notes: 'Calcul du projet (D34) sur la sortie de la vague 9 du robot (docs/sources/series/interieur_elections__participation_par_departement.csv
  : inscrits, votants et exprimés sommés par scrutin et par département sur general_results.csv, aucun votant manquant),
  lue le 15/10/2026. Recoupement avec 5 valeurs officielles : en 2002 et 2007, résultats « France entière » des
  archives du ministère (71,60 % et 83,77 %) diminués des Français de l''étranger et des collectivités d''outre-mer
  lus sur les mêmes archives (2002 : étranger, Mayotte, Nouvelle-Calédonie, Polynésie française, Saint-Pierre-et-Miquelon
  et Wallis-et-Futuna, 730 411 inscrits et 314 712 votants ; 2007 : les mêmes sauf Mayotte, 1 152 694 inscrits et
  549 434 votants), soit 72,11 % et 84,73 %, identiques au calcul (votants identiques en 2002, à 442 près en 2007
  ; inscrits à 302 et 488 près) ; en 2012, 2017 et 2022, INSEE BDM 001778320 (80,7 %, 79,0 % et 75,3 %), identique
  à l''arrondi. Avant l''audit, la fiche portait le taux de tous les bureaux du fichier (79,48 %, 77,77 % et 73,69
  % de 2012 à 2022), qui n''inclut les Français de l''étranger et la plupart des collectivités d''outre-mer qu''à
  partir de 2012 et exagérait la baisse 2007-2012 (audit M06 §3). Mayotte, absente du fichier en 2002, abaisserait
  la valeur 2002 de 0,04 point (72,08 % avec ses 52 218 inscrits et 21 525 votants officiels). La valeur de l''OCDE
  (8_2 : 73,69 % en 2022) porte sur tous les bureaux.'
