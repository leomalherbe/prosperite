raccordement: non
incontournable: non
recommandation: retenir
motif_recommandation: Mesure des compétences numériques avancées de la population en emploi, annuelle de 2004 à
  2025 et comparable depuis la rupture de 2011 (2,7 % en 2011, 4,9 % en 2025).
note_pertinence: 'La part des spécialistes des TIC indique la capacité du pays à concevoir et entretenir les outils
  numériques, complément des compétences de base de toute la population. C''est aussi une structure de l''emploi,
  dont la hausse ne dit rien du bien-être des personnes concernées : la lecture reste prudente. Eurostat signale
  une rupture en 2011 (4,1 % en 2010, 2,7 % en 2011) et une définition différente depuis 2021 ; la part des femmes
  parmi ces spécialistes relève d''egalites.'
