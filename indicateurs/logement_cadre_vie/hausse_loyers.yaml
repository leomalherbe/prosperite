motif_recommandation: Seule série annuelle de l'évolution des loyers payés par les locataires, IPCH de 2000 à 2025
  (26 points), retenue sous réserve du raccordement à son successeur (prc_hicp_ainr ou IPC INSEE base 2025), les
  séries de l'enquête Loyers et charges étant trimestrielles (D35).
note_pertinence: 'Les loyers sont la principale dépense des locataires : leur hausse, comparée à celle des prix
  et des revenus, renseigne sur la tension du marché locatif. L''indicateur est un taux de variation nominal, sans
  rapport au revenu ; les bornes devront tenir compte de l''inflation générale. Il va de -0,3 % (2018) à 3,6 % (2005)
  et vaut 2,3 % en 2024 et en 2025 (API Eurostat lue le 15/10/2026).'
