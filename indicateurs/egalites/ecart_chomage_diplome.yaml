raccordement: non
incontournable: non
recommandation: retenir
motif_recommandation: Écart absolu (D34) construit sur deux séries annuelles de 2000 à 2025 (26 points), de signe
  constant (9,8 points en 2000, 12,3 en 2016, 9,4 en 2025), qui mesure la pénalité des peu diplômés sur le marché
  du travail.
note_pertinence: Le diplôme reste le premier déterminant du risque de chômage ; l'écart mesure cette inégalité sans
  dire si elle vient de compétences ou de signal. Il est sensible à la conjoncture (les peu diplômés subissent davantage
  les récessions).
