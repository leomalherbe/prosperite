motif_recommandation: 'Sur une même période, les agressions graves enregistrées augmentent de 26 % (358,7 à 450,8
  pour 100 000 habitants de 2010 à 2018) quand la part de victimes de violences physiques dans l''enquête CVS reste
  à 2,1 %, et moins d''une victime sur trois porte plainte (29,7 % en 2020, SSMSI) : la série suit surtout les plaintes
  et leur enregistrement (sens ambigu).'
note_pertinence: La délinquance enregistrée dépend de la propension des victimes à porter plainte et de l'activité
  des services ; pour les violences physiques, la hausse est portée en partie par les violences intrafamiliales,
  mieux révélées qu'avant (analyse M04, docs/sources/autres_sources.md §2.4). Sur 2021-2023 (enquête VRS), les deux
  séries montent ensemble (+17 % pour la série enregistrée, de 1,0 à 1,2 % dans l'enquête), ce qui ne suffit pas
  à lever l'ambiguïté. La série reste utile pour la conjoncture, mais pas comme indicateur de résultat sans l'enquête.
