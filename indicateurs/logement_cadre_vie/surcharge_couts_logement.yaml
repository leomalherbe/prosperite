eligibilite_longlist: oui
ligne_id: estat-031390
hors_longlist: non
raccordement: 'non : série EU-SILC continue depuis 2004, ruptures signalées en 2020 et 2022'
incontournable: non
socle_propose: oui
recommandation: retenir
motif_recommandation: Indicateur du suivi des ODD de l'UE (sdg_01_50), voisin de l'indicateur How's Life 3_3 de
  l'OCDE (restreint aux 40 % les plus modestes), annuel de 2004 à 2025 (21 points, 2021 manquant), l'INSEE n'en
  publiant pas le niveau par API (D35).
note_pertinence: Le taux de surcharge repère les ménages pour qui le logement absorbe une part excessive du revenu,
  ce que la moyenne du taux d'effort ne montre pas. Il passe de 5,4 % en 2004 à 4,0 % en 2009, puis remonte à 7,0
  % en 2024 et 6,4 % en 2025 (API Eurostat, lue le 14/10/2026). Les ruptures de 2020 et 2022 (drapeau b) imposent
  la prudence sur la hausse récente.
