motif_recommandation: Indicateur ODD européen de l'état sanitaire des eaux littorales, série Eurostat sans drapeau
  de 2011 à 2025 (15 points), 76,4 % des sites côtiers en 2025.
note_pertinence: Les eaux de baignade reflètent les rejets urbains et agricoles qui atteignent le littoral et les
  rivières. La série saute de 66,4 % en 2012 à 75,6 % en 2013 sans drapeau, cause à documenter. Les eaux intérieures
  (71,0 % en 2025) et la série du SDES et de l'INSEE sont en variantes ; un rattachement à logement_cadre_vie pourrait
  se discuter.
