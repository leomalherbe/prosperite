definition: Surface biologiquement productive (cultures, pâturages, forêts, zones de pêche, terrains bâtis et forêts
  nécessaires à l'absorption du CO2) mobilisée pour produire ce que consomment les habitants et absorber leurs émissions,
  en hectares globaux par personne (comptes nationaux d'empreinte et de biocapacité).
