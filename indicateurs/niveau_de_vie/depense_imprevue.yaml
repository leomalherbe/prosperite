id: depense_imprevue
libelle: Population incapable de faire face à une dépense imprévue
dimension: niveau_de_vie
sous_theme: sécurité économique des ménages
famille: depense_imprevue
variante_principale: oui
definition: Part de la population vivant dans un ménage qui déclare ne pas pouvoir faire face, sur ses propres ressources,
  à une dépense imprévue d'un montant donné (fixé par pays, proche du seuil mensuel de pauvreté) (EU-SILC, volet
  français SRCV).
unite: '% de la population'
sens: bas
type: resultat
declaratif: non
composite: non
source_organisme: Eurostat (EU-SILC ; enquête SRCV de l'INSEE)
