notes: 'Valeurs lues dans la sortie du robot M04 (docs/sources/series/interieur_elections__participation_par_scrutin.csv).
  La valeur 2022 (73,69 %) est celle de l''OCDE (How''s Life 8_2), ce qui valide le calcul pour ce scrutin ; l''INSEE
  publie des taux plus élevés de 1,2 à 1,6 point (80,7 %, 79,0 % et 75,3 % en 2012, 2017 et 2022, lus sur la BDM
  le 14/10/2026), sans doute faute des Français de l''étranger (à vérifier). Les inscrits du fichier passent de
  43,3 millions en 2007 à 46,0 millions en 2012 : la comparabilité 2002-2007 / 2012-2022 est à contrôler avant le
  gel. Le second tour, l''OCDE et V-Dem sont listés en variantes.'
