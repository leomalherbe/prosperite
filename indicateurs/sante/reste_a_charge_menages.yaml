motif_recommandation: Mesure de la protection financière des ménages face aux soins, annuelle de 2006 à 2025 (9,36
  % en 2006, 11,96 % en 2010, 10,32 % en 2025, provisoire), qui complète le renoncement pour raisons financières.
note_pertinence: 'La part des paiements directs mesure ce qui reste à la charge des ménages après remboursements
  ; elle conditionne le renoncement aux soins des plus modestes. Elle passe de 10,17 % en 2009 à 11,96 % en 2010,
  année de rupture (« b »), puis reste entre 10,17 % et 10,38 % de 2021 à 2025. C''est une moyenne de financement,
  pas une mesure par personne : la DREES publie aussi le reste à charge par habitant, non catalogué.'
