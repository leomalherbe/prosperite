motif_recommandation: Seule série nationale des blessés de la route au catalogue (2 726 par million en 2000, 990
  en 2024, sans lacune), complément des tués, alors que l'objectif UE 2030 ne vise que les blessés graves ; issue
  d'un jeu régional que D30 prévoit d'exclure, d'où une exception à prévoir.
note_pertinence: 'Les blessés sont bien plus nombreux que les tués et l''objectif européen 2030 porte sur les tués
  et les blessés graves. La série compte tous les blessés, pas seulement les blessés graves, et la définition française
  des blessés a changé au cours de la période (blessés hospitalisés depuis 2005, à vérifier) : Eurostat ne signale
  pourtant aucune rupture. Si M02 exclut les jeux régionaux NUTS (D30), garder tran_r_acci au niveau national.'
