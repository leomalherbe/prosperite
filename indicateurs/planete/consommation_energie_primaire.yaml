variante_principale: oui
definition: Énergie primaire consommée (consommation intérieure brute hors usages non énergétiques), pertes de transformation
  et de transport comprises, selon la définition de la directive européenne relative à l'efficacité énergétique
  (Eurostat, PEC_EED).
unite: millions de tonnes équivalent pétrole
sens: bas
