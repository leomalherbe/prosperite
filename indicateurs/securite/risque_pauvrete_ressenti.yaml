motif_recommandation: Seule série annuelle de l'insécurité économique ressentie (2014-2025), à condition de compter
  aussi la réponse « je me considère déjà comme pauvre » (7,9 % en 2014, 17,4 % en 2025), sans quoi la baisse de
  la série du catalogue (32,1 % à 16,1 %) est trompeuse.
note_pertinence: 'La crainte de devenir pauvre exprime directement l''insécurité économique vécue. Mais la série
  du catalogue (modalité 1 seule) exclut ceux qui se disent déjà pauvres, dont la part a doublé : la somme des deux
  réponses (« risque » ou « déjà pauvre ») passe de 40,0 % en 2014 à 33,5 % en 2025. Les non-réponses sautent de
  1,4 % à 6,1 % en 2018 (changement de protocole possible, à vérifier) et l''année 2024 manque.'
