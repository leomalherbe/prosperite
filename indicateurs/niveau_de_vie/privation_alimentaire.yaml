rattachement_propose: 'série principale et variantes EU-SILC (ilc_mdes03, hlth_dm030) : lignes de la long-list planete
  (étiquette v0 du jeu) renvoyées à niveau_de_vie par planete (règle 2210), rattachement proposé (A2) déjà signalé
  (maintenance n° 35)'
raccordement: 'non : série EU-SILC annuelle de 2004 à 2025 (ruptures signalées en 2020 et 2022)'
incontournable: non
recommandation: retenir
motif_recommandation: Seule mesure annuelle de l'accès à l'alimentation (A2), publiée par Eurostat de 2004 à 2025
  (22 points), plus longue de 6 ans et plus fraîche d'un an que l'indicateur ODD 2.i1 de l'INSEE, dont elle ne s'écarte
  pas de plus de 0,2 point sur 2010-2024 (méthode §4).
note_pertinence: L'accès à l'alimentation est rattaché à la dimension par l'arbitrage A2 ; faute de mesure de l'insécurité
  alimentaire au catalogue (échelle FIES de la FAO, NDV-7), la privation de repas protéiné est le meilleur indicateur
  disponible. La part passe de 6,7 % en 2004 à 7,5 % en 2019, puis de 6,3 % en 2021 à 9,5 % en 2022 (année de rupture)
  et 12,2 % en 2023, et vaut 11,2 % en 2025 (API Eurostat, lue le 16/10/2026). C'est l'un des 13 éléments de la
  privation matérielle et sociale, mais il porte une préoccupation publique propre (aide alimentaire, prix de l'alimentation),
  d'où une fiche distincte (D32).
