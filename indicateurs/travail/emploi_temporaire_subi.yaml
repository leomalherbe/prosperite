incontournable: non
socle_propose: non
recommandation: retenir_variante
motif_recommandation: Indicateur des contrats temporaires subis (cadre Qualité de vie), série 2003-2025 (23 points)
  rompue en 2021 (7,3 % en 2020, 5,8 % en 2021) puis en baisse jusqu'à 3,6 % en 2025, à lire avec la part des CDD
  et de l'intérim.
note_pertinence: 'La part de l''emploi temporaire subi sépare les contrats courts choisis (études, préférence) de
  ceux qu''on n''a pas pu éviter. Elle est rapportée à l''ensemble des salariés (unité PC_SAL), alors que le cadre
  Qualité de vie la rapporte aux seuls salariés temporaires : c''est une autre statistique, de même sens. La rupture
  de 2021 explique le saut de cette année-là, pas la baisse qui suit (5,8 % en 2021, 3,6 % en 2025 ; collecte ciblée
  du robot, 15/10/2026).'
