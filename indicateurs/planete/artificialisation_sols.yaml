motif_recommandation: Indicateur de richesse nationale n° 10 et concept présent dans trois cadres (Doughnut, OCDE,
  INSEE), série annuelle de 1982 à 2023 (24 points depuis 2000) en France métropolitaine.
note_pertinence: L'artificialisation détruit des sols vivants de façon presque irréversible et fragmente les habitats
  ; c'est la cible de l'objectif « zéro artificialisation nette » en 2050. L'objectif légal intermédiaire porte
  sur le flux de consommation d'espaces naturels, agricoles et forestiers, absent du catalogue (maintenance PLA-4)
  ; le stock Teruti en donne une lecture voisine. Les mesures européennes de l'enquête LUCAS (imperméabilisation,
  5 à 6 points) sont en variantes.
