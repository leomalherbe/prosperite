motif_recommandation: Seule mesure de la pollution de l'air par les métaux lourds, série Eurostat de 2000 à 2024
  (25 points), avec 92,1 t de plomb en 2025 selon le Citepa (extrait du robot M04).
note_pertinence: Le plomb, le cadmium et le mercure sont toxiques et persistants dans les sols et les chaînes alimentaires.
  Le plomb sert d'indicateur principal ; les huit autres métaux de l'inventaire sont en variantes. Les drapeaux
  d'Eurostat n'ont pas été relus.
