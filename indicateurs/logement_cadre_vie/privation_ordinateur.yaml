notes: 'Capacité financière déclarée : déclaratif non (méthode §4). Valeurs lues (ilc_mddu03, ensemble, mise à jour
  Eurostat du 17/09/2026) : 10,5 (2004), 7,0 (2007), 4,0 (2010), 2,2 (2015), 2,6 (2019), 2,5 (2020, b), 2,9 (2021),
  3,3 (2022, b), 3,0 (2024), 3,5 (2025) ; aucun autre drapeau. Variantes : ventilations par type de ménage, sexe,
  âge, diplôme, urbanisation, risque de pauvreté ou d''exclusion, seuil de pauvreté et limitation d''activité (ilc_mddu03,
  ilc_mddu03a, b, f, hlth_dm090), lignes renvoyées par education ; l''absence d''ordinateur pour d''autres raisons
  que financières (ilc_mddu03c à e) est écartée en bloc (choix, sens ambigu).'
