motif_recommandation: 'Sens ambigu : une part ne dit rien du niveau des violences (elle monte si les violences contre
  les hommes baissent), et la série, 2010-2023 (12 points), passe de l''enquête Cadre de vie et sécurité à l''enquête
  Vécu et ressenti en matière de sécurité, avec deux années sans valeur (à lire sur la série).'
note_pertinence: Les violences faites aux femmes sont mesurées en niveau dans securite (victimes de violences conjugales,
  ventilées par sexe, R3). La part des femmes parmi les victimes est un indicateur de structure, pas de résultat.
