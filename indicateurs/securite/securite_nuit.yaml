motif_recommandation: Indicateur des cadres OCDE (10_2) et Eurostat QoL, 2006-2025 (72,0 % en 2025), mais 7 valeurs
  seulement (moyennes Gallup sur 2 à 3 ans) et licence de réutilisation non trouvée (D26).
note_pertinence: 'Se sentir en sécurité la nuit est l''une des mesures du sentiment d''insécurité les plus utilisées
  internationalement et la dimension la cite explicitement. La série française est une moyenne d''environ 1 000
  entretiens Gallup par an, regroupés par blocs de trois ans : elle est peu réactive. Sa diffusion dépend de la
  réponse de l''OCDE sur les conditions de réutilisation (courriel proposé à Léo, D26).'
