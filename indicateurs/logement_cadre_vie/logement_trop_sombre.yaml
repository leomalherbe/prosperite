motif_recommandation: Seule mesure de l'éclairement naturel du logement, élément de la privation sévère liée au
  logement d'Eurostat, 18 valeurs de 2004 à 2023 (annuelles jusqu'en 2020, module triennal ensuite, D17).
note_pertinence: 'Le manque de lumière naturelle dégrade le confort et la santé, en particulier dans les logements
  exigus. L''élément entre dans la définition de la privation sévère liée au logement : il recoupe en partie privation_severe_logement.
  La part oscille entre 6,9 % et 9,0 % de 2004 à 2019, puis passe à 9,7 % en 2020 (rupture b) et 10,6 % en 2023
  (API Eurostat lue le 15/10/2026).'
