incontournable: non
recommandation: retenir
motif_recommandation: Indicateur ordinaire de la dimension par décision du gel 1 (A12, R7), série de l'INSEE de
  1949 à 2025 (26 points depuis 2000), INSEE préféré à Eurostat (sdg_08_10, en variante) à définition égale.
note_pertinence: Le PIB par habitant mesure la production par personne, pas le bien-être des ménages ; il reste
  la référence la plus connue et le gel 1 l'a gardé comme indicateur ordinaire, son appartenance au socle étant
  tranchée au gel 2. Il diverge du revenu des ménages quand la part des profits, des impôts ou des revenus versés
  à l'étranger change, d'où la variante revenu_national_habitant et les fiches de revenu des ménages.
