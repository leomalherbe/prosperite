  lu sur l''API le 16/10/2026 : 0,01228 (2000), 0,00642 (2021), 0,00606 (2023), 0,00569 (2024), soit 12,3, 6,4,
  6,1 et 5,7 pour 1 000, b en 2014, p de 2022 à 2024 ; proche de l''OCDE, loin du PNUD. Question à la session mère
