variante_principale: non
definition: Émissions de gaz à effet de serre (CO2, CH4, N2O) induites par la demande finale intérieure (consommation
  des ménages et des administrations, investissement), y compris celles émises à l'étranger pour produire les biens
  et services importés et hors celles liées aux exportations, selon le calcul du SDES.
