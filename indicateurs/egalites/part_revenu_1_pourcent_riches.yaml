motif_recommandation: Seule mesure de la concentration au sommet fondée sur les données fiscales, annuelle de 2000
  à 2022 (11,3 % en 2000, 9,6 % en 2013, 12,1 % en 2022), alors que l'enquête EU-SILC saisit mal les très hauts
  revenus.
note_pertinence: 'Les enquêtes auprès des ménages sous-estiment les très hauts revenus ; le WID les reconstitue
  à partir des déclarations fiscales. La série est de niveau 2 (fichier OWID) et s''arrête en 2022 : la fraîcheur
  devra être surveillée. Elle déroge à la règle « niveau 1 avant niveau 2 » parce que la variante EU-SILC (part
  du dernier centile, ilc_di01) mesure mal ce concept.'
