motif_recommandation: Mesure du retour à l'emploi des chômeurs, complémentaire du chômage de longue durée, série
  Eurostat 2011-2025 (14 points).
note_pertinence: 'Un chômage dont on sort vite pèse moins qu''un chômage durable : la probabilité de retrouver un
  emploi en un an complète le taux de chômage. Les valeurs et drapeaux de la série n''ont pas pu être relus (refus
  de l''outil, 429) ; la série des passages de l''emploi au chômage, du même jeu, n''a pas de valeur en 2021.'
