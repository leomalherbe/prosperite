motif_recommandation: Variante principale de la famille WGI (D18) et mesure existante de l'indicateur « voix et
  responsabilité » du cadre Eurostat QoL, annuelle depuis 1996 sauf 1997, 1999 et 2001 (25 points depuis 2000, 1,16
  en 2025).
note_pertinence: Voix et responsabilité est la composante des WGI la plus proche de la dimension (participation
  et libertés). La France recule de 1,48 (2005) à 1,16 (2025) ; l'échelle est relative à l'ensemble des pays, ce
  qui invite à lire les évolutions avec prudence (documentation WGI non lue). Les autres sous-indices WGI sont listés
  en variantes ou en fiches de la même famille.
