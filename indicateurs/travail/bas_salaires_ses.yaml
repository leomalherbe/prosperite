motif_recommandation: Indicateur du cadre Qualité de vie d'Eurostat, harmonisé sur le salaire horaire, mais quadriennal
  (5 points de 2006 à 2022) et moins frais que la série de l'OCDE.
note_pertinence: La définition horaire neutralise le temps partiel, contrairement à la série de l'OCDE limitée au
  temps plein. Les valeurs sont 7,13 % (2006), 6,08 % (2010), 8,81 % (2014), 8,61 % (2018) et 9,68 % (2022), sans
  drapeau (API Eurostat, 14/10/2026). L'enquête n'a lieu que tous les quatre ans (D17).
