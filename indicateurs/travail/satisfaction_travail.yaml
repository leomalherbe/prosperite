motif_recommandation: Satisfaction d'un domaine rangée dans ce domaine (R4), citée par l'OCDE et le cadre Qualité
  de vie, seule série annuelle publique de 2010 à 2023 (12 points), quand EU-SILC n'a que 2013 et 2018 et l'OCDE
  trois points.
note_pertinence: La satisfaction au travail est la mesure ressentie de la qualité de l'emploi, nommée dans le contenu
  de la dimension. La série INSEE compte 12 valeurs sur 2010-2023 et s'arrête en 2023, alors que la satisfaction
  dans la vie du même jeu va jusqu'en 2025. La variante de l'OCDE (2013, 2018, 2023) vaut 7,08 en 2023 (extrait
  du robot M04).
