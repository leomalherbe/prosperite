motif_recommandation: Seule mesure annuelle de l'accès à l'alimentation au catalogue (A2), indicateur ODD national
  publié par l'INSEE de 2010 à 2024 (15 points).
note_pertinence: 'L''accès à l''alimentation est rattaché à la dimension par l''arbitrage A2 ; faute de mesure de
  l''insécurité alimentaire au catalogue (échelle FIES de la FAO, non trouvée), la privation de repas protéiné est
  le meilleur indicateur disponible. C''est aussi l''un des 13 éléments de la privation matérielle et sociale :
  il porte une préoccupation publique propre (aide alimentaire, prix de l''alimentation), d''où une fiche distincte
  (D32).'
