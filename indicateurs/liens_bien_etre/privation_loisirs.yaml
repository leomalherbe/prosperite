motif_recommandation: Série annuelle de 12 points (2014-2025) mesurant l'accès aux loisirs sous contrainte financière,
  les loisirs relevant de cette dimension (A13) et les items de privation de leur domaine (R3).
note_pertinence: 'L''indicateur relie loisirs et ressources : il mesure une privation, pas une préférence. Il fait
  partie des 13 items du taux de privation matérielle et sociale (niveau_de_vie) ; le rattachement des items par
  domaine (R3) le place ici, à confirmer par la session mère. Eurostat signale des ruptures de série en 2020 et
  2022.'
