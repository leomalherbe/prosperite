incontournable: non
recommandation: retenir
motif_recommandation: Indicateur du cadre Eurostat Qualité de vie et de l'objectif européen d'au moins 80 % des
  16-74 ans en 2030, 7 vagues de 2015 à 2025 (D17 ; 57 % en 2015, 66 % en 2025), somme recoupée avec les trois valeurs
  publiées par Eurostat.
note_pertinence: 'Les compétences numériques conditionnent l''accès aux droits, à l''emploi et aux services en ligne.
  L''INSEE publie les quatre niveaux de la répartition à l''unité près : la part d''au moins de base est la somme
  des niveaux « de base » et « plus avancées » (62 %, 60 % et 66 % en 2021, 2023 et 2025, contre 61,96 %, 59,67
  % et 65,74 % dans sdg_04_70). L''indicateur européen a changé en 2021 : les valeurs 2015-2019 et 2021-2025 ne
  sont pas strictement comparables.'
