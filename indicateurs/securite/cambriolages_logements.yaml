motif_recommandation: >-
  Cambriolages de logements enregistrés pour 100 000 habitants, 2008-2024 (260 en 2008, 382 en 2013, 295 en 2024),
  lacune 2017-2019 comblable par la série SSMSI ; la plainte conditionne l'indemnisation par l'assurance, ce qui
  rend la série enregistrée interprétable.
note_pertinence: >-
  Le cambriolage du logement est l'atteinte aux biens la plus redoutée par les ménages. L'enquête CVS, qui mesurait
  les ménages victimes, s'arrête en 2020 et la série VRS n'est pas au catalogue : la série enregistrée devient la
  mesure principale. Le jeu Eurostat donne aussi l'ensemble des cambriolages (tous locaux, sans lacune), moins centré
  sur les ménages.
