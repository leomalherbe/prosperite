motif_recommandation: Sens ambigu (l'accession à la propriété est un objectif public, mais une part plus élevée
  de propriétaires n'améliore pas en soi les conditions de logement), malgré une série INSEE annuelle de 1982 à
  2026.
note_pertinence: 'Le taux de propriétaires est souvent cité dans le débat public et l''accession à la propriété
  fait l''objet de politiques dédiées. Il décrit toutefois la structure du parc plus qu''une condition de vie, et
  il varie très peu : 55,7 % en 2000, 57,7 % de 2010 à 2013, 57,3 % en 2026 (valeur provisoire, BDM lue le 15/10/2026).
  La fiche est écartée comme sous_occupation (charte §3.4), pour que Léo puisse s''en saisir s''il en juge autrement.'
