definition: Nombre de victimes de la traite des êtres humains (exploitation sexuelle, travail forcé, autres formes)
  identifiées ou présumées par les autorités dans l'année, pour 100 000 habitants (indicateur de développement durable
  de l'UE, ODD 16).
