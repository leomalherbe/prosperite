motif_recommandation: Seule mesure fréquente de la participation citoyenne hors élections, 10 points de 2011 à 2025
  entre 5,98 % (2015) et 10,36 % (2013), 8,74 % en 2025, éligible et de niveau 1, rattachée à la dimension par l'audit
  M06 (O2).
note_pertinence: 'Participer à une consultation publique ou signer une pétition en ligne est une forme de participation
  citoyenne entre deux élections, complémentaire de la citoyenneté active mesurée par EU-SILC en 2015 et 2022 seulement.
  La part des particuliers concernés varie entre 6 % et 10 % depuis 2011 sans tendance nette. Son niveau dépend
  aussi de l''offre de consultations en ligne et de l''usage d''internet : elle se lit avec la citoyenneté active
  plutôt qu''à sa place.'
