notes: 'Valeurs lues sur l''API Eurostat le 15/10/2026 (mise à jour du jeu : 29/04/2026), sans drapeau : 97,26 (2008),
  93,64 (2010), 102,25 (2013), 105,30 (2019), 92,90 (2020), 106,34 (2022), 111,18 (2023), 117,47 (2024). Lignes
  crim_pris_* de la long-list securite importées (audit M06 O3, D33) : ventilations par âge, sexe et nationalité
  et condamnés (crim_pris_tri, TRI_SPSD) en variantes, avec le nombre de condamnés écroués de l''INSEE ; détenus
  par infraction écartés en bloc (D35).'
