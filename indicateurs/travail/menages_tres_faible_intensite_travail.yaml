id: menages_tres_faible_intensite_travail
libelle: Personnes vivant dans un ménage à très faible intensité de travail
dimension: travail
sous_theme: emploi
famille: intensite_travail
variante_principale: oui
definition: Part des personnes de moins de 60 ans vivant dans un ménage dont les membres en âge de travailler ont
  travaillé moins de 20 % de leur temps potentiel au cours de l'année de référence (EU-SILC, définition de la stratégie
  Europe 2020).
unite: '% des personnes de moins de 60 ans'
sens: bas
type: resultat
declaratif: non
composite: non
source_organisme: Eurostat
source_jeu: ilc_lvhl11 (EU-SILC, enquête SRCV de l'INSEE pour la France)
source_serie_id: ilc_lvhl11?freq=A&unit=PC&age=Y_LT60&sex=T&geo=FR
source_niveau: 1
url_api: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/ilc_lvhl11?freq=A&unit=PC&age=Y_LT60&sex=T&geo=FR
url_page: https://ec.europa.eu/eurostat/databrowser/view/ilc_lvhl11/default/table?lang=fr
frequence: annuelle
premiere_annee: 2004
derniere_annee: 2025
nb_points_depuis_2000: 22
geo: FR
eligibilite_longlist: oui
ligne_id: estat-031333
hors_longlist: non
raccordement: non
incontournable: non
socle_propose: non
recommandation: retenir
motif_recommandation: Indicateur du cadre Qualité de vie d'Eurostat (activité productive), série annuelle 2004-2025
  (22 points) qui mesure l'exclusion de l'emploi à l'échelle du ménage ; composante de niveau_de_vie/pauvrete_exclusion_arope,
  il ne se cumule pas au socle avec elle.
note_pertinence: 'Un ménage sans travail ou presque cumule les risques de pauvreté et d''isolement : l''indicateur
  complète le taux d''emploi individuel. La série va de 10,3 % (2004) à 9,0 % (2025), avec des ruptures en 2020
  et 2022 (API Eurostat, 14/10/2026). La nouvelle définition européenne (moins de 65 ans, sdg_01_40) ne commence
  qu''en 2015 et reste en variante ; l''indicateur est aussi une composante du taux de risque de pauvreté ou d''exclusion,
  ce que la session mère pourra arbitrer avec niveau_de_vie.'
