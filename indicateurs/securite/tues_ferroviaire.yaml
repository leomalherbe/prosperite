motif_recommandation: >-
  Hors du contenu de la dimension, qui ne retient pour les transports que la sécurité routière (arbitrage A6) ;
  série en nombre absolu commençant en 2006.
note_pertinence: >-
  Le risque ferroviaire est faible et concerne surtout les passages à niveau et les personnes circulant sur les
  voies ; il pèse peu dans la sécurité perçue des ménages. La fiche existe pour que l'arbitrage soit visible ; les
  accidents aériens ont été écartés en bloc pour le même motif. La mention « hors suicides » suit la définition
  européenne et reste à vérifier.
