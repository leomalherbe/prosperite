incontournable: oui
recommandation: retenir
motif_recommandation: Indicateur incontournable (Doughnut, OCDE 10_1, Eurostat QoL), taux annuel 2008-2024 sans
  lacune et à sens non ambigu (les homicides sont presque tous connus des services), raccordable à 2000 par la série
  ONUDC.
note_pertinence: 'L''homicide est l''atteinte la plus grave et la mieux enregistrée : presque tous les homicides
  sont connus de la police, si bien que la série enregistrée suit l''évolution réelle, contrairement aux autres
  violences. Le taux français est faible (de 1,03 à 1,60 pour 100 000 entre 2008 et 2024) et ses variations annuelles
  tiennent souvent à des événements exceptionnels (pic de 2015 à 1,55, année des attentats). Le Doughnut fixe un
  seuil de privation à 5 pour 100 000, très au-dessus du niveau français, ce qui plaide pour une borne historique
  ou européenne.'
