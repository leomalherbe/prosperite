motif_recommandation: Emploi de l'économie circulaire rattaché à planete comme moyen en variante (D39), série Eurostat
  sans drapeau de 2005 à 2023 (1,6 % de l'emploi en 2005, 2,0 % en 2020 et 2021, 1,8 % en 2023).
note_pertinence: L'emploi dans le recyclage, la réparation et le réemploi suit le développement d'une économie qui
  prolonge la durée de vie des biens et des matières. C'est un moyen, dont le lien avec la pression sur les ressources
  est indirect, d'où une fiche en variante de la famille du taux d'utilisation circulaire des matières. La série
  nationale de l'INSEE (847 500 emplois en 2023, définition plus large) et sa répartition par pilier, dont les lignes
  Melodi reçues de travail, sont en variantes.
