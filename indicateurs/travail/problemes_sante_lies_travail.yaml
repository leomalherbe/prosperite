id: problemes_sante_lies_travail
libelle: Personnes déclarant un problème de santé causé ou aggravé par le travail
dimension: travail
sous_theme: conditions et santé au travail
famille: problemes_sante_travail
variante_principale: oui
definition: Part des personnes de 15 à 64 ans en emploi ou l'ayant été qui déclarent avoir souffert d'au moins un
  problème de santé causé ou aggravé par le travail au cours des douze derniers mois, d'après le module ad hoc de
  l'enquête sur les forces de travail (Eurostat).
unite: '% des personnes en emploi ou l''ayant été'
sens: bas
type: resultat
declaratif: non
composite: non
source_organisme: Eurostat
source_jeu: hsw_pb1 (module ad hoc « accidents du travail et problèmes de santé liés au travail »), classe d'âge
  15-64 ans
source_serie_id: hsw_pb1?freq=A&sex=T&age=Y15-34&age=Y15-64&age=Y35-54&age=Y35-64&age=Y55-64&age=Y65-74&isced11=TOTAL&unit=PC_EMP_PREEMP&geo=FR
source_niveau: 1
url_api: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/hsw_pb1?geo=FR&sex=T&age=Y15-64&isced11=TOTAL&unit=PC_EMP_PREEMP
url_page: https://ec.europa.eu/eurostat/databrowser/view/hsw_pb1/default/table?lang=fr
frequence: irreguliere
premiere_annee: 2007
derniere_annee: 2020
nb_points_depuis_2000: 3
geo: FR
eligibilite_longlist: a_verifier
ligne_id: estat-021751
hors_longlist: non
rattachement_propose: 'ligne de la long-list sante (règle sante_travail, autre_dimension:travail) : santé au travail
  rattachée à travail par D39 ; oubli O1 de l''audit M06'
raccordement: 'non : la vague 2007 (48,9 %, « définition différente ») n''est pas comparable à 2013 (12,4 %) et
  2020 (8,3 %), sans drapeau entre elles ; lecture en niveau de la vague 2020 pour le socle'
incontournable: non
recommandation: retenir
motif_recommandation: Seule mesure des atteintes à la santé causées par le travail hors accidents et maladies reconnus,
  citée par le cadre Qualité de vie, observée en 2007, 2013 et 2020 (D17), dont seules les vagues 2013 et 2020 sont
  comparables (audit M06 O1).
note_pertinence: 'Les problèmes de santé liés au travail (troubles musculo-squelettiques, stress, dépression ou
  anxiété) mesurent le résultat des expositions, que les maladies professionnelles reconnues ne saisissent qu''à
  travers la reconnaissance. La part passe de 48,9 % en 2007 (définition différente) à 12,4 % en 2013 puis 8,3 %
  en 2020 (collecte ciblée du robot, 15/10/2026) : le niveau de 2007 n''est pas comparable. Les ventilations par
  gravité et par type de problème (hsw_pb2 à hsw_pb5) restent en variantes.'
