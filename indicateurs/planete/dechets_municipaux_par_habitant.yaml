incontournable: non
recommandation: retenir
motif_recommandation: Pression visée par l'objectif de réduction des déchets ménagers et assimilés de la loi AGEC,
  série Eurostat de 2000 à 2024 (514 kg en 2000, 530 kg en 2024) dont la plupart des valeurs récentes sont estimées.
note_pertinence: Les déchets municipaux mesurent la pression de la consommation des ménages sur les ressources et
  les capacités de traitement. La série saute de 516 kg en 2015 à 553 kg en 2016 sans drapeau de rupture, cause
  à documenter, et les valeurs depuis 2016 sont des estimations. La série INSEE des déchets traités par habitant
  (ODD 11.i3b, 2010-2023) et les modes de traitement sont en variantes.
