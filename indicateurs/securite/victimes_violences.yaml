id: victimes_violences
libelle: Adultes victimes de violences physiques ou sexuelles (enquête de victimation)
dimension: securite
sous_theme: atteintes aux personnes
famille: violences_personnes
variante_principale: oui
definition: Part des personnes de 18 à 75 ans résidant en France métropolitaine qui déclarent avoir subi au moins
  une violence physique ou sexuelle dans l'année, qu'elles aient porté plainte ou non (enquêtes de victimation Cadre
  de vie et sécurité, puis Vécu et ressenti en matière de sécurité). Indicateur national ODD 16.i2.
unite: '% des 18-75 ans'
sens: bas
type: resultat
declaratif: non
composite: non
source_organisme: INSEE (indicateurs ODD, d'après les enquêtes de victimation du SSMSI)
source_jeu: BDM, indicateurs ODD (ODD-PAIX-JUSTICE-INSTITUTIONS-EFFICACES)
source_serie_id: '010596041'
source_niveau: 1
url_api: https://bdm.insee.fr/series/sdmx/data/SERIES_BDM/010596041
url_page: https://www.insee.fr/fr/statistiques/serie/010596041
frequence: annuelle
premiere_annee: 2010
derniere_annee: 2023
nb_points_depuis_2000: 12
geo: FM
eligibilite_longlist: oui
ligne_id: bdm-000947
hors_longlist: non
raccordement: 'a_etudier : rupture CVS (2010-2018) / VRS (2021-2023) sans valeur 2019-2020 ; le niveau tombe de
  2,5 % en 2018 à 1,4 % en 2021 (-44 %) : traiter en deux segments ou avec un coefficient de passage à demander
  au SSMSI'
incontournable: non
socle_propose: non
recommandation: retenir
motif_recommandation: Mesure de référence de la victimation (enquête, indépendante du dépôt de plainte), indicateur
  ODD 16.i2 publié par l'INSEE pour 2010-2023, rompue entre l'enquête CVS (2,2 à 2,7 % en 2010-2018) et l'enquête
  VRS (1,4 à 1,7 % en 2021-2023) ; elle englobe les fiches violences physiques, sexuelles et conjugales, à ne pas
  cumuler avec elle au socle.
note_pertinence: 'L''enquête de victimation mesure les violences subies qu''elles aient ou non donné lieu à une
  plainte : c''est la mesure à privilégier pour juger de l''évolution des violences, une hausse des plaintes n''étant
  pas une hausse des violences. La série change d''enquête entre 2018 et 2021, sans valeur pour 2019-2020 : la baisse
  apparente ne doit pas être lue comme une amélioration tant qu''aucune rétropolation n''est publiée. Le champ est
  limité à la métropole et aux 18-75 ans.'
