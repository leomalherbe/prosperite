notes: 'Valeurs relues sur l''API Eurostat le 16/10/2026 (mise à jour du 27/08/2026 ; modalité 25-64 ans du paquet
  d''âges catalogué) : 35,1 % (2007), 50,5 % (2011, b), 51,3 % (2016), 50,8 % (2022, b) ; le jeu trng_aes_100 n''a
  pas de modalité hors formation guidée (dimension training : FE_NFE, FE, NFE). Indicateur des cibles : « extraction
  spéciale de l''AES, hors formation guidée », retenue en septembre 2024 par le groupe des indicateurs du comité
  de l''emploi (rapport conjoint sur l''emploi, COM(2025) 958, annexes 2 et 3, lu le 16/10/2026 : France 48,4 %
  en 2016 et 49,2 % en 2022 avec rupture ; UE 37,4 % et 39,5 %), diffusée hors de la base d''Eurostat (bibliothèque
  CIRCABC du tableau de bord social ; « données fournies à la demande du Cedefop »), donc non cataloguée (liste
  de maintenance EDU-1). Le Cedefop juge les valeurs françaises de 2016 et 2022 non comparables. trng_lfs_17 relue
  le 16/10/2026 (mise à jour du 10/09/2026) : 36,3 % (2022), 37,7 % (2024, b).'
