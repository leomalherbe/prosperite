id: participation_europeennes
libelle: Taux de participation aux élections européennes
dimension: democratie
sous_theme: participation électorale
famille: participation_electorale
variante_principale: non
definition: 'Part des électeurs inscrits ayant voté aux élections européennes (tour unique ; votants rapportés aux
  inscrits), calculée par le projet sur le fichier agrégé des résultats du ministère de l''Intérieur. Champ homogène
  : France métropolitaine et départements d''outre-mer (Guadeloupe, Martinique, Guyane, La Réunion et Mayotte),
  hors collectivités d''outre-mer et hors Français de l''étranger, que le fichier ne contient qu''à partir de 2009-2012
  ; c''est le champ « France » des séries de l''INSEE.'
unite: '% des inscrits'
sens: haut
type: resultat
declaratif: non
composite: non
source_organisme: Ministère de l'Intérieur (résultats électoraux), calcul du projet
source_jeu: Données des élections agrégées (data.gouv.fr, fichier general_results au bureau de vote, Licence Ouverte
  2.0), agrégées par scrutin et par département par le robot (vague 9)
source_serie_id: 'general_results (data.gouv.fr) : id_election AAAA_euro_t1, départements de métropole et DROM (somme
  votants / somme inscrits)'
composantes:
- https://data-pipeline-open.s3.sbg.io.cloud.ovh.net/elections/general_results.parquet (somme votants / somme inscrits)
formule: 'taux = 100 × somme(votants) / somme(inscrits) des lignes id_election = AAAA_euro_t1 et code_departement
  ∈ {01 à 95, 2A, 2B, ZA ou 971, ZB ou 972, ZC ou 973, ZD ou 974, ZM ou 976} de l''agrégat par scrutin et par département
  (première année lue : 1999) ; série annuelle par report de la valeur du dernier scrutin jusqu''au suivant (D17)'
source_niveau: 2
url_api: https://data-pipeline-open.s3.sbg.io.cloud.ovh.net/elections/general_results.csv
url_page: https://www.data.gouv.fr/fr/datasets/6481e741d4cf002ec0efec9d/
