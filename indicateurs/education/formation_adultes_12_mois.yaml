definition: Part des personnes de 25 à 64 ans ayant suivi un enseignement ou une formation, formels ou non formels,
  au cours des douze mois précédant l'enquête, d'après l'enquête européenne sur l'éducation des adultes (Eurostat
  trng_aes_100).
