motif_recommandation: Concept nommé dans le contenu de la dimension et indicateur du cadre Qualité de vie, série
  Eurostat 2000-2025 (26 points).
note_pertinence: 'La surqualification mesure l''adéquation entre diplôme et emploi : un emploi en dessous de sa
  qualification est une forme de déclassement. Les valeurs vont de 18,0 % (2000) à 20,4 % (2025), avec des ruptures
  en 2003, 2005, 2006, 2013, 2014, 2021 et 2024 (API Eurostat, 14/10/2026). Aucune série INSEE de même définition
  n''est au catalogue.'
