id: halo_chomage
libelle: Part du halo autour du chômage dans la population
dimension: travail
sous_theme: chômage
famille: halo_chomage
variante_principale: oui
definition: Part des personnes de 15 ans ou plus sans emploi qui souhaitent travailler mais ne sont pas comptées
  comme chômeurs au sens du BIT (non disponibles ou ne recherchant pas activement), en moyenne annuelle (INSEE,
  enquête Emploi, séries longues).
unite: '% de la population de 15 ans ou plus'
sens: bas
type: resultat
declaratif: non
composite: non
source_organisme: INSEE
source_jeu: Melodi DD_EEC_SERIES (enquête Emploi, séries longues), mesure PT_SEX_AGE_IN_HALO
source_serie_id: DD_EEC_SERIES?AGE=Y_GE15&COMPOHALO=_T&EDUC=_T&EEC_MEASURE=PT_SEX_AGE_IN_HALO&EMPFORM=_T&EMPSTA=3&PCS=_T&SEX=_T&UNDEREMP=_T&UNEMPDUR=_T&UNIT_MEASURE=PT&WKTIME=_T
source_niveau: 1
url_api: https://api.insee.fr/melodi/data/DD_EEC_SERIES?AGE=Y_GE15&COMPOHALO=_T&EDUC=_T&EEC_MEASURE=PT_SEX_AGE_IN_HALO&EMPFORM=_T&EMPSTA=3&PCS=_T&SEX=_T&UNDEREMP=_T&UNEMPDUR=_T&UNIT_MEASURE=PT&WKTIME=_T
url_page: https://www.insee.fr/fr/statistiques/8977323
frequence: annuelle
premiere_annee: 2014
derniere_annee: 2025
nb_points_depuis_2000: 12
geo: FE
eligibilite_longlist: oui
ligne_id: melodi-003252
hors_longlist: non
raccordement: 'a_etudier : part de la population depuis 2014 ; 2003-2013 par la série trimestrielle BDM 011818623
  (15-64 ans) ou le nombre de personnes du halo (1990-2025)'
incontournable: non
recommandation: retenir
motif_recommandation: Composante du chômage caché nommée dans le contenu de la dimension, en série annuelle INSEE
  de 2014 à 2025 (12 points), raccordable avant 2014 par des séries INSEE de même concept.
note_pertinence: 'Le halo rassemble les personnes qui voudraient travailler mais échappent à la définition stricte
  du chômage (découragés, indisponibles temporairement) : il complète le taux de chômage. Le libellé Melodi de la
  mesure (« part du sexe et de l''âge dans les personnes dans le halo ») est ambigu ; le tableau t309 de l''INSEE
  la présente comme une part de la population, ce qui reste à confirmer sur les valeurs.'
