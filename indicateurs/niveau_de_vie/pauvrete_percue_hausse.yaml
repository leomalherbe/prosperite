motif_recommandation: Opinion sur la société (D32) portant sur la pauvreté, posée chaque année depuis 2000 sauf
  en 2003 (25 vagues), calculée sur microdonnées avec un contrôle de plausibilité sur la publication 2025 (D38 b),
  principale de la famille des perceptions du niveau de vie en France.
note_pertinence: 'La question ne demande pas si l''on est pauvre mais si la pauvreté progresse en France : c''est
  une opinion sur la société, au même titre que les perceptions des inégalités d''egalites. La part qui répond «
  ont augmenté » passe de 73,22 % en 2000 à 92,45 % en 2013 et reste proche de 90 % depuis (92,08 % en 2025, sortie
  du robot M04) : le plafond atteint réduit sa capacité à discriminer les années récentes. La réponse spontanée
  « (Sont restées stables) », entre 8,53 et 18,91 % de 2000 à 2006, tombe à 4,78 % en 2007, puis remonte à 7,67
  % en 2014, année où la part retenue recule de 3,9 points : rupture possible en 2007 et anomalie en 2014, comme
  pour la question IN02 d''egalites.'
