notes: 'Déclaratif oui : perception des ménages. Incontournable : la pollution de l''air locale est retenue par
  SSF, l''OCDE et Eurostat (crosswalk §5), et Eurostat en fait l''indicateur phare de sa sous-dimension 8.1 Pollution.
  La long-list donne 18 points de 2004 à 2023, soit 2004-2020 puis 2023, comme les items voisins ilc_mddw01 (bruit,
  lu sur sdg_11_20) et ilc_mddw03 (délinquance, lu par l''audit M06 securite) : module triennal d''EU-SILC depuis
  2021 (vagues 2023 et 2026). Variantes : ventilations par composition du ménage, urbanisation (ilc_mddw05) et handicap
  (hlth_dhc120), lignes renvoyées par planete.'
