note_pertinence: 'L''accès à un compte conditionne le versement des revenus et des prestations et l''accès à la
  plupart des services. La part est proche de la totalité des adultes (97,0 % en 2011, 94,0 % en 2017, 99,2 % en
  2021 et 2024, BDM lue le 15/10/2026) : l''indicateur distinguera peu les années, mais une baisse signalerait une
  exclusion bancaire. Son rattachement à l''accès aux services, proposé par niveau_de_vie, est à trancher par la
  session mère.'
