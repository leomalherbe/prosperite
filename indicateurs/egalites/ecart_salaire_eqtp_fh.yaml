note_pertinence: 'C''est la mesure que l''INSEE commente chaque année pour le secteur privé ; elle neutralise le
  temps partiel mais pas les différences de poste. Elle couvre 2000-2005, absent de l''indicateur européen, et peut
  servir à le raccorder. L''écart est à calculer : il ne figure pas tel quel au catalogue.'
