id: ecart_emploi_fh
libelle: Écart de taux d'emploi entre hommes et femmes (20-64 ans)
dimension: egalites
sous_theme: écarts femmes-hommes
famille: ecart_emploi_fh
variante_principale: oui
definition: Différence, en points de pourcentage, entre le taux d'emploi des hommes et celui des femmes de 20 à
  64 ans (enquête Forces de travail ; jeu Eurostat sdg_05_30, personnes en emploi).
unite: points de pourcentage
sens: bas
type: resultat
