motif_recommandation: Indicateur ODD européen (sdg_08_60, mêmes valeurs depuis 2010) et du cadre Qualité de vie,
  série 2008-2025 (17 points) traitée en famille propre parce qu'un décès n'est pas substituable à un accident avec
  arrêt.
note_pertinence: Les accidents mortels portent une préoccupation publique propre (D32), distincte de la fréquence
  des accidents avec arrêt. Le taux passe de 1,56 (2008) à 3,61 (2024) pour 100 000 travailleurs, avec des ruptures
  en 2014, 2017, 2020 et 2022 qui expliquent sans doute une partie de la hausse (API Eurostat, 14/10/2026). La cause
  des ruptures n'est pas documentée dans la réponse de l'API.
