motif_recommandation: Sens ambigu en France (la part non raccordée relève surtout de l'assainissement non collectif,
  admis par la réglementation), malgré 19 valeurs Eurostat de 2001 à 2024 comprises entre 77,30 % et 80,46 %.
note_pertinence: 'Le raccordement à une station de traitement est la mesure européenne de l''assainissement des
  eaux usées. En France, la population non raccordée vit surtout dans des logements équipés d''un assainissement
  individuel, dont la qualité est suivie par la conformité des dispositifs non collectifs : une part plus élevée
  de raccordement n''est donc pas un progrès en soi. La série est presque plate (de 77,30 % en 2001 à 80,00 % en
  2024, API Eurostat lue le 15/10/2026).'
