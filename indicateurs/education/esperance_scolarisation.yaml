id: esperance_scolarisation
libelle: Espérance de scolarisation (durée attendue des études)
dimension: education
sous_theme: diplômes et sorties précoces
famille: esperance_scolarisation
variante_principale: oui
definition: Nombre d'années d'études qu'un enfant en âge d'entrer à l'école peut espérer accomplir si les taux de
  scolarisation par âge observés l'année considérée se maintenaient (PNUD, d'après l'UNESCO).
unite: années
sens: haut
type: resultat
declaratif: non
composite: non
source_organisme: PNUD (Rapport sur le développement humain 2025)
source_jeu: séries composites, colonnes eys_<année>
source_serie_id: https://hdr.undp.org/sites/default/files/2025_HDR/HDR25_Composite_indices_complete_time_series.csv
  (colonnes eys_<année>)
source_niveau: 2
url_api: https://hdr.undp.org/sites/default/files/2025_HDR/HDR25_Composite_indices_complete_time_series.csv
url_page: non trouvé
frequence: annuelle
premiere_annee: 1990
derniere_annee: 2023
nb_points_depuis_2000: 24
geo: FR
eligibilite_longlist: oui
ligne_id: m04-000360
hors_longlist: non
raccordement: non
incontournable: non
socle_propose: non
recommandation: retenir
motif_recommandation: Indicateur « durée prévisible de scolarité » du Better Life Index de l'OCDE et composante
  éducation de l'IDH, annuel de 1990 à 2023 (16,1 ans en 2023), plus fin que la série Eurostat arrondie à l'année.
note_pertinence: La durée attendue des études résume en un chiffre la participation à l'éducation à tous les âges,
  de la maternelle au supérieur. Elle augmente avec l'allongement des études comme avec les redoublements, ce qui
  en limite la lecture normative. La série Eurostat educ_uoe_enra07 (2013-2024, en années entières) et les taux
  de scolarisation par âge sont en variantes.
