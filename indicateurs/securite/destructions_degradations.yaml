motif_recommandation: 'Les destructions et dégradations sont rarement déclarées (taux de plainte de 16,3 % pour
  celles visant la voiture en 2019 selon l''INSEE, de 9,0 % pour le vandalisme contre le logement en 2018 selon
  le SSMSI) et aucune enquête vivante ne permet de contrôler la série enregistrée (2016-2025, 10 points) : sens
  ambigu.'
note_pertinence: Le vandalisme contre le logement ou la voiture fait partie de l'insécurité du quotidien, mais la
  série enregistrée mêle biens privés et publics et ne compte que les faits déclarés, une minorité. Les séries de
  l'enquête CVS sur le vandalisme (2006-2020) existent dans la base SSMSI mais ne sont pas au catalogue (maintenance
  n° 6) et leur suite VRS reste à cataloguer. Le motif d'écart n'est plus la brièveté de la série, éligible depuis
  2016 (D32), mais son sens ambigu.
