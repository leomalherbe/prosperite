id: duree_hebdomadaire_travail
libelle: Durée hebdomadaire habituelle du travail
dimension: travail
sous_theme: conditions et santé au travail
famille: duree_travail
variante_principale: oui
definition: Nombre moyen d'heures habituellement travaillées par semaine dans l'activité principale par les personnes
  en emploi de 15 ans ou plus (Eurostat, enquête sur les forces de travail).
unite: heures par semaine
sens: ambigu
type: resultat
declaratif: non
composite: non
source_organisme: Eurostat
source_jeu: lfsa_ewhuis (enquête sur les forces de travail)
source_serie_id: lfsa_ewhuis?freq=A&isco08=TOTAL&wstatus=EMP&worktime=TOTAL&age=Y_GE15&sex=T&unit=HR&geo=FR
source_niveau: 1
url_api: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/lfsa_ewhuis?freq=A&isco08=TOTAL&wstatus=EMP&worktime=TOTAL&age=Y_GE15&sex=T&unit=HR&geo=FR
url_page: https://ec.europa.eu/eurostat/databrowser/view/lfsa_ewhuis/default/table?lang=fr
frequence: annuelle
premiere_annee: 2000
derniere_annee: 2025
nb_points_depuis_2000: 26
geo: FR
eligibilite_longlist: oui
ligne_id: estat-026047
hors_longlist: non
raccordement: non
incontournable: non
recommandation: ecarter
motif_recommandation: 'Sens ambigu : une durée moyenne plus courte peut traduire plus de temps libre comme plus
  de temps partiel subi, et les longues durées comme le sous-emploi sont mesurés par des fiches retenues, alors
  que le cadre Qualité de vie d''Eurostat lui donne le sens « bas ».'
note_pertinence: 'La durée moyenne mélange deux phénomènes opposés pour le bien-être : le surtravail et le sous-emploi.
  Le cadre Qualité de vie la cite avec le sens « bas » (choix contraire, audit M06 J6), mais ses extrêmes sont mieux
  lus par les fiches longues_durees_travail et taux_sous_emploi. Les valeurs vont de 37,2 heures (2000) à 36,8 heures
  (2025), avec des ruptures en 2003, 2014, 2021 et 2024 (collecte ciblée du robot, 15/10/2026).'
