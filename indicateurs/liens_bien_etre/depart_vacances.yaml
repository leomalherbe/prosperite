id: depart_vacances
libelle: Taux de départ en vacances (voyage personnel d'au moins 4 nuits dans l'année)
dimension: liens_bien_etre
sous_theme: loisirs, culture, sport et vacances
famille: depart_vacances
variante_principale: oui
definition: Part des résidents de 15 ans ou plus de France métropolitaine ayant fait dans l'année au moins un voyage
  pour motifs personnels d'au moins quatre nuitées, en France ou à l'étranger (enquête Suivi de la demande touristique
  ; jeu Eurostat tour_dem_totot, durée « 4 nuits ou plus », destination « tous les pays du monde », unité PC_POP).
unite: '% des résidents de 15 ans ou plus'
sens: haut
type: resultat
declaratif: non
composite: non
source_organisme: Eurostat
source_jeu: tour_dem_totot (demande touristique des résidents)
