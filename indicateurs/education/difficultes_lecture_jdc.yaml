motif_recommandation: Seule mesure annuelle de la maîtrise de la lecture des jeunes après 15 ans, proche de l'analphabétisme
  suivi par le Doughnut, mais limitée à 3 points au catalogue (2022-2024 ; 13,32 % en 2024), sous le seuil de 10
  points de la charte.
note_pertinence: 'Les tests de la JDC repèrent chaque année les jeunes qui lisent mal vers la fin de la scolarité
  obligatoire, ce que PISA ne mesure que tous les trois ans et à 15 ans. La DEPP publie 13 % de jeunes en difficulté
  de lecture et 6 % en situation d''illettrisme en 2024 (note d''information 25-57). La série longue n''est diffusée
  que dans des fichiers propres à chaque note : il faut la cataloguer pour rendre l''indicateur éligible.'
