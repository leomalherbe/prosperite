source_niveau: 1
url_api: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/env_air_gge?freq=A&unit=MIO_T&airpol=GHG&src_crf=CRF4&geo=FR
url_page: https://ec.europa.eu/eurostat/databrowser/view/env_air_gge/default/table?lang=fr
