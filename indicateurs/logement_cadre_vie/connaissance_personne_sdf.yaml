definition: 'Part des personnes interrogées par le baromètre d''opinion de la DREES qui déclarent connaître, dans
  leur famille ou en dehors, quelqu''un qui est sans domicile fixe, ou l''être elles-mêmes (question SDPROXIM_3
  : « Dans votre famille ou en dehors de votre famille, connaissez-vous quelqu''un qui est SDF (sans domicile fixe)
  ? », réponses « oui », modalités 2 à 8), « ne sait pas » exclus du dénominateur, pondération de redressement de
  l''enquête.'
