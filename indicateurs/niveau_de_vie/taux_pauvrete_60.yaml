id: taux_pauvrete_60
libelle: Taux de pauvreté monétaire (seuil à 60 % du niveau de vie médian)
dimension: niveau_de_vie
sous_theme: pauvreté monétaire
famille: pauvrete_monetaire
variante_principale: oui
definition: Part des personnes dont le niveau de vie est inférieur à 60 % du niveau de vie médian (enquête Revenus
  fiscaux et sociaux, données rétropolées, France métropolitaine, ménages ordinaires).
unite: '% de la population'
sens: bas
type: resultat
declaratif: non
composite: non
source_organisme: INSEE
source_jeu: Melodi DS_ERFS_RETROPOLE (enquête ERFS, données rétropolées), mesure PR_MD60
source_serie_id: DS_ERFS_RETROPOLE?AGE=_T&EMPSTA_ENQ=_T&ERFS_MEASURE=PR_MD60&GEO=FRANCE-FM&MUN_DENSITY_LEVEL=_T&TPH=_T
source_niveau: 1
url_api: https://api.insee.fr/melodi/data/DS_ERFS_RETROPOLE?AGE=_T&EMPSTA_ENQ=_T&ERFS_MEASURE=PR_MD60&GEO=FRANCE-FM&MUN_DENSITY_LEVEL=_T&TPH=_T
