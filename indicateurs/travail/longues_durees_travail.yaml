  continu'
incontournable: oui
recommandation: retenir
motif_recommandation: Concept présent dans trois cadres (SSF, OCDE, Eurostat) et maintenu dans la dimension par
  D27, série Eurostat 2000-2025 (26 points) avec ruptures en 2003, 2014, 2021 et 2024.
note_pertinence: 'Les longues durées de travail pèsent sur la santé et la vie hors travail : c''est un incontournable
  du crosswalk. La série baisse de 13,4 % (2003) à 9,4 % (2025), après un saut de 2003 dû au changement d''enquête
  (API Eurostat, 14/10/2026). Le seuil horaire exact n''est pas donné par l''API (non trouvé) ; la variante de l''OCDE
  fixe le seuil à 50 heures pour les salariés.'
