eligibilite_longlist: hors_longlist
ligne_id: ''
hors_longlist: oui
rattachement_propose: 'hors long-list : modalité age=Y65 du jeu demo_mlexpec (catalogue des jeux), non cataloguée
  par M02 (seules Y_LT1, Y_GE85 et Y_GE95 le sont) ; à cataloguer (maintenance SAN-9, audit M06 O6)'
raccordement: 'non : ruptures de 2012 et 2014 signalées par Eurostat, comme pour l''espérance de vie à la naissance'
incontournable: non
socle_propose: non
recommandation: retenir_variante
motif_recommandation: Lecture de la longévité aux âges élevés, annuelle de 1998 à 2024 dans le même jeu que la fiche
  principale (19,3 ans en 2000, 21,0 ans en 2020, 21,9 ans en 2024), choisie par D43 devant la série du jeu des
  années de vie en bonne santé.
note_pertinence: L'espérance de vie à 65 ans mesure les années restant à vivre à l'âge de la retraite. Elle passe
  de 21,7 ans en 2019 à 21,0 ans en 2020 (Covid-19) puis remonte à 21,9 ans en 2024. La série du jeu des années
  de vie en bonne santé (hlth_hlye, 2004-2024), identique jusqu'en 2013 puis plus haute de 0,1 à 0,5 an, reste en
  variante parce qu'elle sert au calcul des années de vie en bonne santé à 65 ans ; l'INSEE publie l'espérance de
  vie à 60 ans par sexe (variantes).
