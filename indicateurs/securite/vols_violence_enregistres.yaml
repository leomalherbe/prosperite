motif_recommandation: Série enregistrée continue 2008-2024 (de 167 à 190 pour 100 000 jusqu'en 2013, puis 83 en
  2024), dont le sens n'est pas contredit par l'enquête ; variante de la série d'enquête, plus fraîche qu'elle.
note_pertinence: 'Les vols avec violence ont une évolution enregistrée plausible (baisse continue depuis 2013),
  mais moins d''une victime sur trois les signale à la police (30 % en 2022, ONUDC via l''OCDE) : comme pour les
  cambriolages, le sens repose sur la stabilité de ce taux. La série peut remplacer l''enquête si le relais ONUDC
  s''arrête. Le SSMSI publie les vols violents sans arme et avec arme en nombre (2016-2025).'
