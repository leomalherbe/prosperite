note_pertinence: 'La productivité mesure l''efficacité énergétique de l''économie : elle peut augmenter alors que
  la consommation totale stagne, d''où sa lecture comme indicateur de moyens. L''intensité énergétique du PIB (Eurostat)
  et les intensités finales par secteur de l''INSEE (ODD 7.i4) sont en variantes.'
