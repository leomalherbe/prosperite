notes: 'Valeurs lues (ilc_lvho07a, ensemble) : 5,4 (2004), 4,0 (2009), 5,2 (2013), 5,5 (2019), 5,6 (2020, b), 6,5
  (2022, b), 7,0 (2024), 6,4 (2025) ; aucune valeur en 2021. Variantes : table ODD sdg_01_50, ventilations, seuils
  de 25 à 75 % (ilc_lvho27 à 30), nationalité et pays de naissance, enfants, handicap ; OCDE How''s Life 3_3, autre
  statistique : ménages des 40 % les plus modestes consacrant plus de 40 % de leur revenu disponible au logement,
  loyers et remboursements d''emprunt sans loyers imputés (How''s Life 2020), 10,66 % en 2024 contre 7,0 % ici,
  définition de l''édition 2024 à confirmer (audit M06, F2).'
