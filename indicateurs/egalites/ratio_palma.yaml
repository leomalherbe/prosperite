id: ratio_palma
libelle: Ratio de Palma du niveau de vie (masse des 10 % les plus aisés rapportée à celle des 40 % les plus modestes)
dimension: egalites
sous_theme: inégalités de revenu
famille: inegalite_revenu
variante_principale: non
definition: Rapport entre la masse des niveaux de vie détenue par les 10 % de personnes les plus aisées et celle
  détenue par les 40 % les plus modestes, après impôts directs et prestations sociales (enquête ERFS, données rétropolées,
  France métropolitaine).
unite: rapport (sans unité)
sens: bas
type: resultat
declaratif: non
composite: non
