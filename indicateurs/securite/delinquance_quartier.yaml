motif_recommandation: >-
  Indicateur phare du cadre Eurostat QoL (sécurité physique), 2004-2023 (22,3 % en 2004, 14,7 % en 2023), source
  publique de niveau 1 ; devenu triennal après 2020 (pas de valeur 2021-2022).
note_pertinence: >-
  La perception de la délinquance dans son quartier relie la sécurité objective et le sentiment d'insécurité : c'est
  la mesure retenue par Eurostat et la plus longue disponible. Elle est déclarative (perception d'un problème, pas
  une victimation) et, depuis la refonte de SILC, n'est plus posée chaque année. La valeur 2020 est signalée en
  rupture.
