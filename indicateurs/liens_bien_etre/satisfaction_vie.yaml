id: satisfaction_vie
libelle: Satisfaction dans la vie (note moyenne de 0 à 10)
dimension: liens_bien_etre
sous_theme: satisfaction et évaluation de la vie
famille: satisfaction_vie
variante_principale: oui
definition: Note moyenne, sur une échelle de 0 à 10, donnée par les personnes de 16 ans ou plus de France métropolitaine
  à leur satisfaction concernant la vie qu'elles mènent actuellement (enquête Statistiques sur les ressources et
  conditions de vie, SRCV).
unite: note moyenne (0 à 10)
sens: haut
type: resultat
declaratif: oui
composite: non
source_organisme: INSEE
source_jeu: Melodi DS_SRCV_SATISFACTION (enquête SRCV), mesure VIESATISF
