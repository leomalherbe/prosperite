notes: 'Couverture lue dans docs/sources/series/drees__barometre_2000_2025_couverture.csv (pe01 : 2000-2002, 2004-2025)
  ; modalités lues dans le dictionnaire 2025 (1 « ont diminué », 2 « ont augmenté », 3 « (Sont restées stables)
  », réponse spontanée notée entre parenthèses, NSP), stabilité des codes sur toute la période à vérifier. Contrôle
  de plausibilité (D34, D38 b) : le tableau croisé simplifié publié par la DREES pour 2025 (docs/sources/series/drees__barometre_tc_simplifies_2025.txt)
  donne 3,68 % « ont diminué », 92,08 % « ont augmenté », 3,51 % « stables » et 0,73 % NSP, identiques au calcul
  du robot ; vagues 2000-2024 non recoupées. Famille perception_niveau_vie_france : avec les soldes d''opinion de
  l''enquête de conjoncture sur le niveau de vie en France (D38 j). Variante manuelle : PE02 (évolution future,
  « vont plutôt augmenter »), oubli O3 de l''audit. Questions voisines non retenues : OG04_3 (préoccupation pour
  la pauvreté, sens ambigu : solidarité ou exposition), PE07 (revenu minimum jugé nécessaire, sens ambigu), CS27
  (renoncements de dépenses, 2024-2025 seulement). Licence non indiquée sur la page du jeu (Licence Ouverte à confirmer).'
