motif_recommandation: Seule série de mortinatalité qui exclut les interruptions médicales de grossesse, annuelle
  de 2014 à 2024 (11 valeurs ; 5,627 pour 1 000 en 2024), le taux total d'Eurostat restant en variante.
note_pertinence: La mortinatalité (enfants mort-nés) complète la mortalité infantile, qui ne compte que les enfants
  nés vivants. En 2024, Santé publique France compte 9,208 mort-nés pour 1 000 naissances, dont 3,581 après interruption
  médicale de grossesse et 5,627 spontanés ; seule la part spontanée a un sens univoque, la part induite dépendant
  du dépistage prénatal et des décisions des parents. La mortalité fœtale tardive d'Eurostat (9,1 pour 1 000 en
  2013, 9,0 en 2024) et le taux total de Santé publique France sont en variantes.
