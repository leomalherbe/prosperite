motif_recommandation: Maladie chronique liée à la nutrition et à la corpulence (A2), série annuelle de 2011 à 2023
  sans drapeau (18,26 pour 100 000 en 2011, 15,18 en 2023).
note_pertinence: Le diabète est une maladie chronique dont l'obésité et la sédentarité sont des facteurs de risque
  ; c'est l'une des quatre maladies non transmissibles de la cible ODD 3.4. Le taux de décès dont le diabète est
  la cause initiale baisse de 17 % entre 2011 et 2023 ; il ne compte pas les décès où le diabète n'est qu'une cause
  associée. La prévalence du diabète traité n'est pas au catalogue.
