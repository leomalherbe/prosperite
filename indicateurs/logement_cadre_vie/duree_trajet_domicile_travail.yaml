motif_recommandation: Seule mesure du temps de trajet domicile-travail retenue par le cadre Stiglitz-Sen-Fitoussi,
  trois millésimes du recensement (2011, 2016, 2022) admis comme série irrégulière (D17, D28).
note_pertinence: 'Le temps passé dans les trajets quotidiens pèse sur le temps libre, la fatigue et le budget des
  ménages ; il dépend de l''éloignement entre logement et emploi et de l''offre de transport. La série ne compte
  que trois valeurs, dont deux identiques, la dernière étant de 13 minutes en 2022 (19 minutes pour le sous-champ
  « nav », extrait du robot M04) : elle distinguera peu les années. Le mode de calcul de la durée (temps estimé
  à l''heure de pointe ou déclaré) et le sens des sous-champs « act » et « nav » sont à vérifier avant de fixer
  des bornes.'
