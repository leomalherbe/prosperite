id: diplomes_superieur_25_34
libelle: Jeunes adultes de 25 à 34 ans diplômés de l'enseignement supérieur
dimension: education
sous_theme: diplômes et sorties précoces
famille: diplomes_superieur_25_34
variante_principale: oui
definition: Part des personnes de 25 à 34 ans dont le plus haut diplôme relève de l'enseignement supérieur (CITE
  5 à 8 ; CITE 1997 5-6 avant 2014), d'après l'enquête européenne sur les forces de travail (Eurostat, indicateur
  ODD sdg_04_20).
unite: '% des 25-34 ans'
sens: haut
type: resultat
