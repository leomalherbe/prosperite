motif_recommandation: Indicateur de moyens admis (D19) adossé à la cible de 33 % en 2030 de l'article L100-4 (texte
  à vérifier, Q-F), série Eurostat de 2004 à 2025 passée de 9,3 % à 23,9 % (2025 provisoire).
note_pertinence: 'C''est l''indicateur de transition énergétique le plus suivi, et la cible officielle fournira
  une borne (D19). Eurostat est retenu parce qu''il remonte à 2004 et va jusqu''en 2025 ; la série INSEE (ODD 7.i2b,
  2010-2024), les parts par secteur et la définition de l''OCDE sont en variantes. Une part qui monte ne dit pas
  que la consommation baisse : la fiche se lit avec la consommation finale.'
