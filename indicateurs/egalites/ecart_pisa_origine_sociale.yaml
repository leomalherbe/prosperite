variante_principale: non
definition: Écart, en valeur absolue et en points, entre la part des élèves de 15 ans qui atteignent au moins le
  niveau minimal de compétence en mathématiques de l'enquête PISA parmi les élèves au statut socio-économique très
  favorisé (quart supérieur de l'indice PISA) et cette part parmi les élèves très défavorisés (quart inférieur)
  ; indicateur national ODD 4.i1d de l'INSEE ventilé par statut socio-économique.
