motif_recommandation: Série annuelle la plus longue sur les vacances (22 points, 2004-2025), contenu explicite de
  la dimension (A13), rattachée aujourd'hui à travail par l'étiquette du jeu Eurostat.
note_pertinence: Les vacances font partie des loisirs de la dimension (A13). L'indicateur mesure une contrainte
  financière plutôt que le départ effectif (voir depart_vacances) ; il recule de 33,4 % (2004) à 22,0 % (2024),
  avec des ruptures signalées par Eurostat en 2020 et 2022.
