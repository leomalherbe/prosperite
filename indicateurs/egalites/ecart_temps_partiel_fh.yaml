motif_recommandation: Inégalité de durée d'emploi distincte de l'écart d'emploi, annuelle de 2009 à 2025, dont l'ampleur
  a nettement baissé (-25,2 points en 2009, -17,5 en 2025).
note_pertinence: 'Le temps partiel, surtout féminin, explique une grande part des écarts de revenu salarial entre
  femmes et hommes. Comme la série est négative (hommes moins femmes), le sens est « haut » : la valeur remonte
  vers 0 quand l''écart se réduit. Une partie du temps partiel est choisie, ce qui nuance la lecture.'
