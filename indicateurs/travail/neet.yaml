definition: Part des jeunes de 15 à 29 ans qui ne sont ni en emploi, ni en études, ni en formation, en moyenne annuelle
  (INSEE, enquête Emploi, séries longues).
unite: '% des jeunes de 15 à 29 ans'
sens: bas
