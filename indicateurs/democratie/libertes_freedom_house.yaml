notes: 'Dernière valeur (89 en 2025, année couverte, édition 2026) et nombre de valeurs distinctes (7 sur 24) lus
  dans la sortie du robot M04 ; série OWID lue par l''audit M06 (CSV filtré sur la France, métadonnées « Freedom
  House (2026) », période 2002-2025) : 95 (2002-2004), 93 (2005), 94 (2006), 93 (2007), 96 (2008-2009), 95 (2010-2014),
  91 (2015), 90 (2016-2020), 89 (2021-2025). Le fichier Freedom House All_data_FIW_2013-2024.xlsx (docs/sources/series/freedom_house__fiw_2013_2024_france.txt)
  est daté par édition : 95 (éditions 2013-2015), 91 (2016), 90 (2017-2021), 89 (2022-2024), soit les années couvertes
  2012-2014, 2015, 2016-2020 et 2021-2023 (année OWID = édition - 1, audit M06 §4.2).'
