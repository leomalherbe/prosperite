motif_recommandation: Seule mesure de la contamination des rivières par les pesticides au catalogue, série Eurostat
  sans drapeau de 2013 à 2023 (11 points), comprise entre 17,4 % (2022) et 35,2 % (2023).
note_pertinence: L'indicateur mesure l'effet des pesticides sur les milieux aquatiques, à côté des indicateurs d'usage
  (HRI1, NODU). Les données sont transmises sur une base largement volontaire et le nombre de masses d'eau déclarées
  varie, d'où des à-coups (29,7 % en 2017, 17,4 % en 2022) à interpréter avec prudence.
