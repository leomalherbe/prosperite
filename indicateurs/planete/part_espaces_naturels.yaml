motif_recommandation: Autre lecture de la famille usage_sols (état des espaces naturels plutôt que pression), série
  Teruti de 1982 à 2022 (23 points depuis 2000), concept présent dans trois cadres.
note_pertinence: L'indicateur suit les espaces qui portent l'essentiel de la biodiversité terrestre ; il se lit
  avec la part artificialisée et la part agricole (en variante), les trois couvrant le territoire. La couverture
  naturelle et semi-naturelle de l'OCDE (5 points de 2005 à 2022, 52,2 % en 2022 d'après l'extrait du robot M04)
  et ses pertes et gains sont en variantes.
