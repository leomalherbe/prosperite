id: deces_pollution_air
libelle: Décès prématurés attribuables aux particules fines (PM2,5)
dimension: sante
sous_theme: mortalité
famille: deces_pollution_air
variante_principale: oui
definition: 'Décès prématurés attribuables à l''exposition de longue durée aux particules fines PM2,5, pour 100
  000 habitants : seul l''excès de concentration au-delà de 5 µg/m³ en moyenne annuelle (ligne directrice de l''OMS
  de 2021) est compté, avec une hausse du risque de décès de 8 % par 10 µg/m³ (estimations de l''Agence européenne
  de l''environnement, même méthode pour toutes les années).'
unite: décès prématurés pour 100 000 habitants
sens: bas
type: resultat
declaratif: non
composite: non
