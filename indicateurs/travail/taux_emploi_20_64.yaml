notes: 'Série principale prise dans le paquet des classes d''âge (ligne estat-025131 : 15-24, 15-29, 20-64, 25-54
  et 55-64 ans) ; modalité retenue : 20-64 ans (url_api). Valeurs et drapeaux lus dans docs/sources/series/eurostat_travail_lfsi_emp_a.csv
  et eurostat_travail_sdg_08_30.csv : « d » de 2021 à 2025, aucun drapeau avant. Audit M06 F1 : l''ancienne principale
  sdg_08_30 (2009-2025) passe en variante, le raccordement est inutile. Incontournable porté par la variante principale
  de la famille (taux_emploi, D38 d).'
