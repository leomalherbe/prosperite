notes: 'Valeurs lues (BDM 001791247, statut A jusqu''en 2023, P de 2024 à 2026) : 55,7 (2000), 56,9 (2005), 57,7
  (2010), 57,5 (2017 à 2023), 57,4 (2024 et 2025), 57,3 (2026). Variantes : même série en France métropolitaine
  (BDM 001687221) et voie Melodi (DS_PARC_LOGEMENTS_SERIES, PT_OWNER) ; part des personnes vivant dans un logement
  dont elles sont propriétaires (EU-SILC, hlth_dhc010). Les autres statuts d''occupation (accédants, locataires
  du parc privé ou social, logés gratuitement) restent écartés en bloc comme structure du parc.'
