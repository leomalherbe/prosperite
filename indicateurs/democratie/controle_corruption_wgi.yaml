notes: 'Score 0-100 : 73,09 en 2025 (sortie du robot M04, 27 valeurs de 1996 à 2025 ; série complète non relue,
  API de la Banque mondiale refusée à l''outil le 15/10/2026). Estimation (variante, extrait du robot, mise à jour
  WGI du 25/09/2026) : 1,29 (2000), 1,43 (2005), 1,39 (2010), 1,51 (2011), 1,29 (2020), 1,24 (2025). La documentation
  WGI lue ne détaille pas les sources agrégées (dont, peut-être, le CPI). Série principale passée de l''estimation
  au score 0-100 (audit M06 J5). Sous-indices V-Dem de corruption en variantes (D35). Année = année observée.'
