id: participation_presidentielle
libelle: Taux de participation au premier tour de l'élection présidentielle
dimension: democratie
sous_theme: participation électorale
famille: participation_electorale
variante_principale: oui
definition: 'Part des électeurs inscrits ayant voté au premier tour de l''élection présidentielle (votants rapportés
  aux inscrits, tous bureaux de vote du fichier agrégé du ministère de l''Intérieur). Champ : France entière ; l''inclusion
  des Français de l''étranger avant 2012 est à vérifier.'
unite: '% des inscrits'
sens: haut
type: resultat
declaratif: non
composite: non
source_organisme: Ministère de l'Intérieur (résultats électoraux), calcul du projet
source_jeu: Données des élections agrégées (data.gouv.fr, fichier general_results au bureau de vote, Licence Ouverte
  2.0)
source_serie_id: https://data-pipeline-open.s3.sbg.io.cloud.ovh.net/elections/general_results.parquet (somme votants
  / somme inscrits)
source_niveau: 2
url_api: https://data-pipeline-open.s3.sbg.io.cloud.ovh.net/elections/general_results.parquet
url_page: https://www.data.gouv.fr/fr/datasets/6481e741d4cf002ec0efec9d/
frequence: irreguliere
formule: taux = somme des votants / somme des inscrits de l'ensemble des bureaux de vote du fichier pour le scrutin
  ; série annuelle reconstruite en reportant la valeur du dernier scrutin jusqu'au scrutin suivant (D17)
premiere_annee: 2002
derniere_annee: 2022
nb_points_depuis_2000: 5
geo: FR
eligibilite_longlist: a_verifier
ligne_id: m04-000246
hors_longlist: non
raccordement: 'a_etudier : scrutin de 1995 absent du fichier (2000-2001 sans valeur) ; champ des inscrits de 2002
  et 2007 à comparer à celui de 2012-2022'
incontournable: oui
recommandation: retenir
motif_recommandation: 'Concept incontournable (participation et voix politique : Doughnut, SSF, OCDE, Eurostat)
  et scrutin le plus suivi, 5 scrutins de 2002 à 2022 (73,69 % en 2022) admis comme série irrégulière avec report
  de la dernière valeur (D17).'
note_pertinence: 'La participation à l''élection présidentielle est la mesure la plus simple et la plus parlante
  de l''engagement électoral : 72,11 % en 2002, 84,73 % en 2007, 79,48 % en 2012, 77,77 % en 2017 et 73,69 % en
  2022 d''après le fichier du ministère. La série ne bouge que tous les cinq ans : la valeur reportée entre deux
  scrutins ne dit rien des années intermédiaires. Le fichier est choisi comme série principale, malgré son niveau
  2, parce qu''il remonte à 2002 alors que la série de l''INSEE commence en 2012.'
