raccordement: 'a_etudier : la série INSEE (ODD 3.i8) donne 18,2 % en 2024 contre 23,1 % en 2023 chez Santé publique
  France, saut probablement lié au changement de protocole du Baromètre 2024'
incontournable: non
recommandation: retenir
motif_recommandation: Comportement à risque suivi par les cadres OCDE et Eurostat, 13 vagues de 2000 à 2023 (annuelles
  depuis 2014 ; 23,1 % en 2023), plus que l'indicateur national ODD 3.i8 de l'INSEE (9 vagues 2010-2024).
note_pertinence: Le tabagisme est un facteur de risque majeur des cancers et des maladies cardiovasculaires ; sa
  prévalence quotidienne est suivie par les cadres OCDE et Eurostat. La série de Santé publique France est préférée
  à la copie INSEE, plus courte, qui ajoute une valeur 2024 (18,2 %) probablement non comparable. La série OCDE
  et les ventilations de l'INSEE sont en variantes.
