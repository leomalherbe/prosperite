motif_recommandation: >-
  Série en nombre disponible seulement depuis 2016 (10 points) et de sens ambigu, sa progression traduisant aussi
  la hausse des plaintes (M04, autres_sources §2.4) ; la fréquence des violences conjugales est mesurée par l'enquête
  (victimes_violences_conjugales).
note_pertinence: >-
  Comme les violences sexuelles enregistrées, les violences intrafamiliales enregistrées progressent avec la révélation
  des faits (accueil des victimes, campagnes, Grenelle de 2019) : une hausse ne signale pas une dégradation de la
  sécurité. La série sert à décrire l'activité des services, pas le résultat.
