notes: 'geo FM et non FR : la fiche du jeu 431 indique un échantillon représentatif de la France métropolitaine
  (maintenance n° 4). Valeurs (docs/sources/series/drees__barometre_2000_2025_distributions.csv) : 7,87 (2014),
  12,38 (2015), 12,65 (2017), 17,12 (2018), 18,71 (2022), 19,24 (2023), 17,41 (2025) ; non-réponses 1,35 % (2017),
  6,08 % (2018), entre 6,2 et 7,8 % ensuite, comme pour la fiche sœur de securite (rupture_possible_2018). Contrôle
  de plausibilité (D34, D38 b) : tableau croisé simplifié publié par la DREES pour 2025 (docs/sources/series/drees__barometre_tc_simplifies_2025.txt)
  : 16,12 % « oui, plutôt », 59,80 % « non, plutôt pas », 17,41 % « déjà pauvre », 6,67 % sans réponse, identiques
  au calcul du robot ; vagues 2014-2023 non recoupées. Coordination avec securite : la correction n° 3 de la liste
  partagée (somme des modalités 1 et 3) est abandonnée (SEC-2, NDV-4 close) ; modalité 1 en securite, modalité 3
  ici. source_serie_id : identifiant du catalogue M04, qui cite encore les deux pièces jointes antérieures ; url_api
  : pièce jointe unique barometre2000_2025_diff_csv, comme la fiche sœur (question Q6 de l''audit). Pas de vague
  2024 pour PE03 (couverture du robot). Licence non indiquée sur la page du jeu (Licence Ouverte à confirmer).'
