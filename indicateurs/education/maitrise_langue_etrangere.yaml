definition: Part des personnes de 25 à 64 ans qui déclarent un niveau « très bon » dans la langue étrangère qu'elles
  connaissent le mieux, parmi celles qui connaissent au moins une langue étrangère, d'après l'enquête européenne
  sur l'éducation des adultes (Eurostat edat_aes_l31).
