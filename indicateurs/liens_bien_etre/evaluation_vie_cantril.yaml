recommandation: ecarter
motif_recommandation: Même concept que satisfaction_vie, couvert par l'INSEE sur une période équivalente (2010-2025
  contre 2011-2025), alors que cette série est une moyenne glissante sur trois ans, sans valeur 2013 et sans licence
  de réutilisation trouvée.
note_pertinence: L'échelle de Cantril mesure l'évaluation de la vie, comme la satisfaction SRCV, mais avec une autre
  question et un échantillon plus petit. Elle sert surtout aux comparaisons internationales, hors périmètre v1 ;
  elle pourra être reprise pour calibrer les bornes (référence européenne).
