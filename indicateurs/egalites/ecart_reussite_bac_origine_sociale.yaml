motif_recommandation: Seule mesure annuelle de la réussite scolaire selon l'origine sociale, contenu explicite de
  la dimension, calculée sur deux séries de la DEPP de 1997 à 2025 (97,1 % contre 87,5 % en 2025).
note_pertinence: 'L''écart mesure la réussite des candidats qui se présentent, pas l''accès au baccalauréat : les
  enfants d''ouvriers se présentent moins souvent et davantage en voie professionnelle. Il vaut 9,6 points en 2025.
  Les réformes du baccalauréat (2021) peuvent affecter la comparabilité.'
