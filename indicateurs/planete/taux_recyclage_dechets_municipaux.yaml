motif_recommandation: Moyen admis (D19) adossé aux cibles de 55 %, 60 % et 65 % (2025, 2030, 2035) de la directive-cadre
  déchets (texte à vérifier), série Eurostat de 2000 à 2024 (24,5 % en 2000, 40,9 % en 2024, estimé).
note_pertinence: Le taux plafonne autour de 40 % depuis 2015, loin des cibles européennes, ce qui rend l'indicateur
  discriminant. La plupart des valeurs depuis 2006 sont estimées par Eurostat. Les séries de l'INSEE (ODD 11.i3c)
  et de l'OCDE (How's Life 12_15) et les taux de recyclage par flux réglementé (emballages, DEEE, VHU, piles) sont
  en variantes.
