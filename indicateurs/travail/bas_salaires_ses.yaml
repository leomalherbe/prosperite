definition: Part des salariés (apprentis exclus) des entreprises de 10 salariés ou plus dont le salaire horaire
  brut est inférieur ou égal aux deux tiers du salaire horaire brut médian national (Eurostat, enquête quadriennale
  sur la structure des salaires).
