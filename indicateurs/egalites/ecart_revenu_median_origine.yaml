nb_points_depuis_2000: 22
geo: FR
eligibilite_longlist: oui
ligne_id: estat-054846 ; estat-054843
hors_longlist: non
rattachement_propose: lignes de la long-list niveau_de_vie (revenu médian par pays de naissance, variantes de niveau_de_vie/niveau_vie_median)
  ; l'écart construit relève d'egalites (A8, R3), les niveaux restent dans niveau_de_vie ; à trancher au gel 2
raccordement: non
incontournable: non
socle_propose: non
recommandation: retenir_variante
motif_recommandation: Écart calculé sur deux séries annuelles de 2004 à 2025 (22 points ; 20,3 % en 2004, 17,2 %
  en 2015, 22,1 % en 2025), qui couvre les immigrés devenus français, proposé comme alternative dans la famille
  ecart_pauvrete_origine.
note_pertinence: Le revenu médian des personnes nées à l'étranger est inférieur d'environ un cinquième à celui des
  personnes nées en France. Par pays de naissance, la mesure inclut les immigrés naturalisés, que l'écart de pauvreté
  selon la nationalité (principal de la famille) exclut. Les deux composantes sautent en 2008 (+22 % et +15 % en
  un an) sans drapeau, et portent des ruptures en 2020 et 2022.
