motif_recommandation: 'Sens ambigu : la hausse du nombre de détenus pour 100 000 habitants (de 97,26 en 2008 à 117,47
  en 2024) peut traduire plus de délinquance ou une justice plus sévère sans que l''État de droit progresse ni recule.'
note_pertinence: Le taux de détention décrit l'intensité du recours à la prison, mais il ne se lit ni comme une
  amélioration ni comme une dégradation de l'État de droit. La surpopulation carcérale et la part des détenus en
  attente de jugement, retenues dans la dimension, en portent la lecture normative ; la série reste disponible comme
  contexte.
