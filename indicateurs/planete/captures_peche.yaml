motif_recommandation: 'Sens ambigu : une baisse des captures (691 942 t en 2000, 442 800 t en 2025) peut traduire
  une pression moindre comme l''épuisement des stocks, que la série ne mesure pas.'
note_pertinence: 'La pression de pêche se juge par rapport à l''état des stocks, mesuré par l''Ifremer ou, au seul
  niveau européen, par Eurostat (env_bio5, sdg_14_21 : pas de données pour la France). Ces jeux ont été réintégrés
  comme candidats par D26 : la fiche les rend visibles, et la ventilation par zone de pêche est en variantes.'
