motif_recommandation: Opinion sur la société (D32) posée chaque année depuis 2000 (25 années), en baisse de 90,7
  % en 2000 à 63,5 % en 2025, calculée sur les microdonnées du baromètre DREES et plausible au regard des parts
  publiées par la DREES (88 % en 2014, 81 % en 2017).
note_pertinence: 'La préoccupation pour le chômage traduit l''inquiétude face au chômage, pour soi, ses proches
  ou le pays : c''est la face ressentie et collective de la sécurité de l''emploi. La question appartient à la batterie
  des préoccupations du baromètre (pauvreté, logement, environnement…), ce qui en fait une opinion sur la société
  (D32), distincte du risque perçu pour soi ou un proche (famille insecurite_emploi_percue). La série est longue,
  publique et sans trou depuis 2004 (pas d''enquête en 2003).'
