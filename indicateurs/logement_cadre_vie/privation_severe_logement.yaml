hors_longlist: non
rattachement_propose: ligne de la long-list niveau_de_vie (groupe privation_logement) renvoyée à logement_cadre_vie
  ; qualité du logement → logement_cadre_vie ; à trancher au gel 2
raccordement: 'non : série EU-SILC annuelle de 2004 à 2020, puis module triennal (2023)'
incontournable: oui
socle_propose: non
derogation_socle: 'Limite de 8 fiches du socle proposé atteinte (D41) avec une principale par sous-thème ; choix
  du correcteur (docs/cr/M05_logement_cadre_vie_corrections_journal.md §3, question 1 à la session mère) : combinaison
  du surpeuplement et d''un défaut grave, redondante avec surpeuplement et logement_humide (au socle, I6).'
recommandation: retenir
motif_recommandation: Indicateur incontournable qui croise surpeuplement et défauts du logement (suivi ODD 11 de
  l'UE, sdg_11_11), 18 valeurs de 2004 à 2023 (annuelles jusqu'en 2020, puis 2023, D17).
note_pertinence: L'indicateur cible les situations de mal-logement les plus graves, au croisement du manque d'espace
  et des défauts du logement. Il dépend de composantes déjà présentes dans la dimension (surpeuplement, humidité,
  sanitaires, éclairement), ce que le contrôle de redondance devra prendre en compte. La part, entre 2,1 % et 3,4
  % de 2004 à 2019, passe à 3,8 % en 2020 (rupture b) et 4,6 % en 2023 (table ODD sdg_11_11, API Eurostat lue le
  15/10/2026).
