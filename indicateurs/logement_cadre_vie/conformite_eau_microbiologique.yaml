note_pertinence: La qualité sanitaire de l'eau du robinet est une condition de vie subie que les ménages ne choisissent
  pas (R2). Le taux de conformité est élevé et varie peu (97,9 % en 2024, 9 valeurs distinctes de 2008 à 2024 d'après
  l'extrait du robot M04), mais une dégradation serait un signal fort ; une série quasi constante n'est pas un motif
  d'écart (D34).
