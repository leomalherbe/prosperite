motif_recommandation: Indicateur du tableau de bord ODD de l'UE, annuel de 2011 à 2023 (214,83 pour 100 000 en 2011,
  185,84 en 2019, 204,06 en 2021, 185,97 en 2023), sans drapeau.
note_pertinence: 'La mortalité évitable mesure les décès qu''une prévention efficace ou des soins de qualité auraient
  dû éviter : elle relie l''état de santé aux comportements et au système de soins. Elle a baissé jusqu''en 2019
  puis remonté en 2020-2021 par sa composante « prévention » (125,53 en 2019, 145,24 en 2021), dont la liste de
  causes comprend le Covid-19 (cause U_COV19 du jeu hlth_cd_apr). Sa composante traitable fait l''objet d''une fiche
  variante.'
