motif_recommandation: Pression atmosphérique soumise à un plafond d'émission européen, total national Eurostat homogène
  et sans drapeau de 2000 à 2024 (1 570 690 t en 2005, 647 990 t en 2024), identique au total de conformité à 10
  t près (D40).
note_pertinence: 'Les oxydes d''azote acidifient et eutrophisent les milieux et forment de l''ozone : la fiche porte
  la pression exercée, la pollution subie par la population relevant de logement_cadre_vie (R2). Les émissions ont
  été divisées par plus de deux depuis 2005. Le total de conformité, le Citepa (1990-2025), les agrégats sectoriels
  et les comptes d''émissions sont en variantes.'
