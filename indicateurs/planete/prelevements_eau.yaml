id: prelevements_eau
libelle: Prélèvements d'eau douce par habitant
dimension: planete
sous_theme: eau
famille: pression_eau
variante_principale: oui
definition: Volume total d'eau douce (de surface et souterraine) prélevé dans le milieu naturel pour tous les usages
  (eau potable, agriculture, industrie, refroidissement des centrales, canaux), rapporté à la population.
unite: m³ par habitant
sens: bas
type: pression
declaratif: non
composite: non
source_organisme: Eurostat
source_jeu: env_wat_abs (prélèvement annuel d'eau douce par source et secteur)
source_serie_id: env_wat_abs?freq=A&wat_proc=ABST&wat_src=FRW&unit=M3_HAB&geo=FR
source_niveau: 1
url_api: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/env_wat_abs?freq=A&wat_proc=ABST&wat_src=FRW&unit=M3_HAB&geo=FR
url_page: https://ec.europa.eu/eurostat/databrowser/view/env_wat_abs/default/table?lang=fr
frequence: annuelle
premiere_annee: 2000
derniere_annee: 2023
nb_points_depuis_2000: 24
geo: FR
eligibilite_longlist: oui
ligne_id: estat-041297
hors_longlist: non
raccordement: 'non : série continue depuis 2000'
incontournable: non
recommandation: retenir
motif_recommandation: Mesure de la pression sur la ressource en eau la plus longue au catalogue, série Eurostat
  sans drapeau de 2000 à 2023 (538 m³ par habitant en 2000, 341 m³ en 2023).
note_pertinence: 'Le refroidissement des centrales, dont l''eau est en grande partie restituée aux rivières, pèse
  lourd dans les prélèvements (13,3 milliards de m³ d''eau de surface en 2022, sur 34,1 milliards prélevés au total,
  toutes origines et eaux saumâtres comprises, d''après l''ITDD) : la ventilation par usage, en variante, aide à
  lire la tendance. Les volumes nationaux masquent les tensions locales et estivales. La série INSEE par usage (ODD
  6.i5, 2010-2022) et les ventilations par origine et par secteur sont en variantes.'
