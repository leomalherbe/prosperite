recommandation: retenir
motif_recommandation: Concept retenu par Stiglitz-Sen-Fitoussi, l'OCDE (1_1) et Eurostat (« revenu disponible des
  ménages », §5 du crosswalk) et seule série des catalogues en niveau réel par habitant, annuelle de 2000 à 2024
  (25 points).
note_pertinence: 'C''est la mesure des comptes nationaux de « ce dont disposent les ménages » : revenus d''activité
  et de patrimoine, après impôts et prestations, plus les services publics individualisables. Elle passe de 21 496
  € par habitant en 2000 à 27 882 € en 2024 (API Eurostat, lue le 14/10/2026), avec un recul en 2020 (25 849 € contre
  26 280 € en 2019). L''INSEE ne publie pas ce niveau mais son évolution par unité de consommation (fiche pouvoir_achat_uc,
  de la même famille).'
