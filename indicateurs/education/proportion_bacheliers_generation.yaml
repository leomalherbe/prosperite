motif_recommandation: Indicateur national de l'accès au baccalauréat, annuel de 2001 à 2023 en données définitives
  (23 points ; 80,7 % en 2023), prolongé par des données provisoires jusqu'en 2025 (80,1 %).
note_pertinence: Le taux d'accès au baccalauréat est le repère le plus suivi de la démocratisation scolaire en France.
  Il ne retient que le baccalauréat (les CAP et BEP n'y entrent pas) et dépend des règles de l'examen, ce qui en
  fait une mesure d'accès au diplôme plus que de compétences. Le même jeu donne une série « France hors DROM » de
  1970 à 2009 et des données provisoires pour 2024-2025, en variantes.
