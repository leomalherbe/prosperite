motif_recommandation: Seule mesure monétaire des aléas climatiques subis (A14), série Eurostat sans drapeau de 2000
  à 2024, très variable (130,75 € par habitant en 2022, 28,33 € en 2024).
note_pertinence: L'indicateur mesure le coût des aléas subis par le pays, que la grille range dans la planète (A14).
  Sa valeur annuelle dépend de quelques événements majeurs (318,22 € par habitant en 1999, année des tempêtes de
  décembre), si bien que la moyenne sur trente ans, en variante, se prête mieux à la lecture d'une tendance. Les
  indemnisations du régime des catastrophes naturelles (INSEE, ODD 13.i5) ne couvrent que les dommages assurés relevant
  du régime et sont en variante.
