notes: 'Composantes (A = femmes, B = hommes) lues sur l''API Eurostat le 14/10/2026 : valeurs depuis 1995 pour les
  deux, entières jusqu''en 2002 (avant EU-SILC), aucune valeur en 2003, drapeau b en 2001, 2004, 2020 et 2022 ;
  recoupement (D34) : 16 - 15 = 1 (2000), 14,2 - 12,7 = 1,5 (2004), 13,3 - 13,5 → 0,2 (2018), 17,3 - 15,3 = 2,0
  (2025). Variante ilc_pnp12 (« différences de sexe dans le taux de risque de pauvreté », unité « nombre ») : valeurs
  de -7,40 à -0,20 pour les 65 ans ou plus, qui ne correspondent pas à la différence des taux par sexe ; définition
