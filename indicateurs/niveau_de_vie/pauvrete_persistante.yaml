variante_principale: oui
definition: Part des personnes dont le revenu disponible équivalent est inférieur au seuil de pauvreté (60 % du
  médian) l'année courante et au moins deux des trois années précédentes (volet longitudinal d'EU-SILC).
unite: '% de la population'
