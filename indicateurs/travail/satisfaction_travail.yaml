definition: Note moyenne, sur une échelle de 0 à 10, donnée par les personnes de 16 ans ou plus de France métropolitaine
  à leur satisfaction concernant leur emploi principal (INSEE, enquête Statistiques sur les ressources et conditions
  de vie, SRCV).
unite: note moyenne (0 à 10)
sens: haut
type: resultat
declaratif: oui
composite: non
