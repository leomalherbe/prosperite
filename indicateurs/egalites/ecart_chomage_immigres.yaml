definition: Écart, en valeur absolue et en points, entre le taux de chômage des personnes de 15 à 74 ans nées dans
  un pays hors de l'Union européenne et celui des personnes nées en France (enquête Forces de travail, jeu Eurostat
  lfsa_urgacob).
