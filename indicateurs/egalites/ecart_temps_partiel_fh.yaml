id: ecart_temps_partiel_fh
libelle: Écart de part du temps partiel dans l'emploi entre femmes et hommes (20-64 ans)
dimension: egalites
sous_theme: écarts femmes-hommes
famille: ecart_temps_partiel_fh
variante_principale: oui
definition: Différence, en valeur absolue et en points, entre la part du temps partiel dans l'emploi des femmes
  et celle des hommes de 20 à 64 ans (jeu Eurostat sdg_05_30, modalité « personnes en emploi à temps partiel » ;
  la série publiée, hommes moins femmes, est négative).
