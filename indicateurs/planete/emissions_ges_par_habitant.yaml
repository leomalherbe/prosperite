frequence: annuelle
premiere_annee: 2000
derniere_annee: 2024
nb_points_depuis_2000: 25
geo: FR
eligibilite_longlist: oui
ligne_id: estat-002107
hors_longlist: non
raccordement: 'non : la source remonte à 1990 (9,4 t par habitant)'
incontournable: oui
recommandation: retenir_variante
motif_recommandation: Lecture par personne de la famille emissions_ges_territoire, comparable aux repères exprimés
  par habitant, série Eurostat sans drapeau passée de 9,1 t en 2000 à 5,3 t en 2024 (API lue le 14/10/2026).
note_pertinence: Rapporter les émissions à la population permet de les comparer aux repères par personne et aux
  autres pays européens. Eurostat est retenu plutôt que la série INSEE par habitant parce qu'il couvre 2000-2009
  ; l'INSEE (2010-2024), l'OCDE, la Banque mondiale et Our World in Data sont en variantes. Le libellé du jeu parle
  d'émissions « nettes », mais la série retenue exclut l'UTCATF ; la série avec UTCATF est une variante.
