motif_recommandation: Mesure INSEE du temps partiel subi et du chômage partiel, en série annuelle rétropolée de
  1990 à 2025 (26 points depuis 2000), indicateur national ODD 8.i3.
note_pertinence: 'Le sous-emploi est la forme principale du « temps partiel subi » nommé dans le contenu de la dimension.
  La série rétropolée évite la rupture de 2021 visible chez Eurostat (temps partiel involontaire de 36,9 % en 2020
  à 27,2 % en 2021). Elle inclut le chômage partiel, ce qui la fait bondir en 2020 : à garder en tête pour les bornes.'
