- https://data-pipeline-open.s3.sbg.io.cloud.ovh.net/elections/general_results.parquet (somme votants / somme inscrits)
formule: 'taux = 100 × somme(votants) / somme(inscrits) des lignes id_election = AAAA_regi_t1 et code_departement
  ∈ {01 à 95, 2A, 2B, ZA ou 971, ZB ou 972, ZC ou 973, ZD ou 974, ZM ou 976} de l''agrégat par scrutin et par département
  (première année lue : 2004, départements mal codés, non retenue ; série retenue depuis 2010) ; série annuelle
  par report de la valeur du dernier scrutin jusqu''au suivant (D17)'
