motif_recommandation: Seule série des accidents mortels avant 2015 (2008-2024, 17 points, ruptures en 2014, 2017,
  2020 et 2022), gardée en variante de la série nationale pour la profondeur (D40, D45).
note_pertinence: 'La série nationale de l''Assurance maladie ne commence qu''en 2015 ; la série européenne remonte
  à 2008 et permet de couvrir 2008-2014 après raccordement. Les deux séries suivent la même trajectoire (2,74 contre
  2,88 en 2018, 3,54 contre 3,75 en 2019, 3,61 contre 3,67 en 2024) mais leur champ diffère. Le raccordement reste
  à étudier : les ruptures de 2014 et 2017 tombent dans la période de recouvrement.'
