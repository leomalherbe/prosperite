motif_recommandation: Autre mesure de l'effort de recherche (moyens humains), annuelle de 2003 à 2024 (22 points
  ; 1,24 % en 2003, 1,72 % en 2024).
note_pertinence: Le personnel de R&D rapporté aux actifs complète la dépense par une mesure en personnes. La part
  progresse régulièrement (1,37 % en 2010, 1,62 % en 2020, 1,72 % en 2024) ; Eurostat signale une définition différente
  en 2008 et 2009 et une rupture en 2010. L'INSEE publie les effectifs en nombre (ODD 9.i4), en variante.
