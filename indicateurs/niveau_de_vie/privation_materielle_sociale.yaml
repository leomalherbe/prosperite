id: privation_materielle_sociale
libelle: Taux de privation matérielle et sociale
dimension: niveau_de_vie
sous_theme: privations
famille: privation_materielle_sociale
variante_principale: oui
definition: 'Part des personnes qui déclarent au moins 5 privations parmi 13 (7 relatives au ménage, 6 à la personne
  : faire face à une dépense imprévue, une semaine de vacances, un repas avec viande ou poisson un jour sur deux,
  chauffer son logement, une voiture, remplacer des meubles, des vêtements neufs, deux paires de chaussures, une
  petite somme pour soi, une activité de loisirs, retrouver des amis, internet, être sans impayés), enquête Statistiques
  sur les ressources et conditions de vie (SRCV).'
unite: '% de la population'
sens: bas
type: resultat
declaratif: non
composite: non
source_organisme: INSEE
source_jeu: BDM, indicateurs ODD (ODD-ERADICATION-PAUVRETE), indicateur 1.i2 et indicateur de richesse nationale
  n° 7
source_serie_id: '010594486'
source_niveau: 1
url_api: https://bdm.insee.fr/series/sdmx/data/SERIES_BDM/010594486
url_page: https://www.insee.fr/fr/statistiques/serie/010594486
frequence: annuelle
premiere_annee: 2013
derniere_annee: 2024
nb_points_depuis_2000: 12
geo: FM
eligibilite_longlist: oui
ligne_id: bdm-000871
hors_longlist: non
rattachement_propose: 'variantes hlth_dm110 (voiture, par handicap) importées de la long-list sante : lignes renvoyées
  à niveau_de_vie par sante (règle 50, D38 a)'
raccordement: 'a_etudier : la série commence en 2013 et aucune série de même définition ne la précède au catalogue
  ; le taux de « pauvreté en conditions de vie » de l''INSEE (SRCV, hors catalogue, maintenance NDV-9) serait le
  prédécesseur à raccorder (D16)'
incontournable: oui
socle_propose: oui
recommandation: retenir
motif_recommandation: Concept présent dans trois cadres (Stiglitz-Sen-Fitoussi, Eurostat, INSEE ; §5 du crosswalk),
  indicateur de richesse nationale n° 7, publié par l'INSEE de 2013 à 2024 (12 points), INSEE préféré à Eurostat
  à définition égale.
note_pertinence: 'La privation matérielle et sociale mesure directement ce que les ménages ne peuvent pas se payer,
  indépendamment du seuil de revenu. Selon l''INSEE (BDM 010594486, lue le 16/10/2026), le taux vaut 11,7 % en 2013,
  12,9 % en 2014, 12,4 % en 2019, 10,5 % en 2021, 13,1 % en 2023 et 12,7 % en 2024 ; la refonte de l''enquête SRCV
  crée une rupture entre 2019 et 2020 qui relève légèrement le taux. Plusieurs éléments de la liste ont des fiches
  propres dans d''autres dimensions (vacances, loisirs et sorties en liens_bien_etre, dépense imprévue et impayés
  en securite) : à surveiller au contrôle de redondance.'
