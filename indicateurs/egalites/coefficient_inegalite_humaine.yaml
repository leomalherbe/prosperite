motif_recommandation: Composite du PNUD couvrant plusieurs dimensions (durée de vie, éducation, revenu), plafonné
  à retenir_variante et rangé dans la famille de son concept dominant, l'inégalité de revenu (D38 c), annuel de
  2010 à 2023 (14 points ; 8,97 en 2023).
note_pertinence: 'Le coefficient réunit les inégalités de santé, d''éducation et de revenu ; la composante revenu
  (17,9 en 2023) pèse le plus. La règle D38 (c) plafonne les composites qui couvrent plusieurs dimensions à retenir_variante,
  jamais au socle : la fiche devient une variante de la famille inegalite_revenu, son concept dominant. Il recoupe
  les fiches de cette famille et inegalite_esperance_vie : double compte à traiter au contrôle de redondance (D18).'
