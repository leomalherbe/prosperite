motif_recommandation: Concept nommé dans le contenu de la dimension et cité par deux cadres (Doughnut, OCDE), doté
  d'une cible européenne de 9 % en 2030 pour les 15-29 ans, en série annuelle INSEE de 2003 à 2025 (23 points).
note_pertinence: 'Le taux de NEET mesure les jeunes à l''écart à la fois de l''emploi et de la formation : c''est
  l''indicateur d''insertion des jeunes retenu par l''Union. La cible européenne de 9 % en 2030 fournit une borne
  officielle. Le libellé Melodi de la mesure est ambigu (« part du sexe et de l''âge dans le nombre de jeunes NEET
  ») ; le tableau t310 de l''INSEE la présente comme la part de jeunes NEET, à confirmer sur les valeurs.'
