definition: 'Part des personnes de 25 à 34 ans vivant en ménage ordinaire dont le plus haut niveau atteint relève
  au moins du second cycle du secondaire (CITE 3 à 8 : CAP, BEP, baccalauréat ou plus), d''après l''enquête européenne
  sur les forces de travail (Eurostat edat_lfse_03).'
