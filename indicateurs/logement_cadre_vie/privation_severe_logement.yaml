id: privation_severe_logement
libelle: Privation sévère liée au logement
dimension: logement_cadre_vie
sous_theme: surpeuplement et qualité du logement
famille: privation_severe_logement
variante_principale: oui
definition: 'Part de la population vivant dans un logement surpeuplé qui présente en outre au moins un défaut grave
  : toit qui fuit ou humidité, absence de baignoire ou de douche, absence de toilettes intérieures, logement trop
  sombre (EU-SILC).'
unite: '% de la population'
sens: bas
type: resultat
declaratif: non
