motif_recommandation: Seule mesure de prévalence de la dépression, 4 vagues comparables (2005, 2010, 2017, 2021
  ; 13,3 % des 18-75 ans en 2021) admises comme série irrégulière (D17), incontournable au titre de la santé mentale
  (D43).
note_pertinence: La santé mentale est retenue par trois cadres (SSF, OCDE, Eurostat) et citée dans le contenu de
  la dimension ; elle est incontournable (D43). L'épisode dépressif caractérisé est mesuré par un questionnaire
  standardisé, ce qui en fait un état mesuré plutôt qu'une perception. La dernière vague comparable date de 2021
  ; l'édition 2024 du Baromètre (15,6 %) ouvre une nouvelle série, et la dépression déclarée de l'enquête EHIS (OCDE
  5_4, 2014 et 2019) est en variante.
