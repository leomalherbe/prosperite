id: bonheur_ressenti
libelle: Part des personnes heureuses tout le temps ou la plupart du temps (4 dernières semaines)
dimension: liens_bien_etre
sous_theme: émotions ressenties
famille: bonheur_ressenti
variante_principale: oui
definition: 'Part des personnes de 16 ans ou plus déclarant avoir été heureuses tout le temps ou la plupart du temps
  au cours des quatre dernières semaines (module bien-être d''EU-SILC, dont SRCV est le volet français) : somme
  des modalités « toujours » et « la plupart du temps » du jeu Eurostat ilc_pw08.'
unite: '% des 16 ans ou plus'
sens: haut
type: resultat
declaratif: oui
composite: non
