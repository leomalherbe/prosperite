notes: 'Calcul du projet (D34) sur la sortie de la vague 9 du robot (docs/sources/series/interieur_elections__participation_par_departement.csv
  : inscrits, votants et exprimés sommés par scrutin et par département sur general_results.csv, aucun votant manquant),
  lue le 15/10/2026 : 64,53 % (2002), 60,46 % (2007), 58,18 % (2012), 49,61 % (2017), 48,38 % (2022), 67,87 % (2024).
  Recoupement : INSEE BDM 001778442 (58,2 %, 49,6 %, 48,4 % et 67,9 % de 2012 à 2024), identique à l''arrondi ;
  2002 et 2007 non recoupés (premiers tours absents des pages d''archives lisibles à l''outil). Les Français de
  l''étranger n''élisent des députés que depuis 2012 ; avant l''audit, la fiche portait le taux de tous les bureaux
  (57,22 % en 2012, 47,51 % en 2022, 66,71 % en 2024), qui les inclut depuis cette date. En 2002, le fichier ne
  contient ni Mayotte ni la Saône-et-Loire (398 818 inscrits à la présidentielle de 2002, 1 % du champ) ; la participation
  de ce département dépassant la moyenne de 1 à 1,5 point en 2007 et 2012, l''effet sur 2002 est inférieur à 0,02
  point.'
