note_pertinence: 'La préoccupation pour le chômage traduit la crainte de perdre son emploi ou de ne pas en trouver,
  pour soi ou ses proches : c''est la face ressentie de la sécurité de l''emploi. La question mêle une inquiétude
  personnelle et un jugement sur la situation du pays, ce qui la rapproche d''une opinion sur la société (D32).
  La série est longue, publique et sans trou depuis 2004 (pas d''enquête en 2003).'
