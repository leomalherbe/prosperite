note_pertinence: 'Le parc social offre des loyers inférieurs à ceux du marché : sa taille rapportée à la population
  mesure la capacité à loger les ménages modestes à un coût supportable. Il passe de 699 logements pour 10 000 habitants
  en 2012 à 787 en 2025 (BDM lue le 15/10/2026). C''est un indicateur de moyens sans cible nationale par habitant
  (l''objectif de la loi SRU porte sur une part des résidences principales, commune par commune).'
