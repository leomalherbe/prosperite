motif_recommandation: Mesure directe de la dépendance aux énergies fossiles visée par l'article L100-4, série Eurostat
  sans drapeau de 2000 à 2024 (54,89 % en 2000, 46,99 % en 2024).
note_pertinence: La part des fossiles résume la dépendance du système énergétique au carbone fossile ; elle baisse
  lentement et a remonté en 2022 (50,92 %), année de faible production nucléaire. La série INSEE (part des fossiles
  dans la consommation primaire, 2011-2024) et la structure de la consommation finale par énergie sont en variantes.
  L'objectif légal porte sur la consommation primaire de fossiles en volume, à calculer à partir des bilans.
