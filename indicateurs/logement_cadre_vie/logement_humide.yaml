motif_recommandation: Indicateur incontournable de la qualité du logement (cadre Qualité de vie d'Eurostat, SSF),
  18 valeurs de 2004 à 2023 (annuelles jusqu'en 2020, module triennal ensuite, D17).
note_pertinence: L'humidité et les infiltrations sont les défauts du logement les plus répandus et les plus liés
  à la santé respiratoire. Le taux, compris entre 10,9 % et 15,0 % de 2004 à 2019, passe à 18,0 % en 2020 (drapeau
  b) puis 21,1 % en 2023 (API Eurostat, lue le 14/10/2026). Le saut coïncide avec une rupture de série et doit être
  expliqué avant de fixer des bornes.
