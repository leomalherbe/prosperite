id: libertes_freedom_house
libelle: Score global de liberté (Freedom House)
dimension: democratie
sous_theme: qualité démocratique (indices composites)
famille: qualite_democratique
variante_principale: non
definition: 'Score global de Freedom in the World (de 0 à 100), somme des droits politiques (0 à 40 : processus
  électoral, pluralisme, fonctionnement du gouvernement) et des libertés civiles (0 à 60 : expression, association,
  État de droit, autonomie personnelle), notés par des analystes de Freedom House ; relais Our World in Data, dont
  les années sont les années couvertes (l''édition du rapport paraît l''année suivante).'
