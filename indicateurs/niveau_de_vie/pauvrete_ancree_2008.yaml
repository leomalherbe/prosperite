motif_recommandation: Indicateur de pauvreté « absolue » du cadre Qualité de vie d'Eurostat, annuel de 2008 à 2025
  (18 points), lecture en taux du premier décile en euros constants, principal de la famille, mais dont la hausse
  tient aux ruptures d'EU-SILC de 2020 et 2022.
note_pertinence: 'Avec un seuil fixé une fois pour toutes en termes réels, ce taux baisse quand le niveau de vie
  des plus modestes progresse, même si les inégalités ne bougent pas : il répond à la question « les pauvres vivent-ils
  mieux qu''avant ? ». Il passe de 12,5 % en 2008 à 12,1 % en 2019, puis 14,2 % en 2020, 15,0 % en 2022 et 15,6
  % en 2025 (API Eurostat, lue le 16/10/2026). Toute la hausse se concentre sur les deux années de rupture (+2,1
  points en 2020, +1,6 en 2022) : hors ruptures, la série baisse de 0,6 point, et elle ne peut donc pas se lire
  seule comme une dégradation, à la différence du premier décile de l''INSEE, série sans rupture.'
