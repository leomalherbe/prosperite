raccordement: 'a_etudier : 2001 absent du fichier et 2008 limité aux communes de plus de 3 500 habitants (66,5 %
  publiés pour l''ensemble des communes) : 2000-2013 sans valeur comparable'
incontournable: non
socle_propose: non
recommandation: retenir_variante
motif_recommandation: Scrutin local de référence, 3 scrutins comparables de 2014 à 2026 sur un champ homogène (44,60
  % en 2020, scrutin tenu au début de l'épidémie de covid-19), le fichier ne couvrant en 2008 que les communes de
  plus de 3 500 habitants.
note_pertinence: 'Les municipales mesurent la participation à la démocratie locale, la plus proche des habitants
  : 63,52 % en 2014, 44,60 % en 2020 et 57,10 % en 2026, en métropole et dans les DROM. Le creux de 2020, scrutin
  tenu au début de l''épidémie de covid-19, complique la lecture de la tendance. La valeur 2008 du fichier (58,81
  %) est retirée : elle ne porte que sur les communes de plus de 3 500 habitants, contre 66,5 % publiés pour l''ensemble
  des communes.'
