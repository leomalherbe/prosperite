id: rapport_s80_s20
libelle: Rapport interquintile S80/S20 du niveau de vie (masses détenues par les 20 % les plus aisés et les 20 %
  les plus modestes)
dimension: egalites
sous_theme: inégalités de revenu
famille: inegalite_revenu
variante_principale: oui
definition: Rapport entre la masse des niveaux de vie détenue par les 20 % de personnes les plus aisées et celle
  détenue par les 20 % les plus modestes, après impôts directs et prestations sociales (enquête Revenus fiscaux
  et sociaux, données rétropolées, France métropolitaine, ménages ordinaires).
unite: rapport (sans unité)
sens: bas
type: resultat
declaratif: non
composite: non
