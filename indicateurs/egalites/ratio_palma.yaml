hors_longlist: non
raccordement: 'non : série rétropolée par l''INSEE depuis 1996, sans rupture'
incontournable: non
socle_propose: non
recommandation: retenir_variante
motif_recommandation: Statistique retenue par le Doughnut, qui fixe un seuil de privation à un ratio de Palma de
  2, publiée par l'INSEE de 1996 à 2024 (25 points depuis 2000) et proposée comme alternative au S80/S20.
note_pertinence: 'Le Palma compare directement le haut et le bas de la distribution, là où se concentrent les variations
  des inégalités. Calculé sur EU-SILC (ilc_di01 : part du 10e décile rapportée aux parts des deux premiers quintiles),
  il vaut environ 1,04 en 2018 et 1,14 en 2025, bien sous le seuil de 2 du Doughnut ; mesuré avant impôts par le
  WID, il atteint 2,64 en 2022. Le seuil du Doughnut, défini pour des comparaisons mondiales, ne convient donc pas
  tel quel comme borne en France.'
