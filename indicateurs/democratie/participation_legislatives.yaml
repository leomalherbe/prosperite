incontournable: oui
recommandation: retenir_variante
motif_recommandation: Scrutin national qui désigne l'Assemblée nationale et seconde lecture de la participation
  nationale, 6 scrutins de 2002 à 2024 (de 47,51 % en 2022 à 66,71 % en 2024 au premier tour).
note_pertinence: 'Les législatives mesurent l''intérêt pour l''élection du Parlement, en net recul de 2002 (64,53
  %) à 2022 (47,51 %) avant le rebond de 2024 (66,71 %), après la dissolution. Elles complètent la présidentielle,
  dont elles suivent le calendrier depuis 2002 (sauf en 2024) : l''utilisateur choisira l''une ou l''autre, ou les
  deux avec prudence.'
