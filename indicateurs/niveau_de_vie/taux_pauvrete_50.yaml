incontournable: non
socle_propose: non
recommandation: retenir_variante
motif_recommandation: Seuil de pauvreté de l'OCDE (How's Life 1_4) et du Doughnut, publié sans rupture de 1996 à
  2024 (25 points), substituable au taux à 60 %, principal de la famille.
note_pertinence: 'Le seuil à 50 % isole une pauvreté plus marquée et permet la comparaison avec l''OCDE, dont la
  série France ne couvre que 2020-2023. Il se lit comme le taux à 60 % et lui est substituable : l''utilisateur
  choisit l''un ou l''autre. Les seuils de 40 % (grande pauvreté) sont rattachés en variantes.'
