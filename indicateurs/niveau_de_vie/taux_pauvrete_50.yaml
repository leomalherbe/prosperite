id: taux_pauvrete_50
libelle: Taux de pauvreté monétaire (seuil à 50 % du niveau de vie médian)
dimension: niveau_de_vie
sous_theme: pauvreté monétaire
famille: pauvrete_monetaire
variante_principale: non
definition: Part des personnes dont le niveau de vie est inférieur à 50 % du niveau de vie médian (enquête Revenus
  fiscaux et sociaux, données rétropolées, France métropolitaine).
