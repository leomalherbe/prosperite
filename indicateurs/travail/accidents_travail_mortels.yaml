- https://data.ameli.fr/api/explore/v2.1/catalog/datasets/sinistralite-par-secteur-d-activite-concerne-naf-1 (Accidents
  du travail.TOUS.Tous secteurs confondus.Tous secteurs confondus#nb_salaries_int)
