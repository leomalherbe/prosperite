motif_recommandation: Mesure de référence du débat public sur le pouvoir d'achat (INSEE, 1960-2025, 26 points depuis
  2000), gardée à côté du niveau réel par habitant parce qu'elle se lit en évolution.
note_pertinence: 'Le « pouvoir d''achat par unité de consommation » est le chiffre que l''INSEE et les médias commentent
  chaque année ; il neutralise la croissance et le vieillissement de la population. Il mesure une évolution, pas
  un niveau : une année à +0 % après une forte hausse reste une bonne situation, ce que la fiche principale en niveau
  rend mieux. Les bornes devront donc être des taux de croissance (par exemple 0 % et +2 %).'
