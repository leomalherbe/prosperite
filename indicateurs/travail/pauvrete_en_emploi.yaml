id: pauvrete_en_emploi
libelle: Taux de risque de pauvreté des personnes en emploi
dimension: travail
sous_theme: rémunération
famille: pauvrete_en_emploi
variante_principale: oui
definition: Part des personnes de 18 ans ou plus en emploi dont le niveau de vie est inférieur à 60 % du niveau
  de vie médian (EU-SILC, enquête SRCV de l'INSEE pour la France).
unite: '% des personnes en emploi de 18 ans ou plus'
sens: bas
type: resultat
declaratif: non
composite: non
source_organisme: Eurostat
source_jeu: ilc_iw01 (EU-SILC)
source_serie_id: ilc_iw01?freq=A&wstatus=EMP&sex=T&age=Y_GE18&unit=PC&geo=FR
source_niveau: 1
url_api: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/ilc_iw01?freq=A&wstatus=EMP&sex=T&age=Y_GE18&unit=PC&geo=FR
url_page: https://ec.europa.eu/eurostat/databrowser/view/ilc_iw01/default/table?lang=fr
frequence: annuelle
premiere_annee: 2004
derniere_annee: 2025
nb_points_depuis_2000: 22
geo: FR
eligibilite_longlist: oui
ligne_id: estat-030686
hors_longlist: non
raccordement: non
incontournable: non
recommandation: retenir
motif_recommandation: Mesure des travailleurs pauvres, de même définition que l'indicateur ODD européen sdg_01_41,
  en série annuelle 2004-2025 (22 points).
note_pertinence: 'Avoir un emploi ne protège pas toujours de la pauvreté : l''indicateur mesure si le travail permet
  de vivre. Les valeurs vont de 5,4 % (2004) à 8,7 % (2025), avec des ruptures en 2008, 2020 et 2022 (API Eurostat,
  14/10/2026). Il dépend aussi de la composition du ménage, ce qui le place à la frontière de niveau_de_vie : la
  session mère tranchera.'
