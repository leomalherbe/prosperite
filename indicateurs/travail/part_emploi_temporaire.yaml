id: part_emploi_temporaire
libelle: Part des CDD et de l'intérim dans l'emploi
dimension: travail
sous_theme: qualité et sécurité de l'emploi
famille: emploi_temporaire
variante_principale: oui
definition: Part des personnes en emploi en contrat à durée déterminée ou en intérim, en moyenne annuelle (INSEE,
  enquête Emploi, séries longues rétropolées) ; somme des parts des CDD et de l'intérim.
unite: '% des personnes en emploi'
sens: bas
type: resultat
declaratif: non
composite: non
source_organisme: INSEE
source_jeu: Melodi DD_EEC_SERIES (enquête Emploi, séries longues), mesure PT_EMPFORM_IN_EMP_BY_SEX_AGE
source_serie_id: 'DD_EEC_SERIES : PT_EMPFORM_IN_EMP_BY_SEX_AGE, EMPFORM=22 (CDD) + EMPFORM=26 (intérim), AGE=_T,
  SEX=_T'
