note_pertinence: Les vols avec violence sont l'atteinte qui mêle biens et personnes et pèse le plus sur le sentiment
  d'insécurité dans l'espace public. L'enquête est préférée à la série enregistrée, mais elle n'est accessible ici
  que par le relais ONUDC/OCDE, dont la documentation ne précise pas le champ (âge, métropole) ; la série enregistrée
  (vols_violence_enregistres), qui baisse continûment depuis 2013, en est une variante solide.
