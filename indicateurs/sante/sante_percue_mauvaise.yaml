id: sante_percue_mauvaise
libelle: Personnes se déclarant en mauvaise ou très mauvaise santé
dimension: sante
sous_theme: santé perçue et limitations
famille: sante_percue
variante_principale: non
definition: Part des personnes de 16 ans ou plus vivant en logement ordinaire qui jugent leur état de santé général
  « mauvais » ou « très mauvais » (enquête SRCV, volet français d'EU-SILC).
unite: '% des 16 ans ou plus'
sens: bas
type: resultat
declaratif: oui
composite: non
source_organisme: Eurostat (d'après l'INSEE, enquête SRCV)
source_jeu: hlth_silc_10 (santé perçue par sexe, âge et quintile de revenu), ensemble des quintiles
source_serie_id: hlth_silc_10?freq=A&unit=PC&quant_inc=TOTAL&age=Y_GE16&sex=T&levels=B_VB&geo=FR
source_niveau: 1
url_api: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/hlth_silc_10?freq=A&unit=PC&quant_inc=TOTAL&age=Y_GE16&sex=T&levels=B_VB&geo=FR
url_page: https://ec.europa.eu/eurostat/databrowser/view/hlth_silc_10/default/table?lang=fr
frequence: annuelle
premiere_annee: 2005
derniere_annee: 2025
nb_points_depuis_2000: 21
geo: FR
eligibilite_longlist: oui
ligne_id: estat-011360
hors_longlist: non
raccordement: 'a_etudier : ruptures de 2020 et 2022 de l''enquête SRCV à neutraliser'
incontournable: oui
recommandation: retenir_variante
motif_recommandation: Autre lecture de la même question que la part en bonne santé, centrée sur les états de santé
  dégradés, annuelle de 2005 à 2025 (9,9 % en 2005, 7,7 % en 2015, 10,8 % en 2023, 10,2 % en 2025).
note_pertinence: 'La part des personnes en mauvaise ou très mauvaise santé isole les situations les plus dégradées,
  que la part en bonne santé confond avec la catégorie « moyen » (méthode §1 : une autre statistique sur la même
  question se lit autrement pour le public et pour les bornes). Elle baisse de 9,9 % en 2005 à 7,7 % en 2015, puis
  remonte à 10,8 % en 2023, avec des ruptures (« b ») en 2020 et 2022. Les ventilations EU-SILC, la série OCDE 5_2_DEP
  et les catégories « mauvais » et « très mauvais » des 18 ans ou plus (ilc_lvhl01, 2004-2025) sont en variantes.'
