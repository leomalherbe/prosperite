motif_recommandation: Variante principale de la famille privation_internet (privation numérique pour raisons financières),
  série Eurostat annuelle de 2014 à 2025 (12 points), élément de la privation matérielle et sociale de l'UE ; la
  privation d'ordinateur, plus longue (2004-2025), est en variante.
note_pertinence: L'indicateur isole les personnes exclues du numérique faute de moyens, une privation devenue pénalisante
  quand les démarches passent en ligne. L'élément entre dans la privation matérielle et sociale suivie en niveau_de_vie,
  ce que le contrôle de redondance devra noter. La part est faible et baisse de 2,7 % en 2014 à 1,4 % en 2024 (1,6
  % en 2025, API Eurostat lue le 15/10/2026).
