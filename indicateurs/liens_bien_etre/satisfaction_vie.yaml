  2002-2009 avec une autre question (pas de raccordement)'
incontournable: oui
recommandation: retenir
motif_recommandation: Indicateur présent dans quatre cadres de référence (SSF, OCDE, Eurostat, INSEE) et indicateur
  de richesse nationale n° 5, publié chaque année par l'INSEE depuis 2010 (16 points, 2010-2025).
note_pertinence: C'est la mesure de référence de l'évaluation globale de la vie, retenue comme indicateur ordinaire
  de la dimension (arbitrage A1). La voie Melodi est retenue parce qu'elle va jusqu'en 2025, alors que la BDM s'arrête
  en 2024. La série bouge peu (de 6,8 à 7,5 sur 2010-2024 d'après la BDM), ce qui appellera des bornes resserrées.
