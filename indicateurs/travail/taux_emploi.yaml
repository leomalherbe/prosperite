id: taux_emploi
libelle: Taux d'emploi des 15-64 ans
dimension: travail
sous_theme: emploi
famille: taux_emploi
variante_principale: oui
definition: Part des personnes de 15 à 64 ans qui ont un emploi au sens du Bureau international du travail (avoir
  travaillé au moins une heure pendant la semaine de référence), en moyenne annuelle, d'après l'enquête Emploi de
  l'INSEE ; séries longues rétropolées par l'INSEE (ruptures de 2003, 2013 et 2021 corrigées, champ France entière
  y compris Mayotte).
unite: '% de la population de 15 à 64 ans'
sens: haut
type: resultat
declaratif: non
composite: non
source_organisme: INSEE
source_jeu: Melodi DD_EEC_SERIES (enquête Emploi, séries longues), mesure EMPRATE
