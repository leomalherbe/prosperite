motif_recommandation: Satisfaction à l'égard des urgences hospitalières, objet voisin des hôpitaux publics, posée
  chaque année de 2010 à 2025 (16 vagues ; 63,0 % en 2010, 57,0 % en 2014, 42,8 % en 2022, 44,1 % en 2025 parmi
  les répondants qui ont un avis), calculée par le projet et non recoupée (D38 b).
note_pertinence: 'Les urgences sont la porte d''entrée de l''hôpital pour les soins non programmés ; parmi les répondants
  qui ont un avis, la satisfaction à leur égard recule bien plus que celle envers les hôpitaux publics (de 57,0
  % à 44,1 % entre 2014 et 2025, contre 75,2 % à 63,7 %). La série baisse par paliers (45,6 % en 2018, 42,8 % en
  2022), avec une remontée en 2020 et 2021 (53,2 % et 55,4 %). La part des répondants qui n''y sont jamais allés
  double de 2014 à 2022 : l''exclure du dénominateur évite qu''elle pèse sur la tendance.'
