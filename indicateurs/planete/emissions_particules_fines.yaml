motif_recommandation: Pression atmosphérique soumise à un plafond d'émission européen, total national Eurostat homogène
  et sans drapeau de 2000 à 2024 (342 500 t en 2005, 167 520 t en 2024), identique au total de conformité (D40).
note_pertinence: Les émissions de particules fines (chauffage au bois, transports, agriculture, industrie) sont
  la pression ; l'exposition de la population relève de logement_cadre_vie (R2). Elles ont été divisées par deux
  depuis 2005. Le total de conformité, les PM10, le carbone suie (Citepa) et l'intensité en particules de l'industrie
  manufacturière sont en variantes.
