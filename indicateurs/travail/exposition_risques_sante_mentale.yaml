id: exposition_risques_sante_mentale
libelle: Personnes en emploi exposées à des risques pour la santé mentale au travail
dimension: travail
sous_theme: conditions et santé au travail
famille: risques_psychosociaux
variante_principale: oui
definition: Part des personnes en emploi de 15 à 64 ans qui déclarent être exposées au travail à au moins un facteur
  de risque pouvant nuire à leur bien-être mental (pression des délais ou surcharge, harcèlement, violence…), d'après
  le module ad hoc de l'enquête sur les forces de travail (Eurostat).
unite: '% des personnes en emploi'
sens: bas
type: resultat
declaratif: non
composite: non
source_organisme: Eurostat
