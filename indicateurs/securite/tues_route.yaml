id: tues_route
libelle: Tués sur les routes (pour 100 000 habitants)
dimension: securite
sous_theme: sécurité routière
famille: securite_routiere
variante_principale: oui
definition: 'Nombre de personnes tuées dans un accident de la circulation routière (décès dans les 30 jours), rapporté
  à la population moyenne de l''année, pour 100 000 habitants (indicateur de développement durable de l''UE, sdg_11_40).
  Champ mixte : le nombre de tués est celui de la France métropolitaine, la population celle de la France entière.'
unite: tués pour 100 000 habitants
sens: bas
type: resultat
declaratif: non
composite: non
source_organisme: Eurostat, d'après la Commission européenne (DG Mobilité et transports)
source_jeu: sdg_11_40 — Décès sur les routes, par type de route
source_serie_id: sdg_11_40?freq=A&tra_infr=TOTAL&unit=RT&geo=FR
source_niveau: 1
url_api: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/sdg_11_40?freq=A&tra_infr=TOTAL&unit=RT&geo=FR
url_page: https://ec.europa.eu/eurostat/databrowser/view/sdg_11_40/default/table?lang=fr
frequence: annuelle
premiere_annee: 2000
derniere_annee: 2024
nb_points_depuis_2000: 25
geo: FR
eligibilite_longlist: oui
ligne_id: estat-002049
hors_longlist: non
raccordement: non
incontournable: non
recommandation: retenir
motif_recommandation: Indicateur des cadres OCDE (10_3), ODD 3.6 et objectif UE 2030, taux pour 100 000 habitants
  2000-2024 sans lacune (13,3 en 2000, 4,6 en 2024) à champ mixte documenté (D32), proposé au socle (retenu_socle)
  au vu de l'arbitrage A6 et des cibles officielles.
note_pertinence: 'La sécurité routière est rattachée à la dimension par l''arbitrage A6 du gel 1. Le taux de tués
  a été divisé par près de trois depuis 2000, surtout entre 2002 et 2006 (de 12,4 à 7,4), puis stagne autour de
  5 depuis 2013. Le taux publié rapporte les tués de France métropolitaine à la population de la France entière
  : il est sous-estimé d''environ 3 % (4,6 publié en 2024 contre 4,8 pour la métropole), mais le rapport entre les
  deux populations varie peu et la tendance est préservée. Les objectifs officiels (ODD 3.6, UE 2030) fournissent
  des bornes.'
