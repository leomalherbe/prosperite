motif_recommandation: Indicateur du cadre Eurostat Qualité de vie (écart d'emploi entre nationaux et ressortissants
  de pays tiers), construit sur deux séries annuelles de 2000 à 2025 (26 points) de signe constant (23,0 points
  en 2000, 24,5 en 2016, 19,3 en 2025), principale de la famille ecart_emploi_origine.
note_pertinence: Le taux d'emploi des 20-64 ans, sans biais de structure par âge, mesure l'accès à l'emploi des
  ressortissants de pays hors UE, chômage et inactivité compris. L'écart reflète des différences de qualification,
  de maîtrise de la langue et des discriminations, sans les distinguer. La nationalité exclut les immigrés devenus
  français, que l'écart de chômage selon le pays de naissance (variante de la famille) couvre.
