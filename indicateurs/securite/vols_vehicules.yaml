raccordement: 'a_etudier : lacune 2017-2019, série SSMSI des vols de véhicules (2016-2025, non cataloguée, maintenance
  n° 6) à rapporter à la population moyenne (× 100 000) puis à recouper avec Eurostat sur 2016 et 2020-2024 (D34)'
incontournable: non
socle_propose: non
recommandation: retenir
motif_recommandation: Vols de véhicules enregistrés pour 100 000 habitants, 2008-2024 (330 en 2008, 198 en 2024),
  lacune 2017-2019 ; environ une victime sur deux porte plainte (47,2 % pour les vols ou tentatives de vol de voiture
  en 2019 selon l'INSEE, 51 % en 2020 selon le SSMSI) et le sens bas repose sur l'hypothèse, non vérifiée, d'un
  taux de plainte stable.
note_pertinence: 'Le vol de voiture ou de deux-roues est une atteinte aux biens fréquente ; la catégorie ICCS 05021
  compte aussi les vols de pièces détachées. Environ la moitié seulement des victimes porte plainte, si bien que
  la série enregistrée ne suit les vols que si ce taux reste stable : la série SSMSI des taux de plainte (enquête
  CVS, 2006-2020) permettra de le vérifier une fois cataloguée. La série a nettement baissé de 2008 à 2021, puis
  remonte légèrement ; elle complète les cambriolages pour les atteintes aux biens.'
