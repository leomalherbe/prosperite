notes: 'Extrait du robot M04 (docs/sources/series/sdes__itdd_france_entiere.csv) : périodes 2011, 2016 et 2022,
  2 valeurs distinctes, dernière valeur 13 (act) et 19 (nav) minutes ; distance médiane 8,4 km (act) et 14,9 km
  (nav) en 2022. Les valeurs de 2011 et 2016 ne figurent pas dans les extraits commités et la lecture du fichier
  DiDo n''a pas abouti le 15/10/2026 (autorisation non accordée à l''outil) : non trouvé. Le même fichier donne
  les parts modales des déplacements domicile-travail (2016, 2022), reprises en variante de part_modale_transports_collectifs.
  Aucune série annuelle du temps de trajet n''est cataloguée (enquêtes Mobilité des personnes du SDES ponctuelles,
  d''après le relevé M03).'
