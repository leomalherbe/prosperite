famille: sous_utilisation
variante_principale: oui
definition: Part des personnes de 15 à 64 ans au chômage, dans le halo autour du chômage ou en sous-emploi parmi
  les participants au marché du travail (personnes en emploi, au chômage ou dans le halo) ; INSEE, enquête Emploi,
  série trimestrielle corrigée des variations saisonnières, champ France entière.
