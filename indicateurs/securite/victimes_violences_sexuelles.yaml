recommandation: retenir
motif_recommandation: >-
  Seule mesure de la fréquence des violences sexuelles indépendante de la plainte (enquête, 2010-2023) ; valeurs
  faibles (0,4 à 0,8 %) arrondies au dixième, donc peu sensibles aux évolutions.
note_pertinence: >-
  Les violences sexuelles sont celles pour lesquelles l'écart entre faits subis et faits enregistrés est le plus
  grand : la série enregistrée a quadruplé depuis 2010 quand l'enquête reste stable. L'enquête est donc la seule
  base pour juger de leur fréquence. Sa précision est limitée (petits effectifs, arrondi au dixième de point) et
  elle subit la même rupture CVS/VRS que l'indicateur d'ensemble.
