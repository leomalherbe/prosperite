id: maladie_chronique
libelle: Personnes ayant une maladie ou un problème de santé chronique
dimension: sante
sous_theme: santé perçue et limitations
famille: maladie_chronique
variante_principale: oui
definition: Part des personnes de 16 ans ou plus déclarant une maladie ou un problème de santé chronique ou de caractère
  durable (enquête SRCV, volet français d'EU-SILC).
unite: '% des 16 ans ou plus'
sens: bas
type: resultat
declaratif: non
composite: non
source_organisme: Eurostat (d'après l'INSEE, enquête SRCV)
source_jeu: hlth_silc_04 (problème de santé de longue durée par statut d'activité), population totale
source_serie_id: hlth_silc_04?freq=A&unit=PC&wstatus=POP&age=Y_GE16&sex=T&geo=FR
source_niveau: 1
url_api: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/hlth_silc_04?freq=A&unit=PC&wstatus=POP&age=Y_GE16&sex=T&geo=FR
url_page: https://ec.europa.eu/eurostat/databrowser/view/hlth_silc_04/default/table?lang=fr
frequence: annuelle
premiere_annee: 2008
derniere_annee: 2025
nb_points_depuis_2000: 18
geo: FR
eligibilite_longlist: oui
ligne_id: estat-011428
hors_longlist: non
raccordement: 'a_etudier : ruptures de 2020 et 2022 ; la série par degré d''urbanisation (hlth_silc_19) remonte
  à 2004 mais saute de 33,5 % en 2007 à 36,5 % en 2008 sans drapeau'
incontournable: oui
socle_propose: oui
recommandation: retenir
motif_recommandation: Concept « morbidité » du §5 du crosswalk (cadres SSF, OCDE, Eurostat), annuel de 2008 à 2025
  (36,7 % en 2008, 41,7 % en 2025).
note_pertinence: La part de personnes atteintes d'une maladie chronique mesure la morbidité déclarée ; sa hausse
  tient aussi au vieillissement de la population et à de meilleurs diagnostics, ce qui nuance le sens « bas ». Elle
  passe de 36,7 % en 2008 à 41,7 % en 2025, avec un saut à la rupture de 2022 (37,5 % en 2021, 40,7 % en 2022).
