notes: 'Moyenne annuelle calculée par le projet (D34) sur les valeurs mensuelles publiées : l''INSEE ne publie pas
  de moyenne annuelle de ce solde, aucun recoupement n''est possible (calcul élémentaire). Valeurs mensuelles brutes
  lues sur la BDM le 16/10/2026 (mise à jour du 24/09/2026) : de −36 à −18 en 2019, de −64 à −48 en 2025, −62 en
  septembre 2026. La long-list classe la ligne non éligible pour le seul motif hors_grille (D29, P8), levé par D38
  (j) ; série mensuelle depuis 1970 (catalogue). L''horizon de la question (douze mois ?) n''est pas écrit dans
  les publications relues (publication Camme de décembre 2016 sur insee.fr) : à vérifier dans le questionnaire.
  Variante : données CVS (000857189).'
