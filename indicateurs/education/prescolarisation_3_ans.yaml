incontournable: non
recommandation: retenir_variante
motif_recommandation: Indicateur de la cible européenne d'au moins 96 % en 2030, annuel de 2013 à 2024 (12 points),
  mais au plafond en France (100 % chaque année sauf 99,3 % en 2014), d'où son rang de variante dans la famille
  de l'accueil de la petite enfance.
note_pertinence: 'La participation des enfants de 3 ans ou plus à l''école maternelle est quasi universelle en France
  : l''indicateur est au plafond et ne distingue plus les années, ce qui n''est pas un motif d''écart (D34). Il
  garde une valeur de contrôle au regard de la cible européenne. Les taux par âge et la série des 4 ans ou plus
  (educ_uoe_enra10, depuis 2000) sont en variantes.'
