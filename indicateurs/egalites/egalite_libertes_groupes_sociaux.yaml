note_pertinence: Le score V-Dem mesure si les libertés civiles sont garanties de la même façon à tous les groupes
  sociaux (origine, religion, langue) ; pour la France, il varie peu (14 valeurs distinctes sur 237 ans). C'est
  une évaluation d'experts sans borne fixe, alors que la question CS16_1 du baromètre DREES (principale de la famille)
  mesure des discriminations observées par la population. Il apporte une série annuelle longue, utile pour les années
  sans enquête.
