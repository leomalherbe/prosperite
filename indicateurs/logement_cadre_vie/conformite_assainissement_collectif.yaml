rattachement_propose: 'lignes de la long-list logement_cadre_vie (INSEE, ODD 6) et de la long-list planete (renvoyées
  ici par la règle assainissement de planete, maintenance PLA-6) ; cette fiche propose de rendre le concept à planete
  (R2 : pression sur les milieux aquatiques), la session mère tranche au gel 2'
raccordement: 'non : série INSEE depuis 2010'
incontournable: non
recommandation: retenir
motif_recommandation: Seule mesure annuelle de la qualité du traitement des eaux usées (cible 6.3 des ODD), série
  INSEE de 2010 à 2022 (13 points), retenue quelle que soit la dimension que la session mère lui attribuera.
note_pertinence: 'Le traitement des eaux usées protège la santé et les milieux aquatiques : le taux de conformité
  des ouvrages collectifs dit si les stations respectent les exigences de la directive sur les eaux résiduaires
  urbaines. Il passe de 80,0 % en 2010 à 98,6 % en 2018, puis revient à 91,9 % en 2022 (BDM lue le 15/10/2026).
  C''est d''abord une pression sur les milieux, ce qui justifie la proposition de rattachement à planete, que planete
  avait renvoyé ici comme service d''assainissement.'
