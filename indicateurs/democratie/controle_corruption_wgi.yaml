id: controle_corruption_wgi
libelle: Contrôle de la corruption (indicateurs de gouvernance de la Banque mondiale)
dimension: democratie
sous_theme: corruption et intégrité
famille: corruption
variante_principale: oui
definition: 'Indicateur composite « Control of Corruption » des WGI : perception de l''usage du pouvoir public à
  des fins privées, dont la corruption, agrégée à partir de sources d''experts et d''enquêtes ; score de gouvernance
  de 0 à 100, avec intervalles de confiance à 90 %, produit « pour faciliter les comparaisons entre pays et dans
  le temps » (documentation WGI lue le 15/10/2026), l''estimation d''origine suivant une loi normale de moyenne
  proche de zéro (de -2,5 à 2,5 environ).'
unite: score de 0 à 100
sens: haut
