rattachement_propose: ligne de la long-list travail ; l'écart construit relève d'egalites (exclusion « écarts femmes-hommes
  d'emploi et de salaire → egalites », R3), le niveau reste dans travail ; à trancher au gel 2
raccordement: non
incontournable: non
socle_propose: non
recommandation: retenir
motif_recommandation: Écart absolu (D34) des taux de chômage des femmes et des hommes, annuel de 2003 à 2025 (23
  points), de 1,5 point en 2003 à 0,1 en 2012, puis entre 0,1 et 0,9 point de 2012 à 2025, période où son signe
  change.
note_pertinence: Les femmes ont eu un taux de chômage plus élevé que les hommes jusqu'en 2011 ; depuis 2012, il
  est le plus souvent un peu plus bas (sauf en 2018). Exprimé en valeur absolue (D34), l'écart mesure la distance
  à la parité quel que soit le groupe désavantagé, et il a presque disparu. Il complète l'écart d'emploi, qui reste
  de 5,7 points en 2025.
