variante_principale: oui
definition: Part des personnes de 16 à 74 ans dont les compétences numériques générales sont de base ou plus avancées,
  d'après l'indicateur européen de compétences numériques calculé sur l'enquête TIC auprès des ménages (INSEE, indicateur
  national ODD 4.i3 ; somme des niveaux « de base » et « plus avancées »).
