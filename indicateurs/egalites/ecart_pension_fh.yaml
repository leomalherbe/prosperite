id: ecart_pension_fh
libelle: Écart de pension moyenne entre hommes et femmes (65 ans ou plus)
dimension: egalites
sous_theme: écarts femmes-hommes
famille: ecart_pension_fh
variante_principale: oui
definition: Écart relatif entre la pension moyenne des hommes et celle des femmes de 65 ans ou plus percevant une
  pension, en pourcentage de la pension des hommes (EU-SILC, jeu ilc_pnp13).
unite: '% de la pension moyenne des hommes'
sens: bas
