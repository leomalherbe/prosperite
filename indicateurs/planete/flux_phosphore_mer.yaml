motif_recommandation: Indicateur national ODD des apports de phosphore au milieu marin, série de 2010 à 2021 pour
  le total (12 points) et jusqu'en 2023 pour la Manche et l'Atlantique.
note_pertinence: Le phosphore apporté par les fleuves, d'origine urbaine et agricole, nourrit l'eutrophisation des
