notes: 'Valeurs lues sur l''API Eurostat le 17/10/2026 (mise à jour du 14/10/2026) : 57,31 (2000), 63,30 (2004),
  78,91 (2008), 84,45 (2010), 92,49 (2015), 101,21 (2019), 104,29 (2020), 104,93 (2021), 104,55 (2022), 98,07 p
  (2023), 93,63 p (2024) ; série disponible depuis 1995 (55,25). Sens : un endettement plus élevé est une vulnérabilité
  (OCDE, How''s Life, capital économique ; tableau de bord de la procédure de déséquilibre macroéconomique de l''Union
  pour la dette privée) ; il accompagne aussi l''accès à la propriété, d''où `sens_a_confirmer` : Léo tranche au
  gel 2. INSEE principal non retenu : la série ODD 17.i4a de l''INSEE est en % du PIB, autre définition (variante).
  Sécurité économique des ménages : fiche créée en securite par la reprise des lignes renvoyées (D46) après le classeur
  de securite, transférée vers niveau_de_vie avec les 8 fiches de D49 le 17/10/2026 (D50) ; série principale dans
  la long-list niveau_de_vie, plus de renvoi ; Léo la validera ici.'
