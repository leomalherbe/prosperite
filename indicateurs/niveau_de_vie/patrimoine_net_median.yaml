id: patrimoine_net_median
libelle: Patrimoine net médian des ménages
dimension: niveau_de_vie
sous_theme: épargne et patrimoine
famille: patrimoine_menages
variante_principale: oui
definition: 'Patrimoine net (actifs immobiliers, financiers et professionnels moins les dettes, hors « reste » :
  véhicules, équipement, objets de valeur) au-dessous duquel se situe la moitié des ménages, en euros constants
  (enquête Histoire de vie et Patrimoine, France métropolitaine).'
unite: euros constants par ménage
sens: haut
type: resultat
declaratif: non
composite: non
source_organisme: INSEE
source_jeu: Melodi DS_ENQPAT_DET (détention et montants du patrimoine des ménages), mesure MT_PATNET_HR_CST, médiane
  (D5), comparable depuis 2010
source_serie_id: DS_ENQPAT_DET?AGE=_T&COMPARE_TIME=1_2010&DEG_URB_UNIT=_T&ENQPAT_MEASURE=MT_PATNET_HR_CST&GEO=FRANCE-FM&PCS=_T&QUANTILE=D5&QUANTILE_MEASURE=PATNET_HR_CST&TPH=_T
source_niveau: 1
url_api: https://api.insee.fr/melodi/data/DS_ENQPAT_DET?AGE=_T&COMPARE_TIME=1_2010&DEG_URB_UNIT=_T&ENQPAT_MEASURE=MT_PATNET_HR_CST&GEO=FRANCE-FM&PCS=_T&QUANTILE=D5&QUANTILE_MEASURE=PATNET_HR_CST&TPH=_T
url_page: https://www.insee.fr/fr/statistiques/8736846
frequence: irreguliere
premiere_annee: 2010
derniere_annee: 2024
nb_points_depuis_2000: 5
geo: FM
eligibilite_longlist: a_verifier
ligne_id: melodi-004525
hors_longlist: non
raccordement: 'a_etudier : vagues 2010 à 2024 recalculées après le changement de redressement de 2020-2021 ; la
  valeur nette du patrimoine des ménages des comptes nationaux (annuelle, 1995-2025) est en variante'
incontournable: non
recommandation: retenir
motif_recommandation: 'Seule mesure du patrimoine du ménage médian (Stiglitz-Sen-Fitoussi, OCDE 1_3), cinq vagues
  de 2010 à 2024 admises comme série pluriannuelle (D17, D28 : écart moyen de 3,5 ans).'
note_pertinence: 'Le patrimoine protège des aléas et conditionne l''accès au logement ; la médiane décrit le ménage
  « du milieu » sans être tirée par les grandes fortunes, dont la concentration relève d''egalites. La version hors
  « reste » est la seule comparable depuis 2010 ; la version complète ne commence qu''en 2015. Le patrimoine dépend
  fortement des prix immobiliers : sa hausse peut accompagner un logement moins accessible (logement_cadre_vie).'
