motif_recommandation: 'La série enregistrée présente des sauts sans drapeau ni explication publiée (+42,9 % en 2009,
  -15,6 % en 2010, +17,8 % en 2013) et à peine plus d''une victime de vol sans violence sur quatre porte plainte
  (26,9 % en 2020, enquête CVS, SSMSI) : elle ne mesure pas l''évolution des vols (sens ambigu).'
note_pertinence: 'Les vols sans violence sont la délinquance la plus fréquente, mais la plupart ne sont pas déclarés
  et la série Eurostat présente des sauts dont la cause n''est pas documentée (la réponse de l''API ne porte ni
  drapeau ni note). La série SSMSI des victimes de vols sans violence (2016-2025, 10 points, éligible) n''a pas
  ces sauts, mais elle dépend du même faible taux de plainte : elle reste une variante. Les vols de véhicules, déclarés
  par environ une victime sur deux, ont leur propre fiche.'
