recommandation: retenir
motif_recommandation: >-
  Indicateur du cadre Eurostat QoL (sécurité économique), annuel 2004-2025 sans lacune (12,7 % en 2004, 8,4 % en
  2019, 10,4 % en 2025), ruptures signalées en 2020 et 2022.
note_pertinence: >-
  Les retards de paiement signalent le moment où les difficultés financières deviennent des impayés, étape qui précède
  souvent le surendettement. La série remonte depuis 2019. Ses composantes (loyer ou prêt, factures, crédits) sont
  des variantes ; les retards de factures d'énergie sont aussi un indicateur de précarité énergétique (logement_cadre_vie)
  : à signaler pour éviter un double emploi.
