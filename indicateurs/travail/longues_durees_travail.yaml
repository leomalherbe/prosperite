id: longues_durees_travail
libelle: Personnes en emploi travaillant de longues heures
dimension: travail
sous_theme: conditions et santé au travail
famille: longues_durees_travail
variante_principale: oui
definition: Part des personnes en emploi de 15 ans ou plus dont la durée habituelle de travail hebdomadaire dans
  l'activité principale dépasse le seuil des « longues heures » retenu par Eurostat (jeu de qualité de l'emploi,
  enquête sur les forces de travail).
