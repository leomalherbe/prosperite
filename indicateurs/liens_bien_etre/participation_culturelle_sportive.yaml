id: participation_culturelle_sportive
libelle: Participation à des sorties culturelles ou sportives (12 derniers mois)
dimension: liens_bien_etre
sous_theme: loisirs, culture, sport et vacances
famille: participation_culturelle_sportive
variante_principale: oui
definition: Part des personnes de 16 ans ou plus ayant participé au moins une fois au cours des douze derniers mois
  à une activité culturelle ou sportive (cinéma, spectacle vivant, site culturel ou événement sportif, d'après le
  détail du jeu ilc_scp03) (modules d'EU-SILC 2006, 2015 et 2022 ; jeu Eurostat ilc_scp01).
unite: '% des 16 ans ou plus'
sens: haut
type: resultat
declaratif: non
composite: non
source_organisme: Eurostat
source_jeu: ilc_scp01 (EU-SILC, participation sociale et culturelle)
source_serie_id: ilc_scp01?freq=A&frequenc=GE1&isced11=TOTAL&age=Y_GE16&sex=T&unit=PC&geo=FR
source_niveau: 1
url_api: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/ilc_scp01?freq=A&frequenc=GE1&isced11=TOTAL&age=Y_GE16&sex=T&unit=PC&geo=FR
url_page: https://ec.europa.eu/eurostat/databrowser/view/ilc_scp01/default/table?lang=fr
frequence: irreguliere
premiere_annee: 2006
derniere_annee: 2022
nb_points_depuis_2000: 3
geo: FR
eligibilite_longlist: a_verifier
ligne_id: estat-032103
hors_longlist: non
raccordement: non
incontournable: non
recommandation: retenir
motif_recommandation: 'Seule mesure publique de participation culturelle et sportive pour la France (3 vagues :
  2006, 2015, 2022), contenu explicite de la dimension (A13), admise comme série irrégulière (D17).'
note_pertinence: Aller au cinéma, au spectacle, au musée ou à un événement sportif mesure l'accès effectif aux loisirs
  culturels et sportifs. La baisse de 2022 (59,1 % contre 80,6 % en 2015) est à interpréter avec prudence, la période
  de référence recoupant peut-être les restrictions sanitaires (à vérifier). L'indicateur ne couvre pas la pratique
  sportive elle-même, faute de série nationale.
