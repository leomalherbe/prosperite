id: retards_paiement
libelle: Population en retard de paiement (prêt immobilier, loyer, factures, crédit)
dimension: securite
sous_theme: sécurité économique
famille: retards_paiement
variante_principale: oui
definition: Part de la population vivant dans un ménage qui a eu, au cours des 12 derniers mois, au moins un retard
  de paiement de remboursement de prêt immobilier ou de loyer, de factures courantes (énergie, eau…) ou de remboursement
  d'achat à crédit (EU-SILC, volet français SRCV).
