motif_recommandation: Compétences mesurées des élèves (incontournable, trois cadres) avec une cible européenne de
  moins de 15 % en 2030, enquête triennale admise par D17 (9 cycles de 2000 à 2025 ; 26,9 % en 2022, 32,7 % en 2025).
note_pertinence: PISA mesure à 15 ans la maîtrise des textes écrits utile à la vie courante ; la part des élèves
  sous le niveau 2 vise la base de la distribution, ce que traduit la cible européenne. La hausse de 2025 (32,7
  % après 26,9 % en 2022) est la plus forte de la série ; Eurostat signale des ruptures en 2009 et en 2018. Le cycle
  2025, présent dans la mise à jour d'Eurostat du 8 octobre 2026, ne figure pas encore dans la base de l'OCDE lue
  par le robot ; le score moyen et les tests de lecture de la journée défense et citoyenneté sont les alternatives
  de la famille.
