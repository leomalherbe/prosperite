motif_recommandation: Solde d'opinion mensuel de l'INSEE depuis 1970 sur l'évolution de la situation financière
  personnelle, rattaché à la sécurité économique par D29 (P8) ; à agréger en moyenne annuelle.
note_pertinence: 'Le solde résume la perception qu''ont les ménages de l''évolution de leurs finances : il réagit
  vite aux chocs (inflation, crises) et couvre toute la période. Il mesure une évolution perçue et non un niveau,
  si bien qu''un solde négatif stable signifie une dégradation continue. La version corrigée des variations saisonnières
  (000857196) a été classée hors grille par erreur de la table de correspondance (motif de la règle 4) ; la série
  brute suffit pour une moyenne annuelle.'
