incontournable: oui
socle_propose: oui
recommandation: retenir
motif_recommandation: 'Indicateur incontournable (surpeuplement et qualité du logement : SSF, OCDE, Eurostat), série
  Eurostat annuelle de 2004 à 2025 (22 points), l''INSEE n''en publiant que deux points par API (D35).'
note_pertinence: Le surpeuplement prive les ménages d'intimité et d'espace pour les enfants et nuit à la santé.
  Le taux passe de 10,3 % en 2004 à 7,1 % en 2014, puis remonte à 10,8 % en 2025 (API Eurostat, lue le 14/10/2026)
  ; les ruptures de 2020 et 2022 (drapeau b) invitent à lire la hausse avec prudence.
