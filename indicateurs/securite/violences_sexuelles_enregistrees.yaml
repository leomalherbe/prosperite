motif_recommandation: 'Sur 2010-2018, les violences sexuelles enregistrées doublent (35,5 à 71,6 pour 100 000 habitants)
  quand la part de victimes déclarées dans l''enquête CVS passe de 0,4 à 0,5 %, et moins d''une victime d''agression
  sexuelle sur cinq la signale à la police (17,4 % en 2019, ONUDC) : la série mesure la révélation des faits, pas
  leur fréquence (sens ambigu).'
note_pertinence: 'La hausse des violences sexuelles enregistrées traduit d''abord une plus grande propension à porter
  plainte et une meilleure prise en charge des victimes ; elle se poursuit après 2018 (140,8 pour 100 000 en 2024)
  alors que l''enquête VRS reste entre 0,5 et 0,6 % (2021-2023). L''enquête est peu précise (valeurs arrondies au
  dixième, 0,8 % isolé en 2017) : la preuve repose surtout sur l''écart d''ordre de grandeur. Utiliser la série
  enregistrée comme indicateur de sécurité conduirait à lire un progrès de la parole comme une dégradation : elle
  peut être montrée à titre d''information, pas notée.'
