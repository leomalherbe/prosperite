motif_recommandation: Moyen admis (D19) adossé à la cible d'environ 21 % en 2030 de la SNBC 3, série nationale de
  2000 à 2024 (25 points), 10,11 % en 2024 d'après l'extrait du robot M04.
note_pertinence: L'agriculture biologique n'emploie ni engrais minéraux ni pesticides de synthèse, ce qui en fait
  un levier de réduction des pressions agricoles. La série nationale est préférée à celle d'Eurostat, de même profondeur
  mais estimée de 2020 à 2024 et de niveau différent (9,51 % en 2024) ; Eurostat, l'INSEE (ODD 2.i4a) et les exploitations
  HVE sont en variantes. La part d'Eurostat recule depuis 2022 (9,82 % puis 9,51 % en 2024).
