motif_recommandation: Indicateur des cibles européenne (au moins 60 %) et française (65 %) de 2030, mais quinquennal
  (2007, 2011, 2016 et 2022, D17 ; 50,8 % en 2022), d'où son rang de variante derrière la série annuelle.
note_pertinence: La participation sur douze mois capte les formations courtes que la fenêtre de quatre semaines
  manque, d'où un niveau bien plus élevé (50,8 % en 2022 contre 13,3 % sur quatre semaines). L'enquête sur les forces
  de travail pose la même question depuis 2022 mais trouve 36,3 %, écart de source à documenter avant de fixer une
  borne. L'INSEE diffuse l'indicateur ODD 4.i2 sur les 18-64 ans de France métropolitaine (2016, 2022), en variante.
