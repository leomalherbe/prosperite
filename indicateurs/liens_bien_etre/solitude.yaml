motif_recommandation: Seule série publique de solitude ressentie couvrant plus de deux années (7 vagues de 2014
  à 2025, enquête métropolitaine), concept nommé dans le contenu de la dimension, admise comme série irrégulière
  (D17).
note_pertinence: 'La solitude est l''envers du soutien social : elle repère les personnes isolées que les moyennes
  masquent. Les parts calculées par le robot sur les microdonnées passent de 13,36 % (2014) à 9,08 % (2025) pour
  « souvent », et de 49,23 % à 47,90 % pour « souvent ou parfois » (variante). La série EU-SILC relayée par l''OCDE
  (2018 et 2022) devient une variante.'
