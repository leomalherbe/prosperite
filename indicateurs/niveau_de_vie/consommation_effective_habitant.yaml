id: consommation_effective_habitant
libelle: Consommation individuelle effective par habitant en volume
dimension: niveau_de_vie
sous_theme: consommation
famille: consommation_menages
variante_principale: oui
definition: Biens et services consommés par les ménages, qu'ils les paient eux-mêmes ou qu'ils soient financés par
  les administrations ou les institutions sans but lucratif (santé, éducation, logement social…), rapportés à la
  population, en volumes chaînés (euros de 2020 par habitant).
unite: euros de 2020 par habitant
sens: haut
type: resultat
declaratif: non
composite: non
source_organisme: Eurostat
source_jeu: nama_10_pc (PIB et principales composantes par habitant), na_item P41
source_serie_id: nama_10_pc?freq=A&unit=CLV20_EUR_HAB&na_item=P41&geo=FR
source_niveau: 1
url_api: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/nama_10_pc?freq=A&unit=CLV20_EUR_HAB&na_item=P41&geo=FR
url_page: https://ec.europa.eu/eurostat/databrowser/view/nama_10_pc/default/table?lang=fr
frequence: annuelle
premiere_annee: 2000
derniere_annee: 2025
nb_points_depuis_2000: 26
geo: FR
eligibilite_longlist: oui
ligne_id: estat-052398
hors_longlist: non
raccordement: 'non : série annuelle continue de 2000 à 2025'
incontournable: non
recommandation: retenir
motif_recommandation: Mesure de la consommation retenue par Stiglitz-Sen-Fitoussi et le cadre Qualité de vie d'Eurostat,
  en niveau par habitant et en volume de 2000 à 2025 (26 points), que l'INSEE ne publie qu'en total.
note_pertinence: Ce que les ménages consomment réellement est, selon Stiglitz-Sen-Fitoussi, une meilleure mesure
  du niveau de vie matériel que la production. La consommation individuelle effective passe de 21 150 € par habitant
  en 2000 à 25 660 € en 2019, chute à 23 920 € en 2020 et atteint 26 250 € en 2025 (provisoire, API Eurostat, lue
  le 14/10/2026). Elle inclut les services publics individualisables, comme le revenu disponible ajusté.
