id: victimes_violences_sexuelles
libelle: Adultes victimes de violences sexuelles (enquête de victimation)
dimension: securite
sous_theme: atteintes aux personnes
famille: violences_sexuelles
variante_principale: oui
definition: Part des personnes de 18 à 75 ans résidant en France métropolitaine qui déclarent avoir subi au moins
  une violence sexuelle dans l'année, qu'elles aient porté plainte ou non (enquêtes CVS puis VRS ; composante de
  l'indicateur ODD 16.i2).
unite: '% des 18-75 ans'
sens: bas
type: resultat
