variante_principale: oui
definition: Part des masses d'eau de surface (cours d'eau, plans d'eau) en très bon ou bon état écologique au sens
  de la directive-cadre sur l'eau, d'après les états des lieux des bassins (indicateur national ODD 6.i2a ; somme
  des classes « très bon » et « bon »).
