rattachement_propose: 'hors long-list : série du catalogue des séries écartées de l''INSEE (M01, « indice de prix
  »), à réintégrer (maintenance LOG-6) ; loyers → logement_cadre_vie (coût du logement) ; choix de série D42'
raccordement: 'non : IPC des loyers de l''INSEE continu depuis 1996 ; l''IPCH d''Eurostat, qui n''est plus actualisé,
  en variante'
incontournable: non
socle_propose: non
recommandation: retenir
motif_recommandation: Évolution des loyers payés par les locataires calculée sur l'indice annuel de l'INSEE (1996-2025,
  26 taux depuis 2000), recoupée au dixième près avec les taux publiés de l'IPCH sur neuf années (D34, D42).
note_pertinence: 'Les loyers sont la principale dépense des locataires : leur hausse, comparée à celle des prix
  et des revenus, renseigne sur la tension du marché locatif. L''indicateur est un taux de variation nominal (D42),
  sans rapport au revenu : il va de -0,3 % (2018) à 3,6 % (2005), et les bornes devront tenir compte de l''inflation
  générale. L''IPC de l''INSEE, toujours mis à jour, remplace comme série principale l''IPCH d''Eurostat, qui ne
  l''est plus.'
