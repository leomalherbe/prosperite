motif_recommandation: Sens ambigu (l'effet grandit aussi quand les inégalités avant redistribution augmentent) et
  rupture en 2020 lue sur l'API (3,4 à 4,0 de 2010 à 2019, 5,5 à 6,7 de 2020 à 2025, drapeaux b en 2020 et 2022).
note_pertinence: L'effet de la redistribution figure dans le contenu de la dimension, mais c'est un indicateur de
  moyens dont l'interprétation dépend des inégalités primaires. L'information est portée sans ambiguïté par le couple
  S80/S20 avant et après redistribution, tous deux proposés.
