note_pertinence: 'La question porte sur une évolution perçue et non sur un niveau : elle reste élevée même quand
  les inégalités mesurées sont stables. La réponse « (Sont restées stables) », notée entre parenthèses dans le dictionnaire
  2025 comme « (NSP) », passe de 13 à 22 % (2000-2006) à 4,75 à 9,24 % depuis 2007, avec un pic isolé à 16,62 %
  en 2014, année où la part retenue tombe à 76,08 % (86,69 % en 2013) : rupture possible en 2007 et anomalie en
  2014, à vérifier dans les questionnaires.'
