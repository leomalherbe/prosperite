motif_recommandation: Principal indicateur de précarité énergétique (A3 ; suivi ODD 7 de l'UE, OCDE How's Life 3_5),
  série Eurostat de 2004 à 2025 (22 points), plus longue et plus fraîche que la série INSEE de 2010 à 2024 (D35).
note_pertinence: 'Ne pas pouvoir chauffer son logement est la forme la plus directe de la précarité énergétique,
  avec des effets sur la santé. La part, entre 4,6 % et 6,7 % de 2004 à 2021, passe à 10,7 % en 2022 (drapeau b),
  12,1 % en 2023 et 11,5 % en 2025 (API Eurostat, lue le 14/10/2026) : la hausse des prix de l''énergie et la rupture
  de série se cumulent. La question porte sur une capacité financière déclarée, non sur un ressenti (méthode §4).'
