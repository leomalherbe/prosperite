notes: 'Filtre dans la base SSMSI : Titre « Destructions et dégradations volontaires (ensemble) enregistrées par
  les services de sécurité (Données annuelles) », Zone = France. Composantes : m04-000281 (2016-2025) et population
  moyenne 001641584 (1982-2025, Mayotte incluse depuis 2014) ; champ « France » de la base SSMSI à confirmer ; recoupement
  (D34) avec le taux ITDD des destructions et dégradations (m04-000306, pour 1 000 habitants, 2016-2024) à faire
  si la fiche était retenue. Taux de plainte : INSEE, enquête CVS 2019 (page insee.fr 2526026, lue le 14/10/2026
  : 16,3 % pour les destructions ou dégradations de la voiture, valeur non diffusée pour le logement) ; SSMSI, «
  Actes de vandalisme contre le logement » (2006-2018, dernière valeur 9,0 % en 2018). La dernière valeur SSMSI
  pour la voiture (51 % en 2020) s''écarte fortement de la valeur INSEE de 2019 : à vérifier (SEC-3).'
