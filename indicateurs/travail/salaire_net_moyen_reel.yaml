notes: 'Valeurs lues par le robot (collecte ciblée du 15/10/2026, melodi_travail_salaire_net_moyen_reel.csv, depuis
  2000) : 2 486 € (2000), 2 827 € (2020, effet de composition de la crise sanitaire), 2 733 € (2024). Champ (notice
  Melodi du jeu) : « France depuis 2000, France métropolitaine jusqu''en 1999 », salariés du privé hors agriculture
  et particuliers-employeurs, comme la série BDM 010752333 (zone FM99_FR00) ; sans effet sur 2000-2024 (audit M06
  J5). Lignes de la long-list niveau_de_vie reprises (D36, D39) : médiane, temps complet, évolutions et indices
  en variantes ; ventilations par sexe renvoyées à egalites ; centiles, âge et PCS écartés en bloc ; SMIC écarté
  (barème).'
