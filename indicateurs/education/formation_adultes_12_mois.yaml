id: formation_adultes_12_mois
libelle: Participation des 25-64 ans à l'éducation ou à la formation au cours des douze derniers mois
dimension: education
sous_theme: formation des adultes
famille: formation_adultes
variante_principale: oui
definition: Part des personnes de 25 à 64 ans ayant suivi un enseignement ou une formation, formels ou non formels,
  au cours des douze mois précédant l'enquête, d'après l'enquête européenne sur l'éducation des adultes (Eurostat
  trng_aes_100) ; la série diffusée par Eurostat inclut la formation guidée en situation de travail, que l'indicateur
  des cibles de 2030 exclut.
