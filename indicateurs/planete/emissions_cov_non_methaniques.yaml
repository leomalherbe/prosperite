note_pertinence: 'Les composés organiques volatils non méthaniques (solvants, combustion, agriculture) sont des
  précurseurs de l''ozone. Le total de conformité à la directive, qui exclut une partie des émissions agricoles
  certaines années, le Citepa (1990-2025, France hexagonale : 1 027,5 kt en 2025), les agrégats sectoriels et les
  comptes d''émissions sont en variantes.'
