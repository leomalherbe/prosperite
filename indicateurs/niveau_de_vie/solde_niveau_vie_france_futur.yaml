motif_recommandation: Solde d'opinion mensuel de l'INSEE depuis 1970 sur les perspectives d'évolution du niveau
  de vie en France, admis comme variante déclarative par D38 (j), à agréger en moyenne annuelle.
note_pertinence: 'Le solde résume la perception que les ménages ont du niveau de vie du pays, et non du leur : c''est
  une opinion sur la société, comme la perception de la hausse de la pauvreté, principale de la famille. Il est
  structurellement négatif : la moyenne des soldes mensuels bruts vaut −25,6 en 2019 et −56,4 en 2025 (calcul de
  l''agent correcteur sur les valeurs de la BDM lues le 16/10/2026), et le solde atteint −62 en septembre 2026.
  Il réagit vite aux chocs (inflation, crises), mais mesure une évolution perçue et non un niveau.'
