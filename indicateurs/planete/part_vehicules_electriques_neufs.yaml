motif_recommandation: Levier de décarbonation des transports admis comme moyen (D19), série INSEE annuelle de 2013
  à 2024 (12 points) en France entière.
note_pertinence: Le transport routier est le premier secteur émetteur, et l'électrification du parc en est le principal
  levier ; l'indicateur suit le flux des voitures neuves. Les autres catégories de véhicules (dont les transports
  en commun, reçus de logement_cadre_vie), la France métropolitaine (D15), la définition européenne « zéro émission
  » (Eurostat, jusqu'en 2025) et la part du parc en Crit'Air 1 ou électrique sont en variantes. La définition exacte
  des véhicules électriques retenue par la source est à vérifier.
