motif_recommandation: Variante principale de la famille empreinte_carbone (par habitant, D38 h), indicateur de richesse
  nationale n° 9 directement comparable aux repères de 2,3 et 3,1 t par habitant en 2050 de la SNBC 3, série annuelle
  de 1995 à 2024 (11,4 t en 2000, 8,2 t en 2024, estimée).
note_pertinence: 'C''est la forme la plus parlante de l''empreinte pour le public, qui peut la rapprocher de ses
  propres émissions. Les séries de l''OCDE (2004-2020), d''Eurostat (modèle FIGARO, 2010-2023) et du Global Carbon
  Project (CO2 seul) sont en variantes : elles reposent sur d''autres tableaux entrées-sorties et donnent d''autres
  niveaux. Le total en millions de tonnes, grandeur des fourchettes de la SNBC 3, forme l''autre fiche de la famille.'
