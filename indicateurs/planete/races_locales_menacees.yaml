motif_recommandation: 'Sens ambigu : le nombre de races à risque passe de 38 en 2010 à 122 en 2025 surtout parce
  que des races de risque inconnu ont été classées (182 en 2010, 107 en 2025), et la série vaut 0 en 2012 et 2013
  (14 points utiles sur 16).'
note_pertinence: La diversité génétique des races domestiques fait partie de la biodiversité (cible ODD 2.5), mais
  ce décompte se lit mal seul. Les classes « non à risque » et « risque inconnu » sont en variantes ; une part des
  races menacées dans l'ensemble des races locales serait plus lisible.
