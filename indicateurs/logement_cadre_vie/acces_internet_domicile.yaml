id: acces_internet_domicile
libelle: Ménages ayant accès à internet à domicile
dimension: logement_cadre_vie
sous_theme: numérique
famille: acces_internet_domicile
variante_principale: oui
definition: Part des ménages comptant au moins une personne de 16 à 74 ans qui disposent d'un accès à internet à
  domicile (enquête européenne sur l'usage des technologies de l'information par les ménages, Eurostat).
unite: '% des ménages'
sens: haut
