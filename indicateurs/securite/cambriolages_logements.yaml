raccordement: 'a_etudier : lacune 2017-2019 à combler par la série SSMSI des cambriolages de logements (m04-000276,
  2016-2025) rapportée à la population moyenne de la France entière (001641584) × 100 000, à recouper avec Eurostat
  sur 2016 et 2020-2024 avant usage (D34)'
incontournable: non
recommandation: retenir
motif_recommandation: Cambriolages de logements enregistrés pour 100 000 habitants, 2008-2024 (260 en 2008, 382
  en 2013, 295 en 2024), lacune 2017-2019 comblable par la série SSMSI ; environ un ménage victime sur deux porte
  plainte (44,6 % en 2019 selon l'INSEE, 52,7 % en 2020 selon le SSMSI) et le sens bas repose sur l'hypothèse, non
  vérifiée, d'un taux de plainte stable.
note_pertinence: 'Le cambriolage du logement est l''atteinte aux biens la plus redoutée par les ménages. L''enquête
  CVS, qui mesurait les ménages victimes, s''arrête en 2020 et la série VRS n''est pas au catalogue : la série enregistrée
  devient la mesure principale, mais elle ne suit les cambriolages que si le taux de plainte (environ un ménage
  sur deux) reste stable. Le jeu Eurostat donne aussi l''ensemble des cambriolages (tous locaux, sans lacune), moins
  centré sur les ménages.'
