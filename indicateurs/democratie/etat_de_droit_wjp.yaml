motif_recommandation: Seul indice consacré à l'État de droit et à la justice, 12 éditions de 2012-2013 à 2025 (de
  0,764 à 0,724), en alternative à l'indicateur WGI, plus long et de niveau 1, variante principale de la famille
  etat_de_droit (D35).
note_pertinence: Le WJP mesure l'État de droit tel que le vivent les citoyens et les experts, y compris l'accès
  à la justice civile et pénale que la dimension cite explicitement. Le score français recule lentement de 0,764
  (2012-2013) à 0,724 (2025). Les scores antérieurs à 2015 ne sont pas strictement comparables, la licence n'a pas
  été trouvée et l'indicateur WGI, plus long, est la variante principale de la famille.
