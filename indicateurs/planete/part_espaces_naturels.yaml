definition: Part du territoire de France métropolitaine occupée par des zones boisées, naturelles, humides ou en
  eau d'après l'enquête Teruti, calculée par le projet à partir des surfaces que l'INSEE publie en hectares (la
  série publiée en pourcentage, 010776378, est arrondie à l'unité).
