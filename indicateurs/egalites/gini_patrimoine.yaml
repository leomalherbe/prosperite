motif_recommandation: Seule mesure annuelle ou pluriannuelle de la concentration du patrimoine publiée par l'INSEE,
  cinq vagues de 2010 à 2024 admises par D17 (écart moyen de 3,5 ans entre valeurs).
note_pertinence: 'Le patrimoine est beaucoup plus concentré que le revenu ; son inégalité est un besoin explicite
  de la dimension. L''enquête est triennale : la valeur doit être reportée entre deux vagues (D17). Le libellé du
  catalogue (« patrimoine net hors reste, en euros constants ») contredit le code de la mesure (GINI_PATBRUT_HR,
  patrimoine brut hors reste) : à vérifier sur Melodi avant usage.'
