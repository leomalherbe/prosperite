id: besoins_soins_dentaires_non_satisfaits
libelle: Besoins de soins dentaires non satisfaits
dimension: sante
sous_theme: accès aux soins
famille: besoins_soins_dentaires
variante_principale: oui
definition: Part des personnes de 16 ans ou plus déclarant avoir eu besoin d'un examen ou d'un traitement dentaire
  sans l'obtenir parce qu'il était trop cher, trop éloigné ou à cause d'une liste d'attente (enquête SRCV).
unite: '% des 16 ans ou plus'
sens: bas
type: resultat
declaratif: non
composite: non
source_organisme: Eurostat (d'après l'INSEE, enquête SRCV)
source_jeu: hlth_silc_09 (besoins dentaires non satisfaits par raison principale)
source_serie_id: hlth_silc_09?freq=A&unit=PC&quant_inc=TOTAL&reason=TXP_TFAR_WLIST&age=Y_GE16&sex=T&geo=FR
source_niveau: 1
url_api: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/hlth_silc_09?freq=A&unit=PC&quant_inc=TOTAL&reason=TXP_TFAR_WLIST&age=Y_GE16&sex=T&geo=FR
url_page: https://ec.europa.eu/eurostat/databrowser/view/hlth_silc_09/default/table?lang=fr
frequence: annuelle
premiere_annee: 2008
derniere_annee: 2025
nb_points_depuis_2000: 18
geo: FR
eligibilite_longlist: oui
ligne_id: estat-020177
hors_longlist: non
raccordement: 'a_etudier : chute non signalée de 2015 (5,6 % en 2014, 3,4 % en 2015) et ruptures de 2020 et 2022'
incontournable: non
recommandation: retenir
motif_recommandation: Soins les plus souvent non obtenus, annuels de 2008 à 2025 (4,2 % en 2008, 7,0 % en 2024,
  6,5 % en 2025), concept distinct des soins médicaux et non substituable (D35).
note_pertinence: Les besoins dentaires non satisfaits sont presque deux fois plus fréquents que les besoins médicaux
  (6,5 % contre 3,7 % en 2025) ; ils forment une famille propre parce que les soins dentaires ne remplacent pas
  les soins médicaux pour l'utilisateur (D35). La série passe de 2,7 % en 2019 à 6,4 % en 2020, année de rupture
  (« b »). L'indicateur national ODD 3.i7b de l'INSEE est en variante.
