variante_principale: oui
definition: Taux d'emploi des personnes sans limitation d'activité moins celui des personnes déclarant une limitation
  modérée ou forte dans les activités habituelles, en points (EU-SILC, jeu hlth_dlm200 ; tranche d'âge à confirmer
  dans les métadonnées).
