motif_recommandation: Variante principale de la famille concentration_pm10, série du SDES annuelle de 2007 à 2024
  (18 points), plus longue que la même série republiée par l'INSEE de 2010 à 2024 (indicateur ODD 11).
note_pertinence: 'Les PM10 regroupent les particules fines et plus grossières (trafic, chauffage au bois, chantiers)
  ; leur concentration de fond reflète l''air respiré en ville hors de la proximité immédiate des sources. La dernière
  valeur est de 13,26 µg/m³ en 2024, et de 17,3 près du trafic (extrait du robot M04). Les PM2,5, plus nocives,
  sont suivies par la famille exposition_pm25 : le contrôle de redondance devra comparer les deux familles.'
