id: accueil_formel_moins_3_ans
libelle: Enfants de moins de 3 ans accueillis en mode de garde formel ou à l'école
dimension: education
sous_theme: petite enfance
famille: accueil_petite_enfance
variante_principale: oui
definition: Part des enfants de moins de 3 ans accueillis au moins une heure par semaine dans un mode de garde formel
  (structure collective, accueil familial organisé, école), somme des durées « 1 à 29 heures » et « 30 heures ou
  plus » (EU-SILC, Eurostat ilc_caindformal).
unite: '% des enfants de moins de 3 ans'
sens: haut
