notes: 'Champ mixte (D32 ; audit M06 §4.1, maintenance n° 9 close) : la formule de sdg_11_40 se retrouve à l''unité
  près en rapportant les tués de tran_sf_roadro (3 181 en 2024, champ métropolitain, de 2 à 13 unités sous la série
  INSEE 010593288 chaque année de 2018 à 2024) à la population moyenne de la France entière de demo_gind (68 775
  952 en 2024) ; l''API Eurostat (lue le 14/10/2026) donne pour source la DG Mobilité et transports de la Commission
  et pour dénominateur la population moyenne de l''année. Taux homogène à recalculer par le pipeline (D32) : 010593288
  / 000067671 × 100 000 (tués et population moyenne de France métropolitaine, 2010-2024 et 1946-2025) : 6,3 en 2010,
  5,0 en 2018, 3,9 en 2020, 4,8 en 2024 (calcul de l''agent correcteur sur la BDM lue le 14/10/2026 ; Eurostat :
  6,2, 4,8, 3,8 et 4,6). Rupture signalée par Eurostat en 2014 (drapeau b, cause non documentée ; l''entrée de Mayotte
  dans la population France entière est une hypothèse non vérifiée) ; valeurs 2023-2024 provisoires. Incontournable
  : non selon la méthode commune (concepts du §5 de la synthèse du crosswalk ; parmi les cadres, seule l''OCDE le
  cite, l''ODD 3.6 et l''objectif UE 2030 étant des cibles) ; proposé à Léo en retenu_socle (audit M06 §5.5). Variantes
  « causes de décès » (hlth_cd_*, long-list sante) : tous modes de transport, pas seulement la route.'
