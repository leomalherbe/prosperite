motif_recommandation: Seule série annuelle vivante sur l'insécurité ressentie dans le quartier (2014-2025, de 37,5
  à 47,6 % de préoccupés), mais elle mesure une préoccupation plutôt qu'un sentiment d'insécurité vécu.
note_pertinence: 'Le baromètre DREES pose chaque année depuis 2014 la question de la préoccupation pour l''insécurité
  du quartier ; la part de préoccupés augmente (40,8 % en 2014, 47,1 % en 2025). Un saut en 2018 (+5,6 points) coïncide
  avec une hausse des non-réponses à d''autres questions du baromètre : un changement de protocole est possible,
  à vérifier. Le champ est la métropole (fiche du jeu), et non la France entière comme l''indique le catalogue M04.'
