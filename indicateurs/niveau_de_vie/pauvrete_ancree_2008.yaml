recommandation: retenir_variante
motif_recommandation: Indicateur de pauvreté « absolue » du cadre Qualité de vie d'Eurostat, annuel de 2008 à 2025
  (18 points), substituable au premier décile en euros constants de l'INSEE, principal de la famille.
note_pertinence: 'Avec un seuil fixé une fois pour toutes en termes réels, ce taux baisse quand le niveau de vie
  des plus modestes progresse, même si les inégalités ne bougent pas : il répond à la question « les pauvres vivent-ils
  mieux qu''avant ? ». Il porte la même information que le premier décile en euros constants, d''où la même famille.
  Les valeurs n''ont pas pu être lues (API Eurostat saturée, réponse 429 le 14/10/2026).'
