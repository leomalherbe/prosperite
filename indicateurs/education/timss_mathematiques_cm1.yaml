motif_recommandation: 'Écartée (D44) : le seuil de la série n''est pas documenté et sa valeur de 2023 (36 % contre
  57 % en 2019) n''est pas comparable, la note d''information 24.47 de la DEPP constatant des scores stables (485
  en 2019, 484 en 2023) et 15 % seulement d''élèves sous le seuil bas de l''IEA.'
note_pertinence: 'TIMSS évalue tous les quatre ans les mathématiques des élèves en quatrième année de scolarité
  (CM1). La série ODD 4.i1b de l''INSEE donne 58 % (2015), 57 % (2019) et 36 % (2023), alors que la DEPP mesure
  des scores stables (488, 485 et 484 points) et au moins 85 % d''élèves au seuil bas de l''IEA en 2023 : le seuil
  retenu par la série et la chute de 2023 restent inexpliqués. La fiche rejoint la famille des compétences des élèves
  en mathématiques, dont la part d''élèves de 15 ans sous le niveau 2 de PISA est la principale (D44).'
