motif_recommandation: Seule série annuelle longue du recours aux transports collectifs, Eurostat de 2000 à 2024
  (25 points), retenue sous réserve de remplacer les valeurs aberrantes de 2010-2012 par la somme des composantes
  de l'INSEE (2010-2024).
note_pertinence: 'La part des transports collectifs reflète à la fois l''offre de transports publics et la dépendance
  à la voiture, qui pèse sur le budget et le temps des ménages. Hors 2010-2012, elle oscille entre 13,4 % et 15,8
  % de 2000 à 2019, chute à 12,1 % en 2020 et atteint 17,4 % en 2024 (API Eurostat lue le 15/10/2026). Aucun indicateur
  d''accessibilité des transports (ODD 11.2.1) n''existe en série annuelle pour la France : la part modale est la
  seule mesure du contenu « transports collectifs » de la dimension.'
