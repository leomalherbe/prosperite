notes: 'Valeurs lues sur l''API Eurostat le 16/10/2026 (sdg_11_52, PM2_5, PMD, RT, FR ; mise à jour du 09/12/2025)
  : 61 (2005), 51 (2007), 54, 61, 62, 61, 55, 53 (2013), 34 (2014), 42, 36, 34, 34, 27, 24 (2020), 29, 30, 22 (2023),
  aucun drapeau, comme à la lecture de l''audit M06. Métadonnées sdg_11_52_esmsip2 (21/05/2026) : contrefactuel
  de 5 µg/m³, « relative risk of 0.08 » pour 10 µg/m³, même approche pour toutes les années, 2006 manquant faute
  de cartes interpolées, aucune rupture documentée. Rattachement : résultat de santé (sante), l''exposition relève
  de logement_cadre_vie et les émissions de planete (R2, audit M06 I3), à confirmer au gel 2. Cible européenne du
  plan « zéro pollution » sur les décès prématurés : à vérifier avant le socle des bornes.'
