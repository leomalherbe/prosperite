id: limitations_activite
libelle: Personnes limitées dans leurs activités par un problème de santé
dimension: sante
sous_theme: santé perçue et limitations
famille: limitations_activite
variante_principale: oui
definition: Part des personnes de 16 ans ou plus limitées (fortement ou un peu) depuis au moins six mois, à cause
  d'un problème de santé, dans les activités que les gens font habituellement (indicateur GALI, enquête SRCV).
unite: '% des 16 ans ou plus'
sens: bas
type: resultat
declaratif: oui
composite: non
source_organisme: Eurostat (d'après l'INSEE, enquête SRCV)
source_jeu: hlth_silc_06 (limitation de longue durée perçue dans les activités usuelles), population totale, modalité
  « quelque ou grave »
source_serie_id: hlth_silc_06?freq=A&unit=PC&wstatus=POP&age=Y_GE16&sex=T&lev_limit=SM_SEV&geo=FR
source_niveau: 1
url_api: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/hlth_silc_06?freq=A&unit=PC&wstatus=POP&age=Y_GE16&sex=T&lev_limit=SM_SEV&geo=FR
url_page: https://ec.europa.eu/eurostat/databrowser/view/hlth_silc_06/default/table?lang=fr
frequence: annuelle
premiere_annee: 2008
derniere_annee: 2025
nb_points_depuis_2000: 18
geo: FR
eligibilite_longlist: oui
ligne_id: estat-011390
hors_longlist: non
raccordement: 'a_etudier : ruptures de 2020 et 2022 de l''enquête SRCV'
incontournable: oui
recommandation: retenir
motif_recommandation: Concept « limitations » du §5 du crosswalk et base de l'espérance de vie sans incapacité,
  annuel de 2008 à 2025 (23,2 % en 2008, 25,8 % en 2025).
note_pertinence: La limitation d'activité (GALI) mesure les conséquences fonctionnelles des problèmes de santé.
  La série oscille entre 24 % et 26 % de 2009 à 2020, tombe à 22,7 % en 2021 puis remonte à 26,8 % en 2023 après
  la rupture de 2022. Les limitations fortes (9,8 % en 2025) et la série du baromètre DREES sont en variantes.
