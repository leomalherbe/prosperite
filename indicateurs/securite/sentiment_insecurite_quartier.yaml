notes: 'Filtre dans la base SSMSI : Titre « Sentiment d''insécurité dans le quartier ou le village », Unite_de_compte
  = Personnes de 14 ans ou plus. Suite VRS : INSEE, « Sentiment d''insécurité selon l''âge et le sexe — Données
  annuelles de 2022 à 2024 » (19/12/2025, page insee.fr 2526402 lue le 14/10/2026), fichier https://www.insee.fr/fr/statistiques/fichier/2526402/cond-sec-just-insecur.xlsx.
  Vague 2021 : jeu data.gouv.fr 62029493ff5c2e6d510b42b6 (« collecte réalisée quasi exclusivement (99 %) par téléphone
  », le SSMSI recommande de ne pas commenter les évolutions ; lu le 14/10/2026). Part à calculer : le dénominateur
  (population de 14 ans ou plus de France métropolitaine) n''est dans aucun catalogue, d''où une formule sans composantes.'
