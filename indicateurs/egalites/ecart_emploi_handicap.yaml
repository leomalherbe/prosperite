motif_recommandation: Indicateur européen de l'écart d'emploi lié au handicap (stratégie de l'UE 2021-2030), annuel
  de 2014 à 2025 (20,4 points en 2014, 21,6 en 2025, ruptures en 2020 et 2022).
note_pertinence: Le handicap n'est pas cité dans le contenu de la dimension, mais c'est un écart entre groupes au
  sens de sa définition. L'écart ne se réduit pas sur la période (entre 15,7 et 24,1 points). La tranche d'âge et
  la définition de la limitation sont à confirmer dans les métadonnées Eurostat.
