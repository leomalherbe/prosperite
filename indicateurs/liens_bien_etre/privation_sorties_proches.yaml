motif_recommandation: Série annuelle de 12 points (2014-2025) mesurant l'empêchement financier de voir ses proches,
  seule mesure annuelle de la vie relationnelle hors baromètres d'opinion.
note_pertinence: 'L''indicateur touche directement les liens : ne pas pouvoir recevoir ou retrouver ses proches
  isole. Le niveau est bas (de 4,9 % à 6,8 % sur 2014-2025) et Eurostat signale des ruptures en 2020 et 2022. Comme
  privation_loisirs, c''est un item du taux de privation matérielle et sociale rattaché à son domaine (R3).'
