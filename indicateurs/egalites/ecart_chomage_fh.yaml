ligne_id: estat-000059
hors_longlist: non
rattachement_propose: ligne de la long-list travail ; l'écart construit relève d'egalites (exclusion « écarts femmes-hommes
  d'emploi et de salaire → egalites », R3), le niveau reste dans travail ; à trancher au gel 2
raccordement: non
incontournable: non
recommandation: ecarter
motif_recommandation: 'Sens ambigu : l''écart change de signe en 2012 (femmes 9,3 % contre hommes 7,8 % en 2003,
  9,7 % contre 9,8 % en 2012, 7,6 % contre 7,8 % en 2025), si bien qu''une valeur proche de 0 ne dit pas qui est
  désavantagé.'
note_pertinence: Les femmes ont longtemps eu un taux de chômage plus élevé ; depuis 2012 c'est l'inverse, de peu.
  Un écart qui change de signe ne peut pas être normalisé entre deux bornes sans perdre son sens. L'écart d'emploi,
  de signe constant, est préféré.
