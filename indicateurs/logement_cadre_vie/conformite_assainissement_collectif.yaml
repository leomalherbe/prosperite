notes: 'Valeurs lues (BDM 010595400, France, statut A) : 80,0 (2010), 79,7 (2011), 92,9 (2013), 95,1 (2015), 98,6
  (2018), 92,6 (2019), 89,0 (2021), 91,9 (2022) ; aucune valeur après 2022. Variantes : même série par Melodi (ODD
  6.i3a) ; composante assainissement non collectif (BDM 010595405 et Melodi 6.i3b : 40,8 % en 2010, 39,2 % en 2012,
  53,7 % en 2013, 64,5 % en 2023, saut de 2012-2013 non expliqué) ; taux de conformité des stations d''épuration
  des indicateurs territoriaux (ITDD, 2007-2023, 54,9 % en 2023 d''après l''extrait du robot M04 : définition différente,
  à documenter). Les lignes avaient été renvoyées à planete par la première version de cette présélection, et planete
  les a renvoyées ici (règle assainissement, maintenance PLA-6) : sans fiche, le concept aurait disparu des deux
  tableaux.'
