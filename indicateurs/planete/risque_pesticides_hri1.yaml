definition: Indice des quantités de substances actives phytopharmaceutiques mises sur le marché, pondérées selon
  leur classe de danger (indicateur de risque harmonisé 1 de la directive 2009/128/CE), base 100 en moyenne 2011-2013.
unite: indice (moyenne 2011-2013 = 100)
sens: bas
