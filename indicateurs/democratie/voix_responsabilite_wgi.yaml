motif_recommandation: Mesure existante de l'indicateur « voix et responsabilité » du cadre Eurostat QoL, score annuel
  depuis 1996 sauf 1997, 1999 et 2001 (25 points depuis 2000, 78,99 en 2025), substituable à l'indice V-Dem de démocratie
  libérale (famille qualite_democratique, D35) mais de concept plus étroit.
note_pertinence: 'Voix et responsabilité est la composante des WGI la plus proche de la dimension (participation
  et libertés). L''estimation passe de 0,95 (2000) et 0,91 (2003) à un pic de 1,48 (2005), puis redescend à 1,30
  (2012) et 1,16 (2017 comme 2025) : la variation de 2003-2005 est forte pour un indice de ce type et invite à la
  prudence. Les autres sous-indices WGI sont rattachés à leurs familles (État de droit, corruption) ou écartés.'
