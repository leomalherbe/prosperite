note_pertinence: La liberté d'expression est une liberté publique fondamentale que la dimension cite explicitement.
  L'indice V-Dem est proche du maximum pour la France (0,959) et varie peu, ce qui limite son pouvoir de discrimination
  dans le temps. Il recoupe en partie la liberté de la presse de RSF (famille distincte, autre producteur).
