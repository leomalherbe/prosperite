raccordement: 'a_etudier : suite VRS publiée par l''INSEE (2022-2024, « souvent ou parfois », 18 ans ou plus, métropole,
  Guadeloupe, Martinique et La Réunion, par sexe et par âge sans ensemble), non comparable à la série CVS (14 ans
  ou plus, métropole) et non cataloguée (maintenance n° 5)'
incontournable: non
socle_propose: non
recommandation: ecarter
motif_recommandation: 'Mesure officielle historique du sentiment d''insécurité (enquête CVS, 2007-2021), arrêtée
  en 2021 sans relais comparable (D32) : la suite VRS publiée par l''INSEE (2022-2024) a un autre champ et pas de
  total d''ensemble, et la vague 2021 a été collectée à 99 % par téléphone.'
note_pertinence: 'C''est la mesure française de référence du sentiment d''insécurité, que la dimension cite explicitement.
  L''INSEE publie depuis décembre 2025 la suite issue de l''enquête VRS (au domicile, dans le quartier ou le village,
  renoncement à sortir ; 2022-2024), mais seulement par sexe et par âge, pour les 18 ans ou plus de la métropole
  et de trois DROM : elle n''est ni au catalogue ni raccordable sans traitement. La vague CVS de 2021, collectée
  presque entièrement par téléphone, n''est pas comparable aux précédentes selon le SSMSI ; le concept reste couvert
  par delinquance_quartier et preoccupation_insecurite_quartier.'
