recommandation: retenir
motif_recommandation: 'Variante principale de la famille corruption (D35 ; méthode §4 : série la plus longue à niveau
  égal), score annuel depuis 1996 sauf 1997, 1999 et 2001 (25 points depuis 2000, 73,09 en 2025), quand l''indice
  de perception de la corruption n''est comparable que depuis 2012.'
note_pertinence: 'La corruption est nommée dans le contenu de la dimension ; l''indice de perception de la corruption
  (CPI) en est la mesure la plus connue mais n''est comparable que depuis 2012. Le contrôle de la corruption des
  WGI couvre 2000-2025 (estimation de 1,29 en 2000, 1,51 en 2011, 1,24 en 2025) et agrège des évaluations d''experts
  du même type que le CPI : les deux sont substituables (même famille) et ne devraient pas être pris ensemble.'
