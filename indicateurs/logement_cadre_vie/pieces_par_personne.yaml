note_pertinence: La moyenne de pièces par personne décrit l'espace dont dispose le ménage moyen, quand le taux de
  surpeuplement isole les situations de manque. Publiée au dixième, elle ne varie qu'entre 1,7 et 1,9 de 2004 à
  2025 (API Eurostat lue le 15/10/2026) et se prête mal à des bornes annuelles, mais reste un repère utile.
