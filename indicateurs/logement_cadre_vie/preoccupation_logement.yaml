motif_recommandation: Seule mesure ressentie et annuelle de l'inquiétude pour le logement, posée chaque année de
  2014 à 2025 (12 vagues), de 66,2 % à 55,4 % des répondants d'après les distributions calculées par le robot M04.
note_pertinence: 'La préoccupation pour le logement traduit la difficulté ressentie à se loger ou à payer son logement,
  pour soi ou ses proches. Comme les autres questions OG04 du baromètre (chômage en travail, insécurité du quartier
  en securite), elle mêle une inquiétude personnelle et un jugement sur la situation du pays (D32). Sa baisse de
  66,2 % en 2014 à 54,0 % en 2020, puis sa stabilité autour de 55 %, contraste avec la remontée du taux de surcharge
  des coûts du logement : le contrôle de redondance et le choix des bornes devront en tenir compte.'
