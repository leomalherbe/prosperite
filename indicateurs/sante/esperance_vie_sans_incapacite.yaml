id: esperance_vie_sans_incapacite
libelle: Années de vie en bonne santé (espérance de vie sans incapacité) à la naissance
dimension: sante
sous_theme: espérance de vie
famille: esperance_vie_sans_incapacite
variante_principale: oui
definition: Nombre d'années qu'une personne peut espérer vivre sans limitation d'activité durable due à un problème
  de santé (indicateur GALI de l'enquête SRCV combiné aux tables de mortalité), ensemble des sexes, France.
unite: années
sens: haut
type: resultat
declaratif: oui
composite: non
source_organisme: Eurostat (d'après l'INSEE, SRCV et état civil)
source_jeu: hlth_hlye (années de vie en bonne santé par sexe), modalité HLY_Y0
source_serie_id: hlth_hlye?freq=A&unit=YR&sex=T&hlth_hle=HLY_Y0&geo=FR
source_niveau: 1
url_api: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/hlth_hlye?freq=A&unit=YR&sex=T&hlth_hle=HLY_Y0&geo=FR
url_page: https://ec.europa.eu/eurostat/databrowser/view/hlth_hlye/default/table?lang=fr
frequence: annuelle
premiere_annee: 2004
derniere_annee: 2024
nb_points_depuis_2000: 21
geo: FR
eligibilite_longlist: oui
ligne_id: estat-011310
hors_longlist: non
raccordement: 'a_etudier : ruptures de 2020 et 2022 de l''enquête SRCV (question GALI) à neutraliser avant tout
  calcul de tendance'
incontournable: oui
recommandation: retenir
motif_recommandation: Indicateur de richesse nationale de l'INSEE et du cadre Qualité de vie d'Eurostat (§5 du crosswalk),
  annuel de 2004 à 2024, publié pour l'ensemble des sexes par Eurostat seulement.
note_pertinence: 'Les années de vie en bonne santé combinent la mortalité et la part des personnes déclarant une
  limitation durable d''activité : elles disent si l''allongement de la vie se fait en bonne santé. La série passe
  de 62,9 ans en 2004 à 64,6 ans en 2020 (rupture « b ») et 66,2 ans en 2021, puis revient à 63,6 ans en 2024 (provisoire)
  : la refonte de SRCV en 2020 rend la trajectoire récente fragile. L''INSEE publie le même indicateur par sexe
  (variantes, ODD 3.i1a).'
