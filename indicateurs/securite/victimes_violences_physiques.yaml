raccordement: 'a_etudier : rupture CVS (2010-2018) / VRS (2021-2023) sans valeur 2019-2020 ; le niveau tombe de
  2,1 % en 2018 à 1,0 % en 2021 (-52 %) : traiter en deux segments ou avec un coefficient de passage à demander
  au SSMSI'
incontournable: non
recommandation: retenir
motif_recommandation: Part des 18-75 ans déclarant des violences physiques (enquête), 2010-2023, indépendante de
  la plainte et stable sur la période CVS (2,1 % en 2010 comme en 2018), même rupture que l'ensemble (1,0 à 1,2
  % en 2021-2023) ; composante de victimes_violences, à ne pas cumuler avec elle au socle.
note_pertinence: Composante principale de l'indicateur d'ensemble, elle permet de suivre les coups et blessures
  pour eux-mêmes et de contrôler la série enregistrée correspondante, dont le doublement depuis 2008 ne se retrouve
  pas dans l'enquête. Les valeurs sont arrondies au dixième de point. Mêmes limites de champ et de rupture que victimes_violences.
