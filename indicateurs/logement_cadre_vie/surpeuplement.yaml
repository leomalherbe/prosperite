id: surpeuplement
libelle: Taux de surpeuplement des logements
dimension: logement_cadre_vie
sous_theme: surpeuplement et qualité du logement
famille: surpeuplement
variante_principale: oui
definition: Part de la population vivant dans un logement surpeuplé, c'est-à-dire comptant moins de pièces que le
  minimum requis compte tenu de la taille et de la composition du ménage (définition harmonisée EU-SILC).
unite: '% de la population'
sens: bas
type: resultat
declaratif: non
composite: non
