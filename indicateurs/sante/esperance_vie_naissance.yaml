motif_recommandation: Indicateur retenu par quatre cadres de bien-être (§5 du crosswalk), annuel de 2000 à 2024
  (79,2 ans en 2000, 83,0 ans en 2024, provisoire) et publié par Eurostat pour l'ensemble des sexes, alors que l'INSEE
  ne publie ce niveau que par sexe (D35).
note_pertinence: 'L''espérance de vie résume la mortalité à tous les âges : c''est l''indicateur de santé commun
  aux cadres SSF, OCDE, Eurostat et INSEE. L''API Eurostat porte une rupture de série (« b ») en 2012 et en 2014
  et des valeurs provisoires en 2023 et 2024 ; la baisse de 82,7 ans en 2019 à 82,2 ans en 2020-2022 traduit l''épidémie
  de Covid-19. Les séries INSEE par sexe, plus longues (1946-2025 en métropole) et plus fraîches (2025 provisoire),
  sont en variantes.'
