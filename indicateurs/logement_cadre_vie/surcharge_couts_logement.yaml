id: surcharge_couts_logement
libelle: Taux de surcharge des coûts du logement
dimension: logement_cadre_vie
sous_theme: coût du logement
famille: surcharge_couts_logement
variante_principale: oui
definition: Part de la population vivant dans un ménage dont les coûts totaux du logement (loyer ou intérêts d'emprunt,
  charges, énergie, entretien), nets des allocations logement, dépassent 40 % du revenu disponible, lui aussi net
  des allocations logement (EU-SILC).
unite: '% de la population'
sens: bas
type: resultat
declaratif: non
composite: non
source_organisme: Eurostat
