id: ecart_surqualification_origine
libelle: Écart de taux de surqualification entre personnes nées hors de l'UE et personnes nées en France
dimension: egalites
sous_theme: écarts selon l'origine
famille: ecart_surqualification_origine
variante_principale: oui
definition: Écart, en valeur absolue et en points, entre le taux de surqualification (part des diplômés de l'enseignement
  supérieur en emploi, de 15 ans ou plus, qui occupent un emploi ne demandant pas ce niveau de diplôme) des personnes
  nées hors de l'UE et celui des personnes nées en France (enquête Forces de travail, jeu Eurostat lfsa_eoqgac).
