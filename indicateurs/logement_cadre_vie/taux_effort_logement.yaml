note_pertinence: 'Le taux d''effort médian décrit la charge du logement pour un ménage ordinaire, quand le taux
  de surcharge se concentre sur les situations extrêmes. Il varie peu : 12,3 % en 2004, 13,3 % en 2006, 11,1 % en
  2020 (rupture b) et 12,2 % en 2025 (API Eurostat lue le 15/10/2026).'
