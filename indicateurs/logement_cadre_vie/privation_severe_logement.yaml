notes: 'Valeurs lues sur la table ODD sdg_11_11 (même indicateur, ensemble, mise à jour Eurostat du 21/05/2026 ;
  l''API de ilc_mdho06a a été refusée par le proxy le 15/10/2026, HTTP 429) : 3,4 (2004), 2,1 (2013 et 2017), 2,7
  (2018), 2,3 (2019), 3,8 (2020, b), 4,6 (2023) ; sous le seuil de pauvreté : 9,6 (2004), 13,7 (2023). Les défauts
  du logement relèvent du module triennal d''EU-SILC depuis 2021 (vagues 2023 et 2026, page des modules d''Eurostat
  lue le 15/10/2026). Variantes : table ODD sdg_11_11 et ventilations par sexe et âge (lignes de niveau_de_vie),
  ventilations par type de ménage, statut d''occupation et urbanisation (ilc_mdho06b à d), handicap (hlth_dhc030)
  ; ensemble et ventilation par quintile de revenu (ilc_mdho06q, lignes renvoyées par niveau_de_vie, D38 a). Valeurs
  confirmées sur le jeu primaire ilc_mdho06a par l''audit M06 (16/10/2026).'
