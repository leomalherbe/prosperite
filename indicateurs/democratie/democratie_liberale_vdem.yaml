variante_principale: oui
definition: Indice composite de V-Dem (de 0 à 1) qui combine la démocratie électorale (élections libres et équitables,
  suffrage, libertés d'association et d'expression) et la composante libérale (État de droit, contraintes judiciaires
  et législatives sur l'exécutif, libertés individuelles), à partir d'évaluations d'experts ; jeu V-Dem v16 relayé
  par Our World in Data (définition résumée, codebook V-Dem non lu).
