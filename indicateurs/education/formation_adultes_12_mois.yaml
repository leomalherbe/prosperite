raccordement: 'a_etudier : l''indicateur des cibles (AES hors formation guidée : 48,4 % en 2016, 49,2 % en 2022
  selon la Commission) n''est pas dans la base d''Eurostat ; la question sur douze mois de l''EFT (trng_lfs_17,
  biennale depuis 2022, hors formation guidée) doit prendre le relais'
incontournable: non
socle_propose: oui
recommandation: retenir
motif_recommandation: 'Principale de la formation des adultes (D44) : participation sur douze mois de l''enquête
  sur l''éducation des adultes, la plus proche des séries publiées de l''indicateur des cibles européenne (60 %)
  et française (65 %) de 2030, quinquennale (2007, 2011, 2016 et 2022, D17 ; 50,8 % en 2022).'
note_pertinence: 'La participation sur douze mois capte les formations courtes que la fenêtre de quatre semaines
  manque (50,8 % en 2022 contre 13,3 % sur quatre semaines). La série d''Eurostat inclut la formation guidée en
  situation de travail : l''indicateur des cibles, qui l''exclut, n''est publié que par la Commission (extraction
  spéciale de l''AES : 48,4 % en 2016 et 49,2 % en 2022, avec rupture), et les cibles de 60 % et 65 % ne s''appliquent
  pas telles quelles à la série retenue. L''enquête sur les forces de travail pose la question sur douze mois tous
  les deux ans depuis 2022, hors formation guidée (36,3 % en 2022, 37,7 % en 2024), en variante.'
