socle_propose: non
recommandation: retenir
motif_recommandation: Indicateur de l'espace européen de l'éducation (cible d'au moins 45 % en 2030) et du cadre
  Eurostat Qualité de vie, annuel de 2000 à 2025 (31,4 % en 2000, 55,8 % en 2025).
note_pertinence: 'La part des diplômés du supérieur mesure l''élévation de la qualification des générations récentes.
  La cible européenne de 45 % est dépassée depuis 2018 (47,0 %), ce qui posera la question de la borne. Eurostat
  signale le passage à la CITE 2011 en 2014 et des ruptures en 2003, 2013, 2021 et 2024. La DEPP reprend l''indicateur
  (2013-2024, 53,4 % en 2024 contre 53,1 % pour Eurostat : millésime ou champ différent) et l''INSEE publie les
  parts de diplômés du supérieur par tranche d''âge dans les séries longues de l''enquête Emploi, en variantes.'
