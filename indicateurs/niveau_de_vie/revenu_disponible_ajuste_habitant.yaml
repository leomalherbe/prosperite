notes: 'Le catalogue et l''API étiquettent l''unité « prix courants, millions de monnaie nationale » alors que l''indicateur
  est en termes réels par habitant (incohérence relevée par la lecture de l''API le 14/10/2026, maintenance NDV-1)
  ; l''année de référence des prix n''est pas indiquée dans la réponse. Variante non ajustée (B6G_R_HAB) : 17 339
  € en 2000, 22 316 € en 2024. Direction « reçu » (RECV) retenue ; la direction « payé » donne la même valeur (doublon
  technique).'
