notes: 'Déclaratif oui : appréciation du ménage sur sa charge (méthode §4). Valeurs lues (ilc_mded04, lev_bur=HVY,
  ensemble, mise à jour Eurostat du 13/08/2026) : 20,2 (2004), 29,3 (2008), 29,6 (2013), 23,2 (2019), 26,4 (2020,
  b), 31,4 (2023) ; aucune valeur 2021 et 2022. Depuis le règlement-cadre de 2021, l''item relève du module triennal
  « conditions de travail et de logement » d''EU-SILC (vagues 2023 et 2026 d''après la page des modules d''Eurostat
  lue le 15/10/2026) : valeurs annuelles de 2004 à 2020, puis 2023, d''où la fréquence irrégulière (report de la
  dernière valeur, D17). Variantes : ventilation par type de ménage, modalités « dans une certaine mesure » et «
  pas une charge ».'
