motif_recommandation: Alternative au PIB recommandée par Stiglitz-Sen-Fitoussi (revenu national), publiée par l'INSEE
  de 1949 à 2025 (26 points), substituable au PIB par habitant, principal de la famille.
note_pertinence: 'Le revenu national compte ce que gagnent les résidents plutôt que ce qui est produit sur le territoire
  : il ajoute les revenus reçus de l''étranger et retranche ceux qui y sont versés. Il se lit comme le PIB par habitant
  et le remplace pour qui veut une mesure de revenu. La Banque mondiale publie un revenu national net ajusté (après
  consommation de capital fixe et épuisement des ressources), en variante.'
