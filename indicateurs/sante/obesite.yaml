motif_recommandation: Seule série nationale récente de l'obésité des adultes, 6 vagues de 2008 à 2025 (12,2 % en
  2008, 16,3 % en 2025) admises comme série irrégulière (D17).
note_pertinence: L'obésité est un facteur de risque majeur (diabète, maladies cardiovasculaires) lié à l'alimentation
  et à l'activité physique (A2). Les vagues proviennent d'enquêtes différentes (EHIS et modules santé d'EU-SILC)
  et reposent sur des déclarations, qui sous-estiment l'obésité mesurée. La surcharge pondérale, la série OCDE (2004-2019)
  et l'obésité des élèves de 3e sont en variantes.
