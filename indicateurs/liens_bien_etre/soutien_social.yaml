motif_recommandation: Incontournable (Doughnut, OCDE How's Life, Eurostat Qualité de vie) et seule série couvrant
  2006-2025 (7 valeurs distinctes), l'équivalent public EU-SILC n'ayant que 3 vagues (2013, 2018, 2022).
note_pertinence: Le soutien social est l'indicateur de liens le plus partagé par les cadres de référence et l'indicateur
  social retenu par le Doughnut (« manque de soutien social »). Le niveau est élevé (87,6 % sur 2023-2025), ce qui
  demandera des bornes proches du plafond. Si la réutilisation des données Gallup était refusée, la variante EU-SILC
  (ilc_pw06, 2013-2022) prendrait le relais.
