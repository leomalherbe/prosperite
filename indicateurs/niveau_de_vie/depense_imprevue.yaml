rattachement_propose: 'ligne de la long-list securite renvoyée à niveau_de_vie (groupe securite/depense_imprevue_niveau_de_vie)
  : sécurité économique des ménages → niveau_de_vie (D49, D50, grille v1.1, R9) ; la table de correspondance v0→v1
  la place encore en securite (correction signalée à la session mère)'
raccordement: non
incontournable: oui
socle_propose: oui
recommandation: retenir
motif_recommandation: Indicateur phare de la sécurité économique (Eurostat QoL ; SSF, OCDE), annuel 2004-2025 sans
  lacune (34,2 % en 2004, 28,8 % en 2025), ruptures signalées en 2020 et 2022.
note_pertinence: C'est la mesure la plus directe de la capacité des ménages à encaisser un coup dur financier, au
  cœur de la définition de la dimension. Elle fait partie de la privation matérielle européenne et existe aussi
  à l'INSEE (SRCV, dépense d'environ 1 000 €), mais seulement depuis 2020 dans les catalogues. La réponse est une
  auto-évaluation de capacité, classée non déclarative par convention (journal M05 §2.4).
