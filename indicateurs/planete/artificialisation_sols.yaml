definition: Part du territoire de France métropolitaine occupée par des sols artificialisés (bâtis, revêtus ou stabilisés,
  autres sols artificialisés), d'après l'enquête Teruti sur l'utilisation du territoire.
unite: '% du territoire'
sens: bas
