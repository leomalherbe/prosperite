note_pertinence: 'Le bruit des transports et du voisinage nuit au sommeil et à la santé. Aucune mesure objective
  de l''exposition au bruit n''est cataloguée : la déclaration des ménages est la seule série. La part baisse de
  23,5 % en 2004 à 16,2 % en 2013, puis remonte à 20,7 % en 2020 (rupture b) et 21,1 % en 2023 (table ODD sdg_11_20,
  API Eurostat lue le 15/10/2026).'
