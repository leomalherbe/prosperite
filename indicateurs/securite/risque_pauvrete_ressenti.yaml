notes: 'Modalité 1 seule (consigne de la session mère, coordination NDV-4 avec niveau_de_vie/pauvrete_ressentie,
  qui porte la modalité 3) : la correction n° 3 de la maintenance (somme des modalités 1 et 3) est à abandonner
  (SEC-2). Parts lues dans docs/sources/series/drees__barometre_2000_2025_distributions.csv ; parmi les répondants
  qui ne se disent pas déjà pauvres (modalité 1 / (100 − modalité 3)) : 34,9 % en 2014, 26,7 % en 2018, 17,0 % en
  2021, 19,5 % en 2025 (calcul de l''agent correcteur, lecture d''appoint, pas une variante). Recoupement (D34)
  : tableaux croisés simplifiés publiés par la DREES pour 2025 (docs/sources/series/drees__barometre_tc_simplifies_2025.txt)
  : 16,12 % « oui, plutôt », 59,80 % « non, plutôt pas », 17,41 % « déjà pauvre », 6,67 % sans réponse, identiques
  au calcul du robot ; vagues 2014-2023 non recoupées.'
