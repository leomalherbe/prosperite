notes: 'Valeurs lues (tran_hv_psmod, TRN_BUS_TOT_AVD « trains, autocars, autobus et trolleybus, somme des données
  disponibles », mise à jour Eurostat du 26/08/2026) : 13,9 (2000), 15,8 (2008), 14,6 (2009), 99,1 (2010, e), 99,2
  (2011, e), 99,1 (2012), 15,6 (2013, b), 15,6 (2019), 12,1 (2020), 15,4 (2022), 17,4 (2024). Somme des séries INSEE
  (France métropolitaine, transport ferré y compris métro + bus, cars et tramways, BDM lue le 15/10/2026) : 16,7
  (2010), 17,0 (2011), 16,2 (2012), 16,1 (2013), 12,2 (2020), 17,3 (2024), soit de 0,1 point en dessous à 0,7 point
  au-dessus d''Eurostat sur 2013-2024 (champ incluant métro et tramway). Maintenance LOG-7. La part recoupe la planète
  (émissions des transports), mais son rattachement suit le contenu de la dimension. Variantes : table ODD sdg_09_50
  ; composantes autocars et autobus, trains ; complément voiture particulière ; répartition incluant l''aérien et
  le maritime (tran_hv_ms_psmod) ; INSEE BDM 010751584 et 010751585 et Melodi ODD 9 ; part des transports en commun
  dans les déplacements domicile-travail (recensement, ITDD, 2016 et 2022, hors long-list). L''OCDE ne publie l''ODD
  11.2.1 que pour 2020 (95,3 % de la population urbaine, extrait du robot M04).'
