motif_recommandation: Seule mesure de la formation par le travail dans l'enseignement professionnel, assortie d'un
  objectif européen (au moins 60 % en 2025), annuelle de 2021 à 2025 (5 points), retenue en variante faute de dix
  points (D44, D38 f).
note_pertinence: 'La formation en situation de travail pendant les études professionnelles (stages, apprentissage)
  facilite l''insertion des jeunes diplômés. La fiche est accueillie dans la famille de la formation des adultes,
  dont elle n''est pas un substitut au sens strict : elle mesure l''apprentissage par le travail des jeunes plutôt
  que la participation des adultes à la formation. Les valeurs n''ont pas pu être lues (refus du proxy le 16/10/2026)
  et les modalités exactes de l''indicateur européen (personnes en formation ou non, nature de l''expérience) restent
  à confirmer.'
