id: taux_emploi_eqtp
libelle: Taux d'emploi en équivalent temps plein des 15-64 ans
dimension: travail
sous_theme: emploi
famille: taux_emploi
variante_principale: non
definition: Taux d'emploi des 15-64 ans dans lequel chaque emploi est pondéré par sa durée de travail rapportée
  à un temps plein (INSEE, enquête Emploi, série trimestrielle corrigée des variations saisonnières, champ France
  entière).
unite: '% de la population de 15 à 64 ans (en équivalent temps plein)'
sens: haut
type: resultat
declaratif: non
composite: non
