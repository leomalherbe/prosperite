motif_recommandation: 'Variante principale de la famille qualite_democratique (D35 : V-Dem libéral, Freedom House,
  WGI voix et responsabilité), concept le plus large des trois et version continue de l''indicateur de régime du
  Doughnut, annuelle sans lacune de 2000 à 2025 (26 points, 0,80 en 2025).'
note_pertinence: 'L''indice de démocratie libérale est une mesure composite de référence de la qualité démocratique
  ; le Doughnut classe les régimes avec des données de V-Dem (à vérifier d''après la table des cadres). Il est substituable
  au score de Freedom House et à l''indicateur WGI voix et responsabilité (même famille) : l''utilisateur en prendra
  un seul. Pour la France, il varie peu (de 0,789 à 0,822 depuis 2000) ; ses composantes sont listées en variantes,
  l''État de droit et la corruption V-Dem rejoignant leurs familles propres.'
