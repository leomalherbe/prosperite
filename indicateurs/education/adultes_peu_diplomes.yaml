id: adultes_peu_diplomes
libelle: Adultes de 25 à 64 ans sans diplôme du second cycle du secondaire
dimension: education
sous_theme: diplômes et sorties précoces
famille: niveau_etudes_adultes
variante_principale: oui
definition: 'Part des personnes de 25 à 64 ans vivant en ménage ordinaire dont le plus haut niveau atteint est au
  plus le premier cycle du secondaire (CITE 0 à 2 : aucun diplôme, certificat d''études ou brevet), d''après l''enquête
  européenne sur les forces de travail (Eurostat edat_lfse_03).'
unite: '% des 25-64 ans'
sens: bas
type: resultat
declaratif: non
