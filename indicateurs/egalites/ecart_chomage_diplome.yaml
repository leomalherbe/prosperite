variante_principale: oui
definition: Taux de chômage des 15-74 ans dont le diplôme le plus élevé est au plus le premier cycle du secondaire
  (CITE 0-2) moins celui des diplômés du supérieur (CITE 5-8), en points (enquête Forces de travail, jeu Eurostat
  lfsa_urgaed).
