notes: 'Valeurs lues (tipsho60, unité « ratio prix sur revenu rapporté à la moyenne de long terme ») : 70,20 (2000),
  102,96 (2005), 112,33 (2007), 103,19 (2009), 101,29 (2016), 108,04 (2020), 111,09 (2022), 103,42 (2023), 95,48
  (2024) ; aucun drapeau. Variantes : taux de variation annuels de l''indice des prix des logements, nominal (tipsho20)
  et déflaté (tipsho10), prc_hpi_a, logements occupés par leur propriétaire (prc_hpi_ooa). L''indice des prix des
  logements anciens INSEE-Notaires figure au catalogue des séries écartées de l''INSEE (motif « indice de production
  ou de prix de production (entreprises) », à corriger) et est ajouté en variante ; la série BCE des prix de l''immobilier
  résidentiel (flux RPP) n''est pas cataloguée (maintenance LOG-4).'
