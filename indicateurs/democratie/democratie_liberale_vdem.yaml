notes: 'Dernière valeur (0,8 en 2025) lue dans la sortie du robot M04 et sur la page OWID le 14/10/2026 ; plage
  0,789-0,822 depuis 2000 lue par l''audit M06 (CSV OWID filtré sur la France) ; licence V-Dem CC BY-SA 4.0 d''après
  M04. Le jeu V-Dem n''est téléchargeable qu''après un formulaire (niveau exclu) : OWID est la voie d''accès. Série
  disponible depuis 1789 dans le relais OWID (V-Dem v16, métadonnées OWID du 17/03/2026) ; année = année observée.
  Variante principale malgré son niveau 2 (WGI au niveau 1) : concept le plus large (composantes électorale et libérale),
  quand l''indicateur WGI ne couvre que la voix et la responsabilité et Freedom House les droits et libertés (dérogation
  motivée à la méthode §4, à confirmer par la session mère).'
