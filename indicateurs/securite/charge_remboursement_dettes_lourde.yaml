motif_recommandation: Seule mesure du poids ressenti des remboursements de crédits, annuelle de 2004 à 2025 (22
  points, 23,1 % en 2004, 27,8 % en 2014, 23,0 % en 2025), ruptures signalées en 2020 et 2022.
note_pertinence: Le poids ressenti des remboursements signale les ménages que leurs crédits mettent en difficulté
  avant les retards de paiement et le surendettement, autres fiches de la sécurité économique. La part qui juge
  cette charge lourde monte de 23,1 % en 2004 à 27,8 % en 2014, redescend à 21,6 % en 2019 et se tient autour de
  23 % à 24 % depuis 2022, après un point bas de 16,7 % en 2021 entre deux ruptures. Les ventilations par type de
  ménage et les compléments (une certaine charge, aucune charge) sont en variantes.
