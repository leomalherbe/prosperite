incontournable: non
recommandation: retenir
motif_recommandation: Variante principale de la famille usage_internet (A7), série Eurostat annuelle de 2006 à 2025
  (19 points d'après la long-list), plus longue que les séries INSEE de même enquête (2009-2025, D35).
note_pertinence: L'usage effectif d'internet mesure l'inclusion numérique au-delà de l'équipement du ménage. La
  Banque mondiale (UIT) donne une série plus ancienne, de 14,31 % en 2000 à 88,65 % en 2024 (extrait de l'API lu
  le 13/10/2026), avec une cassure en 2015 qui en limite le raccordement. Les compétences numériques et l'illectronisme
  relèvent d'education (A7).
