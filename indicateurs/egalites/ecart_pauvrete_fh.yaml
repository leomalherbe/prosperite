motif_recommandation: Écart absolu (D34) des taux de pauvreté des femmes et des hommes, annuel de 2000 à 2025 sauf
  2003 (25 points), entre 0,2 et 2,0 points (2,0 en 2025), seule mesure de l'écart de pauvreté selon le sexe pour
  toute la population.
note_pertinence: 'La pauvreté est mesurée au niveau du ménage : l''écart entre femmes et hommes vient surtout des
  familles monoparentales et des femmes âgées seules, et il sous-estime les inégalités au sein des couples. Chez
  les 65 ans ou plus, l''écart est plus net (13,1 % contre 9,8 % en 2025). L''écart ne s''est inversé qu''une fois
  (-0,2 point en 2018) ; la valeur absolue (D34) le compte comme une distance à la parité.'
