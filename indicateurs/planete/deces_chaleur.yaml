note_pertinence: Les décès attribuables à la chaleur traduisent en vies humaines l'aléa climatique le plus direct
  pour la population, que la dimension suit déjà par le nombre de jours de canicule. La part des décès estivaux
  neutralise la taille de la population ; le nombre de décès (1 104 en 2014, 6 969 en 2022, 5 722 en 2025), la part
  pendant les seules vagues de chaleur et les 75 ans ou plus sont en variantes. La série commence en 2014 et dépend
  du modèle épidémiologique de Santé publique France, révisable.
