motif_recommandation: Moyen budgétaire (charte §3.4) exprimé en euros courants par habitant, donc gonflé par l'inflation
  (54,3 € en 2000, 120,6 € en 2024), sans cible officielle qui permettrait de fixer des bornes (D19).
note_pertinence: La dépense pour les tribunaux mesure les moyens de la justice, pas son fonctionnement ni la confiance
  qu'elle inspire. Elle est admissible comme indicateur de moyens (D19), mais une version en part du PIB ou en euros
  constants serait nécessaire pour la lire dans le temps.
