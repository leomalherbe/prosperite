motif_recommandation: Indicateur incontournable de la pollution de l'air locale (SSF, OCDE, Eurostat), seul publié
  avec des objectifs réglementaires (14,7 µg/m³ pour 2020, 11,2 pour 2025, 10 pour 2030), de 2011 à 2024 (14 périodes
  triennales).
note_pertinence: Les particules fines sont le polluant de l'air le plus nocif pour la santé ; l'indicateur suit
  l'exposition de la population des villes. Il baisse de 17,3 µg/m³ sur 2009-2011 à 8,9 sur 2022-2024, sous l'objectif
  fixé pour 2030 (extrait du fichier du SDES lu par le robot M04 le 13/10/2026). Les moyennes triennales lissent
  les années atypiques.
