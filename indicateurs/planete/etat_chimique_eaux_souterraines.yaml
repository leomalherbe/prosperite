motif_recommandation: Indicateur de référence de la qualité des nappes (directive-cadre sur l'eau), 4 points de
  2013 à 2021, non éligible dans la long-list mais candidat selon D28 (maintenance PLA-1).
note_pertinence: Le mauvais état chimique des nappes, lié notamment aux nitrates et aux pesticides, se corrige très
  lentement. La série ne bouge qu'aux états des lieux, d'où le report de la dernière valeur (D17). L'état quantitatif
  des nappes, autre composante de leur état, est en variante.
