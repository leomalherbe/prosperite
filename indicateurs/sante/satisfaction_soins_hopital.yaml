recommandation: retenir
motif_recommandation: Seule mesure de satisfaction à l'égard du système de soins (R4), 14 vagues de 2010 à 2025
  (69,2 % en 2010, 75,2 % en 2014, 63,7 % en 2025 parmi les répondants qui ont un avis), calculée par le projet
  et retenue avec le drapeau non_recoupe et un contrôle de plausibilité (D38 b).
note_pertinence: 'La satisfaction à l''égard de la qualité des soins hospitaliers est la satisfaction du domaine
  santé que demande la règle R4 ; parmi les répondants qui ont un avis, elle recule de 75,2 % en 2014 à 60,8 % en
  2023 puis remonte à 63,7 % en 2025. Les urgences ont une fiche variante (satisfaction_urgences) ; les généralistes,
  les cliniques privées et le temps accordé par le généraliste sont en variantes. La question est proche de la confiance
  dans l''hôpital (democratie) : à départager au contrôle de redondance.'
