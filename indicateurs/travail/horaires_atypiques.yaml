id: horaires_atypiques
libelle: Personnes en emploi travaillant à des horaires atypiques
dimension: travail
sous_theme: conditions et santé au travail
famille: horaires_atypiques
variante_principale: oui
definition: Part des personnes en emploi de 15 ans ou plus qui travaillent à des horaires atypiques au sens d'Eurostat
  (enquête sur les forces de travail) ; la liste des horaires comptés (soir, nuit, fin de semaine, travail posté)
  est à vérifier dans les métadonnées.
unite: '% de l''emploi total'
sens: bas
