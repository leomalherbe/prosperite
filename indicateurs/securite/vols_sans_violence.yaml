motif_recommandation: 'Série irrégulière sans drapeau de rupture : +43 % en 2009 (1 504 à 2 150 pour 100 000), -16
  % en 2010, +18 % en 2013, sauts qui traduisent des changements d''enregistrement plus qu''une évolution des vols
  ; pas de série d''enquête au catalogue pour la contrôler.'
note_pertinence: Les vols sans violence sont la délinquance la plus fréquente, mais une part importante n'est pas
  déclarée et la série Eurostat présente des sauts inexpliqués. Une fois que la série SSMSI (victimes de vols sans
  violence, 2016-2025) aura assez de recul, ou si les séries VRS sont cataloguées, le concept pourra revenir. Les
  vols de véhicules, mieux déclarés, ont leur propre fiche.
