definition: Part des personnes vivant dans un ménage qui n'a pas les moyens de s'offrir un repas comportant de la
  viande, du poulet ou du poisson (ou un équivalent végétarien) au moins un jour sur deux (enquête SRCV, indicateur
  ODD 2.i1 « renoncement à consommer des protéines pour raisons financières »).
