rattachement_propose: ligne de la long-list sante (ventilation par quintile de revenu) ; l'écart construit relève
  d'egalites (accès aux soins, R3), le niveau reste dans sante ; à trancher au gel 2
raccordement: non
incontournable: non
recommandation: retenir
motif_recommandation: Écart construit sur une série annuelle de 2008 à 2025 (18 points) qui mesure l'inégalité d'accès
  aux soins selon le revenu, distincte du niveau de renoncement suivi dans sante.
note_pertinence: Le renoncement aux soins pour raisons financières touche d'abord les plus modestes ; l'écart entre
  quintiles mesure cette inégalité. Les valeurs sont faibles en France, ce qui rend l'écart sensible aux aléas d'échantillon.
