rattachement_propose: 'hors long-list : question SA07_1 du baromètre DREES non cataloguée par M04 ; satisfaction
  du domaine santé (R4), voisine de la confiance dans l''hôpital rangée en democratie (R5) ; à cataloguer (maintenance
  SAN-3)'
raccordement: 'a_etudier : rupture de 2014 (avant 2014, la modalité « jamais allé.e / ne connais pas » n''existait
  pas et les non-usagers ne peuvent pas être distingués : 66,8 % en 2013, 75,2 % en 2014) ; pas de question en 2022
  ni en 2024'
incontournable: non
