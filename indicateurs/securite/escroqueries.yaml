motif_recommandation: 'Le taux de plainte des ménages victimes d''escroquerie bancaire n''est que de 12,8 % (2020,
  enquête CVS, SSMSI) et aucune enquête vivante ne permet de contrôler la série enregistrée (2016-2025, 10 points)
  : son évolution dépend autant des canaux de signalement que des faits (sens ambigu).'
note_pertinence: Les escroqueries, en particulier en ligne, sont une atteinte aux biens en forte progression qui
  touche de nombreux ménages. Mais une petite partie seulement des victimes porte plainte, et la série enregistrée
  dépend des canaux de signalement (plateformes de plainte en ligne créées ces dernières années, à documenter).
  Le motif d'écart n'est plus la brièveté de la série, éligible depuis 2016 (D32), mais son sens ambigu ; le concept
  pourra revenir avec les séries de l'enquête VRS.
