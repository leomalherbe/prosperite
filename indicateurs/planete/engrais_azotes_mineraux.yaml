motif_recommandation: Autre lecture de la famille pression_azote_agricole, proche de l'indicateur de la limite planétaire
  du Doughnut et visée par la cible de baisse de 30 % en 2030 de la SNBC 3, série Eurostat de 2000 à 2024 (2 482
  363 t en 2000, 1 824 613 t en 2024, provisoire), l'excédent restant principal (D40).
note_pertinence: Les engrais minéraux sont une source majeure d'azote réactif dans les sols, et le Doughnut fixe
  sa limite sur l'azote appliqué comme engrais. La série ignore les effluents d'élevage et les prélèvements des
  cultures, contrairement à l'excédent. Les valeurs 2023 et 2024 sont provisoires.
