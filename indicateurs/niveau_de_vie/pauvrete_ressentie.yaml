motif_recommandation: Seule mesure de l'auto-identification comme pauvre (DREES, 11 vagues de 2014 à 2025), autre
  lecture subjective de la pauvreté, substituable à la difficulté à joindre les deux bouts, principale de la famille.
note_pertinence: 'Se dire pauvre n''est pas la même chose qu''avoir du mal à boucler son budget : la question mesure
  le sentiment d''appartenir aux pauvres. La part passe de 7,87 % en 2014 à 19,24 % en 2023 et 17,41 % en 2025 (sortie
  du robot M04, docs/sources/series/drees__barometre_2000_2025_distributions.csv). La modalité 1 de la même question
  (« oui, plutôt » : risque de devenir pauvre) est la fiche securite/risque_pauvrete_ressenti, que la maintenance
  n° 3 propose d''élargir à la modalité 3 : les deux fiches ne doivent pas compter deux fois la même modalité (NDV-4).'
