note_pertinence: 'Un chômage dont on sort vite pèse moins qu''un chômage durable : la probabilité de retrouver un
  emploi en un an complète le taux de chômage. Les valeurs vont de 36,4 % (2011) à 33,4 % (2020), puis 42,3 % (2022)
  et 41,3 % (2025), sans valeur en 2021 (collecte ciblée du robot, 15/10/2026). Le saut de 2022 coïncide avec le
  drapeau « définition différente » : la trajectoire n''est lisible qu''après raccordement.'
