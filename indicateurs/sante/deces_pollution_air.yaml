rattachement_propose: 'ligne de la long-list sante gardée ici : le décès attribuable est un résultat de santé, l''exposition
  subie à la pollution de l''air relève de logement_cadre_vie et les émissions de planete (R2) ; à confirmer au
  gel 2'
raccordement: 'a_etudier : chute de 53 à 34 décès pour 100 000 de 2013 à 2014 (-36 %), sans drapeau ni explication
  dans les métadonnées (sdg_11_52_esmsip2) ; pas de valeur en 2006 (pas de carte interpolée des PM2,5)'
incontournable: non
socle_propose: non
recommandation: retenir
motif_recommandation: Indicateur du tableau de bord ODD de l'UE, 18 années de 2005 à 2023 (61 décès prématurés pour
  100 000 habitants en 2005, 22 en 2023, 2006 absent), seule mesure annuelle de la mortalité attribuable à l'environnement
  au catalogue.
note_pertinence: La pollution de l'air est un facteur de risque environnemental majeur ; ce décompte traduit l'exposition
  en décès et relie la dimension santé aux conditions de vie. Le taux baisse de 61 à 22 pour 100 000 entre 2005
  et 2023, mais la chute de 2013 à 2014 (de 53 à 34) n'est pas expliquée et peut tenir à la modélisation. Ce sont
  des estimations révisées à chaque édition ; Santé publique France publie une estimation nationale ponctuelle (2016-2019)
  en variante.
