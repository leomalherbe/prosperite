ligne_id: estat-026548
hors_longlist: non
rattachement_propose: 'ligne de la long-list sante (règle sante_travail, autre_dimension:travail) : santé au travail
  rattachée à travail par D39 ; oubli O1 de l''audit M06'
raccordement: 'non : vagues 2007, 2013 et 2020 non comparables (« définition différente », « rupture et définition
  différente », « rupture ») ; lecture en niveau de la vague 2020 pour le socle'
incontournable: non
socle_propose: non
recommandation: retenir
motif_recommandation: Pendant physique des risques psychosociaux, cité par le cadre Qualité de vie et nommé dans
  le contenu de la dimension (expositions), observé en 2007, 2013 et 2020 (D17) avec la même qualité de données
  que exposition_risques_sante_mentale (audit M06 O1).
note_pertinence: 'Les expositions physiques (produits chimiques, bruit, charges, postures, machines) sont la source
  principale des accidents et des maladies professionnelles. Les trois valeurs (70,0 % en 2007, 81,6 % en 2013,
  74,9 % en 2020) portent les drapeaux « définition différente », « rupture et définition différente » puis « rupture
  » (collecte ciblée du robot, 15/10/2026) : elles ne forment pas une trajectoire comparable. Les facteurs détaillés
  (hsw_exp4) restent en variantes.'
