notes: 'Parts recalculées sur docs/sources/series/drees__barometre_2000_2025_distributions.csv (modalités 1 et 2
  de og04_6, « ne sait pas » au dénominateur) : 90,7 % (2000), 88,7 % (2010), 87,7 % (2014), 81,0 % (2017), 79,2
  % (2018), 63,5 % (2025). Plausibilité (D38 b) : la DREES publie 88 % en 2014 (synthèse du baromètre 2014) et 81
  % en 2017 (synthèse 2017), et « entre huit et neuf Français sur dix » préoccupés par la pauvreté et le chômage
  en 2018 (synthèse 2018) ; recoupement D34 incomplet (deux valeurs chiffrées) : non_recoupe. Libellé de la question
  et des modalités (1 beaucoup, 2 assez, 3 peu, 4 pas du tout, 999999999 ne sait pas) lus dans les dictionnaires
  2025 du robot. Famille propre depuis la correction de l''audit M06 (J7).'
