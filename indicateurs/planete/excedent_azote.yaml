incontournable: non
recommandation: retenir
motif_recommandation: Mesure de la pression azotée agricole retenue par l'OCDE (How's Life 12_11), série Eurostat
  de 2000 à 2023 (40,0 kg/ha en 2000, 18,3 en 2023) avec une rupture en 2010 (drapeau b).
note_pertinence: 'L''excédent d''azote est la part des apports que les cultures n''absorbent pas et qui finit dans
  les eaux (nitrates) ou dans l''air (ammoniac, protoxyde d''azote) : c''est l''indicateur national le plus proche
  de la limite planétaire de l''azote. Il varie avec les rendements, donc avec la météo. La consommation d''engrais
  azotés minéraux forme l''autre fiche de la famille ; la série de l''OCDE et les termes du bilan sont en variantes.'
