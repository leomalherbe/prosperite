incontournable: non
socle_propose: non
recommandation: ecarter
motif_recommandation: 'Sens ambigu : une hausse du taux d''activité peut traduire un raccourcissement des études
  ou un recul de l''âge de la retraite autant qu''une meilleure insertion, alors que le taux d''emploi et le taux
  de chômage portent déjà l''accès à l''emploi.'
note_pertinence: 'Le taux d''activité additionne emploi et chômage : son mouvement ne dit pas si la situation des
  personnes s''améliore. Ses ventilations (seniors, femmes) restent disponibles en variantes pour la consultation.
  Les écarts femmes-hommes d''activité relèvent d''egalites.'
