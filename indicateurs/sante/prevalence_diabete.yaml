notes: 'Valeurs lues dans docs/sources/series/spf_odisse__diabete-prevalence-france.txt (vague 13 du robot, 16/10/2026
  ; jeu mis à jour le 01/04/2026), taux standardisé des hommes et femmes : 4,69 % (2010), 4,83 % (2012), 4,89 %
  (2014), 5,03 % (2016), 5,03 % (2018), 5,09 % (2020), 5,20 % (2022), 5,24 % (2023). Contrôle de plausibilité :
  les taux bruts du jeu (4,58 % en 2012, 5,29 % en 2020) arrondis valent les prévalences publiées par Santé publique
  France (4,6 % en 2012 et 5,3 % en 2020, page « Prévalence et incidence du diabète », lue le 16/10/2026). Population
  de référence de la standardisation et champ géographique (départements d''outre-mer, Mayotte) non lus : les métadonnées
  Odissé sont refusées à l''outil de lecture. Le diabète non traité pharmacologiquement n''est pas compté.'
