notes: 'Calcul du projet (D34) sur la sortie de la vague 9 du robot (docs/sources/series/interieur_elections__participation_par_departement.csv
  : inscrits, votants et exprimés sommés par scrutin et par département sur general_results.csv, aucun votant manquant),
  lue le 15/10/2026. Recoupement : 2010, archives du ministère « France entière » (43 642 325 inscrits, 20 219 958
  votants, 46,33 %) contre 43 643 115 et 20 219 768 dans le fichier ; 2015 et 2021, INSEE BDM 001777817 (49,9 %
  et 33,3 %), identique à l''arrondi. Régionales 2004 (audit M06 §3, cause trouvée lors des corrections) : 59,39
  % dans le fichier contre 60,84 % officiels ; par département, la Manche est absente, le Nord compte 2 705 106
  inscrits (1 740 894 aux européennes de juin 2004) pour 38,40 % de participation, la Guadeloupe 1 140 296 (289
  573) pour 13,86 %, La Réunion 55 009 (464 595), les Alpes-Maritimes 424 621 (677 404) et le Puy-de-Dôme 274 038
  (431 233) : des bureaux sont rattachés au mauvais département et 724 000 votants manquent. Aucun autre premier
  tour n''a, hors outre-mer, de département dont les inscrits s''écartent de plus de 8 % de ceux des scrutins nationaux
  voisins.'
