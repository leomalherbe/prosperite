id: ecart_temps_partiel_fh
libelle: Écart de taux d'emploi à temps partiel entre hommes et femmes (20-64 ans)
dimension: egalites
sous_theme: écarts femmes-hommes
famille: ecart_temps_partiel_fh
variante_principale: oui
definition: Différence, en points, entre le taux d'emploi à temps partiel des hommes et celui des femmes de 20 à
  64 ans (jeu Eurostat sdg_05_30, personnes en emploi à temps partiel) ; la valeur est négative parce que les femmes
  travaillent plus souvent à temps partiel.
unite: points de pourcentage (hommes moins femmes, négatif)
sens: haut
