motif_recommandation: >-
  Indicateur phare de la sécurité économique (Eurostat QoL ; SSF, OCDE), annuel 2004-2025 sans lacune (34,2 % en
  2004, 28,8 % en 2025), ruptures signalées en 2020 et 2022.
note_pertinence: >-
  C'est la mesure la plus directe de la capacité des ménages à encaisser un coup dur financier, au cœur de la définition
  de la dimension. Elle fait partie de la privation matérielle européenne et existe aussi à l'INSEE (SRCV, dépense
  d'environ 1 000 €), mais seulement depuis 2020 dans les catalogues. La réponse est une auto-évaluation de capacité,
  classée non déclarative par convention (journal M05 §2.4).
