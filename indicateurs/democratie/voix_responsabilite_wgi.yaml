definition: 'Indicateur composite « Voice and Accountability » des WGI : perception de la participation des citoyens
  au choix de leurs gouvernants et des libertés d''expression, d''association et des médias (libellé M04 : expression,
  association, élections libres), agrégée à partir de plus de trente sources d''experts et d''enquêtes ; estimation
  sur une échelle d''environ -2,5 à +2,5.'
