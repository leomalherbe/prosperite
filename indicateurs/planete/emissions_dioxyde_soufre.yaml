motif_recommandation: Pression atmosphérique soumise à un plafond d'émission européen, série Eurostat de 2000 à
  2024 (25 points), avec 70,2 kt de SO2 en 2025 selon le Citepa (extrait du robot M04).
note_pertinence: Le dioxyde de soufre est à l'origine des pluies acides ; ses émissions sont désormais faibles,
  ce qui appellera des bornes resserrées. Les drapeaux d'Eurostat n'ont pas été relus. Le Citepa (1990-2025) et
  les comptes d'émissions sont en variantes.
