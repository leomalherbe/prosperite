hors_longlist: non
raccordement: 'non : série Eurostat depuis 2002 ; INSEE (enquête TIC, 2009-2025) en variante'
incontournable: non
recommandation: retenir
motif_recommandation: Variante principale de la famille acces_internet_domicile (accès au numérique, A7 ; OCDE How's
  Life 3_4), série Eurostat de 2002 à 2025 (22 points), plus longue que la série INSEE de même enquête (2009-2025,
  D35).
note_pertinence: L'accès à internet chez soi conditionne désormais l'accès à l'emploi, aux services publics et aux
  liens sociaux. La part approche la saturation (88,11 % des ménages en 2021 selon l'OCDE, extrait du robot M04),
  ce qui déplace l'enjeu vers la qualité de la connexion et l'usage. Les valeurs Eurostat n'ont pas pu être relues
  (API refusée par le proxy, HTTP 429, le 15/10/2026).
