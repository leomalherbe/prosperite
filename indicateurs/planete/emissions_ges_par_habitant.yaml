id: emissions_ges_par_habitant
libelle: Émissions de gaz à effet de serre par habitant (hors UTCATF)
dimension: planete
sous_theme: 'climat : émissions du territoire'
famille: emissions_ges_territoire
variante_principale: non
definition: Émissions nationales de gaz à effet de serre hors UTCATF et hors éléments pour mémoire (inventaire transmis
  à la CCNUCC et à l'Union européenne), rapportées à la population, en tonnes équivalent CO2 par personne.
unite: tonnes équivalent CO2 par habitant
sens: bas
type: pression
declaratif: non
composite: non
source_organisme: Eurostat
source_jeu: sdg_13_10 (émissions nationales nettes de gaz à effet de serre, indicateur ODD de l'UE)
