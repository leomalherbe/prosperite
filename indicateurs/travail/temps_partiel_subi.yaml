raccordement: 'a_etudier : rupture de 2021 (36,9 % en 2020, 27,2 % en 2021) liée à la rénovation de l''enquête ;
  saut non signalé de 2013 (33,5 % en 2012, 38,7 % en 2013)'
incontournable: non
socle_propose: non
recommandation: retenir_variante
motif_recommandation: Indicateur du cadre Qualité de vie d'Eurostat rapporté à l'ensemble des personnes à temps
  partiel, série 2000-2025 (26 points) mais rompue en 2021, alors que le taux de sous-emploi de l'INSEE est rétropolé.
note_pertinence: 'L''indicateur se lit autrement que le taux de sous-emploi : il dit quelle part du temps partiel
  est subie, pas quelle part de l''emploi, et couvre salariés et non-salariés (le jeu n''a pas de dimension de statut).
  Les valeurs vont de 26,7 % (2000) à 42,7 % (2016) puis 20,3 % (2025) ; la chute de 2021 (36,9 % à 27,2 %) est
  une rupture, et le saut de 2013 (33,5 % à 38,7 %), contemporain du nouveau questionnaire, n''est pas marqué (collecte
  ciblée du robot, 15/10/2026). Il ne peut servir de trajectoire longue qu''après raccordement.'
