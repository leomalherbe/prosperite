motif_recommandation: 'Les violences sexuelles enregistrées sont multipliées par 4 entre 2010 et 2024 (35,5 à 140,8
  pour 100 000 habitants, accélération depuis 2018) alors que la part de victimes déclarées dans l''enquête reste
  entre 0,4 et 0,8 % : la série mesure la révélation des faits, pas leur fréquence.'
note_pertinence: La hausse des violences sexuelles enregistrées traduit d'abord une plus grande propension à porter
  plainte et une meilleure prise en charge des victimes ; l'utiliser comme indicateur de sécurité conduirait à lire
  un progrès de la parole comme une dégradation. Elle peut être montrée à titre d'information, à côté de l'enquête,
  mais pas notée.
