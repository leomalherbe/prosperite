motif_recommandation: Niveau d'études de la population adulte (cadre SSF), annuel de 2000 à 2025 (37,8 % en 2000,
  15,3 % en 2025), mesure la plus longue et la plus récente du stock de diplômes des adultes.
note_pertinence: L'indicateur décrit le capital scolaire de toute la population d'âge actif, qui évolue lentement
  par le renouvellement des générations. Les ruptures signalées par Eurostat (2003, 2013, 2014, 2021, 2024) n'interrompent
  pas la baisse, mais l'accélèrent en 2013 et 2014 (27,6 % en 2012, 25,0 % en 2013, 23,3 % en 2014, contre environ
  −0,9 point par an auparavant). L'INSEE publie une mesure voisine dans les séries longues de l'enquête Emploi (sans
  diplôme, CEP ou brevet, 1982-2025) mais par tranches d'âge (15-24, 25-49, 50-64, 65-89 ans) sans total des 25-64
  ans, d'où le choix d'Eurostat.
