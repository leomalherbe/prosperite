motif_recommandation: Variante principale de la famille V-Dem (D18), proposée par la table des cadres comme version
  continue de l'indicateur de régime du Doughnut, annuelle sans lacune de 2000 à 2025 (26 points, 0,80 en 2025).
note_pertinence: L'indice de démocratie libérale est une mesure composite de référence de la qualité démocratique
  ; le Doughnut classe les régimes avec des données de V-Dem (à vérifier d'après la table des cadres). Il agrège
  de nombreux sous-indices listés en variantes, ce qui pose un risque de double compte avec les autres composites
  de la dimension (D18).
