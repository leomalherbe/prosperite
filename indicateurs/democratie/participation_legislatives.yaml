motif_recommandation: Scrutin national qui désigne l'Assemblée nationale, 6 scrutins de 2002 à 2024 sur un champ
  homogène (de 48,38 % en 2022 à 67,87 % en 2024), recoupés avec les 4 valeurs publiées par l'INSEE depuis 2012
  (D34).
note_pertinence: 'Les législatives mesurent l''intérêt pour l''élection du Parlement, en net recul de 2002 (64,53
  %) à 2022 (48,38 %) avant le rebond de 2024 (67,87 %), après la dissolution. Elles complètent la présidentielle,
  dont elles suivent le calendrier depuis 2002 (sauf en 2024) : l''utilisateur choisira l''une ou l''autre, ou les
  deux avec prudence. Le champ exclut les onze circonscriptions des Français de l''étranger, créées en 2012, ce
  qui supprime la rupture de champ relevée par l''audit.'
