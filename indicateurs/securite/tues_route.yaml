recommandation: retenir
motif_recommandation: >-
  Indicateur des cadres OCDE (10_3), ODD 3.6 et objectif UE 2030 (diviser par deux tués et blessés graves), taux
  pour 100 000 habitants 2000-2024 sans lacune (13,3 en 2000, 4,6 en 2024).
note_pertinence: >-
  La sécurité routière est rattachée à la dimension par l'arbitrage A6 du gel 1. Le taux de tués a été divisé par
  près de trois depuis 2000, surtout entre 2002 et 2006 (de 12,4 à 7,4), puis stagne autour de 5 depuis 2013. Le
  champ est à vérifier : rapporter les 3 193 tués de métropole de 2024 (INSEE) au taux de 4,6 pour 100 000 donne
  une population d'environ 69 millions, celle de la France entière et non de la métropole (calcul de l'agent). Les
  objectifs officiels (ODD 3.6, UE 2030) fournissent des bornes.
