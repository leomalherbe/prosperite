motif_recommandation: Statistique la plus répandue dans les comparaisons internationales, publiée par l'INSEE de
  1996 à 2024 (25 points depuis 2000), proposée comme alternative au S80/S20 dans la même famille.
note_pertinence: Le Gini résume toute la distribution, mais il est peu sensible aux extrémités et difficile à expliquer
  au public. La version EU-SILC (ilc_di12) passe de 29,2 en 2014 à 30,4 en 2025 (sur 100), avec ruptures en 2020
  et 2022. À utiliser à la place du S80/S20, pas en plus.
