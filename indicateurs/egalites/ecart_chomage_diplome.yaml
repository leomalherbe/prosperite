variante_principale: oui
definition: Écart, en valeur absolue et en points, entre le taux de chômage des 15-74 ans dont le diplôme le plus
  élevé est au plus le premier cycle du secondaire (CITE 0-2) et celui des diplômés du supérieur (CITE 5-8) (enquête
  Forces de travail, jeu Eurostat lfsa_urgaed).
