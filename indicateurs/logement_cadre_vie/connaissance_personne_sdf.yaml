notes: 'Couverture lue dans docs/sources/series/drees__barometre_2000_2025_couverture.csv (sdproxim_3 : 2000-2002
  et 2004-2025, 25 années). Modalités lues dans le dictionnaire 2025 du robot : 1 « non » ; 2 « oui, dans votre
  famille » ; 3 « oui, hors famille » ; 4 « oui, vous-même » ; 5 à 8 combinaisons des précédentes ; NSP. La distribution
  n''est pas calculée par le robot (absente de drees__barometre_2000_2025_distributions.csv) : maintenance LOG-1
  ; les modalités « vous-même » ont pu apparaître en cours de série, à vérifier sur les dictionnaires anciens avant
  calcul. Les autres questions SDPROXIM (chômage, familles monoparentales sous le SMIC, emploi précaire, RSA, handicap,
  dépendance) relèvent d''autres dimensions et ne sont pas reprises.'
