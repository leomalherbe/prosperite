variante_principale: oui
definition: Produit intérieur brut rapporté à la population, aux prix de l'année précédente chaînés (euros de l'année
  de référence 2020 par habitant ; comptes nationaux annuels de l'INSEE, base 2020).
unite: euros de 2020 par habitant
sens: haut
