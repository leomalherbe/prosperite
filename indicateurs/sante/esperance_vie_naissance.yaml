notes: 'Valeurs lues sur l''API Eurostat le 14/10/2026 (demo_mlexpec, sex=T, age=Y_LT1, geo=FR) : la série France
  commence en 1998. Rupture de 2014 : les séries BDM de l''INSEE sont intitulées « France (inclus Mayotte à partir
  de 2014) » (001686956, 001641594 ; audit M06), ce qui appuie l''explication par l''entrée de Mayotte dans le champ
  ; la cause de la rupture de 2012 n''est pas documentée.'
