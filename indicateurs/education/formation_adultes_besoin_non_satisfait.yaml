id: formation_adultes_besoin_non_satisfait
libelle: Adultes de 25 à 64 ans qui auraient voulu se former sans l'avoir fait
dimension: education
sous_theme: formation des adultes
famille: formation_adultes_besoin_non_satisfait
variante_principale: oui
definition: Part des personnes de 25 à 64 ans qui n'ont participé à aucune éducation ou formation au cours des douze
  derniers mois mais auraient souhaité le faire, d'après l'enquête européenne sur l'éducation des adultes (Eurostat
  trng_aes_175).
