- code_empsta_melodi_inexact
notes: 'Contrôle TRA-3 (robot, 15/10/2026, melodi_travail_neet.csv et melodi_travail_controles.csv) : la mesure
  PT_SEX_AGE_IN_NEET est un taux (total compris entre les femmes, 13,2 %, et les hommes, 12,7 %, en 2025), égal
  à la moyenne annuelle de la série BDM 011818639 à 0,1 point près sur 2003-2025 et au recalcul nombre / population
  des 15-29 ans ; le nombre de NEET (1 528 milliers en 2025) est celui d''Eurostat lfsi_neet_a, qui compte les chômeurs.
  Le code EMPSTA=3 (« Inactif ») porté par toutes les lignes NEET de Melodi est donc un artefact de codage (audit
  M06 §3), sans effet sur le champ. Variantes : BDM 011818639 (trimestrielle, 2003-2026), Eurostat lfsi_neet_a et
  sdg_08_20 (indicateur ODD, 15-29 ans, 2003-2025, mêmes valeurs ; ligne de la long-list education, audit O3) ;
