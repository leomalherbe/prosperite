notes: 'Valeurs lues sur la table ODD sdg_06_10 (même indicateur, ensemble, mise à jour Eurostat du 13/08/2026 ;
  l''API de ilc_mdho05 a été refusée par le proxy le 15/10/2026, HTTP 429) : 0,6 (2004), 0,3 (2010 à 2016), 0,2
  (2019), 0,4 (2020, b), 0,7 (2023) ; sous le seuil de pauvreté : 2,0 (2004), 0,3 (2020, b), 1,1 (2023). Depuis
  le règlement-cadre de 2021, l''item relève du module triennal « conditions de travail et de logement » d''EU-SILC
  (vagues 2023 et 2026 d''après la page des modules d''Eurostat lue le 15/10/2026) : valeurs annuelles de 2004 à
  2020, puis 2023, d''où la fréquence irrégulière (report de la dernière valeur, D17). Variantes : table ODD sdg_06_10
  ; composantes ni baignoire ni douche (ilc_mdho02) et pas de toilettes intérieures (ilc_mdho03), enfants, handicap
  ; ventilations. Valeurs confirmées sur le jeu primaire ilc_mdho05 par l''audit M06 (16/10/2026).'
