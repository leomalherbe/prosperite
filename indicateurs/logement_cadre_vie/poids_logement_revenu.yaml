note_pertinence: L'indicateur mesure le poids moyen du logement dans le revenu de l'ensemble des ménages, y compris
  la valeur du service de logement que se rendent les propriétaires occupants (loyers imputés). Sa longueur situe
  la période depuis 2000 dans une tendance longue ; il ne dit rien de la répartition de la charge entre ménages.
  Les valeurs n'ont pas été relues (API Melodi non interrogée).
