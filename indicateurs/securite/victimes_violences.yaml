definition: >-
  Part des personnes de 18 à 75 ans résidant en France métropolitaine qui déclarent avoir subi au moins une violence
  physique ou sexuelle dans l'année, qu'elles aient porté plainte ou non (enquêtes de victimation Cadre de vie et
  sécurité, puis Vécu et ressenti en matière de sécurité). Indicateur national ODD 16.i2.
