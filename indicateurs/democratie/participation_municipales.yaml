notes: 'Calcul du projet (D34) sur la sortie de la vague 9 du robot (docs/sources/series/interieur_elections__participation_par_departement.csv
  : inscrits, votants et exprimés sommés par scrutin et par département sur general_results.csv, aucun votant manquant),
  lue le 15/10/2026. Recoupement : sur tous les bureaux du fichier (communes des collectivités d''outre-mer comprises),
  63,55 % (2014), 44,66 % (2020) et 57,12 % (2026), soit les taux nationaux publiés (63,55 % et 44,66 %, repris
  par LCP en 2026 ; 57,1 % au communiqué du ministère de 2026) ; le champ métropole et DROM retire moins de 0,1
  point. L''INSEE (BDM 001785274) publie 44,6 % en 2020, comme le calcul, mais 63,4 % en 2014 contre 63,52 % (écart
  non expliqué). Le champ du fichier en 2008 (communes de plus de 3 500 habitants ; scrutin de 2001 absent) est
  lu dans la description du jeu data.gouv.fr par l''audit M06 ; le taux 2008 pour l''ensemble des communes est de
  66,5 % (ministère, cité par Maire-info le 11/03/2008).'
