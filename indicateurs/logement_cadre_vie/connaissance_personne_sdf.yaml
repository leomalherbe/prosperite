motif_recommandation: Seule série annuelle approchant le sans-abrisme (D42), question posée 25 années de 2000 à
  2025, part calculée sur les microdonnées du baromètre DREES entre 8,9 % (2021) et 16,0 % (2008), 9,3 % en 2025,
  non recoupée faute de valeur publiée mais contrôlée en plausibilité (D38 b).
note_pertinence: 'Aucune statistique publique annuelle du nombre de personnes sans domicile n''est cataloguée :
  l''enquête Sans-domicile de l''INSEE est ponctuelle (2001 et 2012) et les estimations associatives sont publiées
  en PDF (exclues, D09). La question mesure la présence du sans-abrisme dans l''entourage des personnes interrogées,
  d''où le sens « bas » (plus de personnes concernées, situation dégradée), mais la part dépend aussi de la taille
  des réseaux, de la visibilité du phénomène et de l''engagement associatif des répondants. Elle ne reproduit pas
  la hausse de près de 50 % du nombre de sans-domicile mesurée par l''INSEE entre 2001 et 2012 (12,7 % puis 11,9
  % ici), ce qui confirme son caractère indirect : Léo tranche au gel 2 (D42).'
