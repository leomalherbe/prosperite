notes: 'Métadonnées Eurostat lues le 14/10/2026 : tour_dem_esms (« Participation in tourism: All residents aged
  15 or over ») et fiche nationale tour_dem_esmsdm_fr (enquête Suivi de la demande touristique, gérée par l''INSEE
  depuis 2020, auparavant par la DGE ; « break in series in 2020 » ; niveaux relevés par rapport aux publications
  de la DGE ; coefficient d''extrapolation recalculé depuis 2018 ; questionnaire révisé en 2023 et 2024 ; « not
  a random sample. It is a client panel » ; lieu de résidence : France métropolitaine, d''où geo FM pour une série
  codée FR). Valeurs de l''API (14/10/2026) : aucun drapeau, dernière mise à jour le 09/10/2026. Jeu tour_dem_totot
  au catalogue des jeux avec candidat = non (« domaine hors périmètre (tourisme) ») : réintégration demandée (liste
  de maintenance, n° 33). Variante INSEE DS_SUIVI_DDE_TOUR (taux de départ en voyage pour motif personnel, annuel
  2022-2025) : seuil de durée non précisé dans le catalogue.'
