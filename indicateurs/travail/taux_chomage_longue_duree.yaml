id: taux_chomage_longue_duree
libelle: Taux de chômage de longue durée
dimension: travail
sous_theme: chômage
famille: chomage_longue_duree
variante_principale: oui
definition: Part des chômeurs au sens du BIT depuis un an ou plus parmi les actifs de 15 ans ou plus, en moyenne
  annuelle ; calculée sur les séries longues rétropolées de l'enquête Emploi (nombre de chômeurs de longue durée
  divisé par la population active).
unite: '% de la population active de 15 ans ou plus'
sens: bas
type: resultat
declaratif: non
composite: non
source_organisme: INSEE
source_jeu: Melodi DD_EEC_SERIES (enquête Emploi, séries longues), mesures UNEMP (UNEMPDUR=LT) et ACTPOP
source_serie_id: 'DD_EEC_SERIES : UNEMP (UNEMPDUR=LT, AGE=_T) / ACTPOP (AGE=_T) x 100'
composantes:
- DD_EEC_SERIES?AGE=_T&COMPOHALO=_T&EDUC=_T&EEC_MEASURE=UNEMP&EMPFORM=_T&EMPSTA=2&PCS=_T&SEX=_T&UNDEREMP=_T&UNEMPDUR=LT&UNIT_MEASURE=PS&WKTIME=_T
- DD_EEC_SERIES?AGE=_T&COMPOHALO=_T&EDUC=_T&EEC_MEASURE=ACTPOP&EMPFORM=_T&EMPSTA=1T2&PCS=_T&SEX=_T&UNDEREMP=_T&UNEMPDUR=_T&UNIT_MEASURE=PS&WKTIME=_T
formule: chômeurs depuis un an ou plus / population active x 100
source_niveau: 1
url_api: https://api.insee.fr/melodi/data/DD_EEC_SERIES?AGE=_T&COMPOHALO=_T&EDUC=_T&EEC_MEASURE=UNEMP&EMPFORM=_T&EMPSTA=2&PCS=_T&SEX=_T&UNDEREMP=_T&UNEMPDUR=LT&UNIT_MEASURE=PS&WKTIME=_T
url_page: https://www.insee.fr/fr/statistiques/8977323
frequence: annuelle
premiere_annee: 1975
derniere_annee: 2025
nb_points_depuis_2000: 26
geo: FE
eligibilite_longlist: oui
ligne_id: melodi-003790 ; melodi-003610
hors_longlist: non
raccordement: non
incontournable: non
recommandation: retenir
motif_recommandation: Indicateur des cadres OCDE et Qualité de vie d'Eurostat, calculable sur deux séries annuelles
  rétropolées de l'INSEE de 1975 à 2025, alors que la série européenne une_ltu_a porte le drapeau « définition différente
  » de 2021 à 2025.
note_pertinence: Le chômage de longue durée mesure l'enfermement dans le chômage, plus grave pour les personnes
  que le chômage frictionnel. Au catalogue, l'INSEE ne publie ce taux qu'en série trimestrielle (BDM 011818581,
  2003-2026) ; le calcul sur les séries longues donne une série annuelle homogène depuis 1975. La série Eurostat
  (une_ltu_a) va de 2,3 % en 2003 à 1,8 % en 2025, avec le drapeau « d » de 2021 à 2025 (API, 14/10/2026).
