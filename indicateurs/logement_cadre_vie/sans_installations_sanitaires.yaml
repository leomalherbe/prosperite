derogation_socle: 'Limite de 8 fiches du socle proposé atteinte (D41) avec une principale par sous-thème ; choix
  du correcteur (docs/cr/M05_logement_cadre_vie_corrections_journal.md §3, question 1 à la session mère) : niveau
  quasi nul (0,7 % en 2023).'
recommandation: retenir
motif_recommandation: Proxy national de l'assainissement non sûr du Doughnut et indicateur d'équipements de base
  du Better Life Index, 18 valeurs de 2004 à 2023 (annuelles jusqu'en 2020, module triennal ensuite, D17).
note_pertinence: 'Le manque d''équipements sanitaires de base est devenu rare en France (le crosswalk M03 le juge
  peu discriminant) mais subsiste dans des logements très dégradés. La part passe de 0,6 % en 2004 à 0,2 % en 2019,
  puis 0,4 % en 2020 (rupture b) et 0,7 % en 2023 (table ODD sdg_06_10 de même définition, API Eurostat lue le 15/10/2026).
  Une série quasi constante n''est pas un motif d''écart (D34) : la fiche couvre l''assainissement des cadres de
  référence du point de vue des ménages.'
