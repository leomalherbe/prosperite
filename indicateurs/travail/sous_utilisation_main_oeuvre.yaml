motif_recommandation: Mesure synthétique de la sous-utilisation du travail retenue par l'OCDE (13_2), série INSEE
  trimestrielle de 2003 à 2026 sans équivalent annuel de même définition ; elle additionne chômage, halo et sous-emploi
  et ne se cumule pas au socle avec taux_chomage, halo_chomage et taux_sous_emploi (familles imbriquées).
note_pertinence: 'L''indicateur additionne chômage, halo et sous-emploi : il résume en un chiffre l''écart entre
  le travail souhaité et le travail obtenu. Il recoupe les fiches taux_chomage, halo_chomage et taux_sous_emploi
  : à surveiller au contrôle de redondance (ensemble ou composantes). Les variantes européennes (capacités excédentaires,
  de 20,0 % en 2014 à 15,0 % en 2025) et de l''OCDE (2007-2025) ont des définitions voisines.'
