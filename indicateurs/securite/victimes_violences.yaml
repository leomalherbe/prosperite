recommandation: retenir
motif_recommandation: >-
  Mesure de référence de la victimation (enquête, indépendante du dépôt de plainte), indicateur ODD 16.i2 publié
  par l'INSEE pour 2010-2023 ; rupture entre l'enquête CVS (2,2 à 2,7 % en 2010-2018) et l'enquête VRS (1,4 à 1,7
  % en 2021-2023).
note_pertinence: >-
  L'enquête de victimation mesure les violences subies qu'elles aient ou non donné lieu à une plainte : c'est la
  mesure à privilégier pour juger de l'évolution des violences, une hausse des plaintes n'étant pas une hausse des
  violences. La série change d'enquête entre 2018 et 2021, sans valeur pour 2019-2020 : la baisse apparente ne doit
  pas être lue comme une amélioration tant qu'aucune rétropolation n'est publiée. Le champ est limité à la métropole
  et aux 18-75 ans.
