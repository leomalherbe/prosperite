recommandation: retenir
motif_recommandation: Indicateur national ODD de report modal publié chaque année de 2010 à 2024 (15 points), seule
  mesure de la structure du transport de marchandises au catalogue.
note_pertinence: Le report du fret de la route vers le rail et le fleuve réduit les émissions et la consommation
  d'énergie des transports. Les parts du ferroviaire et du fluvial, complémentaires à 100 %, sont en variantes,
  avec la répartition modale d'Eurostat (2005-2024, y compris aérien, maritime et oléoducs) et l'intensité du fret
  rapportée au PIB, reçues de logement_cadre_vie et de niveau_de_vie (D38 a, D39).
