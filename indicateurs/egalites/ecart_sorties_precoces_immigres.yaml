motif_recommandation: Écart absolu (D34) construit sur une série annuelle de 2006 à 2025 pour les jeunes nés hors
  de l'UE (21,4 % en 2006, 12,7 % en 2025, lu sur l'API), qui mesure la réussite scolaire selon l'origine (A8).
note_pertinence: Le taux de sortie précoce des jeunes nés hors de l'UE a beaucoup baissé, avec des ruptures en 2013,
  2014, 2021 et 2024 (drapeaux b) qui imposent la prudence. Le catalogue indique 2004 comme première année pour
  le paquet de modalités, mais la modalité « nés hors UE » ne commence qu'en 2006.
