definition: Part des personnes de 16 ans ou plus déclarant un besoin d'examen ou de traitement médical non satisfait
  pour des raisons de coût, de distance ou d'attente dans le quintile de revenu le plus bas moins la même part dans
  le quintile le plus élevé, en points (EU-SILC, jeu hlth_silc_08).
