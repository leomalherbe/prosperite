id: demandeurs_emploi
libelle: Demandeurs d'emploi inscrits en catégorie A
dimension: travail
sous_theme: chômage
famille: taux_chomage
variante_principale: non
definition: Nombre de demandeurs d'emploi inscrits à France Travail (ex-Pôle emploi) en catégorie A (sans emploi
  et tenus de rechercher un emploi), France hors Mayotte, série trimestrielle corrigée des variations saisonnières
  et des jours ouvrables (France Travail et DARES, diffusion BDM de l'INSEE).
unite: nombre de personnes
sens: bas
type: resultat
declaratif: non
composite: non
source_organisme: France Travail et DARES (via INSEE BDM)
source_jeu: BDM, demandeurs d'emploi inscrits (catégories A, B, C)
source_serie_id: '010597456'
source_niveau: 1
url_api: https://bdm.insee.fr/series/sdmx/data/SERIES_BDM/010597456
url_page: https://www.insee.fr/fr/statistiques/serie/010597456
frequence: trimestrielle
premiere_annee: 1996
derniere_annee: 2026
geo: FR-D976
eligibilite_longlist: oui
ligne_id: bdm-000458
hors_longlist: non
raccordement: non
incontournable: non
recommandation: ecarter
motif_recommandation: 'Série administrative en nombre, sensible aux règles d''inscription et de radiation, dominée
  par le taux de chômage au sens du BIT de l''enquête Emploi (méthode : enquête plutôt que série enregistrée).'
note_pertinence: Le nombre de demandeurs d'emploi est très commenté, mais il dépend des règles d'inscription et
  de radiation, qui changent avec les réformes, et il n'est pas rapporté à la population. Le taux de chômage au
  sens du BIT mesure le même phénomène avec une définition stable.
