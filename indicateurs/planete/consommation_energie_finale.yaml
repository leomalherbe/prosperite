id: consommation_energie_finale
libelle: Consommation finale d'énergie
dimension: planete
sous_theme: énergie
famille: consommation_energie_finale
variante_principale: oui
definition: Énergie consommée par les utilisateurs finals (ménages, industrie, transports, tertiaire, agriculture),
  hors usages non énergétiques et hors branche énergie, selon la définition de la directive européenne relative
  à l'efficacité énergétique (Eurostat, FEC_EED).
unite: millions de tonnes équivalent pétrole
sens: bas
type: pression
declaratif: non
composite: non
source_organisme: Eurostat
source_jeu: nrg_ind_eff (consommation d'énergie primaire et finale)
source_serie_id: nrg_ind_eff?freq=A&nrg_bal=FEC_EED&unit=MTOE&geo=FR
source_niveau: 1
url_api: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/nrg_ind_eff?freq=A&nrg_bal=FEC_EED&unit=MTOE&geo=FR
url_page: https://ec.europa.eu/eurostat/databrowser/view/nrg_ind_eff/default/table?lang=fr
frequence: annuelle
premiere_annee: 2005
derniere_annee: 2024
nb_points_depuis_2000: 20
geo: FR
eligibilite_longlist: oui
ligne_id: estat-041960
hors_longlist: non
raccordement: 'non : série continue depuis 2005'
incontournable: non
socle_propose: non
recommandation: retenir
motif_recommandation: Grandeur visée par l'objectif de baisse de l'article L100-4 du code de l'énergie (base 2012)
  et par la directive relative à l'efficacité énergétique, série Eurostat sans drapeau de 2005 à 2024 (150,92 Mtep
  en 2012, 130,72 Mtep en 2024).
note_pertinence: La consommation finale mesure l'énergie effectivement utilisée par l'économie et les ménages, quelle
  que soit sa production. Eurostat est retenu parce que la série INSEE (ODD 7.i2a, en TWh) ne commence qu'en 2011
  ; elle est en variante avec ses ventilations par secteur, la consommation par habitant et celle des ménages. Les
  objectifs de l'article L100-4 sont à vérifier avant le socle des bornes (question Q-F).
