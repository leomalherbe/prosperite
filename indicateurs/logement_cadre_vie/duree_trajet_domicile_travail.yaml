notes: 'Valeurs lues (fichier ITDD France entière, DiDo 305ea0e3, lu le 16/10/2026 ; LIBELLE_SOUS_CHAMP « actifs
  » pour act et « navetteurs » pour nav) : durée médiane 12, 12 et 13 minutes (actifs) et 18, 19 et 19 minutes (navetteurs)
  ; distance médiane 7,5, 7,9 et 8,4 km (actifs) et 14,2, 14,6 et 14,9 km (navetteurs), en 2011, 2016 et 2022 ;
  aucune autre année. Le même fichier donne les parts modales des déplacements domicile-travail (2016, 2022), reprises
  en variante de part_modale_transports_collectifs. Aucune série annuelle du temps de trajet n''est cataloguée (enquêtes
  Mobilité des personnes du SDES ponctuelles, d''après le relevé M03).'
