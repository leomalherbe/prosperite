incontournable: non
recommandation: retenir
motif_recommandation: Mesure de l'offre de soins de premier recours admise comme moyen (D19), annuelle de 2012 à
  2025 (155 pour 100 000 en 2012, 146 en 2025) et en baisse continue.
note_pertinence: La densité de généralistes mesure l'offre de premier recours dont dépend l'accès aux soins courants
  ; elle recule de 155 à 146 pour 100 000 habitants entre 2012 et 2025. C'est une moyenne nationale qui ignore les
  écarts territoriaux (déserts médicaux), mieux mesurés par l'accessibilité potentielle localisée de la DREES, non
  cataloguée. L'ensemble des médecins, les spécialistes et les séries Eurostat et OCDE sont en variantes.
