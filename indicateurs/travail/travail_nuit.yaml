hors_longlist: non
raccordement: 'a_etudier : chute non signalée de 2013 (7,1 % en 2012, 3,7 % en 2013) et rupture de 2003'
incontournable: non
recommandation: retenir
motif_recommandation: Horaire atypique le plus lié à la santé, maintenu dans la dimension par D27, série Eurostat
  2000-2025 (24 points), à condition de traiter la chute de 2013.
note_pertinence: 'Le travail de nuit est associé à des risques pour la santé, distincts de ceux du travail en fin
  de semaine : il forme sa propre famille. La série tombe de 7,1 % en 2012 à 3,7 % en 2013 sans drapeau, ce qui
  coïncide avec le changement de questionnaire de l''enquête Emploi de 2013 ; elle remonte à 3,9 % en 2025 (API
  Eurostat, 14/10/2026).'
