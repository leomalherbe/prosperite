motif_recommandation: Indicateur phare du socle européen des droits sociaux (tableau tepsr_sp210), annuel de 2005
  à 2025 (21 points ; 32,0 % en 2005, 59,7 % en 2025), somme recoupée avec les valeurs publiées par Eurostat.
note_pertinence: L'accès des jeunes enfants à un accueil formel favorise leur développement et l'emploi des parents.
  La part a presque doublé en vingt ans, portée par l'accueil de 30 heures ou plus (16,0 % en 2005, 43,6 % en 2025)
  ; le saut de 2007 à 2008 (27,3 % puis 39,6 %), sans drapeau, et les ruptures de 2020 et 2022 sont à documenter.
  Eurostat publie directement le total dans le tableau tepsr_sp210, absent du catalogue de séries, en variante.
