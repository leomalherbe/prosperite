id: privation_materielle_sociale_severe
libelle: Taux de privation matérielle et sociale sévère
dimension: niveau_de_vie
sous_theme: privations
famille: privation_materielle_sociale
variante_principale: non
definition: Part des personnes qui déclarent au moins 7 privations parmi les 13 éléments de la privation matérielle
  et sociale (EU-SILC).
unite: '% de la population'
sens: bas
type: resultat
declaratif: non
composite: non
source_organisme: Eurostat
source_jeu: ilc_mdsd11 (taux de privation matérielle et sociale sévère par âge et sexe ; doublon ODD sdg_01_31)
