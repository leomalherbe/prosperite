motif_recommandation: >-
  Seule mesure de l'épargne de précaution, indicateur OCDE 1_6 (35,9 % en 2020), mais 4 valeurs seulement (2009,
  2014, 2017, 2020) : report de la dernière valeur (D17).
note_pertinence: >-
  Disposer d'une réserve couvrant trois mois au seuil de pauvreté est la définition opérationnelle de l'épargne
  de précaution citée par la dimension et par les cadres SSF et OCDE. La série suit les vagues de l'enquête Patrimoine
  (environ tous les trois ans) : elle bouge peu et reste à jour avec retard. Les statistiques expérimentales d'Eurostat
  (double risque de pauvreté) ont été écartées.
