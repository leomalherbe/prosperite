rattachement_propose: ligne de la long-list niveau_de_vie (étiquette v0 « niveau_de_vie » du jeu INSEE) ; rattachement
  proposé à egalites (indicateur de dispersion, R3), à trancher au gel 2
raccordement: 'non : série rétropolée par l''INSEE depuis 1996, sans rupture'
incontournable: oui
socle_propose: oui
recommandation: retenir
motif_recommandation: Concept présent dans les cinq cadres de référence (inégalité de revenu) et indicateur de richesse
  nationale n° 6, publié sans rupture de 1996 à 2024 (25 points depuis 2000) dans la version rétropolée de l'INSEE,
  plus récente d'un an que la série ODD de la BDM.
note_pertinence: 'C''est l''indicateur d''inégalité le plus lisible : en 2024, les 20 % les plus aisés détiennent
  4,62 fois la masse de niveau de vie des 20 % les plus modestes (note de lecture du jeu Melodi). La série rétropolée
  neutralise les ruptures de 2010, 2012 et 2020 de l''enquête ERFS. Les autres statistiques de la famille (Gini,
  Palma, D9/D1, part des 40 % les plus modestes) mesurent la même chose sous d''autres angles : en choisir une seule
  évite le double compte.'
