motif_recommandation: Mesure d'ensemble des horaires atypiques maintenus dans la dimension par D27 et cités par
  le cadre Qualité de vie, série Eurostat 2011-2025 (13 points, enquête bisannuelle depuis 2021).
note_pertinence: 'Travailler le soir, la nuit ou en fin de semaine désorganise la vie familiale et sociale et pèse
  sur la santé. Les valeurs vont de 37,9 % (2011) à 34,2 % (2025), sans valeur en 2022 ni 2024 (API Eurostat, 14/10/2026).
  La liste exacte des horaires comptés n''est pas donnée par l''API : à lire dans les métadonnées.'
