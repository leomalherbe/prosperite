motif_recommandation: Confiance dans une institution régalienne retenue par l'INSEE pour l'ODD 16.i4, série annuelle
  de 2013 à 2024 (12 points, de 72 % à 83 %).
note_pertinence: L'armée est, avec l'hôpital, l'institution qui inspire le plus confiance (de 72 % à 83 %). Sa place
  dans une dimension consacrée à la vie démocratique est discutable, mais l'INSEE la retient parmi les fonctions
  régaliennes de l'État et la confiance dans les institutions relève de cette dimension (A11).
