rattachement_propose: ligne de la long-list travail (ventilation par pays de naissance) ; l'écart construit relève
  d'egalites (écarts selon l'origine, A8, R3) ; à trancher au gel 2
raccordement: non
incontournable: non
recommandation: retenir
motif_recommandation: Écart construit sur une série annuelle de 2000 à 2025, de signe constant (19,7 % contre 9,4
  % en 2000, 13,1 % contre 7,0 % en 2025), seule mesure longue des écarts d'insertion selon l'origine (A8).
note_pertinence: L'écart de chômage selon le pays de naissance reflète à la fois des différences de qualification
  et des discriminations à l'embauche ; il ne les distingue pas. Le taux de chômage, rapporté aux actifs, est moins
  sensible à la structure par âge que le taux d'emploi, publié au catalogue seulement pour les 15 ans ou plus. Ruptures
  en 2003, 2005, 2006, 2014, 2021 et 2024 (drapeaux b).
