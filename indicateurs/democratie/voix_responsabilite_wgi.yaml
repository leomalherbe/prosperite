definition: 'Indicateur composite « Voice and Accountability » des WGI : perception de la participation des citoyens
  au choix de leurs gouvernants et des libertés d''expression, d''association et des médias (libellé M04 : expression,
  association, élections libres), agrégée à partir de sources d''experts et d''enquêtes ; score de gouvernance de
  0 à 100, avec intervalles de confiance à 90 %, produit « pour faciliter les comparaisons entre pays et dans le
  temps » (documentation WGI lue le 15/10/2026), l''estimation d''origine suivant une loi normale de moyenne proche
  de zéro (de -2,5 à 2,5 environ).'
