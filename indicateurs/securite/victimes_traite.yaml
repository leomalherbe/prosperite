recommandation: ecarter
motif_recommandation: >-
  Les victimes de traite comptées sont celles que les autorités identifient : la série dépend de l'effort de détection
  (sens ambigu) et ne reflète pas l'exposition de la population générale.
note_pertinence: >-
  La traite est une atteinte grave mais rare et largement cachée ; une hausse des victimes identifiées peut traduire
  une meilleure détection. L'indicateur figure dans le suivi ODD de l'UE, ce qui justifie sa fiche, mais il est
  peu adapté à un indice de sécurité de la population.
