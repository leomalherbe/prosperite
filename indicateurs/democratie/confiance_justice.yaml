motif_recommandation: Confiance dans la justice nommée dans le contenu de la dimension (A11, R5), série annuelle
  de l'INSEE (ODD 16.i4, baromètre du Cevipof) de 2013 à 2024 (12 points, entre 44 % et 48 %).
note_pertinence: La confiance dans la justice est l'un des indicateurs du cadre Eurostat QoL (système judiciaire)
  et une mesure directe de la légitimité de l'État de droit. Moins d'un Français sur deux fait confiance à la justice,
  niveau stable depuis 2013. Elle se lit avec l'indépendance perçue de la justice (Eurobaromètre), qui mesure un
  autre aspect.
