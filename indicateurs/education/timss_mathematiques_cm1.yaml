motif_recommandation: Seule mesure cataloguée des compétences en mathématiques en fin d'école primaire comparable
  dans le temps et entre pays, indicateur national ODD (cycles 2015, 2019 et 2023), exclue à tort par la long-list
  alors que l'écart de quatre ans entre ses valeurs satisfait D28.
note_pertinence: 'TIMSS évalue tous les quatre ans les mathématiques des élèves en quatrième année de scolarité.
  La série BDM de même définition passe de 58 % (2015) et 57 % (2019) à 36 % (2023) : une chute de cette ampleur
  appelle une vérification du seuil ou du champ retenus en 2023 avant tout usage. Les évaluations nationales de
  début de sixième (part d''élèves de bas niveau en mathématiques, annuelle depuis 2017) sont l''alternative de
  la famille.'
