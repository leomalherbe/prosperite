recommandation: retenir
motif_recommandation: Écart construit sur deux séries annuelles de 2000 à 2025 (26 points), de signe constant (1,5
  point en 2000, 12,9 en 2015, 11,2 en 2025), seule mesure au catalogue du déclassement des diplômés selon l'origine.
note_pertinence: Le déclassement des diplômés nés hors de l'UE traduit des difficultés de reconnaissance des diplômes,
  de langue et des discriminations à l'embauche, sans les distinguer. L'écart a fortement augmenté jusqu'en 2015,
  avec des ruptures de série en 2003, 2005, 2006, 2013, 2014, 2021 et 2024 qui imposent la prudence. Le niveau de
  la surqualification reste suivi dans travail ; l'écart selon l'origine relève d'egalites (A8, R3).
