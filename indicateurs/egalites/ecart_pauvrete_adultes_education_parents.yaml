rattachement_propose: 'hors long-list : jeu Eurostat ilc_igtp03 au catalogue des jeux mais hors filtre (début des
  données 2019), oubli O6 de l''audit M06 ; à cataloguer (maintenance EGA-4)'
raccordement: non
incontournable: non
socle_propose: non
recommandation: retenir
motif_recommandation: Seule mesure trouvée de la transmission de la pauvreté entre générations (mobilité sociale,
  contenu explicite de la dimension), deux valeurs en 2019 et 2023 (7,6 puis 10,8 points ; D17, D28), jamais écartée
  pour sa seule brièveté (D32).
note_pertinence: 'L''écart compare le risque de pauvreté à l''âge adulte selon le diplôme des parents : c''est une
  mesure directe de la reproduction des inégalités, que les autres fiches n''approchent qu''indirectement (pauvreté
  des enfants, réussite au baccalauréat). Deux valeurs seulement, dont la comparabilité entre 2019 et 2023 reste
  à vérifier. Le jeu voisin ilc_igtp01 (diplôme des adultes selon celui des parents) varie trop entre 2019 et 2023
  pour être utilisé sans lecture des métadonnées.'
