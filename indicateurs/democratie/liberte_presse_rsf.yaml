definition: Score de la France au Classement mondial de la liberté de la presse de Reporters sans frontières (questionnaire
  d'experts et relevé des exactions contre les journalistes) ; de 0 à 100, plus haut = mieux, depuis 2013 (les fichiers
  2002-2012 utilisent une échelle inverse et non bornée) ; nouvelle méthode en cinq sous-scores depuis 2022.
unite: score de 0 à 100 (plus haut = mieux, depuis 2013)
