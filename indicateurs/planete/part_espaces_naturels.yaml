motif_recommandation: Concept « usage des sols » présent dans trois cadres, part recalculée sur les surfaces Teruti
  en hectares de 1982 à 2022 (39,95 % en 2000, 40,07 % en 2022), recoupée avec la série INSEE arrondie (40 %) et
  avec la part artificialisée publiée (D34).
note_pertinence: 'L''indicateur suit les espaces qui portent l''essentiel de la biodiversité terrestre ; c''est
  un état, distinct de la pression d''artificialisation, d''où une famille propre (D38 i). La part est presque stable
  depuis 2000 : l''artificialisation progresse surtout aux dépens des terres agricoles (52,61 % du territoire en
  2000, 50,44 % en 2022), en variante. La couverture naturelle et semi-naturelle de l''OCDE (5 points de 2005 à
  2022, 52,2 % en 2022 d''après l''extrait du robot M04) et ses pertes et gains sont aussi en variantes.'
