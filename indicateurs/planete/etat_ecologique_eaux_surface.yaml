motif_recommandation: Indicateur de référence de la qualité des rivières (directive-cadre sur l'eau), 4 points de
  2013 à 2021, non éligible dans la long-list mais candidat selon D28 (écart moyen de 2,7 ans entre valeurs, maintenance
  PLA-1).
note_pertinence: L'état écologique résume la qualité biologique et physico-chimique des cours d'eau et des plans
  d'eau ; c'est l'objectif central de la directive-cadre sur l'eau. La série ne bouge qu'aux états des lieux des
  bassins, d'où le report de la dernière valeur (D17). L'état chimique et l'état des eaux littorales sont en variantes.
