motif_recommandation: 'Sens ambigu : une hausse du taux de signalement peut traduire une confiance accrue dans la
  police comme un changement des faits subis ou des comportements de plainte (M04), et la série s''arrête en 2022.'
note_pertinence: Le signalement à la police mesure l'accès à la justice des victimes, indicateur ODD 16.3.1. Il
  se lit dans les deux sens et dépend du type d'atteinte, ce qui empêche d'en fixer des bornes. La fiche existe
  pour rendre ce choix visible.
