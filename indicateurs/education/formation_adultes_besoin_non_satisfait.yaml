motif_recommandation: Seule mesure du besoin de formation non satisfait, 4 vagues de l'enquête sur l'éducation des
  adultes (D17 ; 10,0 % en 2007, 11,5 % en 2022).
note_pertinence: Les adultes qui voudraient se former sans y parvenir signalent un manque d'accès (coût, temps,
  offre) plutôt qu'un manque d'intérêt. L'indicateur complète le taux de participation en distinguant la non-participation
  subie de la non-participation choisie (37,5 % des 25-64 ans ne se sont pas formés et ne le souhaitaient pas en
  2022). Eurostat signale des ruptures en 2011 (13,8 %) et en 2022.
