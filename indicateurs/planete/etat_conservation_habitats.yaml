motif_recommandation: Seule mesure de l'état des habitats naturels, publiée à chaque rapportage européen (22 % en
  2012, 20 % en 2018, 16 % en 2024, provisoire) et admise comme série irrégulière (D17).
note_pertinence: L'indicateur dit dans quel état sont les habitats protégés par la directive Habitats ; il ne bouge
  qu'à chaque rapportage, tous les six ans, ce qui impose de reporter la dernière valeur (D17). Les autres classes
  d'état (défavorable inadéquat, défavorable mauvais, inconnu) sont en variantes, et la part d'état inconnu pèse
  sur la lecture.
