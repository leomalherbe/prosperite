motif_recommandation: 'Variante principale de la famille etat_de_droit (D35 ; méthode §4 : niveau 1 et série la
  plus longue), score annuel depuis 1996 sauf 1997, 1999 et 2001 (25 points depuis 2000, 74,61 en 2025), quand l''indice
  du WJP ne commence qu''en 2012-2013.'
note_pertinence: L'État de droit est nommé dans le contenu de la dimension et la table des cadres propose les WGI
  et le WJP comme mesures (thème « garanties légales et État de droit » de Stiglitz-Sen-Fitoussi). Les WGI couvrent
  toute la période et montrent une baisse continue depuis 2017 (estimation de 1,26 en 2017 à 0,97 en 2025). L'indicateur
  mêle sécurité des contrats et des biens et droits des citoyens ; le WJP, plus spécialisé, reste disponible dans
  la même famille.
