id: ecart_pauvrete_adultes_education_parents
libelle: Écart de taux de pauvreté des adultes selon le diplôme de leurs parents (25-59 ans)
dimension: egalites
sous_theme: origine sociale et mobilité
famille: mobilite_intergenerationnelle
variante_principale: oui
definition: Écart, en valeur absolue et en points, entre le taux de risque de pauvreté des adultes de 25 à 59 ans
  dont les parents ont au plus un diplôme du premier cycle du secondaire (CITE 0-2) et celui des adultes dont les
  parents sont diplômés du supérieur (CITE 5-8) (EU-SILC, jeu Eurostat ilc_igtp03).
unite: points de pourcentage
sens: bas
type: resultat
declaratif: non
composite: non
source_organisme: Eurostat
source_jeu: ilc_igtp03 (taux de risque de pauvreté des adultes de 25 à 59 ans par niveau d'éducation de leurs parents)
