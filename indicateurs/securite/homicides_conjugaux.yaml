motif_recommandation: >-
  Seule série annuelle des homicides conjugaux (ventilation par sexe disponible pour suivre les féminicides), 2015-2024
  sans lacune et à sens non ambigu ; aucune donnée avant 2015.
note_pertinence: >-
  Les homicides conjugaux sont un enjeu public majeur (violences faites aux femmes) et, comme les autres homicides,
  ils sont presque tous connus des services : la série n'a pas le biais de révélation des violences conjugales enregistrées.
  Le taux est très faible (0,15 à 0,19 pour 100 000 de 2015 à 2024) et ses variations annuelles sont peu significatives.
  Il recoupe en partie l'indicateur homicides.
