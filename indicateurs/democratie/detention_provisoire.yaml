url_page: https://www.insee.fr/fr/statistiques/serie/010596049
frequence: annuelle
premiere_annee: 2010
derniere_annee: 2025
nb_points_depuis_2000: 16
geo: FE
eligibilite_longlist: oui
ligne_id: bdm-000955
hors_longlist: non
raccordement: 'a_etudier : rupture de 2019 (condamnés-prévenus comptés parmi les condamnés : 29,0 % en 2018, 25,9
  % en 2019) ; 2008-2009 par Eurostat crim_pris_tri (valeurs identiques à l''INSEE de 2010 à 2019, écart au plus
  de 0,3 point ensuite)'
incontournable: non
socle_propose: non
recommandation: retenir
motif_recommandation: Indicateur ODD 16.3.2 (INSEE 16.i3) de l'usage de la détention avant jugement, annuel de 2010
  à 2025 (16 points, de 24,7 % à 29,0 %), raccordable à 2008 par la même série d'Eurostat.
note_pertinence: Une part élevée de détenus en attente de jugement signale une justice lente ou un recours excessif
  à la détention provisoire, au détriment de la présomption d'innocence ; c'est l'indicateur 16.3.2 de l'ONU (cible
  16.3, État de droit et accès à la justice). La série française oscille entre 24,7 % (2012) et 29,0 % (2018) ;
  la baisse de 2019 vient d'un changement de comptage (les condamnés-prévenus sont désormais comptés parmi les condamnés).
