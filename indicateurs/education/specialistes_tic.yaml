recommandation: retenir
motif_recommandation: Mesure des compétences numériques avancées de la population en emploi, maintenue en education
  (D44), annuelle de 2004 à 2025 (22 points ; 4,0 % en 2004, 4,9 % en 2025) avec des ruptures en 2005, 2006, 2011,
  2013, 2014 et 2021.
note_pertinence: 'La part des spécialistes des TIC indique la capacité du pays à concevoir et entretenir les outils
  numériques, complément des compétences de base de toute la population. C''est aussi une structure de l''emploi,
  dont la hausse ne dit rien du bien-être des personnes concernées : la lecture reste prudente et la fiche n''est
  pas proposée au socle. La cible européenne de la Décennie numérique (au moins 20 millions de spécialistes des
  TIC en emploi dans l''Union en 2030) est exprimée en nombre pour l''Union et ne se transpose pas telle quelle
  en part de l''emploi français ; la part des femmes parmi ces spécialistes relève d''egalites.'
