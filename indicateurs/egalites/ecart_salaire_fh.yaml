id: ecart_salaire_fh
libelle: Écart de rémunération horaire entre hommes et femmes (non corrigé)
dimension: egalites
sous_theme: écarts femmes-hommes
famille: ecart_salaire_fh
variante_principale: oui
definition: Différence entre le salaire horaire brut moyen des hommes et celui des femmes, en pourcentage du salaire
  masculin, dans l'industrie, la construction et les services hors administration publique (entreprises de 10 salariés
  ou plus ; écart non corrigé des différences de poste ou d'expérience).
unite: '% du salaire horaire brut moyen des hommes'
sens: bas
type: resultat
declaratif: non
