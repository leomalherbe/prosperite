id: exposition_risques_sante_physique
libelle: Personnes en emploi exposées à des risques pour la santé physique au travail
dimension: travail
sous_theme: conditions et santé au travail
famille: risques_physiques
variante_principale: oui
definition: Part des personnes en emploi de 15 à 64 ans qui déclarent être exposées au travail à au moins un facteur
  de risque pouvant nuire à leur santé physique (produits chimiques, poussières, fumées ou gaz ; bruit ou vibrations
  ; postures pénibles, gestes répétitifs ou charges lourdes ; machines, véhicules, risque de chute…), d'après le
  module ad hoc de l'enquête sur les forces de travail (Eurostat).
unite: '% des personnes en emploi'
sens: bas
type: resultat
declaratif: non
composite: non
source_organisme: Eurostat
source_jeu: hsw_exp2 (module ad hoc « accidents du travail et problèmes de santé liés au travail »), classe d'âge
  15-64 ans
