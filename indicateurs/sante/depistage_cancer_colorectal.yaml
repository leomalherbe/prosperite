motif_recommandation: Seule série annuelle de dépistage en cours au catalogue, 12 valeurs de 2011 à 2024 (28,2 %
  en 2011, 29,6 % en 2024 ; rien en 2015-2016, rupture « b » en 2017), admise comme moyen (D19).
note_pertinence: Le dépistage organisé vise à réduire la mortalité par cancer colorectal ; la participation stagne
  entre 24,9 % et 29,8 % de la population cible sur la période. Le dépistage du cancer du sein (série Eurostat arrêtée
  en 2020, série Santé publique France 2017-2025) est en variante.
