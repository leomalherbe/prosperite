notes: 'Vagues 2015, 2017, 2019-2021, 2023 et 2025, lues dans docs/sources/series/drees__barometre_2000_2025_couverture.csv
  ; parts « oui » dans docs/sources/series/drees__barometre_2000_2025_distributions.csv : 23,80 % (2015), 23,21
  % (2017), 20,94 % (2019), 21,51 % (2020), 17,74 % (2021), 19,37 % (2023), 20,46 % (2025), « ne sait pas » de 0
  (2017) à 1,07 % (2023). Libellé du dictionnaire 2025 : « Au cours des 12 derniers mois, avez-vous été le.la témoin
  de discriminations liées à l''origine ethnique ». Indicateur calculé par le robot de M04 sur les microdonnées
  pondérées (poids de redressement fournis), non-réponses incluses au dénominateur ; codes de modalités lus dans
  le dictionnaire 2025 (stabilité sur toute la période à vérifier) ; pièce jointe unique barometre2000_2025_diff_csv
  (vérifiée par le robot le 13/10/2026 ; l''identifiant change à chaque édition), alors que l''identifiant de catalogue
  cite encore les deux pièces jointes antérieures ; échantillon représentatif de la population vivant en France
  métropolitaine (page du jeu, variable SDREG) ; licence non indiquée sur la page du jeu (Licence Ouverte à confirmer).'
