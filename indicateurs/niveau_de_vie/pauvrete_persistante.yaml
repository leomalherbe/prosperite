raccordement: 'non : lacune 2008-2010 et ruptures en 2007 et 2025, sans série de relais'
incontournable: non
recommandation: retenir
motif_recommandation: Seule mesure de la durée de la pauvreté, annuelle sur 2007 et 2011-2025 (16 points depuis
  2000), concept distinct du taux annuel.
note_pertinence: 'Être pauvre une année et l''être durablement n''ont pas les mêmes conséquences : la pauvreté persistante
  repère les personnes enfermées dans la pauvreté. Le taux français passe de 7,1 % en 2011 à 10,4 % en 2024, avec
  des mouvements heurtés (7,1 % en 2023, cause non documentée par Eurostat ; API lue le 14/10/2026). Aucune série
  INSEE équivalente n''est au catalogue.'
