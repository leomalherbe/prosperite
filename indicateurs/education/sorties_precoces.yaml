hors_longlist: non
raccordement: 'a_etudier : Eurostat sdg_04_10 pour 2000-2005 et 2025 (D16), valeurs supérieures de 1 à 1,5 point
  avant 2013'
incontournable: oui
recommandation: retenir
motif_recommandation: Concept présent dans les cinq cadres de bien-être (crosswalk §5), indicateur de richesse nationale
  doté d'une cible européenne (moins de 9 % en 2030) et d'une cible française (9,5 %), annuel de 2006 à 2024 (19
  points ; 7,9 % en 2024).
note_pertinence: 'Les sorties précoces comptent les jeunes qui quittent l''école sans qualification du second cycle,
  premier facteur de risque d''exclusion durable. La série de l''INSEE (11,2 % en 2006, 7,9 % en 2024) ne montre
  pas la rupture de 2013 que signale Eurostat (11,8 % en 2012, 9,7 % en 2013, drapeau « b ») et se situe sous la
  série européenne avant 2013 : elle semble rétropolée, ce que sa documentation doit confirmer. La série Eurostat
  sdg_04_10 (2000-2025, 7,2 % en 2025, « définition différente » depuis 2021) couvre les années manquantes et sert
  aux comparaisons européennes.'
