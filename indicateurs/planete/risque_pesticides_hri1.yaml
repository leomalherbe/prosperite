recommandation: retenir
motif_recommandation: Indicateur de la stratégie Ecophyto 2030, qui vise une baisse de 50 % en 2030 par rapport
  à 2011-2013, série Eurostat sans drapeau de 2011 à 2024 (99 en 2011, 53 en 2024).
note_pertinence: Le HRI1 pondère les ventes de substances par leur dangerosité. Le pic de 2018 (111, contre 89 en
  2017) tient à des achats anticipés en fin d'année avant la hausse de la redevance pour pollutions diffuses entrée
  en vigueur le 1er janvier 2019 (communiqué interministériel cité par l'AFP, Terre-net, 7 janvier 2020) ; le niveau
  reste ensuite entre 50 et 60 (59 en 2019, 53 en 2024), sans que cette source explique toute la baisse. Les quantités
  vendues non pondérées (INSEE et Eurostat) et l'indice européen voisin sdg_02_53 sont en variantes ; le NODU, mesure
  de l'intensité des traitements, forme l'autre fiche de la famille.
