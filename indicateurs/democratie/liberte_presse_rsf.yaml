incontournable: oui
recommandation: retenir
motif_recommandation: Mesure de référence de la liberté de la presse, nommée dans le contenu de la dimension et
  proposée pour le thème « démocratie et libertés » de Stiglitz-Sen-Fitoussi dans la table des cadres, annuelle
  de 2002 à 2026 mais lisible sur une échelle commune seulement depuis 2013 (ruptures en 2013 et 2022).
note_pertinence: La liberté de la presse conditionne l'information des citoyens et le contrôle des pouvoirs. Le
  score français reste entre 76 et 79 depuis 2013 (78,4 en 2013, 77,4 en 2021, 78,53 en 2022, 76,68 en 2026). Les
  trois échelles successives imposent soit de ne lire la série qu'à partir de 2013, soit d'étudier un raccordement
  ; la licence n'a pas été trouvée.
