motif_recommandation: >-
  Série enregistrée disponible seulement depuis 2016 (10 points, en nombre) et sans série d'enquête vivante pour
  en contrôler le sens ; l'enquête CVS (escroqueries bancaires) s'arrête en 2020.
note_pertinence: >-
  Les escroqueries, en particulier en ligne, sont une atteinte aux biens en forte progression et touchent de nombreux
  ménages ; mais la série enregistrée dépend des canaux de signalement (plateformes de plainte en ligne créées ces
  dernières années, à documenter) et ne couvre que 2016-2025. À reconsidérer avec les séries de l'enquête VRS.
