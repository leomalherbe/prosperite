motif_recommandation: Seule mesure directe des discriminations selon l'origine (A8), 7 vagues de 2015 à 2025 (écart
  moyen de 1,7 an, D17 et D28 ; 23,80 % en 2015, 17,74 % en 2021, 20,46 % en 2025).
note_pertinence: 'Les discriminations selon l''origine sont un contenu explicite de la dimension (A8) et l''indicateur
  « discriminations » du cadre Eurostat Qualité de vie reste « à développer ». Être témoin de discriminations dépend
  aussi de la sensibilité au sujet et de l''exposition : une baisse ne signifie pas forcément moins de discriminations.
  Les autres motifs posés dans la même question (religion, orientation sexuelle, âge, handicap) sont listés en variantes,
  et le score V-Dem d''égalité des libertés civiles entre groupes sociaux est une alternative de la famille.'
