motif_recommandation: Compétences mesurées des élèves (incontournable, trois cadres) avec une cible européenne de
  moins de 15 % en 2030, enquête triennale admise par D17 (8 cycles de 2003 à 2025 ; 28,8 % en 2022, 35,7 % en 2025).
note_pertinence: PISA mesure à 15 ans la maîtrise des mathématiques utile à la vie courante ; la part des élèves
  sous le niveau 2 vise la base de la distribution, ce que traduit la cible européenne. La part passe de 28,8 %
  en 2022 à 35,7 % en 2025, sans drapeau de rupture dans la série Eurostat. Le cycle 2025, présent dans la mise
  à jour d'Eurostat du 8 octobre 2026, ne figure pas encore dans la base de l'OCDE lue par le robot ; le score moyen,
  l'évaluation de sixième et TIMSS en CM1 (écarté) sont les autres fiches de la famille (D44).
