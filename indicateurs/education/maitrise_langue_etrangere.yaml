motif_recommandation: 'Autre statistique de la même enquête (cadre Eurostat Qualité de vie : niveau de la langue
  la mieux connue), 4 vagues (D17) : 8,7 % en 2007 (non comparable), 18,7 % en 2011, 19,9 % en 2016 et 24,5 % en
  2022.'
note_pertinence: 'Le niveau déclaré dans la meilleure langue étrangère complète la simple connaissance d''une langue.
  Le dénominateur est la population qui connaît au moins une langue étrangère : les trois niveaux publiés (très
  bon, bon, élémentaire) somment à 100 % à l''arrondi près en 2011, 2016 et 2022. En 2007, 22,5 % de « sans réponse
  » entrent dans le dénominateur, ce qui rend cette année non comparable ; les niveaux « élémentaire » et « bon
  » sont écartés en bloc (catégories intermédiaires).'
