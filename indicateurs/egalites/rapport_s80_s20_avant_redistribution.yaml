incontournable: non
recommandation: retenir
motif_recommandation: 'Indicateur complémentaire de l''indicateur de richesse nationale n° 6, qui mesure les inégalités
  « primaires » que la redistribution corrige, publié de 1996 à 2024 (la série BDM s''arrête en 2022 : 7,0 en 1996,
  8,2 en 2022).'
note_pertinence: Rapproché du S80/S20 après redistribution (4,62 en 2024), il montre ce que font les impôts et les
  prestations ; avant redistribution, le rapport est passé de 7,0 en 1996 à 8,2 en 2022 (BDM). Il intéresse l'utilisateur
  qui juge les inégalités de marché en tant que telles ; il ne doit pas être additionné au S80/S20 sans réflexion
  sur le double compte.
