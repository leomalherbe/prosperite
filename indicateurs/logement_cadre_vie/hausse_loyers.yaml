notes: 'Valeurs lues (prc_hicp_aind, CP041, taux de variation moyen annuel, mise à jour Eurostat du 06/02/2026,
  aucun drapeau) : -0,1 (2000), 3,6 (2005), 1,6 (2010), 0,6 (2015), -0,3 (2018), 0,4 (2020), 2,1 (2023), 2,3 (2024
  et 2025). La page de l''API indique que le jeu n''est plus mis à jour et qu''il est remplacé par prc_hicp_ainr
  (ECOICOP version 2), dont seul le total est catalogué (long-list education) : maintenance LOG-6. Variantes : loyers
  effectivement payés par les locataires (CP0411) ; INSEE BDM, variation trimestrielle et annuelle des loyers des
  secteurs libre et social et de l''ensemble (France métropolitaine, 1987-2026) ; indice annuel des prix à la consommation
  des loyers, base 2025 (BDM 011815635, catalogue des séries écartées de l''INSEE). L''indice de référence des loyers
  (IRL) est écarté du catalogue INSEE comme indice de révision de contrats.'
