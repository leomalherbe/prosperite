motif_recommandation: 'Seule mesure ressentie et annuelle de l''inquiétude pour le pouvoir d''achat, 12 vagues de
  2014 à 2025 entre 87,7 % et 90,6 % des répondants, recalculée sur les microdonnées sans valeur publiée pour la
  recouper (D38 b : au plus retenir_variante).'
note_pertinence: La préoccupation pour les salaires et le pouvoir d'achat traduit une inquiétude matérielle ressentie,
  voisine de la difficulté à joindre les deux bouts, principale de la famille. Comme les autres questions OG04 du
  baromètre (logement, chômage, insécurité), elle mêle une inquiétude personnelle et un jugement sur la situation
  du pays. Elle varie peu (entre 87,7 % et 90,6 %), ce qui n'est pas un motif d'écart (D34) mais pèsera sur le choix
  des bornes.
