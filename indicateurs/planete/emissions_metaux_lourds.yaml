motif_recommandation: Seule mesure de la pollution de l'air par les métaux lourds, total national Eurostat homogène
  et sans drapeau de 2000 à 2024 (280 t en 2000, 90 t en 2024), proche du Citepa pour la France hexagonale (92,1
  t en 2025).
note_pertinence: Le plomb, le cadmium et le mercure sont toxiques et persistants dans les sols et les chaînes alimentaires.
  Le plomb sert d'indicateur principal ; le total de conformité et les huit autres métaux de l'inventaire sont en
  variantes.
