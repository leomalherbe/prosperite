motif_recommandation: Écart absolu à la parité (D34) du revenu médian des 65 ans ou plus rapporté à celui des moins
  de 65 ans, annuel de 2000 à 2025 sans 2002-2003 (24 points ; 0,10 en 2000, 0,01 en 2011, 0,03 en 2025), seule
  mesure de l'écart de niveau de vie entre générations.
note_pertinence: 'Le rapport des revenus médians passe de 0,90 (2000) à 1,04 (2015 et 2018) puis 0,97 (2025) : les
  plus âgés ont rattrapé puis dépassé le reste de la population avant de repasser sous la parité. Exprimé en écart
  absolu à 1 (D34), il mesure la distance à l''égalité quel que soit le groupe avantagé. Le revenu ne tient pas
  compte du patrimoine (logement possédé), plus élevé chez les plus âgés.'
