motif_recommandation: Seule mesure annuelle de l'infrastructure numérique (A5, A7), série Eurostat de 2013 à 2025
  (13 points d'après la long-list), admise comme indicateur de moyens adossé à des objectifs publics de couverture
  (D19).
note_pertinence: 'La couverture mesure l''infrastructure disponible et non son usage : elle dit si chaque ménage
  peut accéder à un internet de qualité où qu''il habite. Elle passe de 10,5 % des ménages en 2013 à 91,7 % en 2025
  (API Eurostat lue le 15/10/2026) et approchera bientôt la saturation. Les objectifs publics (plan France Très
  haut débit, décennie numérique de l''UE) sont exprimés en couverture, ce qui facilitera le choix des bornes.'
