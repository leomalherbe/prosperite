id: ecart_pauvrete_etrangers
libelle: Écart de taux de pauvreté entre étrangers et Français (18 ans ou plus)
dimension: egalites
sous_theme: écarts selon l'origine
famille: ecart_pauvrete_origine
variante_principale: oui
definition: Écart, en valeur absolue et en points, entre le taux de pauvreté monétaire (seuil de 60 % du revenu
  médian) des personnes de 18 ans ou plus de nationalité étrangère et celui des personnes de nationalité française
  (EU-SILC, jeu ilc_li31).
unite: points de pourcentage
sens: bas
type: resultat
declaratif: non
composite: non
source_organisme: Eurostat
source_jeu: ilc_li31 (taux de risque de pauvreté par nationalité)
source_serie_id: ilc_li31?freq=A&citizen=FOR&citizen=NAT&age=Y_GE18&sex=T&unit=PC&geo=FR
