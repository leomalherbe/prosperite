notes: 'Valeurs relues le 16/10/2026 : BDM 010594746 (mise à jour du 27/05/2026 ; 2006-2024, statut provisoire de
  2021 à 2024, 2025 non publiée ; 10,8 % en 2012, 10,1 % en 2013, 8,6 % en 2014) ; page de l''INSEE 3281681 (6 janvier
  2025 : indicateur calculé par Eurostat sur l''enquête Emploi, champ France métropolitaine et DOM hors Mayotte,
  série rétropolée par la DEPP de 2003 à 2013, ruptures de 2003, 2013 et 2021, 7,6 % en 2023 provisoire). API Eurostat
  sdg_04_10 lue le 15/10/2026 (2000-2025 ; ruptures en 2003, 2013, 2014, 2021 et 2024 ; 11,8 % en 2012, 9,7 % en
  2013, 8,8 % en 2014). Écarts de millésime (audit M06, 16/10/2026) : de 2021 à 2023, la BDM (8,0, 7,8 et 7,8 %)
  est au-dessus d''Eurostat (7,8, 7,6 et 7,6 %) et de la page de l''INSEE (7,6 % en 2023) ; pour 2024, la reprise
  de la DEPP donne 7,7 % contre 7,9 % pour la BDM et Eurostat.'
