motif_recommandation: Autre lecture de l'achèvement du secondaire (concept incontournable porté par les sorties
  précoces, D38 d), indicateur de l'OCDE (13_1) et du cadre SSF, annuelle de 2000 à 2025 (76,4 % en 2000, 89,9 %
  en 2025) mais sans cible officielle, d'où la variante principale laissée aux sorties précoces.
note_pertinence: 'L''indicateur regarde les jeunes adultes une fois leurs études achevées, quand les sorties précoces
  portent sur les 18-24 ans : les deux mesurent le même déficit de qualification à des âges voisins. Eurostat signale
  des ruptures en 2003, 2013, 2014, 2021 et 2024, dont le passage à la CITE 2011 en 2014. L''OCDE diffuse la même
  mesure de 2004 à 2024 (89,4 % en 2024 contre 89,1 % pour Eurostat), en variante.'
