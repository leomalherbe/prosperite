notes: 'Valeurs lues sur l''API Eurostat le 16/10/2026 : demo_mlexpec (age=Y65, sex=T ; mise à jour du 25/09/2026),
  1998-2024, b en 2012 et 2014, p en 2023 et 2024 (19,1 en 1998, 19,3 en 2000, 21,5 en 2014, 21,7 en 2019, 21,0
  en 2020, 21,2 en 2022, 21,9 en 2024) ; hlth_hlye (LE_Y65 ; mise à jour du 17/07/2026) identique de 2004 à 2013
  puis 22,0 (2014), 22,0 (2019), 21,2 (2020), 21,3 (2022), 21,9 (2024), écart de 0,1 à 0,5 an non expliqué. Choix
  de la principale : D43 (audit M06 J1).'
