motif_recommandation: Effort de R&D rattaché à la dimension par l'arbitrage A5 (D25), indicateur de richesse nationale
  doté de l'objectif européen de 3 % du PIB, annuel de 1996 à 2024 (25 points depuis 2000 ; 2,18 % en 2024, valeur
  estimée).
note_pertinence: 'L''effort de recherche est un indicateur de moyens (D19) : il mesure ce que le pays consacre à
  la production de connaissances, pas leur résultat. La série est stable, entre 2,02 % (2007) et 2,28 % (2014 et
  2020), loin de l''objectif de 3 %. Eurostat (sdg_09_10), l''OCDE (How''s Life 15_4) et la part exécutée par les
  entreprises sont en variantes.'
