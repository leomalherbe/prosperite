notes: 'Valeurs lues (ilc_mdho01, ensemble) : 15,0 (2004), 12,5 (2010), 10,9 (2011), 14,0 (2016), 11,5 (2019), 18,0
  (2020, b), 21,1 (2023). Depuis le règlement-cadre de 2021, l''item relève du module triennal « conditions de travail
  et de logement » d''EU-SILC (vagues 2023 et 2026 d''après la page des modules d''Eurostat lue le 15/10/2026) :
  valeurs annuelles de 2004 à 2020, puis 2023, d''où la fréquence irrégulière (report de la dernière valeur, D17).
  Variantes : ventilations, enfants (ilc_mdho01c), handicap (hlth_dhc070).'
