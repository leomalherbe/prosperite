id: ecart_revenu_median_origine
libelle: Écart relatif de revenu médian entre personnes nées en France et personnes nées à l'étranger (18 ans ou
  plus)
dimension: egalites
sous_theme: écarts selon l'origine
famille: ecart_pauvrete_origine
variante_principale: non
definition: Écart, en valeur absolue et en pourcentage, entre le revenu disponible équivalent médian des personnes
  de 18 ans ou plus nées en France et celui des personnes nées à l'étranger, rapporté au premier (EU-SILC, jeu ilc_di16).
unite: '% du revenu médian des personnes nées en France'
sens: bas
type: resultat
declaratif: non
composite: non
source_organisme: Eurostat
source_jeu: ilc_di16 (revenu moyen et médian par groupe de pays de naissance)
source_serie_id: ilc_di16?freq=A&unit=EUR&statinfo=MED_EI&c_birth=NAT&c_birth=FOR&sex=T&age=Y_GE18&geo=FR
