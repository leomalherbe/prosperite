motif_recommandation: Mesure annuelle des décès par chute de 2011 à 2023, sans drapeau et en hausse de 9,86 à 13,47
  pour 100 000, que complète la série de Santé publique France des 65 ans ou plus (2015-2024).
note_pertinence: 'Les chutes sont un accident de la vie courante qui touche surtout les personnes âgées : Santé
  publique France compte 20 148 décès par chute de personnes de 65 ans ou plus en 2024, dont 14 626 à 85 ans ou
  plus. Le taux standardisé augmente de 37 % entre 2011 et 2023 ; la part de cette hausse qui tiendrait aux pratiques
  de certification des décès n''est pas documentée. Les accidents de transport relèvent de securite (A6) ; les autres
  accidents de la vie courante (noyades, intoxications) sont écartés comme causes de second rang.'
