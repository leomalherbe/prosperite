id: victimes_violences_conjugales
libelle: Adultes victimes de violences physiques ou sexuelles par un conjoint ou ex-conjoint (enquête)
dimension: securite
sous_theme: atteintes aux personnes
famille: violences_intrafamiliales
variante_principale: oui
definition: Part des personnes de 18 à 75 ans résidant en France métropolitaine qui déclarent avoir subi dans l'année
  au moins une violence physique ou sexuelle commise par leur conjoint ou ex-conjoint, qu'elles aient porté plainte
  ou non (enquêtes CVS puis VRS ; ventilation de l'indicateur ODD 16.i2).
unite: '% des 18-75 ans'
sens: bas
type: resultat
declaratif: non
composite: non
source_organisme: INSEE (indicateurs ODD, d'après les enquêtes de victimation du SSMSI)
source_jeu: BDM, indicateurs ODD (ODD-PAIX-JUSTICE-INSTITUTIONS-EFFICACES)
source_serie_id: '010596046'
source_niveau: 1
