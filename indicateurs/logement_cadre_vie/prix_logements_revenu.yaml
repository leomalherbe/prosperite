id: prix_logements_revenu
libelle: Prix des logements rapportés au revenu (ratio standardisé)
dimension: logement_cadre_vie
sous_theme: coût du logement
famille: prix_logements_revenu
variante_principale: oui
definition: Rapport entre l'indice des prix des logements et le revenu disponible nominal par habitant, exprimé
  par rapport à sa moyenne de long terme (Eurostat, tipsho60).
unite: indice (moyenne de long terme = 100)
sens: bas
type: resultat
declaratif: non
composite: non
