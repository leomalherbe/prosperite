motif_recommandation: Concept nommé dans le contenu de la dimension (« intensité de la pauvreté »), indicateur ODD
  1.i3, publié sans rupture de 1996 à 2024 (25 points).
note_pertinence: Le taux de pauvreté compte les pauvres ; l'intensité dit à quel point ils sont pauvres. En 2024,
  le niveau de vie médian des personnes pauvres est inférieur de 19,7 % au seuil, en hausse de 0,5 point sur un
  an (Insee Première n° 2117, lue le 14/10/2026). Une politique qui relève les très bas revenus sans franchir le
  seuil améliore l'intensité sans changer le taux.
