motif_recommandation: 'Sens ambigu : un volume prélevé ne se juge que rapporté à l''accroissement des forêts, que
  mesure la fiche principale de la famille, alors que la série seule (77 136 milliers de m3 en 2000, 57 220 en 2023)
  n''est pas interprétable.'
note_pertinence: 'Récolter du bois peut être soutenable et remplacer des matériaux plus émetteurs, comme épuiser
  la forêt : le volume seul ne tranche pas. Les ventilations par assortiment et par propriétaire et les comptes
  forestiers en volume sont en variantes ; les jeux de sylviculture ont été réintégrés par D26.'
