id: excedent_azote
libelle: Excédent du bilan azoté des terres agricoles
dimension: planete
sous_theme: azote et phosphore
famille: pression_azote_agricole
variante_principale: oui
definition: 'Bilan brut de l''azote des sols agricoles : apports (engrais minéraux et organiques, effluents d''élevage,
  fixation biologique, dépôts atmosphériques, semences) moins exportations par les récoltes et les fourrages, en
  kg d''azote par hectare de surface agricole utilisée.'
unite: kg d'azote par hectare de SAU
sens: bas
