qualite:
- champ_metropole_menages_ordinaires
notes: 'Champ : personnes vivant en France métropolitaine dans un ménage ordinaire dont le revenu déclaré est positif
  ou nul et dont la personne de référence n''est pas étudiante (métadonnées du jeu Melodi). Variantes : série non
  rétropolée 1975-2024 et ses ventilations, revenu équivalent médian EU-SILC (ilc_di03, 2000-2025) et ses ventilations,
  indice réel ilc_di18, seuils de pauvreté (60 % de la médiane).'
