incontournable: oui
socle_propose: non
derogation_socle: 'Décision de Léo au gel 2 (classeur retourné le 17/10/2026, docs/validation/classeurs/retours/validation_egalites_2026-10-17.xlsx,
  D48) : retenu, hors du socle.'
recommandation: retenir
motif_recommandation: Concept présent dans quatre cadres (écarts femmes-hommes) et objet d'une cible de l'UE pour
  2030 (réduire de moitié l'écart de 2019), série annuelle de 2009 à 2025 (8,0 points en 2009, 5,7 en 2025).
note_pertinence: L'écart d'emploi est la mesure de base des inégalités femmes-hommes sur le marché du travail. Il
  a baissé de 8,0 à 5,7 points entre 2009 et 2025 (drapeau d, définition différente, de 2021 à 2025). L'objectif
  européen (réduire de moitié l'écart de 2019, fixé pour l'UE) donnerait 3,0 points pour la France.
