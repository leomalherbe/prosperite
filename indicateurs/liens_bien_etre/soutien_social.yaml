definition: Part des personnes de 15 ans ou plus qui répondent oui à la question « Si vous aviez des ennuis, avez-vous
  des parents ou des amis sur lesquels vous pouvez compter pour vous aider chaque fois que vous en avez besoin ?
  » (Gallup World Poll, base How's Life de l'OCDE, mesure 7_1).
