hors_longlist: non
raccordement: non
incontournable: non
recommandation: retenir
motif_recommandation: 'Seule mesure publique d''affect positif pour la France (3 vagues : 2013, 2018, 2022), admise
  comme série irrégulière (D17), alors que les émotions ressenties font partie du contenu de la dimension.'
note_pertinence: 'Les émotions complètent l''évaluation de la vie : elles décrivent le vécu récent plutôt qu''un
  jugement d''ensemble. Les valeurs vérifiées à la source (62,1 % en 2013, 67,8 % en 2018, 66,4 % en 2022) varient
  peu ; la valeur 2022 serait reportée jusqu''à la vague suivante du module.'
