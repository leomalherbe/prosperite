motif_recommandation: 'Concept incontournable (participation et voix politique : Doughnut, SSF, OCDE, Eurostat)
  et scrutin le plus suivi, 5 scrutins de 2002 à 2022 sur un champ homogène (75,28 % en 2022), recoupés avec 5 valeurs
  officielles (D34) et admis comme série irrégulière (D17).'
note_pertinence: 'La participation à l''élection présidentielle est la mesure la plus simple et la plus parlante
  de l''engagement électoral : 72,11 % en 2002, 84,73 % en 2007, 80,67 % en 2012, 79,02 % en 2017 et 75,28 % en
  2022, en métropole et dans les DROM. La série ne bouge que tous les cinq ans : la valeur reportée entre deux scrutins
  ne dit rien des années intermédiaires. Le fichier du ministère est préféré aux séries de l''INSEE (niveau 1, identiques
  à l''arrondi depuis 2012) parce qu''il remonte à 2002.'
