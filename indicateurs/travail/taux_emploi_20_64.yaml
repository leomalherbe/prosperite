motif_recommandation: Même concept que la principale sur la classe d'âge de la cible française et européenne de
  78 % en 2030, série Eurostat lfsi_emp_a de 2003 à 2025 (23 points), que l'indicateur ODD sdg_08_30 reprend à l'identique
  depuis 2009.
note_pertinence: 'La cible d''emploi de l''Union (au moins 78 % des 20-64 ans en emploi en 2030) et l''objectif
  français se lisent sur cette série : elle fournit une borne officielle que la série 15-64 ans n''a pas. Les valeurs
  vont de 70,0 % en 2003 à 75,4 % en 2025, identiques à celles de sdg_08_30 de 2009 à 2025 (collecte ciblée du robot,
  15/10/2026). Le drapeau « d » de 2021 à 2025 signale le changement de règlement européen de l''enquête, que l''INSEE
  a corrigé dans ses séries longues.'
