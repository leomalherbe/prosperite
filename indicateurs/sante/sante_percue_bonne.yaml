source_niveau: 1
url_api: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/sdg_03_20?freq=A&unit=PC&quant_inc=TOTAL&age=Y_GE16&sex=T&levels=VG_G&geo=FR
