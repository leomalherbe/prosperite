id: satisfaction_soins_hopital
libelle: Satisfaction à l'égard de la qualité des soins des hôpitaux publics
dimension: sante
sous_theme: perceptions
famille: satisfaction_soins
variante_principale: oui
definition: 'Part des personnes qui se disent « très » ou « plutôt » satisfaites de la qualité des soins ou des
  services des hôpitaux publics (hors urgences et maternités), parmi les répondants du baromètre d''opinion de la
  DREES qui ont un avis sur ce prestataire : la modalité « je n''y suis jamais allé.e / je ne connais pas », proposée
  depuis 2014, est exclue du dénominateur (D39, D43) et les non-réponses y restent (question SA07_1).'
unite: '% des répondants hors « jamais allé.e »'
sens: haut
