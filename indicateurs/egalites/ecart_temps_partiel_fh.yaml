notes: 'Définition corrigée après l''audit M06 : écart de parts du temps partiel dans l''emploi, et non de taux
  d''emploi à temps partiel ; l''audit l''a recoupée sur lfsa_eppga (« personnes en emploi à temps partiel, % de
  l''emploi total », 20-64 ans) : 8,1 % pour les hommes moins 25,6 % pour les femmes = -17,5 en 2025, valeur publiée.
  Les métadonnées de sdg_05_30 ne détaillent pas la modalité EMP_PT (à confirmer, maintenance EGA-5) ; l''API a
  refusé une nouvelle lecture le 14/10/2026 (HTTP 429). A = série publiée (hommes moins femmes) : -25,2 (2009),
  -17,5 (2025), drapeau d de 2021 à 2025.'
