id: ecart_besoins_soins_revenu
libelle: Écart de renoncement aux soins médicaux entre les 20 % les plus modestes et les 20 % les plus aisés
dimension: egalites
sous_theme: santé
famille: ecart_acces_soins_revenu
variante_principale: oui
definition: Écart, en valeur absolue et en points, entre la part des personnes de 16 ans ou plus déclarant un besoin
  d'examen ou de traitement médical non satisfait pour des raisons de coût, de distance ou d'attente dans le quintile
  de revenu le plus bas et la même part dans le quintile le plus élevé (EU-SILC, jeu hlth_silc_08).
