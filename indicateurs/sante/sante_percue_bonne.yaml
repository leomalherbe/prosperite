geo: FR
eligibilite_longlist: oui
ligne_id: estat-002040
hors_longlist: non
raccordement: 'a_etudier : ruptures de 2020 et 2022 de l''enquête SRCV à neutraliser'
incontournable: oui
recommandation: retenir
motif_recommandation: Indicateur phare du cadre Qualité de vie d'Eurostat et de l'OCDE (§5 du crosswalk), annuel
  de 2005 à 2025 (68,8 % en 2005, 64,7 % en 2025) ; l'INSEE ne publie pas ce niveau.
note_pertinence: La santé perçue est la mesure synthétique de l'état de santé ressenti, prédictive de la mortalité.
  Elle recule de 68,8 % en 2005 à 64,7 % en 2025, avec des ruptures (« b ») en 2020 et 2022 liées à la refonte de
  SRCV. La part en mauvaise ou très mauvaise santé, les ventilations et les séries de l'OCDE et du baromètre DREES
  sont en variantes.
