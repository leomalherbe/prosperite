motif_recommandation: Série nationale de référence des accidents du travail (2005-2024, 19 points, pas de valeur
  en 2020), plus longue et plus stable que la série européenne ESAW, qui compte quatre ruptures.
note_pertinence: Les accidents du travail sont la mesure de la santé au travail citée par SSF et par le cadre Qualité
  de vie d'Eurostat. L'indice de l'Assurance maladie vaut 26,4 accidents pour 1 000 salariés en 2024 (extrait du
  robot M04). La série européenne des accidents non mortels varie fortement d'une année à l'autre (3 443,59 pour
  100 000 en 2008, 2 303,37 en 2009) et porte des ruptures en 2014, 2017, 2020 et 2022 (API Eurostat, 14/10/2026).
