note_pertinence: 'Aucune statistique publique annuelle du nombre de personnes sans domicile n''est cataloguée :
  l''enquête Sans-domicile de l''INSEE est ponctuelle (2001 et 2012 d''après le relevé M03) et les estimations associatives
  sont publiées en PDF (exclues, D09). La question mesure la présence du sans-abrisme dans l''entourage des personnes
  interrogées, un indicateur indirect qui dépend aussi de la taille des réseaux sociaux et de la visibilité du phénomène.
  Le sens « bas » (plus de personnes concernées dans l''entourage, situation dégradée) est à confirmer par Léo.'
