hors_longlist: non
raccordement: 'oui : 2004-2009 par la somme des modalités « grande difficulté » et « difficulté » d''ilc_mdes09,
  égale à ilc_sbjp01 à l''arrondi près sur 2010-2025 (vérifié sur l''API le 14/10/2026)'
incontournable: non
recommandation: retenir
motif_recommandation: Indicateur du cadre Qualité de vie d'Eurostat et de l'OCDE (How's Life 1_5), annuel de 2010
  à 2025 (16 points) et raccordable jusqu'en 2004 par sa décomposition publiée.
note_pertinence: 'La question porte sur le ressenti du budget du ménage : elle capte les fins de mois difficiles
  que le revenu seul ne révèle pas (charges contraintes, endettement). La part passe de 20,2 % en 2010 à 16,5 %
  en 2021 puis 21,8 % en 2025 ; la modalité « grande difficulté » double, de 4,4 % en 2010 à 8,0 % en 2025 (API
  Eurostat, lue le 14/10/2026). La rupture de 2022 coïncide avec la hausse : à interpréter avec prudence.'
