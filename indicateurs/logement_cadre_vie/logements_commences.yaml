motif_recommandation: Sens ambigu pour le cadre de vie (offre de logements mais aussi artificialisation des sols),
  série mensuelle de l'INSEE de 2000 à 2026 sans série annuelle publiée.
note_pertinence: 'La construction neuve est suivie de près dans le débat sur la crise du logement : peu de mises
  en chantier signale une offre insuffisante. Mais davantage de constructions n''est pas un progrès en soi (artificialisation,
  vacance) et le besoin dépend de la démographie, si bien que le sens de l''indicateur n''est pas univoque. La valeur
  annuelle serait le cumul de décembre.'
