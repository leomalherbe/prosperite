notes: 'Composantes lues dans la long-list education (lignes melodi-005367 et melodi-005361 : 4 valeurs de 2012
  à 2022 chacune, éligibilité « à vérifier », D17). Les valeurs ne sont pas dans le dépôt : l''API Melodi est refusée
  à l''outil de lecture (17/10/2026) ; lecture par le robot et recoupement avec les valeurs publiées par l''INSEE
  ou la DEPP à faire avant toute recommandation « retenir » (D34 ; maintenance TRV-1). Les séries BDM équivalentes
  (010594819 à 010594829) sont écartées : champ géographique non national d''après la long-list.'
