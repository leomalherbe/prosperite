ligne_id: estat-025817
hors_longlist: non
raccordement: 'a_etudier : saut de 2003 (9,7 % en 2002, 12,9 % en 2003, rupture)'
incontournable: non
recommandation: retenir_variante
motif_recommandation: Composante des horaires atypiques suivie depuis plus longtemps que l'indicateur d'ensemble
  (2000-2025, 24 points), à lire avec la rupture de 2003.
note_pertinence: Le travail du dimanche prive d'un temps commun de la vie familiale et sociale. La série va de 12,9
  % (2003) à 14,6 % (2025), sans valeur en 2022 ni 2024 (API Eurostat, 14/10/2026). Le travail le samedi et en fin
  de semaine reste en variante.
