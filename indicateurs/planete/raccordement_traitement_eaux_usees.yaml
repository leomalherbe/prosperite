definition: Part de la population connectée au moins à un traitement secondaire des eaux usées (Eurostat, suivi
  des ODD de l'UE) ; le libellé couvre les traitements urbains, individuels et autres, mais la France ne déclare
  que les stations urbaines (voir notes).
