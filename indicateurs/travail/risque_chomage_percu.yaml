notes: 'Parts calculées par l''agent correcteur sur docs/sources/series/drees__barometre_2000_2025_risque_chomage.csv
  (vague 11 du robot, 16/10/2026), modalité 1 rapportée aux modalités 1 et 2 : 41,0 % (2010), 44,8 % (2013), 41,5
  % (2014), 49,8 % (2016), 38,4 % (2018), 43,6 % (2020), 31,5 % (2021), 28,7 % (2025) ; avec « ne sait pas » au
  dénominateur : 40,1 % (2010) et 26,4 % (2025). Plausibilité (D38 b) : la DREES publie 42 % en 2014, « en baisse
  de trois points par rapport à 2013 » (synthèse du baromètre 2014), ce que reproduit le calcul hors « ne sait pas
  » (41,5 % et 44,8 %) mieux que le calcul avec (40,6 % et 44,1 %) ; recoupement D34 incomplet (deux valeurs) :
  non_recoupe. Libellé de la question et des modalités lus dans les dictionnaires 2025 du robot. Variante principale
  de la famille insecurite_emploi_percue depuis la correction de l''audit M06 (J7).'
