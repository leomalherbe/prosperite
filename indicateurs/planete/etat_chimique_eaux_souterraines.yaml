variante_principale: oui
definition: Part des masses d'eau souterraine (nappes) en bon état chimique au sens de la directive-cadre sur l'eau,
  d'après les états des lieux des bassins (indicateur national ODD 6.i2c).
unite: '% des masses d''eau souterraine'
