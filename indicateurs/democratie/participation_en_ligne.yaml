variante_principale: oui
definition: Part des particuliers ayant utilisé internet pour participer à des consultations en ligne ou pour voter
  sur des sujets civiques ou politiques (urbanisme, signature de pétitions, par exemple), d'après l'enquête européenne
  sur l'usage des technologies de l'information par les particuliers (Eurostat isoc_ci_ac_i, indicateur I_IUVOTE,
  ensemble des individus) ; tranche d'âge et période de référence non relues dans les métadonnées.
