recommandation: retenir_variante
motif_recommandation: Lecture du taux d'emploi corrigée du temps partiel, sans série annuelle de même définition,
  disponible en trimestriel de 2003 à 2026 (agrégation annuelle à prévoir).
note_pertinence: 'Le taux en équivalent temps plein distingue un emploi à mi-temps d''un emploi à temps plein :
  il complète le taux d''emploi quand la part du temps partiel varie. La série est trimestrielle et corrigée des
  variations saisonnières ; la moyenne des quatre trimestres donnera la valeur annuelle (2026 incomplet).'
