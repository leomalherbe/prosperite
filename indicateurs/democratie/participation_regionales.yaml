motif_recommandation: Participation à un scrutin territorial, 3 scrutins comparables de 2010 à 2021 sur un champ
  homogène (de 49,91 % en 2015 à 33,27 % en 2021), recoupés avec 3 valeurs officielles (D34), la valeur 2004 du
  fichier étant fausse.
note_pertinence: 'Les régionales montrent une forte érosion de la participation : 60,84 % en 2004 d''après les résultats
  officiels, 46,33 % en 2010, 49,91 % en 2015 et 33,27 % en 2021, scrutin tenu pendant l''épidémie. Elles renseignent
  sur l''intérêt pour l''échelon régional, avec trois points seulement dans le fichier. Le scrutin de 2004 y est
  mal codé : la Manche manque, les inscrits du Nord et de la Guadeloupe sont gonflés et ceux de La Réunion, des
  Alpes-Maritimes et du Puy-de-Dôme amputés.'
