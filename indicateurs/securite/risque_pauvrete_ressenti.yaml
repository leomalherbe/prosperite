motif_recommandation: Seule série annuelle de la crainte de devenir pauvre (DREES, 11 vagues de 2014 à 2025), la
  réponse « déjà pauvre » relevant de niveau_de_vie (NDV-4) ; sa baisse (32,1 % en 2014, 16,1 % en 2025) se retrouve
  parmi les répondants qui ne se disent pas déjà pauvres (34,9 % puis 19,5 %), si bien qu'elle ne tient pas seulement
  au passage vers la pauvreté ressentie.
note_pertinence: 'La crainte de devenir pauvre exprime directement l''insécurité économique vécue. La série compte
  la seule réponse « oui, plutôt » : ceux qui se disent déjà pauvres (7,9 % en 2014, 17,4 % en 2025) sont comptés
  dans la fiche niveau_de_vie/pauvrete_ressentie, et les deux fiches sont à lire ensemble, une partie de la baisse
  pouvant venir du passage d''une réponse à l''autre. Les non-réponses sautent de 1,4 % à 6,1 % en 2018 (changement
  de protocole possible, à vérifier) et l''année 2024 manque.'
