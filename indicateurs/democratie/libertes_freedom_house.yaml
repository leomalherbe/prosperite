motif_recommandation: Variante principale de la famille Freedom House (D18), score annuel de 2002 à 2025 (24 points,
  89 sur 100 en 2025), mais 7 valeurs distinctes seulement et licence non trouvée.
note_pertinence: 'Freedom House mesure les droits politiques et les libertés civiles, au cœur de la dimension. Le
  score français varie très peu (89 ou 90 de 2018 à 2024 dans le fichier source) : il distingue mal les années et
  recoupe largement l''indice V-Dem. Freedom House ne diffuse les éditions 2025 et 2026 que sur demande ; OWID relaie
  l''édition 2025.'
