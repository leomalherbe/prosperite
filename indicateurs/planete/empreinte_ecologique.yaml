motif_recommandation: Seul indicateur agrégé de la demande de surfaces productives, comparable à la biocapacité,
  disponible de 1961 à 2025 (dont 2024 et 2025 estimés) et admis comme composite (D18).
note_pertinence: L'empreinte écologique traduit plusieurs pressions (carbone, cultures, forêts, pêche, artificialisation)
  dans une unité commune et se compare à la biocapacité par habitant, en variante. Le poids du carbone y est prépondérant,
  d'où un recouvrement avec l'empreinte carbone à traiter au contrôle de redondance. La licence du classeur n'est
  pas trouvée et son adresse change à chaque édition.
