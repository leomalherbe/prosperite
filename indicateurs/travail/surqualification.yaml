id: surqualification
libelle: Taux de surqualification des diplômés du supérieur
dimension: travail
sous_theme: qualité et sécurité de l'emploi
famille: surqualification
variante_principale: oui
definition: Part des diplômés de l'enseignement supérieur en emploi, de 15 ans ou plus, qui occupent un emploi ne
  demandant pas ce niveau de diplôme (Eurostat, enquête sur les forces de travail).
unite: '% des diplômés du supérieur en emploi'
