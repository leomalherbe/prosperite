rattachement_propose: 'hors long-list : jeu Ameli des décès au travail, repéré par M04 dans l''export du catalogue
  data.ameli.fr mais non catalogué, lu par la collecte ciblée du robot (15/10/2026) ; série nationale principale
  par D40'
raccordement: 'a_etudier : hausse de 2019 (553 décès en 2018, 733 en 2019) attribuée à un changement de méthode
  qui prend mieux en compte les malaises, non chiffré ; la série européenne hsw_n2_02 prolonge avant 2015'
incontournable: non
socle_propose: non
recommandation: retenir
motif_recommandation: Série nationale des décès par accident du travail du régime général (D40), calculée sur deux
  jeux de l'Assurance maladie de 2015 à 2024 (10 points) et recoupée avec les nombres de décès publiés (733 en 2019,
  738 en 2022, 759 en 2023), la série européenne hsw_n2_02 (2008-2024, quatre ruptures) restant en variante.
note_pertinence: Les accidents mortels portent une préoccupation publique propre (D32), distincte de la fréquence
  des accidents avec arrêt. Le taux passe de 2,9 décès pour 100 000 salariés en 2015 à 3,7 en 2024, avec un saut
  en 2019 (2,9 en 2018, 3,7 en 2019) attribué en partie à une meilleure prise en compte des malaises. La série européenne
  (tous travailleurs) suit la même trajectoire (2,74 en 2018, 3,54 en 2019, 3,61 en 2024), commence en 2008 et porte
  des ruptures en 2014, 2017, 2020 et 2022, sans cause documentée.
