motif_recommandation: Indice global V-Dem le plus proche du thème participation, annuel de 2000 à 2025 (26 points,
  0,597 en 2025), en alternative à l'indice de démocratie libérale dans la famille qualite_democratique (D35).
note_pertinence: La démocratie participative met l'accent sur l'implication directe des citoyens, au cœur de la
  question de la dimension (« est-ce que les citoyens participent et sont entendus ? »). L'utilisateur choisira
  cet indice ou l'indice libéral, pas les deux, pour éviter de compter deux fois la composante électorale.
