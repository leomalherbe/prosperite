motif_recommandation: Mesure de référence de l'endettement des ménages rattachée à la sécurité économique par D39,
  annuelle de 2000 à 2024 (25 points, 57,3 % en 2000, 104,9 % en 2021, 93,6 % en 2024 provisoire).
note_pertinence: 'Le taux d''endettement mesure la vulnérabilité financière de l''ensemble des ménages : plus la
  dette pèse sur le revenu, plus un choc de revenu ou de taux expose au surendettement ; l''OCDE (How''s Life) le
  range parmi les facteurs de risque pour le bien-être futur. Il a presque doublé de 2000 à 2021 avant de reculer,
  et ne dit rien de la répartition de la dette entre ménages, que la charge ressentie des remboursements mesure.
  Le même ratio de l''OCDE, de la BCE (trimestriel), l''endettement en % du PIB (INSEE, ODD 17.i4a) et l''endettement
  moyen de l''enquête Patrimoine sont en variantes.'
