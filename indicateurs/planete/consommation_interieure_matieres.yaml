motif_recommandation: Indicateur territorial des flux de matières, série Eurostat de 2000 à 2025 (14,6 t par habitant
  en 2000, 10,6 t en 2025 imputée), avec des ruptures en 2000, 2004 et 2009.
note_pertinence: 'La consommation intérieure de matières mesure ce qui est consommé sur le territoire, sans les
  matières mobilisées à l''étranger pour les importations : elle sous-estime la pression d''une économie qui importe
  ses produits, d''où la fiche distincte sur l''empreinte. La productivité des ressources (PIB par tonne), les composantes
  du compte et la série INSEE (ODD 12.i1) sont en variantes.'
