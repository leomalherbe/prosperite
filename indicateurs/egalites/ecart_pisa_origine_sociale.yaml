motif_recommandation: Écart construit (D34) sur deux séries de l'indicateur ODD 4.i1d de l'INSEE à quatre vagues
  PISA de 2012 à 2022 (D17), proposé comme lecture des compétences selon l'origine sociale à côté de l'écart de
  réussite au baccalauréat, principal de la famille.
note_pertinence: La réussite selon l'origine sociale est un contenu explicite de la dimension, porté jusqu'ici par
  le seul écart de réussite au baccalauréat, qui ne mesure que les candidats présents. L'écart PISA mesure les compétences
  de toute une génération de 15 ans et se compare entre pays, mais il n'a qu'une valeur tous les trois ou quatre
  ans. Les parts des quarts intermédiaires et le même écart en compréhension de l'écrit (ODD 4.i1c) sont en variantes.
