motif_recommandation: Mesure de la pression phosphorée agricole, série Eurostat de 2000 à 2023 (8,4 kg/ha en 2000,
  -1,1 en 2023) avec une rupture en 2010 (drapeau b).
note_pertinence: 'L''excédent de phosphore s''accumule dans les sols et rejoint les eaux par érosion, ce qui nourrit
  l''eutrophisation. Il est devenu presque nul, et négatif en 2023, ce qui signale un déstockage des sols plutôt
  qu''une absence de pression : les bornes devront en tenir compte. La consommation d''engrais phosphatés forme
  l''autre fiche de la famille.'
