motif_recommandation: Indice de perception de la corruption par la voie Eurostat (niveau 1), annuel et comparable
  de 2012 à 2025 (14 points, de 71 en 2012 à 66 en 2025, maximum 72), en alternative à l'indicateur WGI, plus long,
  variante principale de la famille corruption (D35).
note_pertinence: 'La corruption est nommée dans le contenu de la dimension et le CPI en est l''indicateur le plus
  connu, retenu par l''OCDE (14_6) et par l''UE. Le score français oscille entre 69 et 72 de 2012 à 2023 puis recule
  à 67 (2024) et 66 (2025). Les scores antérieurs à 2012 ne sont pas comparables : l''indicateur WGI de contrôle
  de la corruption, qui couvre 2000-2025, est la variante principale de la famille.'
