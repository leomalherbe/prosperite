motif_recommandation: Confiance dans le gouvernement nommée dans le contenu de la dimension et indicateur OCDE 14_3,
  2006-2025 (37,3 % en 2025), mais 7 valeurs seulement (moyennes Gallup sur 2 à 3 ans) et licence de réutilisation
  non trouvée (D26).
note_pertinence: 'La confiance dans le gouvernement est la mesure la plus citée de la confiance politique (OCDE).
  Aucune série publique annuelle n''a été trouvée pour la France : le baromètre du Cevipof n''est diffusé qu''en
  PDF (D9) et l''indicateur 16.i4 de l''INSEE ne couvre pas le gouvernement. La série Gallup, lissée par blocs de
  trois ans, est peu réactive et sa diffusion dépend de la réponse de l''OCDE sur les conditions de réutilisation
  (D26).'
