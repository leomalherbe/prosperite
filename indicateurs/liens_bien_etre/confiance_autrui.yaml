motif_recommandation: Confiance interpersonnelle rattachée à cette dimension (A11, R5), série la plus longue disponible
  (7 vagues, 2013-2025), bien que toutes les valeurs françaises portent le drapeau Eurostat de faible fiabilité
  « u ».
note_pertinence: 'La confiance envers les autres est un pilier du capital social (OCDE) et des interactions sociales
  (Eurostat). Eurostat signale des ruptures en 2018 et 2022 et une faible fiabilité pour toutes les années : la
  baisse de 5,9 (2018) à 4,5 (2021) ne peut pas être interprétée sans précaution. La série annuelle de l''INSEE
  (2020-2025) pourrait devenir la variante principale.'
