id: puits_carbone_utcatf
libelle: Puits de carbone des terres et des forêts (solde net de l'UTCATF)
dimension: planete
sous_theme: 'climat : émissions du territoire'
famille: puits_carbone_utcatf
variante_principale: oui
definition: Solde net des émissions et absorptions de gaz à effet de serre du secteur « utilisation des terres,
  changement d'affectation des terres et foresterie » (catégorie 4 de l'inventaire) ; une valeur négative est une
  absorption nette (puits).
unite: 'millions de tonnes équivalent CO2 (négatif : absorption)'
sens: bas
type: resultat
declaratif: non
composite: non
source_organisme: Eurostat
