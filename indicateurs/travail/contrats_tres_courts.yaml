motif_recommandation: Seule mesure des contrats très courts (trois mois au plus) nommés dans le contenu de la dimension,
  série Eurostat 2008-2025 (18 points) marquée « définition différente » depuis 2021.
note_pertinence: La multiplication des contrats de quelques semaines est une forme d'insécurité que la part des
  CDD ne montre pas. Les métadonnées Eurostat (lfsa_qoe_esms) définissent l'emploi précaire comme la part des salariés
  dont le contrat dure trois mois au plus ; une note Eurostat du 9 février 2018 donne 4,8 % pour la France en 2016,
  valeur de l'API. La série va de 4,8 % (2008) à 3,9 % (2025), avec des ruptures en 2014, 2021 et 2024 (collecte
  ciblée du robot, 15/10/2026).
