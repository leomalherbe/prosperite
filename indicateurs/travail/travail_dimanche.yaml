source_niveau: 1
url_api: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/lfsa_ewpsun?freq=A&unit=PC&sex=T&age=Y_GE15&wstatus=EMP&frequenc=USU&geo=FR
