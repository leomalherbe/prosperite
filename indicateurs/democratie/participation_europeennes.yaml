motif_recommandation: Seul scrutin dont la série couvre l'année 2000 par report de la valeur de 1999, 6 scrutins
  de 1999 à 2024 sur un champ homogène (de 40,78 % en 2009 à 52,95 % en 2024), recoupés avec les 3 valeurs publiées
  par l'INSEE depuis 2014 (D34).
note_pertinence: La participation aux européennes est la plus basse des scrutins nationaux mais remonte nettement
  depuis 2019 (51,28 %, puis 52,95 % en 2024). Son rythme régulier de cinq ans et la présence du scrutin de 1999
  donnent une série complète de 2000 à aujourd'hui avec le report de la dernière valeur.
