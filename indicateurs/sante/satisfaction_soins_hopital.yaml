notes: 'Parts recalculées le 16/10/2026 sur docs/sources/series/drees__barometre_2000_2025_distributions.csv, modalités
  1 et 2 rapportées aux répondants hors modalité 6 (formule de l''audit M06 §3) : 69,2 % (2010), 66,8 % (2013),
  75,2 % (2014), 72,6 % (2015), 65,0 % (2018), 68,5 % (2019), 71,4 % (2021), 60,8 % (2023), 63,7 % (2025), identiques
  aux valeurs de l''audit. Modalité 6 : 2,9 % des répondants en 2014, 4,8 % en 2019, 3,8 % en 2025 ; non-réponses
  : 0,2 % à 1,7 %. Contrôle de plausibilité (D38 b) : avec la convention du tableau officiel de la DREES (tous les
  répondants au dénominateur), le même calcul reproduit la valeur publiée de 2025 (61,29 %, docs/sources/series/drees__barometre_tc_simplifies_2025.txt)
  ; aucune valeur n''est publiée hors « jamais allé.e » (non_recoupe). Avant 2014, les non-réponses étaient plus
  fréquentes (1,1 % à 1,5 %) : une partie des non-usagers y figurait sans doute.'
