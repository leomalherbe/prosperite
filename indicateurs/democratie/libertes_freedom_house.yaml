motif_recommandation: Score global de Freedom House de 2002 à 2025 (24 points, 89 sur 100 en 2025), substituable
  à l'indice V-Dem de démocratie libérale (famille qualite_democratique, D35) mais à 7 valeurs distinctes seulement,
  sans licence trouvée et absent de la table des cadres (non incontournable).
note_pertinence: 'Freedom House mesure les droits politiques et les libertés civiles, au cœur de la dimension, et
  recoupe largement l''indice V-Dem de démocratie libérale, variante principale de la même famille. Le score français
  a perdu 6 à 7 points depuis 2002-2014 (de 93 à 96 selon les années) : 91 en 2015, 90 de 2016 à 2020, 89 depuis
  2021, et il varie très peu d''une année à l''autre. Freedom House ne diffuse les éditions récentes que sur demande
  ; OWID relaie l''édition 2026 (données 2025).'
