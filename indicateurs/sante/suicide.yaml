note_pertinence: Le suicide est l'issue la plus grave des troubles psychiques et l'une des rares mesures annuelles
  de santé mentale. Le taux baisse de 16,9 à 13,0 pour 100 000 entre 2011 et 2023, avec des à-coups (15,8 en 2012,
  14,2 en 2022). Les séries Eurostat, OCDE (2000-2022) et Santé publique France sont en variantes.
