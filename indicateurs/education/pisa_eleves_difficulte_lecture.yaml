definition: Part des élèves de 15 ans dont le score PISA en compréhension de l'écrit est inférieur au niveau 2 de
  compétence, seuil de maîtrise insuffisante retenu par l'Union européenne (Eurostat, indicateur ODD sdg_04_40,
  d'après l'OCDE).
