note_pertinence: 'L''indicateur suit l''amélioration du parc neuf mais change de protocole : NEDC jusqu''en 2016,
  valeurs converties en WLTP de 2017 à 2019, WLTP depuis 2020, d''où un saut de 109,8 à 133,8 g/km en 2017. Il faudra
  raccorder la série ou ne lire que 2017-2025 (89,1 g/km en 2025, valeur provisoire). Il mesure des émissions d''homologation,
  pas l''usage réel des véhicules.'
