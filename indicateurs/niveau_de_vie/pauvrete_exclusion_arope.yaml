id: pauvrete_exclusion_arope
libelle: Personnes en risque de pauvreté ou d'exclusion sociale (AROPE)
dimension: niveau_de_vie
sous_theme: pauvreté et exclusion
famille: pauvrete_exclusion_arope
variante_principale: oui
definition: Part des personnes en risque de pauvreté (moins de 60 % du revenu médian), ou en situation de privation
  matérielle et sociale sévère, ou vivant dans un ménage à très faible intensité de travail (définition de la stratégie
  européenne 2030, EU-SILC).
unite: '% de la population'
sens: bas
type: resultat
declaratif: non
composite: oui
source_organisme: Eurostat
source_jeu: sdg_01_10 (indicateur ODD de l'UE, définition 2030 ; doublon ilc_peps01n)
source_serie_id: sdg_01_10?freq=A&age=TOTAL&unit=PC&geo=FR
source_niveau: 1
url_api: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/sdg_01_10?freq=A&age=TOTAL&unit=PC&geo=FR
url_page: https://ec.europa.eu/eurostat/databrowser/view/sdg_01_10/default/table?lang=fr
frequence: annuelle
premiere_annee: 2015
derniere_annee: 2025
nb_points_depuis_2000: 11
geo: FR
eligibilite_longlist: oui
ligne_id: estat-000001
hors_longlist: non
raccordement: 'a_etudier : l''ancienne définition (ilc_peps01, 2004-2020, cible UE 2020) couvre 2004-2014 et pourrait
  être raccordée sur 2015-2020'
incontournable: non
recommandation: retenir
motif_recommandation: Indicateur de l'objectif européen et français 2030 (−1,1 million de personnes en France par
  rapport à 2019, objectifs officiels du référentiel), annuel de 2015 à 2025 (11 points).
note_pertinence: 'L''AROPE est l''indicateur phare de l''Union européenne : il réunit la pauvreté monétaire, la
  privation sévère et l''exclusion de l''emploi. En France, il passe de 18,4 % en 2015 à 20,8 % en 2025, avec des
  ruptures en 2020 et 2022 (API Eurostat, lue le 14/10/2026). Comme il contient le taux de pauvreté et la privation
  sévère, il est marqué composite pour le contrôle de redondance (D18).'
