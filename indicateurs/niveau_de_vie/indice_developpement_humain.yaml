incontournable: non
recommandation: ecarter
motif_recommandation: 'Hors champ de la dimension : indice synthétique santé-éducation-revenu dont les trois composantes
  sont des fiches de sante, education et niveau_de_vie, et dont l''observatoire construit lui-même l''équivalent
  multidimensionnel (D18, double compte).'
note_pertinence: 'L''IDH est l''alternative au PIB la plus connue, mais il mélange trois dimensions de la grille
  : le cocher dans niveau_de_vie compterait deux fois la santé et l''éducation. Pour la France, il évolue lentement
  (0,92 en 2023, sortie du robot M04) et sert surtout aux comparaisons entre pays. Il pourrait figurer comme repère
  externe à côté de l''indice plutôt que comme indicateur.'
