hors_longlist: non
raccordement: 'non : série continue de 1959 à 2025 en base 2020'
incontournable: non
recommandation: retenir
motif_recommandation: Mesure des dépenses contraintes, voisine de la « part des dépenses de base dans le budget
  » du cadre Qualité de vie d'Eurostat, publiée par l'INSEE de 1959 à 2025 (26 points).
note_pertinence: 'Plus la part des dépenses contraintes est forte, moins le ménage dispose librement de son revenu
  : c''est l''origine de la notion de revenu « arbitrable », dont l''INSEE calcule aussi le pouvoir d''achat (variante
  de pouvoir_achat_uc). Le logement en représente l''essentiel, y compris les loyers imputés aux propriétaires :
  l''indicateur recoupe donc le coût du logement de logement_cadre_vie, à surveiller au contrôle de redondance.'
