  ; accès au numérique → logement_cadre_vie (A7) ; reprise après l'audit M06 (O1, D38 a, D46)
raccordement: 'non : série EU-SILC depuis 2004'
incontournable: non
socle_propose: non
recommandation: retenir_variante
motif_recommandation: Autre lecture de la famille privation_internet (équipement plutôt que connexion), série Eurostat
  annuelle de 2004 à 2025 (22 points), qui couvre les dix années antérieures à la principale et remonte depuis 2015
  quand la privation d'internet baisse.
note_pertinence: Ne pas avoir les moyens d'un ordinateur limite l'usage des services en ligne (démarches, recherche
  d'emploi, scolarité) même quand le logement est connecté. La part baisse de 10,5 % en 2004 à 2,2 % en 2015, puis
  remonte à 3,5 % en 2025 (API Eurostat lue le 16/10/2026), alors que la privation d'internet passe de 2,7 % à 1,6
  % de 2014 à 2025. La fiche est proposée en variante de la privation d'internet ; la session mère peut en faire
  une famille propre si elle juge les deux équipements non substituables.
