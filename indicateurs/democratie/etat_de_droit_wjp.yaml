definition: Score global (de 0 à 1) du Rule of Law Index du World Justice Project, moyenne de huit facteurs (limitation
  des pouvoirs du gouvernement, absence de corruption, gouvernement ouvert, droits fondamentaux, ordre et sécurité,
  application de la réglementation, justice civile, justice pénale) établis par enquêtes auprès des ménages et d'experts.
