motif_recommandation: Deuxième grande cause de décès après les cancers en taux standardisé, série annuelle de 2011
  à 2023 (224,76 pour 100 000 en 2011, 163,26 en 2023) sans drapeau.
note_pertinence: Les maladies cardiovasculaires sont une cible de la prévention (tabac, alimentation, activité physique)
  et de la prise en charge (urgences, traitements). Leur taux standardisé baisse de 27 % entre 2011 et 2023. Les
  cardiopathies ischémiques et les maladies cérébrovasculaires sont en variantes ; la série 1994-2010 (ancien jeu
  hlth_cd_asdr) n'est pas au catalogue.
