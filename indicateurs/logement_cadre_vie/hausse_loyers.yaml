definition: Taux de variation annuel de l'indice annuel des prix à la consommation des loyers d'habitation effectivement
  payés (poste COICOP 04.1, ensemble des ménages, France, base 2025), calculé par le projet à partir de l'indice
  publié par l'INSEE.
