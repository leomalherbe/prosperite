frequence: annuelle
premiere_annee: 2006
derniere_annee: 2024
nb_points_depuis_2000: 19
geo: FR-D976
eligibilite_longlist: oui
ligne_id: bdm-000781
hors_longlist: non
raccordement: 'a_etudier : rétropolation de 2000-2005 par l''évolution de sdg_04_10 (rupture de 2003), pas en niveau
  (Eurostat au-dessus de 1 à 1,5 point avant 2013) ; 2025 d''après Eurostat'
incontournable: oui
socle_propose: oui
recommandation: retenir
motif_recommandation: Concept présent dans les cinq cadres de bien-être (crosswalk §5), indicateur de richesse nationale
  doté de cibles européenne (moins de 9 %) et française (9,5 %) en 2030, annuel de 2006 à 2024 (19 points ; 7,9
  % en 2024), principal par exception à la méthode §4 (D44) pour son champ homogène rétropolé par la DEPP de 2003
  à 2013, la série d'Eurostat étant plus longue mais rompue en 2013.
note_pertinence: 'Les sorties précoces comptent les jeunes qui quittent l''école sans qualification du second cycle,
  premier facteur de risque d''exclusion durable. La série de l''INSEE (11,2 % en 2006, 7,9 % en 2024) est rétropolée
  par la DEPP de 2003 à 2013 sur le champ France hors Mayotte : elle atténue la rupture de questionnaire de 2013
  (−0,7 point de 2012 à 2013 contre −2,1 chez Eurostat) sans l''effacer (−2,2 points de 2012 à 2014 contre −3,0).
  La série Eurostat sdg_04_10 (2000-2025, 7,2 % en 2025) couvre les années manquantes et porte la cible européenne,
  en variante.'
