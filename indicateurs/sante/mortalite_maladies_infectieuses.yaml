motif_recommandation: Indicateur de la cible ODD 3.3 (mettre fin aux épidémies), annuel de 2001 à 2023 sans drapeau
  (5,80 pour 100 000 en 2001, 2,73 en 2011, 1,01 en 2023), seule mesure annuelle des maladies infectieuses au catalogue.
note_pertinence: La cible ODD 3.3 vise la fin des épidémies de sida, de tuberculose et d'hépatites. Ces décès deviennent
  rares en France (1,01 pour 100 000 en 2023, près de six fois moins qu'en 2001), ce qui rend la série peu discriminante
  en fin de période ; ses trois composantes sont en variantes. Les valeurs ont une décimale jusqu'en 2010 et deux
  à partir de 2011, signe probable de deux séries sources raccordées par Eurostat (non documenté dans la réponse
  de l'API).
