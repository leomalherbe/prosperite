definition: Part des adultes résidant en France métropolitaine (âge minimal à vérifier) qui répondent « oui, plutôt
  » à la question PE03 du baromètre d'opinion de la DREES (« pensez-vous qu'il y a un risque que vous deveniez pauvre
  dans les cinq prochaines années ? ») ; part pondérée, les réponses « je me considère déjà comme pauvre » et les
  non-réponses étant comptées au dénominateur. La réponse « déjà pauvre » (modalité 3) est la fiche niveau_de_vie/pauvrete_ressentie.
