note_pertinence: 'L''indicateur porte sur la société et non sur la personne interrogée : c''est une opinion, sensible
  au climat politique et à l''actualité. Il ne figure comme indicateur dans aucun cadre de référence (le Doughnut
  a une dimension « cohésion sociale » mesurée autrement). Les « ne sait pas », comptés au dénominateur, passent
  de 0,63 % (2017) à 5,31 % (2018) puis restent entre 2,26 et 4,25 % (2019-2025) : rupture possible de protocole
  en 2018, comme pour niveau_de_vie/risque_pauvrete_ressenti.'
