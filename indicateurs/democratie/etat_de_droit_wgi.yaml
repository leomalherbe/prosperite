notes: 'Score 0-100 : 74,61 en 2025 (sortie du robot M04, 27 valeurs de 1996 à 2025 ; série complète non relue,
  API de la Banque mondiale refusée à l''outil le 15/10/2026). Estimation (variante, extrait du robot, mise à jour
  WGI du 25/09/2026) : 1,35 (2000), 1,47 (2005), 1,28 (2010), 1,26 (2017), 1,10 (2021), 0,97 (2025). Série principale
  passée de l''estimation au score 0-100 après lecture de la documentation WGI (audit M06 J5). Sous-indices V-Dem
  d''État de droit en variantes (D35). Année = année observée.'
