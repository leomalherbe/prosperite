motif_recommandation: Seule mesure publique et annuelle de l'adhésion syndicale depuis 2000 (25 années sur 2000-2025,
  de 8,06 % en 2000 à 6,81 % en 2025), candidat de la dimension (D33), calculée par le robot sans valeur officielle
  publiée pour la recouper (D34).
note_pertinence: L'adhésion à un syndicat mesure l'engagement dans la représentation collective des intérêts, une
  forme de participation que le vote ne capte pas. La part des adhérents baisse de 8,06 % (2000) à 5,49 % (2019)
  puis remonte à 6,99 % (2024) et 6,81 % (2025). Le sens « haut » suppose qu'une présence syndicale plus dense renforce
  la voix des citoyens ; la série porte sur toute la population interrogée, retraités et inactifs compris, et ne
  se compare pas à un taux de syndicalisation des salariés.
