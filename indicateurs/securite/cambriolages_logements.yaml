notes: 'Valeurs relues sur l''API Eurostat le 14/10/2026 (259,74 en 2008, 381,75 en 2013, 361,29 en 2016, 259,67
  en 2020, 295,47 en 2024, aucun drapeau). Taux de plainte : INSEE, enquête CVS 2019 (page insee.fr 2526026, lue
  le 14/10/2026 : 44,6 % pour un cambriolage ou une tentative) ; SSMSI, taux de dépôt de plainte des ménages victimes
  de cambriolage (enquête CVS, 2006-2020, dernière valeur 52,7 % en 2020), catalogué dans la long-list democratie
  (m04-000298) : la stabilité du taux sur 2006-2020 est à vérifier sur ses valeurs, non lues ici (SEC-3).'
