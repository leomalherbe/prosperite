motif_recommandation: Seule mesure de l'eutrophisation des eaux marines au catalogue, moyenne sur quatre ans publiée
  par Eurostat sans drapeau de 2001 à 2025 (2,35 % en 2010, 0,02 % en 2017, 1,23 % en 2025), préférée à la valeur
  annuelle erratique (J3).
note_pertinence: 'L''eutrophisation marine résulte des apports d''azote et de phosphore des fleuves, que mesurent
  les fiches de flux à la mer. L''indicateur est relatif : il compte les anomalies de chlorophylle par rapport à
  1998-2017, pas un niveau absolu d''eutrophisation. La valeur annuelle, en variante, vaut 0,00 % quatre années
  sur les dix dernières et 4,82 % en 2024, d''où le choix de la moyenne publiée.'
