note_pertinence: 'Le risque de pauvreté des 18-24 ans est resté autour de 20 % quand celui des 65 ans ou plus baissait
  jusqu''en 2017 puis remontait : l''écart mesure cette inégalité entre générations. Le taux des 18-24 ans inclut
  des étudiants hors du domicile parental dont les ressources sont mal mesurées. Ruptures en 2004, 2020 et 2022.'
