variante_principale: oui
definition: Part des évaluations d'habitats d'intérêt communautaire (directive Habitats-Faune-Flore) jugées dans
  un état de conservation favorable, France métropolitaine, moyenne sur la période de rapportage de six ans (indicateur
  national ODD 15.i2).
