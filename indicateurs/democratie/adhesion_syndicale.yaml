notes: 'Parts « oui » lues dans la sortie de la vague 10 du robot (docs/sources/series/drees__barometre_2000_2025_syndicat_association.csv,
  distribution pondérée des questions SDASSYND_1 et SDASSYND_2) : 8,06 % (2000), 8,93 % (2001), 8,66 % (2002), 8,67
  % (2004), 7,81 % (2010), 7,41 % (2012), 5,49 % (2019), 6,29 % (2022), 6,99 % (2024), 6,81 % (2025) ; « ne sait
  pas » (999999999) au plus 0,62 % (2023), absent avant 2016 (des non-réponses laissées vides seraient exclues du
  dénominateur). Couverture 2000-2002 et 2004-2025 lue dans docs/sources/series/drees__barometre_2000_2025_couverture.csv
  ; libellés de la question et des modalités lus dans les dictionnaires 2025 (1 = oui, 2 = non, 999999999 = ne sait
  pas). Recoupement (D34) : aucune valeur publiée par la DREES pour cette question n''a été trouvée (les tableaux
  simplifiés 2025 au dépôt ne la contiennent pas) ; la méthode du robot est recoupée sur la question PE03 en 2025
  (fiche securite/risque_pauvrete_ressenti). Échantillon représentatif de la population vivant en France métropolitaine
  (page du jeu) ; licence non indiquée sur la page du jeu.'
