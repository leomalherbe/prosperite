id: participation_departementales
libelle: Taux de participation au premier tour des élections cantonales puis départementales
dimension: democratie
sous_theme: participation électorale
famille: participation_electorale
variante_principale: non
definition: Part des électeurs inscrits ayant voté au premier tour des élections cantonales (jusqu'en 2011) puis
  départementales (depuis 2015) ; votants rapportés aux inscrits, tous bureaux de vote du fichier agrégé du ministère
  de l'Intérieur.
unite: '% des inscrits'
sens: haut
type: resultat
declaratif: non
composite: non
source_organisme: Ministère de l'Intérieur (résultats électoraux), calcul du projet
source_jeu: Données des élections agrégées (data.gouv.fr, fichier general_results au bureau de vote, Licence Ouverte
  2.0)
source_serie_id: https://data-pipeline-open.s3.sbg.io.cloud.ovh.net/elections/general_results.parquet (somme votants
  / somme inscrits)
source_niveau: 2
url_api: https://data-pipeline-open.s3.sbg.io.cloud.ovh.net/elections/general_results.parquet
url_page: https://www.data.gouv.fr/fr/datasets/6481e741d4cf002ec0efec9d/
frequence: irreguliere
formule: taux = somme des votants / somme des inscrits de l'ensemble des bureaux de vote du fichier pour le scrutin
  ; série annuelle reconstruite en reportant la valeur du dernier scrutin jusqu'au scrutin suivant (D17)
premiere_annee: 2001
derniere_annee: 2021
nb_points_depuis_2000: 6
geo: FR
eligibilite_longlist: a_verifier
ligne_id: m04-000251
hors_longlist: non
raccordement: non
incontournable: oui
recommandation: ecarter
motif_recommandation: 'Champ rompu en 2015 : les cantonales de 2001 à 2011 ne concernaient qu''environ la moitié
  des électeurs (19,6 à 21,4 millions d''inscrits dans le fichier) contre 42,7 millions aux départementales de 2015.'
note_pertinence: Les cantonales renouvelaient les conseils généraux par moitié, si bien que chaque scrutin ne portait
  que sur une partie du territoire ; la réforme de 2015 fait voter tous les électeurs. La série mêle donc deux champs
  et son niveau de 2021 (33,32 %) est marqué par l'épidémie.
