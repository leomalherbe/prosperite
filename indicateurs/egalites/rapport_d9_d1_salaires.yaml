definition: Rapport entre le salaire net annuel en équivalent temps plein au-dessus duquel se situent les 10 % les
  mieux payés et celui au-dessous duquel se situent les 10 % les moins payés, salariés du secteur privé (base Tous
  salariés ; France métropolitaine jusqu'en 1999, France ensuite).
