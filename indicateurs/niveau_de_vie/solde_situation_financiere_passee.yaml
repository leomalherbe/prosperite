definition: Solde des réponses (part des ménages déclarant une amélioration moins part déclarant une détérioration)
  à la question sur l'évolution de leur situation financière personnelle au cours des douze derniers mois, enquête
  mensuelle de conjoncture auprès des ménages (Camme), France métropolitaine ; moyenne annuelle des 12 mois à calculer.
