motif_recommandation: Plus longue série de prévention au catalogue, annuelle de 2000 à 2025 (53,0 % en 2000, 64,8
  % en 2009, 48,5 % en 2015, 59,9 % en 2021, 53,7 % en 2025), admise comme moyen (D19).
note_pertinence: La vaccination antigrippale des personnes âgées réduit la mortalité hivernale ; son taux mesure
  l'adhésion à la prévention. La couverture recule de 63,9 % en 2010 à 48,5 % en 2015, remonte à 59,9 % en 2021
  (épidémie de Covid-19) puis redescend à 53,7 % en 2025. Les valeurs de 2000 à 2004 sont arrondies à l'unité et
  la série porte une rupture (« b ») en 2005.
