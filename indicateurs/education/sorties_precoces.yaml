id: sorties_precoces
libelle: Sorties précoces du système scolaire (18-24 ans)
dimension: education
sous_theme: diplômes et sorties précoces
famille: sorties_precoces
variante_principale: oui
definition: Part des jeunes de 18 à 24 ans qui ne suivent ni études ni formation et n'ont pas de diplôme du second
  cycle du secondaire (CAP, BEP ou plus), en moyenne annuelle (INSEE, enquête Emploi, France hors Mayotte). Indicateur
  de richesse nationale n° 8 et indicateur national ODD 4.i4.
unite: '% des 18-24 ans'
sens: bas
type: resultat
declaratif: non
composite: non
