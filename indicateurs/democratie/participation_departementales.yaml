motif_recommandation: Scrutin départemental renouvelé en entier depuis 2015, 2 scrutins comparables sur un champ
  homogène (50,17 % en 2015, 33,32 % en 2021) recoupés avec l'INSEE, admis comme série irrégulière (D17, D28) plutôt
  qu'écartés pour leur seul nombre (D32).
note_pertinence: 'Les départementales mesurent la participation à l''échelon départemental : 50,17 % en 2015 et
  33,32 % en 2021, scrutin tenu pendant l''épidémie le même jour que les régionales. Les cantonales de 2001 à 2011
  ne portaient que sur la moitié des cantons (19,6 à 21,4 millions d''inscrits contre 42,7 millions en 2015) : elles
  sont exclues de la série. Avec deux scrutins, l''indicateur montre un niveau plus qu''une trajectoire.'
