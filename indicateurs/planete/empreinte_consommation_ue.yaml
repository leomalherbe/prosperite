hors_longlist: non
raccordement: non
incontournable: non
socle_propose: non
recommandation: retenir
motif_recommandation: Seul indicateur public qui rapporte l'ensemble des impacts de la consommation aux limites
  planétaires, série Eurostat sans drapeau de 2010 à 2024 (3,27 en 2010, 3,17 en 2024), admis comme composite (D18).
note_pertinence: L'indicateur prolonge la logique de plafond de la dimension en rapportant la consommation aux limites
  planétaires. Il repose sur un modèle (analyse du cycle de vie de produits représentatifs) dont les hypothèses
  pèsent sur le niveau, et sa pondération est conventionnelle. Les seize catégories d'impact et la note par habitant
  sont en variantes.
