definition: Part des diplômés récents (sortis depuis un à trois ans) du second cycle du secondaire ou du post-secondaire
  professionnel (CITE 35 et 45), âgés de 20 à 34 ans, qui ont eu une expérience professionnelle pendant leurs études,
  d'après l'enquête européenne sur les forces de travail (Eurostat edat_lfs_9919) ; indicateur de l'objectif européen
  d'au moins 60 % de diplômés de l'enseignement professionnel exposés à la formation par le travail en 2025.
