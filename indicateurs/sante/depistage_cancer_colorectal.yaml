notes: 'Valeurs lues sur l''API Eurostat le 14/10/2026 (hlth_ps_prev, sex=T : C50 et C53 sans valeur, « m » en 2015
  et 2016). Série de Santé publique France lue dans docs/sources/series/spf_odisse__cancer-participation-au-depistage-organise-du-cancer-du-colon-rectum-france-copie.txt
  (vague 13 du robot, 16/10/2026) : la valeur Eurostat de l''année N est le taux standardisé de participation de
  la population éligible de la campagne N-1/N (28,16 % pour 2010-2011 contre 28,20 % en 2011 ; 24,85 % pour 2019-2020
  contre 24,90 % en 2020 ; 29,57 % pour 2023-2024 contre 29,60 % en 2024) ; elle ne comble pas 2015-2016 et ajoute
  2024-2025 (30,74 %) : variante, Eurostat reste principal (audit M06 O4). Objectif de participation des lignes
  directrices européennes : non trouvé (à chercher avant le socle des bornes).'
