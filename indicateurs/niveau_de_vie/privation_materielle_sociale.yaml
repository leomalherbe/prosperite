notes: 'Valeurs de la BDM (mise à jour du 27/05/2026) : 11,7 (2013), 12,9 (2014), 11,8 (2015), 12,1 (2016), 11,4
  (2017), 11,9 (2018), 12,4 (2019), 12,3 (2020), 10,5 (2021), 12,9 (2022), 13,1 (2023), 12,7 (2024, révisée), 2025
  sans valeur. Même concept qu''EU-SILC (ilc_mdsd07, 2014-2025 : 14,1 en 2014, 13,1 en 2019, 10,5 en 2021, 13,3
  en 2025, drapeau b en 2020 et 2022, API lue par l''audit M06) mais valeurs différentes avant 2020 : EU-SILC dépasse
  l''INSEE de 0,7 à 1,2 point sur 2014-2019, de 0 à 0,4 point ensuite. L''INSEE (Insee Résultats « Privations matérielles
  et sociales depuis 2013 », https://www.insee.fr/fr/statistiques/7738980, lue le 16/10/2026) écrit que la refonte
  de SRCV (panel ramené de 9 à 4 ans, pondérations et imputations revues) « génère une rupture de série entre 2019
  et 2020 » qui « impacte légèrement à la hausse le taux » : la série 2013-2019 n''est pas rétropolée, le drapeau
  rupture_2020 s''applique à la principale ; la rupture EU-SILC de 2022 n''est pas mentionnée par l''INSEE (à vérifier).
  Eurostat est plus frais d''un an mais commence un an plus tard : la règle INSEE > Eurostat à définition égale
  est gardée (choix jugé défendable par l''audit). Variantes : copie Melodi, 16 ans ou plus (BDM 010777531), EU-SILC
  (ilc_mdsd07) et ventilations, nombre moyen de privations (ilc_sis4), éléments sans fiche propre (voiture, dont
  par handicap hlth_dm110 renvoyé par sante, vêtements, chaussures, meubles, petite somme), série SRCV Melodi 2020-2025
  (catalogue des séries écartées, maintenance n° 8).'
