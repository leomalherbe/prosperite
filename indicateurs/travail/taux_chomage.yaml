id: taux_chomage
libelle: Taux de chômage au sens du BIT
dimension: travail
sous_theme: chômage
famille: taux_chomage
variante_principale: oui
definition: Part des chômeurs au sens du BIT (sans emploi, disponibles, ayant cherché activement un emploi) parmi
  les actifs de 15 ans ou plus, en moyenne annuelle (INSEE, enquête Emploi, séries longues rétropolées, champ France
  entière).
unite: '% de la population active de 15 ans ou plus'
sens: bas
type: resultat
declaratif: non
composite: non
source_organisme: INSEE
source_jeu: Melodi DD_EEC_SERIES (enquête Emploi, séries longues), mesure UNEMPRATE
