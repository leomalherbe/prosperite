motif_recommandation: Seule mesure de l'état des sols au catalogue, 4 estimations (2000, 2010, 2016, 2023) passées
  de 4,14 % à 3,08 % (2023 provisoire), admise comme série irrégulière (D17).
note_pertinence: L'érosion détruit les sols fertiles et emporte sédiments et polluants vers les rivières. La série
  est modélisée à quatre dates seulement, et ses variations reflètent aussi les révisions du modèle. La ventilation
  par occupation du sol (2000-2016) est en variante.
