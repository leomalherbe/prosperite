recommandation: retenir
motif_recommandation: >-
  Seule mesure de la fréquence des violences conjugales indépendante de la plainte (enquête, 2010-2023), mais imprécise
  (0,2 à 0,9 %, arrondi au dixième) et rompue entre 2018 et 2021.
note_pertinence: >-
  Les violences conjugales sont au cœur des politiques de sécurité récentes et leur enregistrement par la police
  a fortement augmenté avec la libération de la parole : seule l'enquête permet d'en suivre la fréquence. La série
  baisse de 0,7-0,9 % (2010-2014) à 0,5-0,6 % (2015-2018), mais la précision est faible. La part des victimes dans
  le cercle familial hors conjoint et le nombre total de victimes intrafamiliales sont des variantes.
