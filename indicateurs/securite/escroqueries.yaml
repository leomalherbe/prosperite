notes: 'Filtre dans la base SSMSI : Titre « Escroqueries et les fraudes aux moyens de paiements enregistrées par
  les services de sécurité (Données annuelles) », Zone = France. Composantes : m04-000280 (2016-2025) et population
  moyenne 001641584 (1982-2025, Mayotte incluse depuis 2014) ; champ « France » de la base SSMSI (métropole et DROM)
  à confirmer ; recoupement (D34) avec le taux ITDD des fraudes aux moyens de paiement (m04-000307, pour 1 000 habitants,
  2016-2024, champ plus étroit) à faire si la fiche était retenue. Taux de plainte : série SSMSI « Escroqueries
  bancaires » (enquête CVS, 2010-2020, dernière valeur 12,8 % en 2020 ; docs/sources/series/ssmsi__series_chronologiques.csv,
  non cataloguée, SEC-3).'
