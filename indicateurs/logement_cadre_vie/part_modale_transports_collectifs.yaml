motif_recommandation: Seule série annuelle du recours aux transports collectifs, Eurostat de 2000 à 2024 (25 points),
  plus longue que les composantes publiées par l'INSEE de 2010 à 2024.
note_pertinence: 'La part des transports collectifs reflète à la fois l''offre de transports publics et la dépendance
  à la voiture, qui pèse sur le budget et le temps des ménages. Aucun indicateur d''accessibilité des transports
  (ODD 11.2.1) n''existe en série annuelle pour la France : la part modale est la seule mesure du contenu « transports
  collectifs » de la dimension. Elle recoupe la planète (émissions des transports), mais son rattachement suit le
  contenu de la dimension.'
