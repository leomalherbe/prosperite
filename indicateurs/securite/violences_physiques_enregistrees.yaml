motif_recommandation: 'Les agressions graves enregistrées passent de 294 à 613 pour 100 000 habitants entre 2008
  et 2024 alors que la part de victimes de violences physiques dans l''enquête ne progresse pas (2,1 % en 2010 comme
  en 2018) : la série mesure surtout l''évolution des plaintes et de leur enregistrement.'
note_pertinence: La délinquance enregistrée dépend de la propension des victimes à porter plainte et de l'activité
  des services ; pour les violences physiques, la hausse est portée en partie par les violences intrafamiliales,
  mieux révélées qu'avant (analyse M04, docs/sources/autres_sources.md §2.4). La série reste utile pour la conjoncture,
  mais pas comme indicateur de résultat sans l'enquête. Le SSMSI publie l'équivalent national en nombre de victimes
  (2016-2025).
