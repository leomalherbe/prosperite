variante_principale: oui
definition: 'Nombre de décès consécutifs à un accident du travail reconnu, survenus avant consolidation, pour 100
  000 salariés du régime général de la Sécurité sociale (Assurance maladie, risques professionnels) ; calculé par
  le projet : décès de l''année (jeu des décès au travail) rapportés aux salariés de l''année (jeu de sinistralité).'
unite: décès pour 100 000 salariés
sens: bas
type: resultat
declaratif: non
