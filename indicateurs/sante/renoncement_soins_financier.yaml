incontournable: non
recommandation: retenir_variante
motif_recommandation: Composante financière des besoins non satisfaits, annuelle de 2008 à 2025 (1,6 % en 2008,
  1,9 % en 2025), identique sur 2010-2023 à l'indicateur national ODD 3.i7a de l'INSEE.
note_pertinence: Le renoncement pour raisons financières est l'indicateur d'accès aux soins le plus suivi en France
  (ODD national). Eurostat est préféré à la série INSEE de même définition parce qu'il couvre 2008-2025 contre 2010-2023
  (D35). La série tombe de 2,3 % en 2014 à 0,8 % en 2015 sans drapeau puis remonte à 2,0 % en 2020.
