notes: 'Parts calculées sur docs/sources/series/drees__barometre_2000_2025_sdproxim_sdf.csv (vague 15 du robot,
  16/10/2026 ; modalités 2 à 8, « ne sait pas » exclus) : 9,18 (2000), 12,70 (2001), 11,23 (2002), 12,57 (2004),
  14,53 (2005), 12,90 (2006), 13,15 (2007), 15,97 (2008), 12,51 (2009), 13,61 (2010), 11,25 (2011), 11,94 (2012),
  10,78 (2013), 9,34 (2014), 11,67 (2015), 11,90 (2016), 11,46 (2017), 9,25 (2018), 10,15 (2019 et 2020), 8,93 (2021),
  9,87 (2022), 11,27 (2023), 9,89 (2024), 9,33 (2025) ; avec les « ne sait pas » au dénominateur, l''écart est au
  plus de 0,13 point (2002). Modalités lues dans le dictionnaire 2025 : 1 « non » ; 2 « oui, dans votre famille
  » ; 3 « oui, hors famille » ; 4 « oui, vous-même » ; 5 à 8 combinaisons ; NSP. Modalités présentes : 1 à 3 en
  2000, 1 à 4 de 2001 à 2013, combinaisons 5 à 8 à partir de 2014 (réponses multiples possibles depuis cette date,
  sans rupture visible de la part des « oui ») ; « vous-même » ne dépasse pas 0,17 % (2005). Contrôle de plausibilité
  (D38 b) : (1) le même calcul reproduit les valeurs publiées par la DREES pour d''autres questions du même fichier
  (OG04_1 en 2025 ici, PE03 en securite, OG04_6 et SDRICHOM en travail) ; (2) les parts somment à 100 à 0,01 près
  et les « ne sait pas » ne dépassent pas 1,09 % (2002) ; (3) ordre de grandeur : 141 500 personnes sans domicile
  en France métropolitaine début 2012 (INSEE Première n° 1455, juillet 2013, page lue le 16/10/2026), soit environ
  0,2 % de la population, pour 11,9 % de répondants qui en connaissent une, ce qui est compatible avec un entourage
  de plusieurs dizaines de personnes (ordre de grandeur, pas une validation) ; (4) la tendance diffère : l''INSEE
  mesure une hausse de près de 50 % du nombre de sans-domicile de 2001 à 2012, la part passe de 12,7 % à 11,9 %.
  Aucune valeur publiée de cette question n''a été trouvée (synthèses du baromètre 2015 et 2017, Dossiers solidarité
  et santé n° 61, sondage IFOP 2020 sur le logement : recherches du 16/10/2026) ; elle est absente des tableaux
  publiés de 2025. Déclaratif oui (D42), par exception à la méthode §4 qui classe les faits déclarés en déclaratif
  non. Les autres questions SDPROXIM (chômage, familles monoparentales sous le SMIC, emploi précaire, RSA, handicap,
  dépendance) relèvent d''autres dimensions et ne sont pas reprises.'
