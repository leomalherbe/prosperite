note_pertinence: 'La sous-occupation concerne surtout des ménages restés dans un logement devenu grand pour eux
  : elle traduit un confort mais aussi un parc mal ajusté aux besoins. Ni une hausse ni une baisse ne sont un progrès
  univoque ; la fiche est écartée comme l''exige la charte (§3.4).'
