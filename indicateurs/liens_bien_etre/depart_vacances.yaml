rattachement_propose: 'hors long-list : jeu Eurostat tour_dem_totot exclu au niveau 1 par M02 (« domaine hors périmètre
  (tourisme) ») ; rattachement proposé à liens_bien_etre (vacances, A13), à trancher au gel 2'
raccordement: 'a_etudier : rupture de 2020 (reprise de l''enquête par l''INSEE) ; Eurostat n''a recalculé le coefficient
  d''extrapolation que depuis 2018, 2012-2017 restent sur l''ancienne méthode'
incontournable: non
recommandation: retenir
motif_recommandation: Seule mesure du départ effectif en vacances, contenu explicite de la dimension (A13), annuelle
  de 2012 à 2025 (14 points vérifiés à la source), malgré une rupture de série en 2020 documentée par Eurostat.
note_pertinence: 'Partir en vacances est un marqueur de bien-être et d''inclusion sociale ; l''enquête interroge
  les résidents sur leurs voyages, c''est un résultat pour les personnes et non une statistique d''entreprises.
  Eurostat documente une rupture en 2020 (reprise de l''enquête par l''INSEE, niveaux relevés), un questionnaire
  révisé en 2023 et 2024 et un échantillon tiré d''un panel non aléatoire. La série décroche aussi entre 2016 (63,1
  %) et 2017 (57,4 %) sans explication dans les métadonnées : elle ne s''utilise qu''avec ces réserves.'
