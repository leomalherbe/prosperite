notes: 'Valeurs lues (sdg_06_20, WWT_GE2, mise à jour Eurostat du 18/09/2026, aucun drapeau) : 77,30 (2001), 79,50
  (2004), 77,70 (2010), 80,46 (2016), 79,56 (2022 et 2023), 80,00 (2024) ; aucune valeur de 2005 à 2009. Libellé
  de la modalité : « Traitement des eaux usées urbaines, individuelles (autonomes) et autres - avec au moins un
  traitement secondaire ». Décomposition lue (env_ww_con, France, % de la population, mise à jour Eurostat du 18/09/2026,
  lue le 16/10/2026) : stations urbaines à traitement secondaire 13,20 (2010) et 9,50 (2024), à traitement tertiaire
  64,50 (2010) et 70,50 (2024), dont la somme égale la série (77,70 et 80,00) ; traitement non spécifié 4,30 (2010),
  1,46 (2012), 2,44 (2022), 1,90 (2024) ; part collectée 82,00 et traitement individuel 18,00 chaque année depuis
  2010 (estimations) ; traitement individuel avec au moins un traitement secondaire : aucune valeur pour la France.
  Le motif de M05 (part non raccordée relevant de l''assainissement individuel) est donc confirmé, et la question
  J4 de l''audit tranchée en faveur du sens ambigu. Variante : env_ww_con, ww_tp=TOTAL (« total connecté au traitement
  des eaux usées », 100,00 % chaque année depuis 2010, intitulé à tort « population raccordée à des stations d''épuration
  » au catalogue). La part raccordée à un traitement tertiaire (élimination de l''azote et du phosphore) n''est
  pas cataloguée : piste pour planete, signalée (LOG-12). L''accès des ménages à des sanitaires est porté par logement_cadre_vie/sans_installations_sanitaires.'
