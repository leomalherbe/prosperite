definition: Part des spécialistes des technologies de l'information et de la communication (professions de la CITP-08
  retenues par Eurostat) dans l'emploi total, d'après l'enquête européenne sur les forces de travail (Eurostat isoc_sks_itspt).
unite: '% de l''emploi total'
