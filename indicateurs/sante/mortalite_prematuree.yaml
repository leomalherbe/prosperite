motif_recommandation: Mesure annuelle de l'INSEE de 1998 à 2025 (2,2 ‰ en 2000, 1,7 ‰ en 2025, provisoire), centrée
  sur les décès avant 65 ans que l'espérance de vie mêle aux décès des âges élevés.
note_pertinence: La mortalité prématurée isole les décès survenus avant 65 ans, ceux qui pèsent le plus sur les
  années de vie perdues. La série INSEE n'a qu'une décimale (2,2 ‰ de 1998 à 2001, 1,8 ‰ de 2016 à 2022), ce qui
  la rend peu sensible d'une année à l'autre. Les années potentielles de vie perdues de l'OCDE (2004-2022) et d'Eurostat
  (2011-2023) sont des variantes plus fines.
