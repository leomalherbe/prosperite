motif_recommandation: Lecture de la longévité aux âges élevés, annuelle de 2004 à 2024 (20,1 ans en 2004, 21,9 ans
  en 2024), indépendante de la mortalité infantile et juvénile.
note_pertinence: L'espérance de vie à 65 ans mesure les années restant à vivre à l'âge de la retraite et sert de
  référence aux années de vie en bonne santé au même âge. Elle passe de 22,0 ans en 2019 à 21,2 ans en 2020 (Covid-19)
  puis remonte à 21,9 ans en 2023 et 2024. L'INSEE la publie à 60 ans et par sexe (variantes, 1946-2025 en métropole).
