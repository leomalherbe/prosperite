notes: 'Valeurs lues sur l''API Eurostat le 14/10/2026 (aucun drapeau) : parents CITE 0-2 : 14,3 % (2019) et 18,6
  % (2023) ; CITE 3-4 : 9,1 et 10,5 % ; CITE 5-8 : 6,7 et 7,8 % ; écart A - B (A = parents CITE 0-2, B = parents
  CITE 5-8) : 7,6 (2019) et 10,8 points (2023) ; le recoupement (D34) ne peut porter que sur ces deux années publiées.
  ilc_igtp01 : la part des adultes de niveau CITE 3-4 dont les parents sont de niveau CITE 0-2 passe de 77,3 % (2019)
  à 46,8 % (2023), variation à expliquer avant tout usage.'
