motif_recommandation: Lecture en volume de la famille empreinte_carbone, grandeur des fourchettes indicatives de
  la SNBC 3, série INSEE-SDES annuelle de 1995 à 2024 (692 Mt en 2000, 563 Mt en 2024, estimée), le par habitant
  étant principal (D38 h).
note_pertinence: 'L''empreinte mesure la pression climatique du mode de vie français, où qu''elle s''exerce : elle
  complète l''inventaire territorial, qui ignore les importations, et forme une famille distincte (méthode §8).
  Le calcul combine l''inventaire national et des tableaux entrées-sorties internationaux pour les importations,
  révisés à chaque édition. Les cibles de la SNBC 3 en Mt se convertissent par habitant pour la fiche principale
  (D38 h) ; les ventilations par gaz et par origine (ménages, production intérieure, importations) sont en variantes.'
