geo: FE
eligibilite_longlist: oui
ligne_id: melodi-003812
hors_longlist: non
raccordement: 'non : série rétropolée par l''INSEE depuis 1975'
incontournable: non
recommandation: retenir
motif_recommandation: Indicateur de référence du chômage, présent dans le cadre Qualité de vie d'Eurostat, publié
  par l'INSEE en série annuelle rétropolée de 1975 à 2025 (26 points depuis 2000).
note_pertinence: 'C''est la mesure du chômage la plus connue du public, comparable dans le temps grâce à la rétropolation
  de l''INSEE. Le taux de chômage n''atteint pas trois cadres au §5 du crosswalk (incontournable : non), mais il
  est indispensable à la question de la dimension. Les demandeurs d''emploi inscrits à France Travail forment une
  série voisine, administrative, gardée dans la même famille.'
