notes: 'Valeurs non lues (API Melodi fermée à l''outil). Vagues de l''enquête : 2009-2010, 2014-2015, 2017-2018,
  2020-2021, 2023-2024 (métadonnées du jeu Melodi). Variantes : autres médianes (brut, net, courants ou constants,
  France hors Mayotte depuis 2015), patrimoine moyen et ses composantes, OCDE 1_3 (2009-2020), valeur nette du patrimoine
  des ménages dans les comptes nationaux (total, euros courants).'
