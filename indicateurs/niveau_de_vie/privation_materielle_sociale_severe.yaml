frequence: annuelle
premiere_annee: 2015
derniere_annee: 2025
nb_points_depuis_2000: 11
geo: FR
eligibilite_longlist: oui
ligne_id: estat-000040
hors_longlist: non
raccordement: 'a_etudier : l''ancien taux de privation matérielle sévère (4 privations sur 9, ilc_mddd11, 2004-2020)
  est en variante pour couvrir 2004-2014 avec une autre définition'
incontournable: oui
recommandation: retenir_variante
motif_recommandation: Composante de l'AROPE et indicateur ODD européen (sdg_01_31), annuel de 2015 à 2025 (11 points),
  lecture « privation grave » substituable au taux à 5 privations, principal de la famille.
note_pertinence: Le seuil de 7 privations isole les situations les plus dures ; c'est la composante « privation
  » de l'indicateur européen AROPE. En France, il oscille entre 5,5 % (2021) et 7,3 % (2019) et vaut 7,0 % en 2025
  (API Eurostat, lue le 14/10/2026). L'INSEE ne le publie pas dans la BDM.
