motif_recommandation: Satisfaction à l'égard des urgences hospitalières, objet voisin des hôpitaux publics, posée
  chaque année de 2010 à 2025 (16 vagues ; 63,0 % en 2010, 41,4 % en 2019, 38,3 % en 2023, 41,1 % en 2025), calculée
  par le projet et non encore recoupée (D34).
note_pertinence: Les urgences sont la porte d'entrée de l'hôpital pour les soins non programmés ; la satisfaction
  à leur égard recule bien plus que celle envers les hôpitaux publics (de 63,0 % à 41,1 % entre 2010 et 2025, contre
  69,2 % à 61,3 %). La série baisse par paliers (54,9 % en 2012, 42,1 % en 2018, 38,6 % en 2022), avec une remontée
  en 2020 et 2021 (49,4 % et 51,0 %). La modalité « jamais allé.e » apparaît en 2014 et ses répondants restent au
  dénominateur, comme pour la fiche principale.
