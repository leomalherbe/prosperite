motif_recommandation: Variante principale de la famille CPI (D18) par la voie Eurostat (niveau 1), annuelle et comparable
  de 2012 à 2025 (14 points, de 72 à 66).
note_pertinence: La corruption est nommée dans le contenu de la dimension et le CPI en est l'indicateur le plus
  connu, retenu par l'OCDE (14_6) et par l'UE. Le score français oscille entre 69 et 72 de 2012 à 2023 puis recule
  à 67 (2024) et 66 (2025). Les scores antérieurs à 2012 ne sont pas comparables, d'où l'absence de valeurs 2000-2011.
