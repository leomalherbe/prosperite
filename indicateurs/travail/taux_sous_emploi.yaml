id: taux_sous_emploi
libelle: Taux de sous-emploi
dimension: travail
sous_theme: sous-emploi et temps partiel
famille: sous_emploi
variante_principale: oui
definition: 'Part des personnes en emploi en situation de sous-emploi au sens du BIT : à temps partiel souhaitant
  travailler davantage et disponibles pour le faire, ou à temps complet ayant involontairement travaillé moins que
  d''habitude (chômage partiel ou technique), en moyenne annuelle (INSEE, séries longues).'
unite: '% des personnes en emploi'
sens: bas
type: resultat
declaratif: non
composite: non
source_organisme: INSEE
source_jeu: Melodi DD_EEC_SERIES (enquête Emploi, séries longues), mesure PT_UNDEREMP_SEX_AGE_IN_EMP
