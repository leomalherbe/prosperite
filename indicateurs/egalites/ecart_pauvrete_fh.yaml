motif_recommandation: Écart de signe presque constant de 2004 à 2025 (1,5 point en 2004, -0,2 en 2018, 2,0 en 2025),
  calculé sur une série annuelle d'Eurostat et seule mesure de l'écart de pauvreté selon le sexe pour toute la population.
note_pertinence: 'La pauvreté est mesurée au niveau du ménage : l''écart entre femmes et hommes vient surtout des
  familles monoparentales et des femmes âgées seules, et il sous-estime les inégalités au sein des couples. Chez
  les 65 ans ou plus, l''écart est plus net (13,1 % contre 9,8 % en 2025). L''unique valeur négative (2018) est
  faible : le sens « bas » reste lisible.'
