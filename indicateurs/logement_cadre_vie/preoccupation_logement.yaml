notes: 'Parts recalculées sur docs/sources/series/drees__barometre_2000_2025_distributions.csv (somme des modalités
  1 « beaucoup » et 2 « assez » de og04_1, « ne sait pas » au dénominateur) : 66,23 (2014), 62,10 (2015), 62,49
  (2016), 63,87 (2017), 59,89 (2018), 59,22 (2019), 54,01 (2020), 54,49 (2021), 53,86 (2022), 56,77 (2023), 55,77
  (2024), 55,36 (2025) ; part des « ne sait pas » au plus 0,30 % (2020), nulle en 2017 et en 2025. Recoupement (D34,
  D38 b) : les tableaux croisés simplifiés publiés par la DREES pour 2025 (feuille 5 de docs/sources/series/drees__barometre_tc_simplifies_2025.txt)
  donnent « S/T Oui » = 55,35 % (beaucoup 19,16 ; assez 36,20), identique au calcul (55,36 %, 55,35 % rapporté au
  total des parts arrondies) ; aucune valeur publiée n''a été trouvée pour 2014-2024 (non_recoupe_2014_2024). Convention
  du dénominateur (D45) : « ne sait pas » compris, comme la base des tableaux publiés par la DREES et la fiche travail/preoccupation_chomage
  ; l''année 2025, sans « ne sait pas », ne départage pas les conventions, dont l''écart est au plus de 0,16 point
  (2020). Libellés de la question et des modalités lus dans les dictionnaires 2025 du robot ; couverture 2014-2025
  (12 années) lue dans drees__barometre_2000_2025_couverture.csv. Questions voisines non retenues : LO11 (conditions
  actuelles de logement jugées satisfaisantes ou insuffisantes, 2024 et 2025 seulement, non éligible), LO10 (nombre
  de pièces, 5 vagues de 2020 à 2025), LO01 et LO02 (statut d''occupation, prêt en cours : structure).'
