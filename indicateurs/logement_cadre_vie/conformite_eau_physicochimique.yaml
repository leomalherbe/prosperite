  tombe à 95,3 % en 2024 (fichier ITDD lu le 16/10/2026) : la cause de cette chute n''est pas documentée à la source
  (une extension de la liste des paramètres contrôlés est possible, non vérifiée) et doit être établie avant de
  fixer des bornes.'
