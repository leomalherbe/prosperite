notes: 'Valeurs lues sur la BDM le 16/10/2026 : 150 (2015), 129 (2020), 129 (2021), 137 (2022), 142 (2023) kg par
  habitant ; rupture de 2020, révision de 2020 en 2023 et de 2022 en 2025 d''après les métadonnées INSEE 12.i3 (lues
  par l''audit M06). La long-list classe la série « non » (moins de 10 points), à juste titre : ce n''est pas une
  série pluriannuelle au sens de D28 (maintenance PLA-1 corrigée). Famille production_dechets : le gaspillage est
  la composante alimentaire, sur toute la chaîne, des déchets de toutes les activités et des ménages.'
