definition: Taux de chômage des personnes de 15 à 74 ans nées dans un pays hors de l'Union européenne moins celui
  des personnes nées en France, en points (enquête Forces de travail, jeu Eurostat lfsa_urgacob).
unite: points de pourcentage
sens: bas
