note_pertinence: 'La surconsommation d''antibiotiques favorise l''antibiorésistance, menace sanitaire majeure. La
  consommation, comprise entre 24,7 et 25,9 doses de 2013 à 2019, chute en 2020 et 2021 (20,3 et 21,5) puis dépasse
  son niveau d''avant la crise sanitaire en 2024 (26,5). L''indicateur est à la marge du contenu de la dimension
  (comportements de soins) : la fiche est soumise à Léo pour décision.'
