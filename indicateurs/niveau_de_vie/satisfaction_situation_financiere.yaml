incontournable: non
recommandation: retenir
motif_recommandation: 'Satisfaction du domaine « niveau de vie » (R4) retenue par le cadre Qualité de vie d''Eurostat,
  publiée en 2013, 2018 et 2022, série pluriannuelle admise (D17, D28 : écart moyen de 4,5 ans).'
note_pertinence: 'Selon R4, la satisfaction d''un domaine va dans ce domaine : celle-ci complète, côté ressenti,
  les mesures objectives du revenu et des privations. La note moyenne vaut 6,4 en 2013, 6,6 en 2018 et 6,4 en 2022
  (API Eurostat, lue le 14/10/2026). Avec trois points seulement, elle se prête mal au suivi annuel, d''où l''intérêt
  d''une série SRCV de l''INSEE si elle existe (non trouvée au catalogue).'
