motif_recommandation: Pression atmosphérique soumise à un plafond d'émission européen, total national Eurostat homogène
  et sans drapeau de 2000 à 2024 (640 600 t en 2000, 70 690 t en 2024), identique au total de conformité (D40).
note_pertinence: Le dioxyde de soufre est à l'origine des pluies acides ; ses émissions sont désormais faibles,
  ce qui appellera des bornes resserrées. Le total de conformité, le Citepa (1990-2025, 70,2 kt en 2025) et les
  comptes d'émissions sont en variantes.
