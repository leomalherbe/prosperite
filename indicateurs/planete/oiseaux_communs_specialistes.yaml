url_page: https://www.insee.fr/fr/statistiques/serie/010596708
frequence: annuelle
premiere_annee: 2010
derniere_annee: 2024
nb_points_depuis_2000: 15
geo: FM
eligibilite_longlist: oui
ligne_id: bdm-001146
hors_longlist: non
raccordement: 'a_etudier : la BDM ne diffuse l''indice qu''à partir de 2010 alors qu''il est calculé depuis 1989
  ; série longue à rechercher auprès du producteur'
incontournable: non
socle_propose: non
recommandation: retenir
motif_recommandation: Seule mesure annuelle de l'état de la biodiversité ordinaire au catalogue national, indicateur
  ODD 15.i6a publié de 2010 à 2024 (15 points).
note_pertinence: Les oiseaux spécialistes réagissent à la dégradation de leur habitat, ce qui en fait un bon témoin
  de l'état de la biodiversité ordinaire. Les indices par milieu (dont les oiseaux des milieux agricoles, aussi
  suivis par Eurostat jusqu'en 2021) sont en variantes ; l'indice des espèces généralistes, dont la hausse traduit
  une homogénéisation, ne s'interprète pas seul. L'indice est calculé depuis 1989 chez le producteur, ce qui permettrait
  des bornes historiques plus longues.
