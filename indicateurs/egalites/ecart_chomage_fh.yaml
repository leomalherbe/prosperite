id: ecart_chomage_fh
libelle: Écart de taux de chômage entre femmes et hommes
dimension: egalites
sous_theme: écarts femmes-hommes
famille: ecart_chomage_fh
variante_principale: oui
definition: Écart, en valeur absolue et en points, entre le taux de chômage des femmes de 15 à 74 ans et celui des
  hommes (enquête Forces de travail, jeu Eurostat une_rt_a).
unite: points de pourcentage
sens: bas
type: resultat
declaratif: non
composite: non
source_organisme: Eurostat
source_jeu: une_rt_a (chômage par sexe et âge, données annuelles)
source_serie_id: une_rt_a?freq=A&age=Y15-74&unit=PC_ACT&sex=M&sex=F&geo=FR
composantes:
