motif_recommandation: Écart absolu (D34) de chômage entre personnes nées hors de l'UE et nées en France, annuel
  de 2000 à 2025 (19,7 % contre 9,4 % en 2000, 13,1 % contre 7,0 % en 2025), qui couvre aussi les immigrés devenus
  français, proposé comme alternative dans la famille ecart_emploi_origine.
note_pertinence: L'écart de chômage selon le pays de naissance reflète à la fois des différences de qualification
  et des discriminations à l'embauche ; il ne les distingue pas. Il couvre les immigrés naturalisés, que l'écart
  d'emploi selon la nationalité (principale de la famille, indicateur Eurostat Qualité de vie) exclut. Ruptures
  en 2003, 2005, 2006, 2014, 2021 et 2024 (drapeaux b).
