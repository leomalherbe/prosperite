motif_recommandation: Seule mesure du poids ressenti du coût du logement, 18 valeurs de 2004 à 2023 (annuelles jusqu'en
  2020, module triennal ensuite, D17).
note_pertinence: 'La question recueille l''appréciation du ménage sur son budget logement : elle complète les ratios
  coût sur revenu en captant des situations tendues qu''ils ne montrent pas (charges contraintes, endettement).
  La part qui juge ce coût lourd passe de 20,2 % en 2004 à 29,6 % en 2013, redescend à 23,2 % en 2019 et atteint
  31,4 % en 2023 (API Eurostat lue le 15/10/2026), après une rupture en 2020.'
