hors_longlist: non
raccordement: non
incontournable: non
recommandation: retenir
motif_recommandation: Mesure des contrats courts nommés dans le contenu de la dimension (A15), en série annuelle
  INSEE rétropolée de 1982 à 2025, plus homogène que la série européenne des contrats temporaires marquée « définition
  différente » depuis 2021.
note_pertinence: Les contrats temporaires exposent à l'insécurité de l'emploi et des revenus. La définition INSEE
  (CDD et intérim, rapportés à tout l'emploi) diffère de la définition européenne, qui ajoute apprentis et contrats
  aidés et rapporte aux seuls salariés (variantes). La somme des deux parts est à calculer.
