id: depenses_pre_engagees
libelle: Part des dépenses pré-engagées dans le revenu disponible des ménages
dimension: niveau_de_vie
sous_theme: consommation
famille: depenses_pre_engagees
variante_principale: oui
definition: 'Part, dans le revenu disponible brut des ménages, des dépenses réalisées dans le cadre d''un contrat
  difficilement renégociable à court terme : logement (y compris loyers imputés), eau, énergie, télécommunications,
  assurances, services financiers, cantines, abonnements (comptes nationaux de l''INSEE, base 2020).'
unite: '% du revenu disponible brut'
sens: bas
type: resultat
declaratif: non
composite: non
source_organisme: INSEE
source_jeu: Melodi DD_CNA_AGREGATS (comptes nationaux annuels, base 2020), mesure _DEP_REVENU
