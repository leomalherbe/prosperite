motif_recommandation: Seule mesure cataloguée de l'écart de retraite, qui cumule les écarts de carrière, annuelle
  de 2015 à 2025 (34,1 % en 2015, 26,6 % en 2025, rupture en 2022).
note_pertinence: L'écart de pension est l'aboutissement des écarts d'emploi, de temps de travail et de salaire tout
  au long de la vie, et il pèse sur la pauvreté des femmes âgées. Il baisse d'environ 0,7 point par an. La série
  ne commence qu'en 2015 (11 points), sans raccordement possible au catalogue.
