- ilc_li31?freq=A&citizen=NAT&age=Y_GE18&sex=T&unit=PC&geo=FR
formule: abs(A - B)
source_niveau: 1
url_api: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/ilc_li31?freq=A&citizen=FOR&citizen=NAT&age=Y_GE18&sex=T&unit=PC&geo=FR
url_page: https://ec.europa.eu/eurostat/databrowser/view/ilc_li31/default/table?lang=fr
frequence: annuelle
premiere_annee: 2004
derniere_annee: 2025
nb_points_depuis_2000: 22
geo: FR
eligibilite_longlist: oui
ligne_id: estat-054671 ; estat-054674
hors_longlist: non
rattachement_propose: lignes de la long-list niveau_de_vie (taux de pauvreté par nationalité) ; l'écart construit
  relève d'egalites (A8, R3), les niveaux restent dans niveau_de_vie ; à trancher au gel 2
raccordement: non
incontournable: non
recommandation: retenir
motif_recommandation: Écart construit sur deux séries annuelles de 2004 à 2025 (22 points), très stable et de signe
  constant (32,8 % contre 11,8 % en 2004, 34,0 % contre 12,8 % en 2025).
note_pertinence: 'Les étrangers ont un risque de pauvreté presque trois fois plus élevé que les Français, sans réduction
  depuis vingt ans. La nationalité exclut les immigrés devenus Français ; la variante par pays de naissance (ilc_li32)
  ne commence qu''en 2015 au catalogue. Petits effectifs : la série est heurtée (37,8 % en 2013 et 2019, 39,7 %
  en 2020).'
