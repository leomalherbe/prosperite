variante_principale: oui
definition: Part des masses d'eau déclarées où la concentration de pesticides (substances actives des produits phytopharmaceutiques
  et biocides, métabolites pertinents) dépasse des seuils fondés sur les normes de qualité environnementale (indicateur
  ODD de l'UE, données de l'Agence européenne pour l'environnement).
