notes: 'Valeurs lues (isoc_cbt, FTTP, % des ménages, mise à jour Eurostat du 17/06/2026, aucun drapeau) : 10,5 (2013),
  20,8 (2016), 43,8 (2019), 63,4 (2021), 81,4 (2023), 91,7 (2025). Variantes : couverture par les réseaux d''accès
  de nouvelle génération (NGA), à très haute capacité (VHCN), haut débit fixe, 5G ; couverture par débit (plus de
  30 et 100 Mbit/s, 1 Gbit/s) ; locaux raccordables à la fibre et surface couverte en 4G (ITDD, hors long-list,
  preuve du robot).'
