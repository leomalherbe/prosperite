motif_recommandation: Indicateur ODD national de la ségrégation des filières, annuel de 2010 à 2025 (39,0 % en 2010,
  46,4 % en 2025, valeur provisoire), sur le seul champ où la part des femmes reste sous la parité.
note_pertinence: 'La sous-représentation des femmes dans les filières scientifiques prépare les écarts de salaire
  futurs. Le total de l''indicateur ODD (toutes disciplines scientifiques, santé comprise) dépasse 50 % depuis 2023
  (50,6 %) : il n''a plus de sens univoque, d''où le choix du champ « formations scientifiques ». L''objectif naturel
  est la parité ; au-delà, le sens deviendrait ambigu.'
