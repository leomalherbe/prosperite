motif_recommandation: Moyen admis (D19) adossé à la cible légale de 30 % d'aires protégées (article L110-4 du code
  de l'environnement), série OCDE de 2000 à 2024 (25 points), 31,84 % en 2024 d'après l'extrait du robot M04.
note_pertinence: La protection d'espaces est le premier levier de préservation de la biodiversité, et la cible légale
  fournira une borne. Une aire protégée ne garantit pas un bon état écologique, d'où la fiche sur la protection
  forte (cible de 10 %) et les variantes sur les zones clés de biodiversité. Les relais How's Life, OWID et Natura
  2000 (Eurostat) sont en variantes.
