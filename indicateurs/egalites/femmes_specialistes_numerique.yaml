motif_recommandation: Objet voisin (l'emploi plutôt que les études) et série plus longue (2004-2025, 22 points ;
  23,6 % en 2004, 19,6 % en 2025) que l'indicateur principal, proposée comme alternative dans la famille femmes_filieres_scientifiques.
note_pertinence: La part des femmes parmi les spécialistes du numérique mesure la ségrégation professionnelle dans
  un secteur en croissance et bien rémunéré ; elle stagne autour de 20 %. Les valeurs 2004-2012 sont estimées (drapeau
  e) et la série compte plusieurs ruptures (2005, 2006, 2011, 2013, 2014, 2021). Le sens « haut » vaut jusqu'à la
  parité.
