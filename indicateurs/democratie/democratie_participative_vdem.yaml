definition: Indice composite de V-Dem (de 0 à 1) qui combine la démocratie électorale et la composante participative
  (participation des citoyens aux organisations de la société civile, démocratie directe, élus locaux et régionaux),
  à partir d'évaluations d'experts ; jeu V-Dem v16 relayé par Our World in Data (définition résumée, codebook V-Dem
  non lu).
