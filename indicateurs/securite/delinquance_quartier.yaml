note_pertinence: 'La perception de la délinquance dans son quartier relie la sécurité objective et le sentiment
  d''insécurité : c''est la mesure retenue par Eurostat et la plus longue disponible. Elle est déclarative (perception
  d''un problème, pas une victimation) et, depuis la refonte de SILC, n''est plus posée chaque année. La valeur
  2020 est signalée en rupture.'
