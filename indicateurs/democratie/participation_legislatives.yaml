definition: 'Part des électeurs inscrits ayant voté au premier tour des élections législatives (votants rapportés
  aux inscrits, tous bureaux de vote du fichier agrégé du ministère de l''Intérieur). Champ : France entière ; l''inclusion
  des Français de l''étranger avant 2012 est à vérifier.'
