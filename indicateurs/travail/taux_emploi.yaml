geo: FE
eligibilite_longlist: oui
ligne_id: melodi-002516
hors_longlist: non
raccordement: 'non : série rétropolée par l''INSEE depuis 1975'
incontournable: oui
recommandation: retenir
motif_recommandation: Concept présent dans trois cadres (OCDE, Eurostat, INSEE) et indicateur de richesse nationale
  n° 1, publié par l'INSEE en série rétropolée de 1975 à 2025 (26 points depuis 2000), plus long et plus homogène
  que les séries Eurostat marquées « définition différente » depuis 2021.
note_pertinence: 'C''est l''indicateur central de l''accès à l''emploi, retenu par l''INSEE parmi les dix indicateurs
  de richesse nationale. La série longue de l''INSEE corrige les ruptures de l''enquête Emploi (2003, 2013, 2021)
  et couvre la France entière, ce que ne fait ni la série BDM de l''IRN 1 (France hors Mayotte, jusqu''en 2024)
  ni la série européenne. La cible officielle de 78 % porte sur les 20-64 ans : elle est portée par la fiche taux_emploi_20_64.'
