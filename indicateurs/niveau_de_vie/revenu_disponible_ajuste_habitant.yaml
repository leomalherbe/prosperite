id: revenu_disponible_ajuste_habitant
libelle: Revenu disponible brut ajusté des ménages par habitant, en termes réels
dimension: niveau_de_vie
sous_theme: revenus et pouvoir d'achat
famille: revenu_disponible_menages
variante_principale: oui
definition: Revenu disponible brut des ménages et des institutions sans but lucratif à leur service, augmenté des
  transferts sociaux en nature (santé, éducation, logement social…), rapporté à la population et exprimé en termes
  réels (déflaté par les prix de la consommation finale effective des ménages), en euros par habitant (comptes nationaux
  de secteur, Eurostat).
unite: euros réels par habitant
sens: haut
