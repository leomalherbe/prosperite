motif_recommandation: Inégalité de durée d'emploi distincte de l'écart d'emploi, annuelle de 2009 à 2025, dont l'ampleur
  a nettement baissé (25,2 points en 2009, 17,5 en 2025, en valeur absolue).
note_pertinence: Le temps partiel, surtout féminin, explique une grande part des écarts de revenu salarial entre
  femmes et hommes. La série publiée (hommes moins femmes) est négative ; exprimée en valeur absolue (D34), elle
  mesure la distance à la parité avec le sens « bas ». Une partie du temps partiel est choisie, ce qui nuance la
  lecture.
