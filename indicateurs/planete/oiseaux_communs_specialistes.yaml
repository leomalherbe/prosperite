id: oiseaux_communs_specialistes
libelle: Abondance des oiseaux communs spécialistes
dimension: planete
sous_theme: biodiversité
famille: oiseaux_communs_specialistes
variante_principale: oui
definition: Indice d'abondance des populations d'oiseaux communs spécialistes de leur milieu (agricole, forestier,
  bâti), base 100 en 1989, France métropolitaine, issu du suivi temporel des oiseaux communs (indicateur national
  ODD 15.i6a).
unite: indice (base 100 en 1989)
sens: haut
type: resultat
declaratif: non
composite: non
source_organisme: INSEE (indicateurs ODD nationaux)
source_jeu: ODD 15.i6a (BDM 010596708)
