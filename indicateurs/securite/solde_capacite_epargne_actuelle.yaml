motif_recommandation: >-
  Solde d'opinion INSEE depuis 1970 sur la capacité à épargner, seule mesure annuelle et longue de la marge financière
  ressentie des ménages, rattaché à la sécurité économique par D29 (P8) ; à agréger en moyenne annuelle.
note_pertinence: >-
  Pouvoir mettre de l'argent de côté est la condition de l'épargne de précaution, que la dimension cite et que la
  série OCDE ne mesure que tous les trois ans. Le solde est déclaratif et dépend du climat conjoncturel, mais il
  couvre toute la période sans rupture connue. La version CVS est une variante.
