  (D17).
note_pertinence: Avoir le sentiment d'être entendu par les pouvoirs publics est le versant subjectif de la voix
  politique, que la participation électorale ne mesure pas. En 2023, 26,3 % des Français de 16 à 65 ans disent avoir
  leur mot à dire et 57,6 % disent le contraire. Avec deux vagues seulement, l'indicateur montre un niveau plus
  qu'une trajectoire.
