motif_recommandation: Première cause de décès en taux standardisé sur toute la période 2011-2023 (253,11 pour 100
  000 en 2011, 218,58 en 2023), série annuelle sans drapeau.
note_pertinence: La mortalité par cancer dépend de la prévention (tabac, alcool), du dépistage et des traitements.
  Son taux standardisé baisse régulièrement (−14 % entre 2011 et 2023). Les cancers du poumon, colorectal et du
  sein sont en variantes.
