notes: 'Parts recalculées sur docs/sources/series/drees__barometre_2000_2025_distributions.csv (somme des modalités
  1 « beaucoup » et 2 « assez » de og04_9, « ne sait pas » au dénominateur) : 88,63 (2014), 89,33 (2015), 88,20
  (2016), 87,97 (2017), 89,95 (2018), 89,62 (2019), 87,67 (2020), 89,12 (2021), 90,62 (2022), 89,05 (2023), 88,56
  (2024), 90,19 (2025) ; part des « ne sait pas » au plus 0,32 % (2021). Couverture 2014-2025 (12 années) lue dans
  drees__barometre_2000_2025_couverture.csv ; libellés dans les dictionnaires 2025 du robot. Recoupement (D34, D38
  b) : la feuille 5 des tableaux croisés simplifiés 2025 lue par le robot s''arrête aux questions OG04_1 et OG04_3
  (aucune valeur publiée d''OG04_9 dans le dépôt) ; la convention du dénominateur reproduit la valeur publiée par
  la DREES pour OG04_1 en 2025 (55,35 %, voir logement_cadre_vie/preoccupation_logement). Signalement TRA-14 de
  la correction travail soldé par cette fiche (le catalogage de la question reste à faire).'
