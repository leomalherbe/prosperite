note_pertinence: La surpopulation carcérale touche à la dignité des personnes détenues et au respect des droits
  fondamentaux par l'État ; elle relève de l'État de droit plus que de la sécurité. Le taux français dépasse 100
  % sur toute la période, avec un creux en 2020 (103,4 %, année de l'épidémie) et un maximum en 2024 (129,5 %).
