eligibilite_longlist: oui
ligne_id: estat-053080
hors_longlist: non
raccordement: 'non : série Eurostat depuis 2000'
incontournable: non
recommandation: retenir
motif_recommandation: Seule mesure du prix d'achat des logements rapporté au revenu, série Eurostat annuelle de
  2000 à 2024 (25 points d'après la long-list).
note_pertinence: Le prix d'achat relatif au revenu dit si l'accession à la propriété devient plus ou moins accessible
  ; une hausse enrichit les propriétaires en place mais éloigne les autres ménages de l'accession. Le ratio passe
  de 70,2 en 2000 à 112,3 en 2007, reste au-dessus de 100 jusqu'en 2023 et revient à 95,5 en 2024 (100 = moyenne
  de long terme, API Eurostat lue le 14/10/2026). Le sens « bas » retenu ici est celui de l'accessibilité et reste
  à confirmer par Léo.
