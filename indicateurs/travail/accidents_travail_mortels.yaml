notes: 'Calcul (D34) : A = décès par accident du travail, ligne « TOUS / TOUS » du jeu des décès (545 en 2015, 553
  en 2018, 733 en 2019, 550 en 2020, 645 en 2021, 738 en 2022, 759 en 2023, 764 en 2024) ; B = salariés du régime
  général, ligne « TOUS / TOUS » du jeu de sinistralité (19 557 331 en 2019, 20 737 804 en 2023, 20 799 568 en 2024)
  ; sorties du robot cnam_ameli__deces_naf_brut.csv.gz et cnam_ameli__sinistralite_naf1_brut.csv.gz (15/10/2026).
  Taux : 2,90 (2015), 2,74 (2016), 2,75 (2017), 2,88 (2018), 3,75 (2019), 2,84 (2020), 3,21 (2021), 3,57 (2022),
  3,66 (2023), 3,67 (2024). Recoupement : 733 décès en 2019 (question écrite n° 6836 à l''Assemblée nationale, citant
  la CNAM), 738 en 2022 et 645 en 2021 (Politis, janvier 2024, d''après la CNAM), 759 en 2023 (« 759 décès parmi
  les AT reconnus et survenus avant consolidation, soit 21 de plus qu''en 2022 », Assurance maladie, Santé et sécurité
  au travail, chiffres 2023) ; 20,7 millions de salariés en 2023 (même source). Champ (description des jeux) : salariés
  du régime général, y compris indépendants ayant souscrit l''assurance volontaire et certains agents contractuels
  publics ; hors régime agricole et fonctions publiques ; France entière. Hausse de 2019 : « changement de méthodologie
  statistique prenant mieux en compte les malaises », non chiffré (Politis, 2024, d''après la CNAM) ; à confirmer
  sur la page Méthode de data.ameli.fr. Ancienne principale (M05) : Eurostat hsw_n2_02 (2008-2024 et non 2008-2025,
  audit F6), passée en variante (D40) ; jeu à cataloguer (TRA-11).'
