note_pertinence: Le surendettement est l'issue extrême de l'insécurité économique et la dimension le cite explicitement.
  Le nombre de dépôts dépend aussi des règles de la procédure et de l'accès au crédit (à documenter avec la Banque
  de France). La baisse jusqu'en 2020 puis la remontée sont cohérentes avec les retards de paiement de l'enquête
  SILC.
