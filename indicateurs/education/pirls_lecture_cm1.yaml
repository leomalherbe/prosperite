motif_recommandation: Seule mesure cataloguée des compétences en lecture en fin d'école primaire comparable dans
  le temps et entre pays, indicateur national ODD (cycles 2011, 2016 et 2021, D17).
note_pertinence: PIRLS évalue tous les cinq ans la compréhension de l'écrit des élèves en quatrième année de scolarité.
  Au seuil minimal, la part est proche du plafond (95 % en 2011, 94 % en 2016 et en 2021 dans la série BDM de même
  définition), ce qui en limite le pouvoir de discrimination. Les évaluations nationales de début de sixième (part
  d'élèves de bas niveau en français, annuelle depuis 2017) sont l'alternative de la famille.
