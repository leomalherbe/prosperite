motif_recommandation: Seule série nationale annuelle de l'exposition aux vagues de chaleur (A14), de 2004 à 2025
  (22 points), avec 517 jours-départements en 2025 d'après l'export vérifié par le robot M04.
note_pertinence: Les canicules sont l'aléa climatique aux effets sanitaires les plus directs, et la grille les range
  dans la planète (A14). La série commence en 2004 et omet la canicule de 2003, ce qui pèsera sur le choix de bornes
  historiques. La part de la population exposée à des températures extrêmes (OCDE) forme l'autre fiche de la famille
  ; la sévérité des canicules (Santé publique France) et les degrés-jours de refroidissement (Eurostat, reçus de
  logement_cadre_vie) sont en variantes.
