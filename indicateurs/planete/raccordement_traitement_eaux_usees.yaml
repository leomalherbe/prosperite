motif_recommandation: 'Sens ambigu en France : la série (77,30 % en 2001, 80,00 % en 2024) est la part de la population
  raccordée à une station urbaine à traitement secondaire ou tertiaire, les 18 % en assainissement individuel n''y
  étant jamais comptés (env_ww_con lu le 16/10/2026, J4 de l''audit M06).'
note_pertinence: 'Le raccordement à une station de traitement est la mesure européenne de l''assainissement des
  eaux usées (ODD 6.3). En France, la population non comptée vit surtout dans des logements en assainissement individuel
  (18,00 % chaque année depuis 2010), dont la conformité est suivie par la variante non collective de conformite_assainissement_collectif
  : une part plus élevée de raccordement n''est donc pas un progrès en soi. Depuis 2010, les variations de la série
  tiennent surtout à la part des stations au traitement « non spécifié » (de 1,46 % à 4,30 %), la part collectée
  étant fixée à 82,00 %.'
