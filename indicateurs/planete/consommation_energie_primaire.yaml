recommandation: retenir
motif_recommandation: Concept distinct de la consommation finale (méthode §8), qui inclut les pertes de production
  d'électricité, série Eurostat sans drapeau de 2005 à 2024 (260,87 Mtep en 2005, 202,62 Mtep en 2024).
note_pertinence: L'énergie primaire inclut les pertes de conversion, très importantes pour l'électricité nucléaire,
  d'où un niveau et une tendance différents de la consommation finale ; les deux forment des familles distinctes.
  La série INSEE (ODD 7.i3a, 2011-2024), sa composante nucléaire et les séries par habitant sont en variantes.
