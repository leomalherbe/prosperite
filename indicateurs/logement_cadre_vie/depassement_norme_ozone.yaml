note_pertinence: 'L''ozone se forme sous l''effet du soleil à partir des polluants du trafic et de l''industrie
  : parmi les polluants suivis par le SDES, c''est le seul dont le niveau de fond n''a pas baissé depuis 2000 (indice
  de 98,96 en 2024). Ses dépassements dépendent fortement des étés chauds, ce qui rend l''indicateur volatil ; la
  variante en moyenne triennale par station le lisse.'
