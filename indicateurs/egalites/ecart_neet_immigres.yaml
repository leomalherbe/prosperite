motif_recommandation: Écart absolu (D34) de taux NEET entre jeunes de 15 à 34 ans nés hors de l'UE et nés en France,
  annuel de 2006 à 2025 (20 points ; 16,4 points en 2006, 13,1 en 2025, lus sur l'API), qui mesure l'insertion des
  jeunes selon l'origine (A8).
note_pertinence: Le décrochage scolaire et professionnel des jeunes nés hors de l'UE est un indicateur avancé des
  écarts selon l'origine. La modalité « nés hors UE » n'a pas de valeur en 2004 et 2005, bien que le paquet de modalités
  du catalogue commence en 2004. Ruptures en 2014, 2021 et 2024 (drapeaux b) ; aucun drapeau de faible fiabilité
  (u).
