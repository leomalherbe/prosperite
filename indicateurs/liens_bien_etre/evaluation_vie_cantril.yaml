id: evaluation_vie_cantril
libelle: Évaluation de la vie (échelle de Cantril, World Happiness Report)
dimension: liens_bien_etre
sous_theme: satisfaction et évaluation de la vie
famille: satisfaction_vie
variante_principale: non
definition: Moyenne sur trois ans des réponses à l'échelle de Cantril (se situer entre 0, la pire vie possible,
  et 10, la meilleure vie possible), posée chaque année à environ 1 000 personnes en France par le Gallup World
  Poll et diffusée par le World Happiness Report (l'année N couvre N-2 à N).
unite: note (0 à 10)
sens: haut
type: resultat
declaratif: oui
composite: non
source_organisme: World Happiness Report (données Gallup World Poll)
source_jeu: WHR 2026, données de la figure 2.1 (colonne « Life evaluation (3-year average) »)
source_serie_id: https://files.worldhappiness.report/WHR26_Data_Figure_2.1.xlsx (colonne « Life evaluation (3-year
  average) »)
source_niveau: 2
