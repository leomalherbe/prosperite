motif_recommandation: Pression azotée atmosphérique soumise à un plafond d'émission européen, série Eurostat sans
  drapeau de 2000 à 2024 (682 900 t en 2005, 574 390 t en 2024).
note_pertinence: L'ammoniac, presque entièrement agricole (547,7 kt sur 568,3 kt en 2025 d'après le Citepa), retombe
  sur les sols et les milieux naturels, qu'il acidifie et eutrophise, et forme des particules fines. Ses émissions
  baissent lentement. Le Citepa (1990-2025), l'ammoniac agricole par hectare (sdg_02_60) et les comptes d'émissions
  sont en variantes.
