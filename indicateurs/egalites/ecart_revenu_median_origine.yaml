notes: 'Composantes (A = nés en France, B = nés à l''étranger, euros courants, sans effet sur l''écart relatif)
  lues sur l''API Eurostat le 14/10/2026 : 2004-2025 pour les deux (aucune valeur en 2003), drapeau b en 2020 et
  2022 ; recoupement (D34) : 15 974 et 12 737 € (2004, écart 20,3 %), 22 191 et 18 380 € (2015, 17,2 %), 27 964
  et 21 792 € (2025, 22,1 %) ; saut de 2008 : 17 115 → 19 638 € (A) et 13 564 → 16 581 € (B). Variante possible
  par nationalité (ilc_di15), non importée pour ne pas multiplier les niveaux tenus en variante (audit M06, I2).
  Oubli O5 de l''audit M06.'
