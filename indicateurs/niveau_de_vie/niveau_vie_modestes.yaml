motif_recommandation: Seule mesure en euros constants du niveau de vie du bas de la distribution, publiée sans rupture
  de 1996 à 2024 (25 points depuis 2000), complémentaire du taux de pauvreté qui est relatif au médian.
note_pertinence: 'Le taux de pauvreté monétaire peut rester stable alors que le niveau de vie réel des plus modestes
  progresse ou recule : le premier décile en euros constants mesure directement ce que les 10 % les plus modestes
  peuvent acheter. Il atteint 13 970 € par unité de consommation en 2024, en hausse de 1,7 % en euros constants
  (Insee Première n° 2117, lue le 14/10/2026). C''est un niveau, pas un écart : il reste dans niveau_de_vie (R3),
  le rapport D9/D1 étant en egalites.'
