incontournable: non
recommandation: retenir
motif_recommandation: Seule mesure annuelle de la sortie des contrats temporaires vers l'emploi stable (2008-2025,
  18 points), qui distingue un contrat court tremplin d'un contrat court piège, sous réserve de la rupture de 2020.
note_pertinence: 'La précarité pèse moins si les contrats temporaires mènent à l''emploi stable : l''indicateur
  complète la part des contrats temporaires. La série passe de 12,0 % en 2019 à 19,3 % en 2020 (rupture) puis 32,5
  % en 2024 (API Eurostat, 14/10/2026) : la trajectoire n''est pas lisible d''un bloc. La variante lfsi_long_e09
  (statistique expérimentale de l''enquête sur les forces de travail) n''a pas pu être lue (refus de l''outil, 429).'
