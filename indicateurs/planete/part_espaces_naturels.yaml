notes: 'Recoupement (BDM lue le 16/10/2026) : la somme des trois surfaces (54 950 587 ha en 2000, 54 918 357 ha
  en 2022) est la superficie de la métropole ; la part calculée vaut 39,95 % (2000), 40,06 % (2010), 40,07 % (2015,
  2020, 2022), soit 40 une fois arrondie comme la série publiée 010776378 (en 1982, 39,49 % contre 40 publié : écart
  non expliqué) ; le même calcul donne pour les sols artificialisés 5,71 %, 7,44 %, 8,47 %, 8,95 %, 9,35 % et 9,49
  % (1982, 2000, 2010, 2015, 2020, 2022), égaux une fois arrondis à la série publiée 010596134 (5,7 ; 7,4 ; 8,5
  ; 9,0 ; 9,4 ; 9,5). Étiquettes INSEE inversées : 010776377 et 010776375 (« proportion », POURCENT) contiennent
  des hectares, 010776378 et 010776376 (« surface », MILLIERS_HECTARES) des pourcentages arrondis à l''unité, 010596146
  (MILLIERS_HECTARES) des hectares (maintenance PLA-12).'
