id: formation_adultes_4_semaines
libelle: Participation des 25-64 ans à l'éducation ou à la formation au cours des quatre dernières semaines
dimension: education
sous_theme: formation des adultes
famille: formation_adultes
variante_principale: oui
definition: Part des personnes de 25 à 64 ans ayant suivi un enseignement ou une formation, formels ou non formels,
  au cours des quatre semaines précédant l'enquête, d'après l'enquête européenne sur les forces de travail (Eurostat,
  indicateur ODD sdg_04_60).
unite: '% des 25-64 ans'
sens: haut
type: resultat
declaratif: non
composite: non
source_organisme: Eurostat
source_jeu: sdg_04_60 (indicateur ODD 4, enquête sur les forces de travail)
source_serie_id: sdg_04_60?freq=A&unit=PC&age=Y25-64&sex=T&geo=FR
source_niveau: 1
url_api: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/sdg_04_60?freq=A&unit=PC&age=Y25-64&sex=T&geo=FR
url_page: https://ec.europa.eu/eurostat/databrowser/view/sdg_04_60/default/table?lang=fr
frequence: annuelle
premiere_annee: 2000
derniere_annee: 2025
nb_points_depuis_2000: 26
geo: FR
eligibilite_longlist: oui
ligne_id: estat-002059
hors_longlist: non
raccordement: 'a_etudier : rupture de 2013 (5,7 % en 2012, 17,8 % en 2013) à neutraliser avant toute lecture de
  la trajectoire'
incontournable: non
recommandation: retenir
motif_recommandation: Indicateur du cadre Eurostat Qualité de vie (participation des adultes à l'éducation et à
  la formation), seule mesure annuelle depuis 2000 (26 points ; 15,5 % en 2025).
note_pertinence: 'La participation au cours des quatre dernières semaines est le suivi annuel de la formation tout
  au long de la vie. La série française est marquée par une rupture majeure en 2013 (5,7 % en 2012, 17,8 % en 2013,
  drapeau « b »), une chute en 2020 (13,0 %) et une nouvelle rupture en 2021 : sa trajectoire ne se lit que par
  morceaux. Les cibles européenne (au moins 60 %) et française (65 %) de 2030 portent sur la participation au cours
  des douze derniers mois, en variante.'
