id: esperance_vie_65
libelle: Espérance de vie à 65 ans
dimension: sante
sous_theme: espérance de vie
famille: esperance_vie
variante_principale: non
definition: Nombre moyen d'années restant à vivre à 65 ans dans les conditions de mortalité de l'année, ensemble
  des sexes, France (Eurostat, jeu démographique de l'espérance de vie, comme la fiche principale de la famille).
unite: années
sens: haut
type: resultat
