id: empreinte_consommation_ue
libelle: Empreinte environnementale de la consommation (note unique pondérée)
dimension: planete
sous_theme: 'climat : empreinte'
famille: empreinte_consommation_ue
variante_principale: oui
definition: Indicateur composite du Centre commun de recherche de la Commission européenne qui agrège, par analyse
  du cycle de vie, seize catégories d'impact de la consommation (climat, particules, acidification, eutrophisation,
  écotoxicité, usage des terres, eau, ressources fossiles et minérales…), pondérées et exprimées en unités de limite
  planétaire.
unite: limite planétaire (unité Eurostat PB)
sens: bas
type: pression
declaratif: non
composite: oui
annee_reference: observation
