ligne_id: estat-000897
hors_longlist: non
raccordement: non
incontournable: non
recommandation: retenir
motif_recommandation: Grandeur visée par les cibles indicatives de la SNBC 3 (décret n° 2026-636), série Eurostat
  sans drapeau de 2000 à 2024 dont l'absorption nette est passée de 60,98 Mt en 2004 à 41,18 Mt en 2024 (API lue
  le 14/10/2026).
note_pertinence: Le puits des forêts et des sols compense une partie des émissions et conditionne la neutralité
  carbone en 2050 ; son affaiblissement (sécheresses, mortalité des arbres, récoltes) est une alerte en soi. La
  série est très variable d'une année à l'autre (absorption de 34,07 Mt en 2000 et de 33,94 Mt en 2017) et révisée
  à chaque inventaire. Le solde par habitant (sdg_13_21), la série du Citepa et le détail par type de terres sont
  en variantes.
