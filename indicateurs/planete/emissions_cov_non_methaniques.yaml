notes: 'Champ : France métropolitaine. La directive (UE) 2016/2284 ne couvre pas les départements d''outre-mer (article
  2 §2, lu le 16/10/2026) et, pour la France, le total « pour tout l''ensemble du territoire » coïncide à 10 t près
  avec le total pour l''évaluation de conformité chaque année de 1999 à 2024 (API Eurostat lue le 16/10/2026, mise
  à jour du 07/09/2026, aucun drapeau), sauf pour les COVNM ; les niveaux sont proches de ceux du Citepa pour la
  France hexagonale (ammoniac : 574 380 t en 2024 chez Eurostat, 568,3 kt en 2025 chez le Citepa ; oxydes d''azote
  : 647 990 t et 631,9 kt). Le champ `geo` garde le code de la série (FR, D15). Le total de conformité, en variante,
  n''est pas homogène : l''article 4 §3 d de la directive (lu le 16/10/2026) exclut des engagements les émissions
  d''oxydes d''azote et de COVNM des catégories 3B (effluents d''élevage) et 3D (sols agricoles), et ce total les
  retire pour l''année de référence 2005 (1 339 890 t contre 1 765 820 t) et depuis 2020 (706 010 t contre 1 133
  840 t en 2020 ; 635 090 t contre 1 037 120 t en 2024). Pour les oxydes d''azote, les deux totaux coïncident (754
  770 t en 2020) : pas de rupture.'
