notes: 'Valeurs lues le 16/10/2026 : Eurostat cei_cie011 (mise à jour du 06/08/2025, aucun drapeau) 1,6 % en 2005,
  1,8 % en 2010, 2,0 % en 2020 et 2021, 1,8 % en 2023 (417 108 ETP en 2005, 537 036 en 2023) ; INSEE BDM 010600336
  : 621 100 emplois en 2010, 847 500 en 2023. Les métadonnées d''Eurostat précisent que ces secteurs ne sont qu''un
  sous-ensemble de l''économie circulaire.'
