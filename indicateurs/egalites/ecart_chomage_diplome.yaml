notes: 'Composantes (A = CITE 0-2, B = CITE 5-8) lues sur l''API Eurostat le 14/10/2026 : valeurs depuis 1993 pour
  les deux (long-list : 2000), mêmes drapeaux (b en 1998, 2003, 2005, 2006, 2013 et 2014 ; bd en 2021 et 2024 ;
  d de 2021 à 2025) ; recoupement (D34) : 15,3 - 5,5 = 9,8 (2000), 11,1 - 4,3 = 6,8 (2008), 18,0 - 5,7 = 12,3 (2016),
  14,7 - 5,3 = 9,4 (2025). Sous-thème « diplôme » (et non « origine sociale ») : l''écart porte sur le diplôme de
  la personne elle-même (J3 de l''audit M06).'
