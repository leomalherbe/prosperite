motif_recommandation: Compétences mesurées des élèves (incontournable, trois cadres) avec une cible européenne de
  moins de 15 % en 2030, enquête triennale admise par D17 (7 cycles de 2006 à 2025 ; 23,8 % en 2022, 25,8 % en 2025).
note_pertinence: PISA mesure à 15 ans la maîtrise des sciences utile à la vie courante ; la part des élèves sous
  le niveau 2 vise la base de la distribution, ce que traduit la cible européenne. La part passe de 23,8 % en 2022
  à 25,8 % en 2025, sans drapeau de rupture dans la série Eurostat. Le cycle 2025, présent dans la mise à jour d'Eurostat
  du 8 octobre 2026, ne figure pas encore dans la base de l'OCDE lue par le robot ; le score moyen est l'alternative
  de la famille.
