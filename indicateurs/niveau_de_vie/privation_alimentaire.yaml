id: privation_alimentaire
libelle: Ne pas avoir les moyens d'un repas avec viande, poisson ou équivalent un jour sur deux
dimension: niveau_de_vie
sous_theme: accès à l'alimentation
famille: privation_alimentaire
variante_principale: oui
definition: Part des personnes vivant dans un ménage qui n'a pas les moyens de s'offrir un repas comportant de la
  viande, du poulet ou du poisson (ou un équivalent végétarien) au moins un jour sur deux (EU-SILC, élément de la
  privation matérielle et sociale ; même question que l'indicateur ODD 2.i1 de l'INSEE, « renoncement à consommer
  des protéines pour raisons financières »).
