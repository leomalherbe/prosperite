definition: Indice de perception de la corruption dans le secteur public établi par Transparency International en
  agrégeant des évaluations d'experts ; score de 0 à 100 (plus haut = moins de corruption perçue), comparable d'une
  année à l'autre depuis 2012 ; indicateur ODD de l'UE sdg_16_50.
