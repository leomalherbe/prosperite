definition: Part des personnes de 16 ans ou plus déclarant ne pas avoir les moyens de retrouver des amis ou de la
  famille autour d'un verre ou d'un repas au moins une fois par mois (item de la privation matérielle et sociale
  d'EU-SILC ; jeu Eurostat ilc_mdes10a, âge « total »).
