motif_recommandation: Série nationale du producteur, annuelle de 2011 à 2025 (25,3 % en 2011, 13,2 % en 2015, 44,7
  % en 2023, 50,7 % en 2025), plus fraîche que la série OCDE qui la reprend jusqu'en 2023 (méthode §4), admise comme
  moyen (D19).
note_pertinence: 'La vaccination contre les papillomavirus prévient les cancers du col de l''utérus et d''autres
  cancers ; après un creux en 2015 (13,2 %), la couverture complète des jeunes filles de 16 ans atteint 50,7 % en
  2025, loin de celle des vaccins du nourrisson. Elle forme une famille propre : ni la population ni la maladie
  visées ne sont celles des vaccins du nourrisson. La vaccination des garçons, mesurée depuis 2022, et la série
  OCDE sont en variantes.'
