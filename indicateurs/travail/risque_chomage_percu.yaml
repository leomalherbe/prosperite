motif_recommandation: Mesure personnelle de l'insécurité de l'emploi (risque de chômage pour soi ou un proche),
  posée chaque année de 2010 à 2025 (16 points), calculée sur les microdonnées du baromètre DREES et plausible au
  regard des parts publiées par la DREES (45 % en 2013, 42 % en 2014).
note_pertinence: 'La question porte sur un risque concret à court terme, pour soi ou un proche : c''est la face
  ressentie et personnelle de la sécurité de l''emploi (A15). La part passe de 41,0 % en 2010 à 49,8 % en 2016,
  puis 28,7 % en 2025 (calcul sur la sortie du robot, « ne sait pas » exclu). La hausse des « ne sait pas » en 2018
  (2,0 % en 2017, 5,8 % en 2018, environ 8 % depuis 2020) signale un possible changement de protocole, comme pour
  d''autres questions du baromètre.'
