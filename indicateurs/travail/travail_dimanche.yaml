id: travail_dimanche
libelle: Personnes en emploi travaillant habituellement le dimanche
dimension: travail
sous_theme: conditions et santé au travail
famille: horaires_atypiques
variante_principale: non
definition: Part des personnes en emploi de 15 ans ou plus qui travaillent habituellement le dimanche (Eurostat,
  enquête sur les forces de travail).
unite: '% de l''emploi total'
sens: bas
type: resultat
declaratif: non
composite: non
source_organisme: Eurostat
source_jeu: lfsa_ewpsun (enquête sur les forces de travail)
