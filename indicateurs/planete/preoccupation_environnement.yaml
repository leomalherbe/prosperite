motif_recommandation: 'Sens ambigu : la part de personnes préoccupées par l''environnement (86,8 % en 2000, 76,7
  % en 2025, modalités « beaucoup » et « assez » recalculées sur les distributions du robot M04) mesure l''attention
  portée au sujet autant que l''état de l''environnement.'
note_pertinence: 'C''est la seule mesure déclarative disponible pour la dimension : le baromètre de la DREES pose
  la question chaque année depuis 2000 (sauf 2003), en France métropolitaine. Sa remontée en 2018-2019 (87,5 % en
  2019) puis sa baisse (76,7 % en 2025) suivent l''actualité plus que les pressions mesurées par les autres fiches.
  Elle pourrait servir de contexte, ou d''indicateur d''adhésion à la transition, si Léo le souhaite.'
