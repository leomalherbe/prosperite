notes: 'Famille pauvrete_monetaire (INSEE prioritaire à définition égale, charte §3.5) : principal ERFS rétropolée
  ; taux_pauvrete_50 en variante de fiche. Variantes : ERFS non rétropolée 1975-2024 et ventilations, indicateur
  ODD 1.i1a (BDM 010594446, 2010-2023) et ventilations, EU-SILC (ilc_li02, sdg_01_20 ; drapeaux b en 2001, 2004,
  2020 et 2022 sur ilc_li02, API lue par l''audit M06) et ventilations (dont les lignes par âge et par nationalité,
  composantes des écarts construits d''egalites, D32), seuil de 70 %, revenu après coûts du logement (dont par degré
  d''urbanisation, lignes renvoyées par logement_cadre_vie), double risque revenu-consommation (expérimental). Les
  ventilations par sexe du taux à 60 % (EU-SILC, ERFS, ODD 1.i1a, 9 lignes) sont renvoyées à egalites, où l''écart
  existe déjà (ecart_pauvrete_fh, D35 ; audit M06 T2).'
