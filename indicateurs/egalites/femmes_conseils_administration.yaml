motif_recommandation: Indicateur ODD de l'UE annuel de 2012 à 2025 (14 points ; 21,4 % en 2012, 40,0 % en 2016,
  46,5 % en 2025), objet d'une cible légale de 40 % (loi n° 2011-103, dite Copé-Zimmermann), seule mesure de la
  place des femmes dans la gouvernance des entreprises.
note_pertinence: 'La part des femmes dans les conseils a plus que doublé depuis 2012 : la série mesure surtout l''effet
  d''une obligation légale. La cible de 40 % est atteinte depuis 2016 ; le sens « haut » vaut jusqu''à la parité
  (50 %), qui fournit un objectif naturel. Les directions exécutives (cadres dirigeants) restent moins féminisées,
  d''où une famille distincte de femmes_postes_direction.'
