motif_recommandation: 'Sens ambigu : le taux d''admis (91,6 % en 2025) dépend autant des exigences de l''examen
  et de ses réformes que du niveau des candidats, et ignore les jeunes qui ne se présentent pas.'
note_pertinence: Le taux de réussite est très suivi mais mesure le résultat d'un examen dont les règles changent
  (épreuves remplacées par le contrôle continu en 2020, réforme du baccalauréat de 2021), pas un niveau de compétences.
  La proportion de bacheliers dans une génération, retenue, rend mieux compte de l'accès au diplôme. Les taux par
  série et au diplôme national du brevet (BDM, 2011-2020) sont en variantes.
