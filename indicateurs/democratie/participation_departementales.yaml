notes: 'Calcul du projet (D34) sur la sortie de la vague 9 du robot (docs/sources/series/interieur_elections__participation_par_departement.csv
  : inscrits, votants et exprimés sommés par scrutin et par département sur general_results.csv, aucun votant manquant),
  lue le 15/10/2026. Recoupement : INSEE BDM 001778052 (50,2 % en 2015, 33,3 % en 2021), identique à l''arrondi.
  Cantonales, non retenues : 65,48 % (2001), 63,91 % (2004), 64,87 % (2008), 44,32 % (2011). Avant l''audit, la
  fiche était écartée pour « champ rompu en 2015 », motif hors de la méthode (audit M06 J3) : la partie 2015-2021
  est éligible au sens de D17 et D28.'
