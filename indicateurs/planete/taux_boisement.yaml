note_pertinence: La surface forestière ne dit rien de la santé des forêts (mortalité, sécheresses) ni de leur exploitation,
  que mesure la fiche sur l'intensité d'exploitation. Les séries de la FAO (via OWID et Eurostat) et de l'enquête
  LUCAS sont en variantes. Le Doughnut fixe une limite mondiale sur la surface forestière, sans équivalent national.
