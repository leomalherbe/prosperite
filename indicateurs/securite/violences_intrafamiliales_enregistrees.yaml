motif_recommandation: 'La série enregistrée (2016-2025) progresse avec la révélation des faits (M04, autres_sources
  §2.4) alors que l''enquête montre une baisse des violences conjugales déclarées sur 2010-2018 (de 0,7 % à 0,5
  %) : sens ambigu, la fréquence étant mesurée par victimes_violences_conjugales.'
note_pertinence: 'Comme les violences sexuelles enregistrées, les violences intrafamiliales enregistrées progressent
  avec la révélation des faits (accueil des victimes, campagnes, Grenelle de 2019) : une hausse ne signale pas une
  dégradation de la sécurité. Les valeurs de la série enregistrée n''ont pas pu être lues (fichier SSMSI trop lourd
  pour l''outil de lecture) : la comparaison avec l''enquête sur la période commune 2016-2018 reste à faire. La
  série décrit l''activité des services, pas le résultat.'
