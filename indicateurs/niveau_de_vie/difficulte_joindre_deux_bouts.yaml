id: difficulte_joindre_deux_bouts
libelle: Difficulté à joindre les deux bouts (pauvreté subjective)
dimension: niveau_de_vie
sous_theme: pauvreté ressentie
famille: pauvrete_subjective
variante_principale: oui
definition: Part des personnes vivant dans un ménage qui déclare arriver à joindre les deux bouts « avec difficulté
  » ou « avec grande difficulté » (EU-SILC, indicateur de pauvreté subjective).
unite: '% de la population'
sens: bas
