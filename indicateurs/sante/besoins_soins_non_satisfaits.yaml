id: besoins_soins_non_satisfaits
libelle: Besoins de soins médicaux non satisfaits
dimension: sante
sous_theme: accès aux soins
famille: besoins_soins_non_satisfaits
variante_principale: oui
definition: Part des personnes de 16 ans ou plus déclarant avoir eu besoin d'un examen ou d'un traitement médical
  au cours des 12 derniers mois sans l'obtenir parce qu'il était trop cher, trop éloigné ou à cause d'une liste
  d'attente (enquête SRCV, volet français d'EU-SILC).
unite: '% des 16 ans ou plus'
sens: bas
type: resultat
declaratif: non
composite: non
source_organisme: Eurostat (d'après l'INSEE, enquête SRCV)
source_jeu: sdg_03_60 (besoins auto-déclarés de traitement médical non satisfaits)
source_serie_id: sdg_03_60?freq=A&age=Y_GE16&sex=T&reason=TXP_TFAR_WLIST&unit=PC&quant_inc=TOTAL&geo=FR
source_niveau: 1
url_api: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/sdg_03_60?freq=A&age=Y_GE16&sex=T&reason=TXP_TFAR_WLIST&unit=PC&quant_inc=TOTAL&geo=FR
url_page: https://ec.europa.eu/eurostat/databrowser/view/sdg_03_60/default/table?lang=fr
frequence: annuelle
premiere_annee: 2008
derniere_annee: 2025
nb_points_depuis_2000: 18
geo: FR
eligibilite_longlist: oui
ligne_id: estat-002026
hors_longlist: non
raccordement: 'a_etudier : chute non signalée de 2015 (2,8 % en 2014, 1,2 % en 2015) et ruptures de 2020 et 2022'
incontournable: non
socle_propose: oui
recommandation: retenir
motif_recommandation: Indicateur du tableau de bord ODD de l'UE et du cadre Qualité de vie d'Eurostat, annuel de
  2008 à 2025 (1,9 % en 2008, 4,1 % en 2024, 3,7 % en 2025).
note_pertinence: 'Les besoins non satisfaits pour raison de coût, de distance ou d''attente mesurent l''accès effectif
  aux soins, y compris les délais (raison « liste d''attente »). La série a deux ruptures de fait : une chute non
  signalée en 2015 et une remontée à 2,7 % en 2020 (rupture « b »), puis 4,1 % en 2024. Les raisons « trop loin
  » et « liste d''attente » et la série par degré d''urbanisation (2004-2025) sont en variantes.'
