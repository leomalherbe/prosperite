id: niveau_vie_median
libelle: Niveau de vie médian
dimension: niveau_de_vie
sous_theme: revenus et pouvoir d'achat
famille: niveau_vie_median
variante_principale: oui
definition: Niveau de vie (revenu disponible du ménage après impôts directs et prestations sociales, divisé par
  le nombre d'unités de consommation) qui partage la population en deux moitiés, en euros constants de la dernière
  année (enquête Revenus fiscaux et sociaux, données rétropolées, France métropolitaine, ménages ordinaires).
unite: euros constants par an et par unité de consommation
sens: haut
type: resultat
declaratif: non
composite: non
source_organisme: INSEE
source_jeu: Melodi DS_ERFS_RETROPOLE (enquête ERFS, données rétropolées), mesure MED_SL
source_serie_id: DS_ERFS_RETROPOLE?AGE=_T&EMPSTA_ENQ=_T&ERFS_MEASURE=MED_SL&GEO=FRANCE-FM&MUN_DENSITY_LEVEL=_T&TPH=_T
source_niveau: 1
url_api: https://api.insee.fr/melodi/data/DS_ERFS_RETROPOLE?AGE=_T&EMPSTA_ENQ=_T&ERFS_MEASURE=MED_SL&GEO=FRANCE-FM&MUN_DENSITY_LEVEL=_T&TPH=_T
url_page: https://www.insee.fr/fr/statistiques/9019316
frequence: annuelle
premiere_annee: 1996
derniere_annee: 2024
nb_points_depuis_2000: 25
geo: FM
eligibilite_longlist: oui
ligne_id: melodi-005335
hors_longlist: non
rattachement_propose: 'variantes EU-SILC (ilc_di04, seuil D5 d''ilc_di01) importées de la long-list egalites : lignes
  renvoyées à niveau_de_vie par egalites (règles 1280 et 1290, maintenance n° 11)'
raccordement: 'non : série rétropolée par l''INSEE depuis 1996, sans rupture'
incontournable: oui
recommandation: retenir
motif_recommandation: Revenu médian des ménages, concept du cadre Qualité de vie d'Eurostat et de Stiglitz-Sen-Fitoussi
  (§5 du crosswalk), publié sans rupture par l'INSEE de 1996 à 2024 (25 points depuis 2000).
note_pertinence: La médiane décrit le niveau de vie d'un ménage « du milieu », sans être tirée par les très hauts
  revenus comme la moyenne des comptes nationaux. En 2024, le niveau de vie médian atteint 2 228 € par mois pour
  une personne seule et progresse de 1,8 % en euros constants (Insee Première n° 2117, lue le 14/10/2026). Il complète
  la mesure macroéconomique (revenu_disponible_ajuste_habitant), qui couvre aussi les services publics mais pas
  la répartition.
