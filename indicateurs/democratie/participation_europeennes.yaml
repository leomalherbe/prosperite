notes: 'Calcul du projet (D34) sur la sortie de la vague 9 du robot (docs/sources/series/interieur_elections__participation_par_departement.csv
  : inscrits, votants et exprimés sommés par scrutin et par département sur general_results.csv, aucun votant manquant),
  lue le 15/10/2026 : 47,06 % (1999), 42,83 % (2004), 40,78 % (2009), 43,37 % (2014), 51,28 % (2019), 52,95 % (2024).
  Recoupement : INSEE BDM 001778185 (43,4 %, 51,3 % et 53,0 % en 2014, 2019 et 2024), identique à l''arrondi ; 1999-2009
  non recoupés (pages d''archives illisibles à l''outil, audit M06). Avant l''audit, la fiche portait le taux de
  tous les bureaux (40,63 % en 2009, 42,43 % en 2014, 50,12 % en 2019, 51,49 % en 2024), qui inclut des collectivités
  d''outre-mer depuis 2009 et les Français de l''étranger depuis 2014. Mayotte est absente du fichier en 1999.'
