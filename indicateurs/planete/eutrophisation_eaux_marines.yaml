variante_principale: oui
definition: 'Part de la zone économique exclusive métropolitaine (environ 348 500 km²) classée eutrophe, en moyenne
  sur quatre ans : une zone est eutrophe quand la concentration en chlorophylle a, observée par satellite (Copernicus
  Marine Service), dépasse le 90e centile de la période de référence 1998-2017 plus de 25 % des jours d''observation
  de l''année (indicateur ODD 14.60 de l''UE).'
