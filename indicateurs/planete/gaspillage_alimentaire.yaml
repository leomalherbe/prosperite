motif_recommandation: Seule mesure fréquente du gaspillage alimentaire (cible ODD 12.3, loi AGEC), série INSEE annuelle
  comparable sur 4 points seulement (129, 129, 137 et 142 kg par habitant de 2020 à 2023), la valeur 2015 (150 kg)
  relevant d'une autre méthode, d'où une variante de la famille production_dechets (D38 f, D40).
note_pertinence: 'Le gaspillage alimentaire gâche les ressources (sols, eau, énergie, émissions) mobilisées pour
  produire la nourriture. D''après les métadonnées INSEE de l''indicateur 12.i3, les valeurs depuis 2020 suivent
  le champ et la méthode des décisions (UE) 2019/1597 et 2019/2000 et ne sont pas comparables à l''estimation de
  l''ADEME pour 2015 : l''objectif de la loi AGEC (baisse de 50 % par rapport à 2015) ne peut pas être suivi sur
  cette série seule. La ventilation par étape de la chaîne est en variantes.'
