variante_principale: oui
definition: Part du revenu disponible brut des ménages qui n'est pas consacrée à la consommation (épargne brute
  / revenu disponible brut, comptes nationaux de l'INSEE, base 2020).
unite: '% du revenu disponible brut'
sens: ambigu
