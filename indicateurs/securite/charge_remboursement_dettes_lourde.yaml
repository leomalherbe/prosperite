id: charge_remboursement_dettes_lourde
libelle: Remboursement de crédits ou de prêts ressenti comme une lourde charge
dimension: securite
sous_theme: sécurité économique
famille: charge_remboursement_dettes
variante_principale: oui
definition: 'Part des personnes vivant dans un ménage qui déclare que le remboursement de dettes liées à des achats
  à crédit ou à des prêts représente une lourde charge financière (EU-SILC, volet français SRCV ; autres réponses
  : une certaine charge, aucune charge ; les trois parts somment à 100, champ exact du dénominateur à vérifier dans
  les métadonnées).'
