frequence: annuelle
premiere_annee: 1996
derniere_annee: 2024
nb_points_depuis_2000: 25
geo: FM
eligibilite_longlist: oui
ligne_id: melodi-005344
hors_longlist: non
rattachement_propose: 'variantes ilc_li48 (pauvreté après coûts du logement par degré d''urbanisation) importées
  de la long-list logement_cadre_vie : lignes renvoyées à niveau_de_vie par logement_cadre_vie (règle 1650, D38
  a)'
raccordement: 'non : série rétropolée par l''INSEE depuis 1996, sans rupture'
incontournable: oui
socle_propose: oui
recommandation: retenir
motif_recommandation: Concept présent dans les cinq cadres de référence (§5 du crosswalk, en complément pour l'INSEE),
  indicateur ODD national 1.i1a, publié sans rupture par l'INSEE de 1996 à 2024 (25 points), un an de plus que la
  série ODD de la BDM.
note_pertinence: 'C''est l''indicateur de pauvreté de référence en France et en Europe : en 2024, 15,4 % des personnes,
  soit 9,8 millions, vivent sous le seuil de 1 337 € par mois (Insee Première n° 2117, lue le 14/10/2026). Le taux
  est relatif : il mesure la distance au niveau de vie médian, pas la privation absolue, que portent d''autres fiches
  (privation matérielle et sociale, premier décile). La version EU-SILC d''Eurostat, de même définition mais avec
  des ruptures en 2001, 2004, 2020 et 2022, est une variante.'
