motif_recommandation: Seule mesure annuelle de la qualité du traitement des eaux usées (cible 6.3 des ODD), série
  INSEE de 2010 à 2022 (13 points), rattachée à planete par D39.
note_pertinence: 'Le traitement des eaux usées protège les milieux aquatiques et la santé : le taux de conformité
  des ouvrages collectifs dit si les stations respectent les exigences de la directive sur les eaux résiduaires
  urbaines. Il passe de 80,0 % en 2010 à 98,6 % en 2018, puis revient à 91,9 % en 2022 (BDM lue le 15/10/2026, valeurs
  confirmées par l''audit M06 du 16/10/2026). L''équipement sanitaire des logements reste suivi en logement_cadre_vie
  (sans_installations_sanitaires).'
