id: etat_de_droit_wgi
libelle: État de droit (indicateurs de gouvernance de la Banque mondiale)
dimension: democratie
sous_theme: justice et État de droit
famille: etat_de_droit
variante_principale: oui
definition: 'Indicateur composite « Rule of Law » des WGI : perception du respect des règles de la société, notamment
  l''exécution des contrats, la police et la justice (libellé M04), agrégée à partir de sources d''experts et d''enquêtes
  ; score de gouvernance de 0 à 100, avec intervalles de confiance à 90 %, produit « pour faciliter les comparaisons
  entre pays et dans le temps » (documentation WGI lue le 15/10/2026), l''estimation d''origine suivant une loi
  normale de moyenne proche de zéro (de -2,5 à 2,5 environ).'
