hors_longlist: non
raccordement: 'a_etudier : 2000-2005 par l''écart de salaire net en équivalent temps plein de l''INSEE (ecart_salaire_eqtp_fh)'
incontournable: oui
recommandation: retenir
motif_recommandation: Indicateur européen de référence repris par l'INSEE comme indicateur ODD national 5.i1 et
  par Eurostat QoL, annuel de 2006 à 2024 (15,4 % en 2006, 11,8 % en 2024, valeurs provisoires en 2023-2024).
note_pertinence: L'écart « non corrigé » mesure l'inégalité globale de rémunération, y compris celle qui vient de
  la ségrégation des emplois, et non la seule discrimination à poste égal. Il a nettement baissé depuis 2019 (16,0
  % en 2019, 11,8 % en 2024). La variante INSEE en équivalent temps plein, plus longue (1996-2024), est proposée
  dans la même famille.
