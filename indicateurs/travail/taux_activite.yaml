id: taux_activite
libelle: Taux d'activité des 15-64 ans
dimension: travail
sous_theme: emploi
famille: taux_activite
variante_principale: oui
definition: Part des personnes de 15 à 64 ans actives au sens du BIT (en emploi ou au chômage), en moyenne annuelle
  (INSEE, enquête Emploi, séries longues rétropolées).
unite: '% de la population de 15 à 64 ans'
sens: ambigu
type: resultat
