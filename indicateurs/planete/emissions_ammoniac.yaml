motif_recommandation: Pression azotée atmosphérique soumise à un plafond d'émission européen, total national Eurostat
  homogène et sans drapeau de 2000 à 2024 (682 900 t en 2005, 574 380 t en 2024), identique au total de conformité
  à 10 t près (D40).
note_pertinence: L'ammoniac, presque entièrement agricole (547,7 kt sur 568,3 kt en 2025 d'après le Citepa), retombe
  sur les sols et les milieux naturels, qu'il acidifie et eutrophise, et forme des particules fines. Ses émissions
  baissent lentement. Le total de conformité, le Citepa (1990-2025), l'ammoniac agricole par hectare (sdg_02_60)
  et les comptes d'émissions sont en variantes.
