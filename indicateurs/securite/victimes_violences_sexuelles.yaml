url_page: https://www.insee.fr/fr/statistiques/serie/010596045
frequence: annuelle
premiere_annee: 2010
derniere_annee: 2023
nb_points_depuis_2000: 12
geo: FM
eligibilite_longlist: oui
ligne_id: bdm-000951
hors_longlist: non
raccordement: 'a_etudier : rupture CVS (2010-2018) / VRS (2021-2023) sans valeur 2019-2020 ; aucune baisse visible
  à la rupture (0,5 % en 2018 comme en 2021, valeurs arrondies au dixième), mais le changement d''enquête impose
  le même traitement que l''ensemble (deux segments ou coefficient de passage)'
incontournable: non
socle_propose: non
recommandation: retenir
motif_recommandation: Seule mesure de la fréquence des violences sexuelles indépendante de la plainte (enquête,
  2010-2023), aux valeurs faibles (0,4 à 0,8 %) arrondies au dixième, donc peu sensibles aux évolutions ; composante
  de victimes_violences, à ne pas cumuler avec elle au socle.
note_pertinence: 'Les violences sexuelles sont celles pour lesquelles l''écart entre faits subis et faits enregistrés
  est le plus grand : la série enregistrée a quadruplé depuis 2010 quand l''enquête reste stable. L''enquête est
  donc la seule base pour juger de leur fréquence. Sa précision est limitée (petits effectifs, arrondi au dixième
  de point) et elle subit la même rupture CVS/VRS que l''indicateur d''ensemble.'
