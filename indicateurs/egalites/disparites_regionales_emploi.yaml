motif_recommandation: Seule mesure annuelle des inégalités territoriales au catalogue, sans lacune de 2000 à 2025
  (6,9 % en 2000, 5,1 % en 2025).
note_pertinence: 'Les inégalités territoriales sont un contenu explicite de la dimension ; la dispersion des taux
  d''emploi entre régions en est la mesure la plus longue. Le découpage NUTS 2 (anciennes régions) masque les écarts
  infrarégionaux (quartiers, villes moyennes). La série est une valeur nationale issue d''un jeu régional : l''exclusion
  prévue des jeux NUTS (D30) doit l''épargner.'
