notes: 'Recoupement (D34) : taux calculés sur l''indice BDM 011815635 (lu le 16/10/2026 ; base 2025, France, statut
  A, mis à jour le 27/02/2026) contre taux publiés de l''IPCH, loyers effectifs CP041 (prc_hicp_aind, lu le 15/10/2026)
  : -0,12 contre -0,1 (2000), 3,60 contre 3,6 (2005), 1,60 contre 1,6 (2010), 0,65 contre 0,6 (2015), -0,27 contre
  -0,3 (2018), 0,38 contre 0,4 (2020), 2,13 contre 2,1 (2023), 2,34 contre 2,3 (2024), 2,32 contre 2,3 (2025). Indice
  : 64,07 (1996), 67,46 (1999), 67,38 (2000), 75,90 (2005), 85,82 (2010), 91,14 (2015), 91,36 (2018), 95,50 (2023),
  97,73 (2024), 100,00 (2025). L''écart à l''inflation d''ensemble proposé par l''audit M06 (J2) n''est pas retenu
  : D42 garde le taux nominal. Variantes : IPCH d''Eurostat, loyers effectifs (CP041) et loyers effectivement payés
  par les locataires (CP0411), prc_hicp_aind, qui n''est plus mis à jour et est remplacé par prc_hicp_ainr (ECOICOP
  version 2), dont les loyers ne sont pas catalogués (LOG-6) ; INSEE BDM, variation trimestrielle et annuelle des
  loyers des secteurs libre et social et de l''ensemble (France métropolitaine, 1987-2026). L''indice de référence
  des loyers (IRL) est écarté du catalogue INSEE comme indice de révision de contrats.'
