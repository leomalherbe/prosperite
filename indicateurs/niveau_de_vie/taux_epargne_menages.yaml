motif_recommandation: 'Sens ambigu : le taux bondit quand la consommation est contrainte (20,03 % en 2020 contre
  14,24 % en 2019 selon Eurostat, confinements) aussi bien que quand les ménages s''enrichissent.'
note_pertinence: 'Le taux d''épargne est un agrégat intelligible des comptes nationaux, mais une hausse peut traduire
  une aisance accrue comme une épargne de précaution ou une consommation empêchée : il ne dit pas si les ménages
  vont mieux. La capacité d''épargne ressentie et l''épargne de précaution sont suivies en securite (soldes d''opinion,
  pauvreté en actifs liquides). Il reste disponible comme variable de contexte.'
