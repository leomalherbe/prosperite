motif_recommandation: Seule mesure annuelle de la qualité des nappes au catalogue, série Eurostat sans drapeau de
  2007 à 2023 (17 points).
note_pertinence: Les nitrates d'origine agricole dégradent durablement les nappes qui alimentent l'eau potable ;
  le seuil de 50 mg/l sert de repère réglementaire. La moyenne nationale varie très peu et sans à-coup (17,85 mg/l
  en 2007, 17,26 en 2018, 17,49 en 2023 ; API lue le 16/10/2026), ce qui suggère une série lissée et appellera des
  bornes resserrées. La part des stations au-dessus de 50 mg/l (ITDD, 2010-2022, 3,87 % en 2022) est en variante.
