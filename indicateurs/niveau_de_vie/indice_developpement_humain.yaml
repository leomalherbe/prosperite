motif_recommandation: Composite santé-éducation-revenu couvrant plusieurs dimensions, rattaché à niveau_de_vie comme
  alternative au PIB par habitant, au plus en variante et jamais au socle (D38 c), annuel de 1990 à 2023 (24 points
  depuis 2000).
note_pertinence: 'L''IDH est l''alternative au PIB la plus connue : il combine l''espérance de vie, la durée de
  scolarisation et le revenu national par habitant. Pour la France, il évolue lentement (0,92 en 2023, sortie du
  robot M04) et sert surtout aux comparaisons entre pays. Comme il recouvre la santé et l''éducation, qui ont leurs
  dimensions, il n''est proposé qu''en variante du PIB par habitant, jamais au socle (D38 c), le double compte se
  traitant au contrôle de redondance (D18).'
