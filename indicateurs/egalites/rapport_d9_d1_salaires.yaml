motif_recommandation: Série annuelle de l'INSEE sans lacune de 1996 à 2024 (2,99 en 2000, 3,06 en 2020, 2,91 en
  2024), plus longue et plus fréquente que la série de l'OCDE (2_8_VER, 10 valeurs).
note_pertinence: 'La dispersion des salaires est l''une des sources des inégalités de niveau de vie, mais elle ne
  tient compte ni du temps de travail réel ni de la redistribution : c''est un indicateur distinct du S80/S20. Elle
  bouge peu (entre 2,87 et 3,06 depuis 1996), ce qui appellera des bornes resserrées.'
