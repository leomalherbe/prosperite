motif_recommandation: Grand chapitre de causes de décès lié au tabac, à la pollution de l'air et aux épidémies hivernales,
  série annuelle de 2011 à 2023 sans drapeau (55,28 pour 100 000 en 2011, 45,41 en 2021, 56,44 en 2023).
note_pertinence: Les maladies respiratoires (bronchopneumopathie chronique obstructive, pneumonies, grippe, asthme)
  dépendent du tabagisme, de la pollution de l'air et de la couverture vaccinale. Le taux varie d'une année à l'autre
  avec l'intensité des épidémies hivernales (51,93 en 2014, 60,47 en 2015) et tombe à 48,51 en 2020 et 45,41 en
  2021, années de l'épidémie de Covid-19 dont les décès sont classés à part (codes U07). Les maladies chroniques
  des voies respiratoires inférieures, la grippe et la pneumonie sont en variantes.
