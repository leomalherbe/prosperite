motif_recommandation: 'Sens ambigu : la part du PIB consacrée à l''éducation varie avec la démographie scolaire
  et le PIB autant qu''avec l''effort (pic de 5,66 % en 2020 dû à la chute du PIB), et le seul repère existant,
  international (Cadre d''action Éducation 2030 : au moins 4 à 6 % du PIB), est un plancher que la France dépasse
  chaque année (5,26 % en 2023).'
note_pertinence: Les moyens consacrés à l'éducation sont souvent cités, mais un même niveau de dépense peut produire
  des résultats très différents. Les résultats eux-mêmes (diplômes, compétences) sont retenus dans la dimension
  ; une fiche de moyens (type moyen, D19) serait possible par cohérence avec l'effort de R&D, mais sans cible discriminante
  pour la France. La dépense par élève rapportée au PIB par habitant (2012-2019) est en variante ; la dépense intérieure
  d'éducation de la DEPP, série nationale plus longue, n'est pas cataloguée.
