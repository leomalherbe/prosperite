id: emissions_ges_territoire
libelle: Émissions de gaz à effet de serre du territoire (hors UTCATF)
dimension: planete
sous_theme: 'climat : émissions du territoire'
famille: emissions_ges_territoire
variante_principale: oui
definition: Émissions de gaz à effet de serre (CO2, CH4, N2O et gaz fluorés, en équivalent CO2) des activités situées
  sur le territoire national, hors utilisation des terres, changement d'affectation des terres et foresterie (UTCATF),
  selon l'inventaire national du Citepa, sur le périmètre du protocole de Kyoto (métropole, départements d'outre-mer
  et Saint-Martin).
unite: millions de tonnes équivalent CO2
sens: bas
type: pression
declaratif: non
composite: non
source_organisme: INSEE (d'après l'inventaire national du Citepa)
source_jeu: Indicateur complémentaire de richesse nationale et ODD 13.i4b (BDM 010596008)
source_serie_id: '010596008'
source_niveau: 1
url_api: https://bdm.insee.fr/series/sdmx/data/SERIES_BDM/010596008
url_page: https://www.insee.fr/fr/statistiques/serie/010596008
frequence: annuelle
premiere_annee: 1990
derniere_annee: 2024
nb_points_depuis_2000: 25
geo: FM_D99_D978
eligibilite_longlist: oui
ligne_id: bdm-000920
hors_longlist: non
raccordement: 'non : série continue depuis 1990'
incontournable: oui
recommandation: retenir
motif_recommandation: Concept présent dans quatre cadres (Doughnut, SSF, OCDE, INSEE), série INSEE annuelle de 1990
  à 2024 (25 points depuis 2000) et grandeur visée par les budgets carbone et l'objectif de baisse de 50 % en 2030
  par rapport à 1990 de la SNBC 3.
note_pertinence: C'est l'indicateur de pression climatique de référence, publié par l'INSEE à partir de l'inventaire
  officiel du Citepa ; le Citepa diffuse une année de plus (359,4 Mt CO2e en 2025 hors UTCATF d'après l'extrait
  du robot M04, niveau 2). Les ventilations par gaz et par secteur sont en variantes, de même que les émissions
  nettes (UTCATF inclus) visées par la neutralité carbone en 2050. L'empreinte carbone, qui inclut les importations,
  forme une famille distincte (méthode §8).
