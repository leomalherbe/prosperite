motif_recommandation: Mesure de la pression matérielle de la consommation, série Eurostat de 2008 à 2025 (17,2 t
  par habitant en 2008, 11,9 t en 2025 imputée), plus longue et plus fraîche que la série INSEE (2010-2022).
note_pertinence: L'empreinte matières compte les matières extraites à l'étranger pour produire les biens importés,
  à la différence de la consommation intérieure de matières, qui forme une famille distincte. Les deux dernières
  années sont imputées par Eurostat. Les séries de l'INSEE (ODD 12.i2), de l'OCDE (12_14) et du PNUD sont en variantes.
