id: detention_provisoire
libelle: Part des prévenus parmi les détenus
dimension: democratie
sous_theme: justice et État de droit
famille: detention_provisoire
variante_principale: oui
definition: 'Nombre de personnes détenues prévenues (poursuivies mais non encore jugées ou dont la condamnation
  n''est pas définitive) rapporté au nombre total de personnes détenues, au 31 décembre (au 30 août pour 2025) ;
  source : applicatif Genesis de suivi des personnes écrouées (administration pénitentiaire puis service statistique
  ministériel de la Justice) ; indicateur national ODD 16.i3, identique à l''ODD 16.3.2.'
unite: '% des détenus'
sens: bas
