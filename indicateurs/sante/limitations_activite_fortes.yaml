id: limitations_activite_fortes
libelle: Personnes fortement limitées dans leurs activités par un problème de santé
dimension: sante
sous_theme: santé perçue et limitations
famille: limitations_activite
variante_principale: non
definition: Part des personnes de 16 ans ou plus fortement limitées, depuis au moins six mois et à cause d'un problème
  de santé, dans les activités que les gens font habituellement (modalité « grave » de l'indicateur GALI, enquête
  SRCV).
unite: '% des 16 ans ou plus'
sens: bas
type: resultat
declaratif: oui
composite: non
source_organisme: Eurostat (d'après l'INSEE, enquête SRCV)
source_jeu: hlth_silc_06 (limitation de longue durée perçue dans les activités usuelles), population totale, modalité
  « grave »
source_serie_id: hlth_silc_06?freq=A&unit=PC&wstatus=POP&age=Y_GE16&sex=T&lev_limit=SEV&geo=FR
source_niveau: 1
url_api: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/hlth_silc_06?freq=A&unit=PC&wstatus=POP&age=Y_GE16&sex=T&lev_limit=SEV&geo=FR
url_page: https://ec.europa.eu/eurostat/databrowser/view/hlth_silc_06/default/table?lang=fr
frequence: annuelle
premiere_annee: 2008
derniere_annee: 2025
nb_points_depuis_2000: 18
geo: FR
eligibilite_longlist: oui
ligne_id: estat-011387
hors_longlist: non
raccordement: 'a_etudier : ruptures de 2020 et 2022 de l''enquête SRCV ; la série par degré d''urbanisation (hlth_silc_20)
  remonte à 2004'
incontournable: non
socle_propose: non
recommandation: retenir_variante
motif_recommandation: Approche statistique du handicap (limitation grave), annuelle de 2008 à 2025 (8,6 % en 2008,
  10,2 % en 2023, 9,8 % en 2025), que la fiche principale additionne aux limitations légères.
note_pertinence: 'Eurostat intitule ses jeux par degré de limitation « niveau de handicap (restriction d''activité)
  » : la limitation grave et durable est la mesure du handicap des enquêtes européennes, qui touche environ une
  personne de 16 ans ou plus sur dix. La part varie entre 8,6 % et 9,6 % de 2008 à 2020, tombe à 8,3 % en 2021 puis
  dépasse 10 % en 2023 et 2024 après la rupture de 2022. Les ventilations EU-SILC, dont la série par degré d''urbanisation
  (2004-2025), sont en variantes.'
