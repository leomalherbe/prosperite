definition: Consommation de matières premières (biomasse, minerais métalliques, minéraux non métalliques, combustibles
  fossiles) mobilisées dans le monde pour satisfaire la demande finale du pays, importations comptées en équivalent
  matières premières, en tonnes par habitant.
