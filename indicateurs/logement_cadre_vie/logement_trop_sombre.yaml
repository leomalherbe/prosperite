notes: 'Déclaratif oui : jugement du ménage sur son logement. Valeurs lues (ilc_mdho04, ensemble, mise à jour Eurostat
  du 13/08/2026) : 9,0 (2004), 7,4 (2015), 6,9 (2017 et 2018), 7,3 (2019), 9,7 (2020, b), 10,6 (2023) ; aucune valeur
  2021, 2022, 2024, 2025. Depuis le règlement-cadre de 2021, l''item relève du module triennal « conditions de travail
  et de logement » d''EU-SILC (vagues 2023 et 2026 d''après la page des modules d''Eurostat lue le 15/10/2026) :
  valeurs annuelles de 2004 à 2020, puis 2023, d''où la fréquence irrégulière (report de la dernière valeur, D17).
  Variantes : ventilations, enfants (ilc_mdho04c), handicap (hlth_dhc100).'
