source_niveau: 1
url_api: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/isoc_ci_in_h?freq=A&unit=PC_HH&hhtyp=TOTAL&geo=FR
url_page: https://ec.europa.eu/eurostat/databrowser/view/isoc_ci_in_h/default/table?lang=fr
