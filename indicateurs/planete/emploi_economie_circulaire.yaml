variante_principale: non
definition: Personnes employées dans les secteurs les plus liés à l'économie circulaire (recyclage, réparation et
  réemploi) selon le cadre de suivi de l'économie circulaire de l'UE, en pourcentage de l'emploi total, numérateur
  en équivalents temps plein.
